name: F2.1A Bootstrap

on:
  push:
    branches:
      - 'feat/enrollment-rectification-f2-1a-attendance'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == 'gutenberggt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Apply F2.1A patch
        run: python scripts/_f2_1a_bootstrap.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mongomock mongomock-motor
      - name: Compile changed contracts
        working-directory: backend
        run: |
          python -m py_compile \
            services/attendance_validation.py \
            services/enrollment_rectification_attendance.py \
            routers/attendance.py \
            tests/test_enrollment_rectification_f2_1a_attendance.py
      - name: Run focused F2.1A suite
        working-directory: backend
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017'
          DB_NAME: 'sigesc_rectification_f21a_bootstrap_unused'
          JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_DRY_RUN_SECRET: 'ci-only-rectification-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        run: |
          python -m pytest tests/test_enrollment_rectification_f2_1a_attendance.py -q --asyncio-mode=auto
      - name: Remove bootstrap-only files
        run: |
          rm scripts/_f2_1a_bootstrap.py
          rm .github/workflows/_f2-1a-bootstrap.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F2.1A: implementar frequência compensável com ledger e CAS'
          git push origin HEAD:feat/enrollment-rectification-f2-1a-attendance
