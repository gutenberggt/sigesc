name: F2.1B Bootstrap

on:
  push:
    branches:
      - 'feat/enrollment-rectification-f2-1b-grades'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == 'gutenberggt'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Apply F2.1B patch
        run: python scripts/_f2_1b_bootstrap.py

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mongomock mongomock-motor

      - name: Compile F2.1B contracts
        working-directory: backend
        run: |
          python -m py_compile \
            services/enrollment_rectification.py \
            services/enrollment_rectification_grade_contract.py \
            services/enrollment_rectification_grades.py \
            routers/grades.py \
            tests/test_enrollment_rectification_f2_1b_grades.py

      - name: Run focused F2.1B suite
        working-directory: backend
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017'
          DB_NAME: 'sigesc_rectification_f21b_bootstrap_unused'
          JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_DRY_RUN_SECRET: 'ci-only-rectification-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        run: |
          python -m pytest \
            tests/test_enrollment_rectification_f2_1b_grades.py \
            tests/test_enrollment_rectification_f1_dry_run.py \
            tests/test_enrollment_rectification_f2_safety_kernel.py \
            tests/test_grade_assignment_adapter_phase5.py \
            tests/test_grade_historical_backfill_p0.py \
            -q --asyncio-mode=auto

      - name: Structural fail-closed guard
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          f2_router = Path('routers/enrollment_rectification_execution.py').read_text(encoding='utf-8')
          f2_kernel = Path('services/enrollment_rectification_execution.py').read_text(encoding='utf-8')
          grade_service = Path('services/enrollment_rectification_grades.py').read_text(encoding='utf-8')
          if '@router.post("/execute")' in f2_router or '@router.post("/rollback")' in f2_router:
              raise SystemExit('F2.1B não pode expor execute/rollback')
          if 'ACADEMIC_MUTATION_IMPLEMENTED = False' not in f2_kernel:
              raise SystemExit('Gate acadêmico global deixou de estar fail-closed')
          if 'APIRouter' in grade_service:
              raise SystemExit('Primitivo de grades não pode expor router')
          print('F2.1B structural guard: PASS')
          PY

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/enrollment_rectification.py \
                  backend/services/enrollment_rectification_grade_contract.py \
                  backend/services/enrollment_rectification_grades.py \
                  backend/routers/grades.py \
                  backend/tests/test_enrollment_rectification_f2_1b_grades.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'F2.1B: implementar notas compensáveis com fingerprint e ownership'
          git push origin HEAD:feat/enrollment-rectification-f2-1b-grades
