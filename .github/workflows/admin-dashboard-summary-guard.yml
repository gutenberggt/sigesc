name: Admin Dashboard Summary Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/src/pages/Dashboard.js'
      - 'backend/routers/users.py'
      - 'backend/tests/test_admin_dashboard_summary_links.py'
      - 'backend/tests/test_secretary_user_school_scope.py'
      - '.github/workflows/admin-dashboard-summary-guard.yml'

  push:
    branches:
      - main
    paths:
      - 'frontend/src/pages/Dashboard.js'
      - 'backend/routers/users.py'
      - 'backend/tests/test_admin_dashboard_summary_links.py'
      - 'backend/tests/test_secretary_user_school_scope.py'
      - '.github/workflows/admin-dashboard-summary-guard.yml'

jobs:
  admin-dashboard-summary:
    name: Dashboards administrativos sem duplicação e com escopo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Validate consolidated administrative dashboards
        run: >-
          pytest -q --noconftest
          backend/tests/test_admin_dashboard_summary_links.py
          backend/tests/test_secretary_user_school_scope.py
