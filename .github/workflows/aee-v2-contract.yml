name: AEE v2 - Contract Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-6-6d-ui:
    name: TEMP - aplicar patch autorizado 6.6D na UI
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/aee-v2-plan-write-governance-6-6d'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply minimal authorized DiarioAEE patch
        run: python .github/scripts/_tmp_aee_6_6d_patch_diario.py

      - name: Validate and push patch
        run: |
          git diff --check
          git diff -- frontend/src/pages/DiarioAEE.js
          if git diff --quiet -- frontend/src/pages/DiarioAEE.js; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git add frontend/src/pages/DiarioAEE.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(aee): aplicar governança de escrita 6.6D na UI"
          git push origin HEAD:${{ github.head_ref }}

  aee-v2-contract:
    name: AEE v2 - contrato, persistência, interface e preservação do legado
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated dependencies
        # Mantém o comportamento de roteamento idêntico ao backend de produção.
        # FastAPI >= 0.137 alterou estruturalmente include_router() e não reproduz
        # a clonagem de APIRoute usada pelo SIGESC enquanto estiver em 0.110.1.
        run: pip install pytest pydantic pymongo 'fastapi==0.110.1'

      - name: Compile canonical AEE v2 package
        run: python -m compileall -q aee_v2 routers/aee_v2_dossier.py routers/aee_v2_persistence.py routers/aee_v2_delete_guard.py scripts/audit_aee_time_integrity_2026.py scripts/audit_aee_v2_plan_list_6_6a.py

      - name: Run AEE v2 contract, persistence, legacy-preservation and UI tests
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_aee_v2_contracts.py \
            tests/test_aee_v2_p0.py \
            tests/test_aee_v2_versioning.py \
            tests/test_aee_v2_bootstrap_recovery.py \
            tests/test_aee_v2_fase3_ui_contract.py \
            tests/test_aee_v2_delete_guard.py \
            tests/test_aee_v2_effective_source.py \
            tests/test_aee_v2_diario_shadow.py \
            tests/test_aee_v2_diario_schedule_cutover.py \
            tests/test_aee_v2_pdf_shadow.py \
            tests/test_aee_v2_pdf_schedule_cutover.py \
            tests/test_aee_time_integrity.py \
            tests/test_aee_v2_plano_shadow.py \
            tests/test_aee_v2_plano_effective_read.py \
            tests/test_aee_v2_plano_pdf_effective.py \
            tests/test_aee_v2_plano_pdf_shadow.py \
            tests/test_aee_v2_plan_list_shadow.py \
            tests/test_aee_v2_plan_list_contract.py \
            tests/test_aee_v2_plan_list_effective_cutover.py \
            tests/test_aee_v2_fase6_6c_ui_contract.py \
            tests/test_aee_v2_plan_write_governance.py \
            tests/test_aee_v2_fase6_6d_ui_contract.py
