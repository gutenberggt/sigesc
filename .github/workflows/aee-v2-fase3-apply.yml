name: AEE v2 Fase 3 - Apply integration patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/aee-v2-fase3-interface

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aee-v2-fase3-interface
          fetch-depth: 0

      - name: Detect already-applied patch
        id: detect
        run: |
          if grep -q "import DossieAEEV2Modal" frontend/src/pages/DiarioAEE.js; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply deterministic Fase 3 integrations
        if: steps.detect.outputs.applied != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 match, encontrado {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          diario = 'frontend/src/pages/DiarioAEE.js'
          modal = 'frontend/src/components/PlanoAEEModal.js'
          pdf = 'backend/pdf/plano_aee.py'

          replace_once(
              diario,
              " * AEE v2 P0: alterações desta rodada autorizadas explicitamente pelo\n * proprietário do produto em 21/08/2026.\n",
              " * AEE v2 P0: alterações desta rodada autorizadas explicitamente pelo\n * proprietário do produto em 21/08/2026.\n *\n * AEE v2 Fase 3: interface do Dossiê Individual AEE V2 autorizada\n * explicitamente pelo proprietário em 21/08/2026.\n"
          )
          replace_once(
              diario,
              "import PlanoAEEModal from '@/components/PlanoAEEModal';\nimport SpellCheckTextarea from '@/components/SpellCheckTextarea';",
              "import PlanoAEEModal from '@/components/PlanoAEEModal';\nimport DossieAEEV2Modal from '@/components/DossieAEEV2Modal';\nimport SpellCheckTextarea from '@/components/SpellCheckTextarea';"
          )
          replace_once(
              diario,
              "  const [selectedStudent, setSelectedStudent] = useState(null);\n  const [selectedPlano, setSelectedPlano] = useState(null);",
              "  const [selectedStudent, setSelectedStudent] = useState(null);\n  const [selectedPlano, setSelectedPlano] = useState(null);\n  const [dossiePlano, setDossiePlano] = useState(null);"
          )
          replace_once(
              diario,
              "                        <Eye size={16} />\n                      </button>\n                      {canEdit && (",
              "                        <Eye size={16} />\n                      </button>\n                      <button\n                        onClick={() => setDossiePlano(plano)}\n                        className=\"p-1 text-cyan-700 hover:bg-cyan-50 rounded\"\n                        title=\"Abrir Dossiê Individual AEE V2\"\n                        data-testid={`btn-dossie-v2-${plano.id}`}\n                      >\n                        <ClipboardList size={16} />\n                      </button>\n                      {canEdit && ("
          )
          replace_once(
              diario,
              "            Diário AEE\n          </h1>",
              "            Diário AEE V2.0\n          </h1>"
          )
          replace_once(
              diario,
              "<h3 className=\"text-lg font-semibold text-gray-800\">Diário AEE - Visão Consolidada</h3>",
              "<h3 className=\"text-lg font-semibold text-gray-800\">Diário AEE V2.0 - Visão Consolidada</h3>"
          )
          replace_once(
              diario,
              "      {showAtendimentoModal && atendimentoModalContent}\n\n      {/* Modal de Visualização do Plano AEE (Feb 2026) */}",
              "      {showAtendimentoModal && atendimentoModalContent}\n      <DossieAEEV2Modal\n        show={Boolean(dossiePlano)}\n        onClose={() => setDossiePlano(null)}\n        plano={dossiePlano}\n        token={token}\n        canEdit={canEdit}\n      />\n\n      {/* Modal de Visualização do Plano AEE (Feb 2026) */}"
          )
          replace_once(
              modal,
              'label="Adaptações por Componente Curricular" value={form.adaptacoes_por_componente}',
              'label="Adaptações por Componente Curricular/Campos de Experiência" value={form.adaptacoes_por_componente}'
          )
          replace_once(
              modal,
              'placeholder="Adaptações específicas para cada componente curricular..."',
              'placeholder="Adaptações específicas para cada componente curricular ou campo de experiência..."'
          )
          replace_once(
              pdf,
              "[Paragraph('Adaptações por Componente:', label),",
              "[Paragraph('Adaptações por Componente Curricular/Campos de Experiência:', label),"
          )
          PY

      - name: Validate intended diff
        if: steps.detect.outputs.applied != 'true'
        run: |
          git diff --check
          grep -q 'Diário AEE V2.0' frontend/src/pages/DiarioAEE.js
          grep -q 'DossieAEEV2Modal' frontend/src/pages/DiarioAEE.js
          grep -q 'Adaptações por Componente Curricular/Campos de Experiência' frontend/src/components/PlanoAEEModal.js
          grep -q 'Adaptações por Componente Curricular/Campos de Experiência' backend/pdf/plano_aee.py

      - name: Commit integration patch
        if: steps.detect.outputs.applied != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/pages/DiarioAEE.js frontend/src/components/PlanoAEEModal.js backend/pdf/plano_aee.py
          git commit -m 'feat(aee): connect Dossiê V2 interface and labels'
          git push origin HEAD:agent/aee-v2-fase3-interface
