name: AEE v2 Fase 4 - PR patch runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/aee-v2-fase4-adequacao-pedagogica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aee-v2-fase4-adequacao-pedagogica
          fetch-depth: 0

      - name: Execute deterministic patch embedded in preparation workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/aee-v2-fase4-apply.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate intended diff"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Bloco determinístico da Fase 4 não localizado')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(block), 'aee-v2-fase4-patch', 'exec'))
          PY

      - name: Validate and commit patch
        run: |
          git diff --check
          grep -q 'STUDY_CASE_STUDENT_PARTICIPATION' backend/aee_v2/legacy_mapper.py
          grep -q 'update_lifecycle' backend/aee_v2/versioning.py
          grep -q 'sections/lifecycle' backend/routers/aee_v2_persistence.py
          grep -q 'Vigência e Revisão' frontend/src/components/DossieAEEV2Modal.jsx
          grep -q 'item.description || item.message' frontend/src/components/DossieAEEV2Modal.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/aee_v2/legacy_mapper.py \
            backend/aee_v2/versioning.py \
            backend/aee_v2/repository.py \
            backend/routers/aee_v2_persistence.py \
            backend/tests/test_aee_v2_contracts.py \
            backend/tests/test_aee_v2_versioning.py \
            backend/tests/test_aee_v2_fase3_ui_contract.py \
            frontend/src/components/DossieAEEV2Modal.jsx
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'feat(aee): complete pedagogical adequacy guidance for Dossie V2'
            git push origin HEAD:agent/aee-v2-fase4-adequacao-pedagogica
          fi
