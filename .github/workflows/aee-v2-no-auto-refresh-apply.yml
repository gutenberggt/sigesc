name: AEE v2 - apply modal navigation persistence fix

on:
  push:
    branches:
      - fix/aee-v2-modal-no-auto-refresh

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aee-v2-modal-no-auto-refresh
          fetch-depth: 0

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('frontend/src/components/DossieAEEV2Modal.jsx')
          text = ui.read_text(encoding='utf-8')
          text = text.replace(
              "import React, { useCallback, useEffect, useMemo, useState } from 'react';",
              "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
              1,
          )
          text = text.replace(
              "  const [message, setMessage] = useState(null);\n\n  const baseUrl =",
              "  const [message, setMessage] = useState(null);\n  const initialLoadKeyRef = useRef(null);\n\n  const baseUrl =",
              1,
          )
          old = """  useEffect(() => {\n    if (show) {\n      setActiveTab('overview');\n      loadState();\n    }\n  }, [show, loadState]);"""
          new = """  useEffect(() => {\n    if (!show || !plano?.id) {\n      initialLoadKeyRef.current = null;\n      return;\n    }\n\n    const openKey = String(plano.id);\n    if (initialLoadKeyRef.current === openKey) return;\n\n    initialLoadKeyRef.current = openKey;\n    setActiveTab('overview');\n    loadState();\n  }, [show, plano?.id, loadState]);"""
          if text.count(old) != 1:
              raise SystemExit('effect block not found exactly once')
          ui.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('backend/tests/test_aee_v2_fase3_ui_contract.py')
          source = test.read_text(encoding='utf-8').rstrip()
          marker = 'def test_dossier_does_not_auto_refresh_or_reset_tab_while_open():'
          if marker not in source:
              source += '''\n\n\ndef test_dossier_does_not_auto_refresh_or_reset_tab_while_open():\n    source = _read(DOSSIE)\n    effect_block = source[source.index("useEffect(() =>"):source.index("if (!show || !plano) return null;")]\n\n    assert "useRef" in source\n    assert "initialLoadKeyRef.current = null" in effect_block\n    assert "if (initialLoadKeyRef.current === openKey) return;" in effect_block\n    assert effect_block.index("if (initialLoadKeyRef.current === openKey) return;") < effect_block.index("setActiveTab('overview')")\n    assert source.count("setActiveTab('overview')") == 1\n    assert "onClick={loadState}" in source\n    assert 'title="Recarregar"' in source\n'''
          test.write_text(source + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/src/components/DossieAEEV2Modal.jsx').read_text(encoding='utf-8')
          effect = source[source.index('useEffect(() =>'):source.index('if (!show || !plano) return null;')]
          guard = 'if (initialLoadKeyRef.current === openKey) return;'
          assert 'useRef' in source
          assert 'initialLoadKeyRef.current = null' in effect
          assert guard in effect
          assert effect.index(guard) < effect.index("setActiveTab('overview')")
          assert source.count("setActiveTab('overview')") == 1
          assert 'onClick={loadState}' in source
          assert 'title="Recarregar"' in source
          print('AEE V2 modal no-auto-refresh contract: PASS')
          PY
          git diff --check

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/aee-v2-no-auto-refresh-apply.yml
          git add frontend/src/components/DossieAEEV2Modal.jsx backend/tests/test_aee_v2_fase3_ui_contract.py
          git commit -m 'fix(aee): preserve selected Dossie V2 tab until user action'
          git push origin HEAD:fix/aee-v2-modal-no-auto-refresh
