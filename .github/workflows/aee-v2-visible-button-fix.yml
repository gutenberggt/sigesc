name: AEE v2 - Visible Dossie button fix

on:
  push:
    branches:
      - fix/aee-v2-dossie-visible-button

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(aee): apply visible dossie button fix [aee-v2-visible-button]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aee-v2-dossie-visible-button
          fetch-depth: 0

      - name: Apply deterministic UI fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 match, encontrado {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          diario = 'frontend/src/pages/DiarioAEE.js'
          test = 'backend/tests/test_aee_v2_fase3_ui_contract.py'

          replace_once(
              diario,
              '''                      <button\n                        onClick={() => setDossiePlano(plano)}\n                        className="p-1 text-cyan-700 hover:bg-cyan-50 rounded"\n                        title="Abrir Dossiê Individual AEE V2"\n                        data-testid={`btn-dossie-v2-${plano.id}`}\n                      >\n                        <ClipboardList size={16} />\n                      </button>''',
              '''                      <button\n                        onClick={() => setDossiePlano(plano)}\n                        className="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-cyan-700 bg-cyan-50 border border-cyan-200 rounded-md hover:bg-cyan-100 whitespace-nowrap"\n                        title="Abrir Dossiê Individual AEE V2"\n                        data-testid={`btn-dossie-v2-${plano.id}`}\n                      >\n                        <ClipboardList size={14} />\n                        <span>Dossiê V2</span>\n                      </button>'''
          )

          replace_once(
              test,
              '''    assert "btn-dossie-v2-" in source\n    assert "<DossieAEEV2Modal" in source''',
              '''    assert "btn-dossie-v2-" in source\n    assert "<span>Dossiê V2</span>" in source\n    assert "inline-flex items-center" in source\n    assert "<DossieAEEV2Modal" in source'''
          )
          PY

      - name: Validate intended diff
        run: |
          git diff --check
          grep -q '<span>Dossiê V2</span>' frontend/src/pages/DiarioAEE.js
          grep -q 'btn-dossie-v2-' frontend/src/pages/DiarioAEE.js
          grep -q '<span>Dossiê V2</span>' backend/tests/test_aee_v2_fase3_ui_contract.py

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/pages/DiarioAEE.js backend/tests/test_aee_v2_fase3_ui_contract.py
          git commit -m 'fix(aee): make Dossie V2 action visible'
          git push origin HEAD:fix/aee-v2-dossie-visible-button
