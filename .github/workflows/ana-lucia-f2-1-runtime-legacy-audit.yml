name: "ANA-LUCIA-F2.1 Runtime Legacy Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/ana_lucia_f2_1_runtime_legacy_audit.py'
      - 'backend/tests/test_ana_lucia_f2_1_runtime_legacy_audit.py'
      - '.github/workflows/ana-lucia-f2-1-runtime-legacy-audit.yml'
      - 'memory/audit/ANA_LUCIA_F2_1_RUNTIME_LEGACY_2026-09-01.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ana-lucia-f2-1-runtime-legacy-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard ANA-LUCIA-F2.1 read-only collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compile and test classifications
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          python -m py_compile backend/scripts/ana_lucia_f2_1_runtime_legacy_audit.py
          python -m py_compile backend/tests/test_ana_lucia_f2_1_runtime_legacy_audit.py
          pytest -q --noconftest backend/tests/test_ana_lucia_f2_1_runtime_legacy_audit.py

      - name: Enforce read-only and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/scripts/ana_lucia_f2_1_runtime_legacy_audit.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden = {
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in forbidden:
                      raise SystemExit(f'ANA_LUCIA_F2_1_MONGO_MUTATOR:{node.func.attr}')
          for marker in (
              '"database_mutation": False',
              '"production_writes": False',
              '"mongo_reads_only": True',
              '"http_methods": ["GET"]',
              '"login_endpoint_used": False',
              '"attendance_records_read": False',
              '"student_data_read": False',
              '"student_pii_emitted": False',
              '"pedagogical_text_decoded": False',
              '"technical_ids_emitted": False',
          ):
              if marker not in source:
                  raise SystemExit(f'ANA_LUCIA_F2_1_BOUNDARY_MARKER_MISSING:{marker}')
          if 'method="POST"' in source or 'method="PUT"' in source or 'method="DELETE"' in source or 'method="PATCH"' in source:
              raise SystemExit('ANA_LUCIA_F2_1_HTTP_WRITE_METHOD_FOUND')
          print('ANA_LUCIA_F2_1_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Audit runtime legacy chain in production
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[ANA-LUCIA-F2.1-RUNTIME] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-scoped exact-SHA authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, os, re, urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('ANA_LUCIA_F2_1_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('ANA_LUCIA_F2_1_GATE_MUST_BE_OPEN')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              line=raw.strip()
              if not line or '=' not in line: continue
              key,value=line.split('=',1)
              if key.strip() in values: raise SystemExit(f'ANA_LUCIA_F2_1_DUPLICATE_FIELD:{key.strip()}')
              values[key.strip()]=value.strip()
          if values.get('ANA_LUCIA_F2_1_RUNTIME') != 'AUTHORIZED': raise SystemExit('ANA_LUCIA_F2_1_AUTH_INVALID')
          if values.get('CONFIRMATION') != 'AUDIT_RUNTIME_LEGACY_READ_ONLY': raise SystemExit('ANA_LUCIA_F2_1_CONFIRMATION_INVALID')
          if values.get('ACADEMIC_YEAR') != '2026': raise SystemExit('ANA_LUCIA_F2_1_YEAR_INVALID')
          if values.get('TRACKING_ISSUE') != '314': raise SystemExit('ANA_LUCIA_F2_1_TRACKING_INVALID')
          target=values.get('TARGET_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target): raise SystemExit('ANA_LUCIA_F2_1_SHA_INVALID')
          if issue.get('title') != f'[ANA-LUCIA-F2.1-RUNTIME] {target}': raise SystemExit('ANA_LUCIA_F2_1_TITLE_MISMATCH')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/branches/main",
              headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-ana-lucia-f2-1'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              main_sha=json.load(response)['commit']['sha']
          if main_sha != target: raise SystemExit(f'ANA_LUCIA_F2_1_MAIN_MOVED:{main_sha}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
              out.write('tracking_issue=314\n')
          print('ANA_LUCIA_F2_1_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Seal frontend resolver and screen contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          content_bridge=Path('frontend/src/services/contentDvdBridge.js').read_text(encoding='utf-8')
          attendance_bridge=Path('frontend/src/services/attendanceDvdBridge.js').read_text(encoding='utf-8')
          content_page=Path('frontend/src/pages/LearningObjects.js').read_text(encoding='utf-8')
          attendance_page=Path('frontend/src/pages/Attendance.js').read_text(encoding='utf-8')
          attendance_backend=Path('backend/routers/attendance_dvd.py').read_text(encoding='utf-8')
          checks={
              'content_zero_diary_falls_back_legacy': 'if (candidates.length === 0) return config;' in content_bridge,
              'content_page_component_scoped_monthly_get': 'course_id: selectedCourse' in content_page and 'month: currentMonth + 1' in content_page,
              'content_page_sets_http_records_directly': 'setRecords(data);' in content_page and 'records.find(r => r.date === dateStr)' in content_page,
              'attendance_bridge_requires_assignment_id': "if (!assignmentId || !config?.url || !config.url.includes('/attendance'))" in attendance_bridge,
              'attendance_page_uses_dates_endpoint': 'attendanceAPI.getDatesWithRecords(selectedClass, academicYear, courseId)' in attendance_page,
              'attendance_page_silently_empties_dates_on_error': 'setRegistrosAttDates(new Set());' in attendance_page,
              'attendance_backend_has_raw_year_guard': 'async def _has_dvd_year' in attendance_backend and '"diary_settings.enabled": True' in attendance_backend,
              'attendance_raw_year_guard_does_not_call_scope_contract': 'is_class_in_scope' not in attendance_backend[attendance_backend.index('async def _has_dvd_year'):attendance_backend.index('@base_router.get("/report/class/{class_id}")')],
          }
          if not all(checks.values()):
              raise SystemExit('ANA_LUCIA_F2_1_FRONTEND_CONTRACT_DRIFT:' + json.dumps(checks,sort_keys=True))
          Path('evidence/frontend-contract.json').write_text(json.dumps(checks,sort_keys=True),encoding='utf-8')
          print('ANA_LUCIA_F2_1_FRONTEND_CONTRACT=PASS')
          PY

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "ANA_LUCIA_F2_1_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ana_lucia_f2_1_prod_key
          chmod 600 ~/.ssh/ana_lucia_f2_1_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/ana_lucia_f2_1_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute live runtime audit inside backend container
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          raw='evidence/ana-lucia-f2-1-raw.log'
          remote_command="timeout 700 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"ana_lucia_f2_1_runtime_legacy_audit.py\",\"exec\"),ns); print(\"ANA_LUCIA_F2_1_JSON=\"+json.dumps(ns[\"run_live_audit\"](),ensure_ascii=False,sort_keys=True))'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/ana_lucia_f2_1_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/ana_lucia_f2_1_runtime_legacy_audit.py > "$raw" 2>&1
          prefix='ANA_LUCIA_F2_1_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then tail -n 120 "$raw" || true; exit 2; fi
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"

      - name: Validate boundaries and derive layered diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          f=json.loads(Path('evidence/frontend-contract.json').read_text(encoding='utf-8'))
          for key in ('database_mutation','production_writes','attendance_records_read','student_data_read','student_pii_emitted','pedagogical_text_decoded','technical_ids_emitted','login_endpoint_used'):
              if p.get(key) is not False: raise SystemExit(f'ANA_LUCIA_F2_1_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True or p.get('http_methods') != ['GET']:
              raise SystemExit('ANA_LUCIA_F2_1_READ_ONLY_FAILED')
          if p.get('target_pair_count') != 17 or len(p.get('pairs') or []) != 17:
              raise SystemExit('ANA_LUCIA_F2_1_TARGET_COUNT_FAILED')
          if not all(f.values()): raise SystemExit('ANA_LUCIA_F2_1_FRONTEND_CONTRACT_FAILED')
          layers={
              'mongo': p.get('summary'),
              'endpoint_http': {
                  'content': p.get('summary',{}).get('content_diagnoses'),
                  'attendance': p.get('summary',{}).get('attendance_diagnoses'),
              },
              'resolver_frontend': f,
              'screen': {
                  'content': 'setRecords(data) -> records.find(date); sem filtro adicional após GET no fluxo Anos Finais/EJA',
                  'attendance': 'erro em dates-with-records é convertido silenciosamente em Set vazio',
              },
          }
          Path('evidence/layers.json').write_text(json.dumps(layers,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          print('ANA_LUCIA_F2_1_AUDIT=PASS')
          print('CONTENT_DIAGNOSES=' + json.dumps(p['summary']['content_diagnoses'],sort_keys=True))
          print('ATTENDANCE_DIAGNOSES=' + json.dumps(p['summary']['attendance_diagnoses'],sort_keys=True))
          PY

      - name: Upload read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ana-lucia-f2-1-runtime-${{ github.run_id }}
          path: |
            evidence/runtime.json
            evidence/frontend-contract.json
            evidence/layers.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment layered diagnosis and close execution gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: ${{ steps.context.outputs.tracking_issue }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          f=json.loads(Path('evidence/frontend-contract.json').read_text(encoding='utf-8'))
          s=p['summary']
          lines=[
              '## ANA-LUCIA-F2.1 — diagnóstico runtime legacy por camada', '',
              f"Target: `{os.environ['TARGET_SHA']}`", f"Pares auditados: **{p['target_pair_count']}**", '',
              '### Cadeia',
              f"- **Mongo legado:** conteúdo={s['content_mongo_total']} docs; frequência oficial={s['attendance_official_documents_total']} docs; documental={s['attendance_documentary_documents_total']} docs.",
              f"- **Endpoint/HTTP:** conteúdo `{json.dumps(s['content_diagnoses'],ensure_ascii=False,sort_keys=True)}`; frequência `{json.dumps(s['attendance_diagnoses'],ensure_ascii=False,sort_keys=True)}`.",
              f"- **Resolver frontend:** content fallback legado={f['content_zero_diary_falls_back_legacy']}; attendance sem assignment preserva legado={f['attendance_bridge_requires_assignment_id']}.",
              f"- **Tela:** conteúdo injeta a resposta em `setRecords(data)` e marca dia por `records.find(date)`; frequência transforma falha de `dates-with-records` em conjunto vazio={f['attendance_page_silently_empties_dates_on_error']}.",
              '',
              '| Turma / Componente | Conteúdo Mongo t/m | HTTP P/G | Diagnóstico conteúdo | Freq oficial docs/datas | HTTP datas P/G | by-class P/G | Diagnóstico frequência |',
              '|---|---:|---:|---|---:|---:|---:|---|',
          ]
          for row in p['pairs']:
              cm=row['content']['mongo']; chp=row['content']['professor_http']; chg=row['content']['management_http']
              am=row['attendance']['mongo']['collections']['attendance']; adp=row['attendance']['professor_dates_http']; adg=row['attendance']['management_dates_http']
              pair=f"{row['class']} / {row['component']}"
              lines.append(
                  f"| {pair} | {cm['target_tenant']}/{cm['missing_tenant']} | {chp['status']}:{chp['count']}/{chg['status']}:{chg['count']} | `{row['content']['diagnosis']}` | {am['documents']}/{am['distinct_dates']} | {adp['status']}:{adp['count']}/{adg['status']}:{adg['count']} | {row['attendance']['professor_by_class_status']}/{row['attendance']['management_by_class_status']} | `{row['attendance']['diagnosis']}` |"
              )
          lines += ['', '**Boundary:** Mongo read-only; HTTP GET only; sem login; sem `attendance.records`; sem PII de aluno; conteúdo pedagógico não decodificado; nenhuma mutação/backfill/reconciliação.', '']
          if s['attendance_diagnoses'].get('ATTENDANCE_RAW_DVD_YEAR_GUARD_OUT_OF_SCOPE'):
              lines += [
                  '### Achado causal — frequência',
                  'O adaptador `attendance_dvd.py` usa `_has_dvd_year` baseado na existência bruta de `teacher_class_assignments` com `diary_settings.enabled=true`, sem aplicar o contrato de escopo DVD v1. Em turma fora do DVD, isso pode devolver 409 ao professor. `Attendance.js` captura a falha de `dates-with-records` e substitui as datas por conjunto vazio, produzindo exatamente o sintoma de histórico desaparecido.',
              ]
          if s['content_diagnoses'].get('CONTENT_TENANT_METADATA_GAP'):
              lines += [
                  '', '### Achado causal — conteúdo',
                  'Há `learning_objects` legados sem `mantenedora_id`. Após o fail-closed multi-tenant, o endpoint legado aplica o tenant ativo e esses documentos não entram na resposta de nenhum perfil tenant-scoped. O bridge de conteúdo está corretamente em fallback legado; a perda ocorre antes da tela, no filtro de persistência/endpoint.',
              ]
          if s['content_diagnoses'].get('CONTENT_REACHES_SCREEN'):
              lines += ['', '### Conteúdo que chega à tela', 'Nos pares classificados `CONTENT_REACHES_SCREEN`, Mongo e HTTP estão em paridade e o código da tela não adiciona filtro posterior. Se ainda houver ausência visual nesses pares, a próxima verificação deve ser a versão efetivamente servida/cache do frontend, não saneamento de dados.']
          body='\n'.join(lines)
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def req(method,path,payload):
              r=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',data=json.dumps(payload).encode(),method=method,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-ana-lucia-f2-1','Content-Type':'application/json'})
              with urllib.request.urlopen(r,timeout=30) as response: response.read()
          req('POST',f"/issues/{os.environ['TRACKING_ISSUE']}/comments",{'body':body})
          req('PATCH',f"/issues/{os.environ['GATE_ISSUE']}",{'state':'closed','state_reason':'completed'})
          PY