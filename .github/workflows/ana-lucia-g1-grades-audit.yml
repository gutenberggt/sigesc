name: "ANA-LUCIA-G1 Grades Read-Only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/ana_lucia_g1_grades_audit.py'
      - 'backend/tests/test_ana_lucia_g1_grades_audit.py'
      - '.github/workflows/ana-lucia-g1-grades-audit.yml'
      - 'memory/audit/ANA_LUCIA_G1_GRADES_AUDIT_2026-09-11.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ana-lucia-g1-grades-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard G1 read-only surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest pymongo
      - name: Compile and run focused tests
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/ana_lucia_g1_grades_audit.py
          python -m py_compile backend/tests/test_ana_lucia_g1_grades_audit.py
          python -m pytest -q --noconftest backend/tests/test_ana_lucia_g1_grades_audit.py
      - name: Enforce read-only boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('backend/scripts/ana_lucia_g1_grades_audit.py')
          tree=ast.parse(p.read_text(encoding='utf-8'))
          forbidden={
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          found=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  found.append(node.func.attr)
          if found:
              raise SystemExit('ANA_LUCIA_G1_MUTATOR_FORBIDDEN:'+','.join(found))
          print('ANA_LUCIA_G1_READ_ONLY_BOUNDARY=PASS')
          PY

  production-audit:
    name: Audit grades in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[ANA-LUCIA-G1-RUNTIME] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-scoped exact-SHA authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('ANA_LUCIA_G1_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              line=raw.strip()
              if not line or '=' not in line: continue
              key,value=line.split('=',1)
              key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'ANA_LUCIA_G1_DUPLICATE_FIELD:{key}')
              values[key]=value
          if values.get('ANA_LUCIA_G1_RUNTIME') != 'AUTHORIZED':
              raise SystemExit('ANA_LUCIA_G1_AUTH_INVALID')
          if values.get('CONFIRMATION') != 'READ_ONLY_GRADES_AUDIT':
              raise SystemExit('ANA_LUCIA_G1_CONFIRMATION_INVALID')
          if values.get('ACADEMIC_YEAR') != '2026':
              raise SystemExit('ANA_LUCIA_G1_YEAR_INVALID')
          if values.get('TRACKING_ISSUE') != '694':
              raise SystemExit('ANA_LUCIA_G1_TRACKING_INVALID')
          target=values.get('TARGET_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target):
              raise SystemExit('ANA_LUCIA_G1_SHA_INVALID')
          if issue.get('title') != f'[ANA-LUCIA-G1-RUNTIME] {target}':
              raise SystemExit('ANA_LUCIA_G1_TITLE_MISMATCH')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/branches/main",
              headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-ana-lucia-g1'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              main_sha=json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'ANA_LUCIA_G1_MAIN_MOVED:{main_sha}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('ANA_LUCIA_G1_CONTEXT=PASS')
          PY

      - name: Checkout exact authorized main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "ANA_LUCIA_G1_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ana_lucia_g1_prod_key
          chmod 600 ~/.ssh/ana_lucia_g1_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container
        id: topology
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/ana_lucia_g1_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute read-only audit
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/ana-lucia-g1-raw.log'
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/ana_lucia_g1_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "timeout 900 docker exec -i ${BACKEND_CONTAINER} python -" \
            < backend/scripts/ana_lucia_g1_grades_audit.py > "$raw" 2>&1
          rc=$?
          set -e
          prefix='ANA_LUCIA_G1_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then
            tail -n 160 "$raw" || true
            exit "${rc:-2}"
          fi
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"
          test "$rc" -eq 0

      - name: Validate receipt and build summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'ANA_LUCIA_G1_GRADES_AUDIT_V1':
              raise SystemExit('ANA_LUCIA_G1_RECEIPT_SCHEMA_INVALID')
          if p.get('status') != 'READ_ONLY_AUDIT_COMPLETE':
              raise SystemExit('ANA_LUCIA_G1_STATUS_INVALID')
          if p.get('production_writes') or p.get('database_mutation'):
              raise SystemExit('ANA_LUCIA_G1_MUTATION_DETECTED')
          if p.get('target_pair_count') != 8:
              raise SystemExit('ANA_LUCIA_G1_TARGET_COUNT_INVALID')
          priv=p.get('privacy') or {}
          if priv.get('student_ids_emitted') or priv.get('student_names_read') or priv.get('grade_values_emitted'):
              raise SystemExit('ANA_LUCIA_G1_PRIVACY_CONTRACT_INVALID')
          lines=[
              '## ANA-LUCIA-G1 — auditoria read-only de notas',
              '',
              f"**Status:** `{p.get('status')}`",
              f"**Documentos:** legado={p.get('legacy_grade_documents')} | canônico={p.get('current_grade_documents')}",
              f"**Classificações:** `{json.dumps(p.get('classifications') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"**Ownership:** `{json.dumps(p.get('ownership') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"**Colisões bloqueantes:** `{json.dumps(p.get('blocking_collisions') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"**Remapeamento apenas de course_id seguro:** `{p.get('safe_course_id_only_remap')}`",
              '',
              f"Identidade: `{p.get('legacy_course_fingerprint')}` → `{p.get('current_course_fingerprint')}`",
              '',
              'Nenhuma PII ou valor acadêmico foi emitido; nenhuma escrita foi executada.',
          ]
          Path('evidence/summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ana-lucia-g1-grades-audit
          path: |
            evidence/runtime.json
            evidence/summary.md
          retention-days: 30

      - name: Comment tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 694 --repo "$GITHUB_REPOSITORY" --body-file evidence/summary.md
