name: Apply A2 cadastral adjustments

on:
  push:
    branches:
      - fix/a2-cadastral-adjustments
    paths:
      - .github/workflows/apply-a2-cadastral-adjustments.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a2-cadastral-adjustments
          fetch-depth: 0

      - name: Patch StudentsComplete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/StudentsComplete.js')
          text = path.read_text(encoding='utf-8')

          import_old = "import { EMPTY_STUDENT_ADDRESS, buildStudentAddressDefaultsFromMantenedora, ibgeCodesFromViaCep, updateStudentAddressField } from '@/utils/ibgeAddress';\nimport { DIFFERENTIATED_LOCATION_OPTIONS, GEOGRAPHIC_LOCATION_OPTIONS } from '@/utils/studentLocation';"
          import_new = "import { EMPTY_STUDENT_ADDRESS, buildStudentAddressDefaultsFromMantenedora, ibgeCodesFromViaCep, updateStudentAddressField } from '@/utils/ibgeAddress';\nimport { mergeMissingIbgeCodesFromMantenedora } from '@/utils/studentIbgeBackfill';\nimport { DIFFERENTIATED_LOCATION_OPTIONS, GEOGRAPHIC_LOCATION_OPTIONS } from '@/utils/studentLocation';"
          assert text.count(import_old) == 1, 'Import esperado não encontrado exatamente uma vez'
          text = text.replace(import_old, import_new, 1)

          merge_marker = """    Object.entries(freshStudent).forEach(([key, value]) => {\n      if (value !== null && value !== undefined) {\n        mergedData[key] = value;\n      }\n    });\n"""
          merge_insert = merge_marker + """    mergedData.address = mergeMissingIbgeCodesFromMantenedora(\n      freshStudent.address,\n      mantenedoraConfig\n    );\n"""
          assert text.count(merge_marker) == 2, f'Esperadas 2 montagens de cadastro existente; encontrado {text.count(merge_marker)}'
          text = text.replace(merge_marker, merge_insert, 2)

          note_old = "Em novos cadastros, CEP, Município, UF e códigos IBGE são pré-preenchidos pela Unidade Mantenedora e permanecem editáveis."
          note_new = "Em novos cadastros, CEP, Município, UF e códigos IBGE são pré-preenchidos pela Unidade Mantenedora. Em cadastros existentes, códigos IBGE ausentes são completados quando UF/Município forem compatíveis com a mantenedora."
          assert text.count(note_old) == 1, 'Texto explicativo do endereço não encontrado'
          text = text.replace(note_old, note_new, 1)

          layout_old = """        <div><label className=\"block text-sm font-medium text-gray-700 mb-1\">Código IBGE do Município</label><input type=\"text\" inputMode=\"numeric\" maxLength={7} value={formData.address?.city_ibge_code || ''} onChange={(e) => updateAddressData('city_ibge_code', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\" /></div>\n        <div>\n          <label className=\"block text-sm font-medium text-gray-700 mb-1\">Localização geográfica da residência</label>\n          <select value={formData.address?.geographic_location || ''} onChange={(e) => updateAddressData('geographic_location', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\">\n            <option value=\"\">Não informado</option>\n            {GEOGRAPHIC_LOCATION_OPTIONS.map(option => (<option key={option.value} value={option.value}>{option.label}</option>))}\n          </select>\n        </div>\n        <div>\n          <label className=\"block text-sm font-medium text-gray-700 mb-1\">Localização diferenciada</label>\n          <select value={formData.address?.differentiated_location || ''} onChange={(e) => updateAddressData('differentiated_location', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\">\n            <option value=\"\">Não informado</option>\n            {DIFFERENTIATED_LOCATION_OPTIONS.map(option => (<option key={option.value} value={option.value}>{option.label}</option>))}\n          </select>\n          <p className=\"mt-1 text-xs text-gray-500\">Opcional. “Não informado” permanece distinto de “Não está em localização diferenciada”.</p>\n        </div>\n"""
          layout_new = """        <div className=\"md:col-span-6 grid grid-cols-1 md:grid-cols-12 gap-4\">\n          <div className=\"md:col-span-2\"><label className=\"block text-sm font-medium text-gray-700 mb-1\">Código IBGE do Município</label><input type=\"text\" inputMode=\"numeric\" maxLength={7} value={formData.address?.city_ibge_code || ''} onChange={(e) => updateAddressData('city_ibge_code', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\" /></div>\n          <div className=\"md:col-span-3\">\n            <label className=\"block text-sm font-medium text-gray-700 mb-1\">Localização geográfica da residência</label>\n            <select value={formData.address?.geographic_location || ''} onChange={(e) => updateAddressData('geographic_location', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\">\n              <option value=\"\">Não informado</option>\n              {GEOGRAPHIC_LOCATION_OPTIONS.map(option => (<option key={option.value} value={option.value}>{option.label}</option>))}\n            </select>\n          </div>\n          <div className=\"md:col-span-4\">\n            <label className=\"block text-sm font-medium text-gray-700 mb-1\">Localização diferenciada</label>\n            <select value={formData.address?.differentiated_location || ''} onChange={(e) => updateAddressData('differentiated_location', e.target.value)} disabled={viewMode} className=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100\">\n              <option value=\"\">Não informado</option>\n              {DIFFERENTIATED_LOCATION_OPTIONS.map(option => (<option key={option.value} value={option.value}>{option.label}</option>))}\n            </select>\n            <p className=\"mt-1 text-xs text-gray-500\">Opcional. “Não informado” permanece distinto de “Não está em localização diferenciada”.</p>\n          </div>\n        </div>\n"""
          assert text.count(layout_old) == 1, 'Bloco territorial esperado não encontrado exatamente uma vez'
          text = text.replace(layout_old, layout_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Static checks
        run: |
          git diff --check
          python -m compileall -q backend/scripts/backfill_student_ibge_codes.py backend/tests/test_backfill_student_ibge_codes.py

      - name: Commit patched component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/StudentsComplete.js
          git commit -m "fix(student): adjust A2 legacy address fields"
          git push origin HEAD:fix/a2-cadastral-adjustments
