name: Assessment Policy v1 - Foundation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/assessment_policy/**'
      - 'backend/tests/test_assessment_policy_foundation_v1.py'
      - 'backend/tests/test_assessment_policy_registry_v1.py'
      - 'memory/audit/ASSESSMENT_POLICY_V1_*.md'
      - '.github/scripts/assessment_policy_scope_guard.py'
      - '.github/workflows/assessment-policy-foundation.yml'

jobs:
  scope-creep-guard:
    name: Assessment Policy - Scope Creep Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard Foundation scope
        run: python .github/scripts/assessment_policy_scope_guard.py

  contract-tests:
    name: Assessment Policy - Contract + Registry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated test dependencies
        run: pip install 'pydantic>=2,<3' pytest pytest-asyncio

      - name: Compile package
        run: python -m compileall -q backend/assessment_policy

      - name: Run Foundation tests
        run: |
          PYTHONPATH=backend pytest -q --noconftest \
            backend/tests/test_assessment_policy_foundation_v1.py \
            backend/tests/test_assessment_policy_registry_v1.py
