name: Assessment Policy v1 - Shadow Runner Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/assessment_policy/**'
      - 'backend/tests/test_assessment_policy_*_v1.py'
      - 'memory/audit/ASSESSMENT_POLICY_V1_SPRINT_006_SHADOW_RUNNER.md'
      - '.github/scripts/assessment_policy_scope_guard.py'
      - '.github/workflows/assessment-policy-shadow-runner.yml'

jobs:
  scope-creep-guard:
    name: Assessment Policy - Shadow Runner Scope Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard Shadow Runner scope
        run: python .github/scripts/assessment_policy_scope_guard.py

  runner-tests:
    name: Assessment Policy - Shadow Runner Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated test dependencies
        run: pip install 'pydantic>=2,<3' pytest pytest-asyncio

      - name: Compile Assessment Policy package
        run: python -m compileall -q backend/assessment_policy

      - name: Run complete Assessment Policy regression through Shadow Runner
        run: |
          PYTHONPATH=backend pytest -q --noconftest \
            backend/tests/test_assessment_policy_foundation_v1.py \
            backend/tests/test_assessment_policy_registry_v1.py \
            backend/tests/test_assessment_policy_series_resolver_v1.py \
            backend/tests/test_assessment_policy_resolver_v1.py \
            backend/tests/test_assessment_policy_conflict_checker_v1.py \
            backend/tests/test_assessment_policy_calculator_v1.py \
            backend/tests/test_assessment_policy_recovery_v1.py \
            backend/tests/test_assessment_policy_outcome_v1.py \
            backend/tests/test_assessment_policy_shadow_v1.py \
            backend/tests/test_assessment_policy_shadow_runner_v1.py
