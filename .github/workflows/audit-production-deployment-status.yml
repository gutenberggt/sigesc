name: Audit Production Deployment Status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-deployment-status.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  audit:
    name: Read GitHub production deployment states
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest production deployments read-only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-production-deployment-audit',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({
              'environment': 'production',
              'per_page': 20,
          })
          deployments = get_json(
              f'https://api.github.com/repos/{repo}/deployments?{query}'
          )

          print(f'PRODUCTION_DEPLOYMENT_COUNT_FETCHED={len(deployments)}')
          if not deployments:
              print('LATEST_PRODUCTION_DEPLOYMENT=NONE')
              raise SystemExit(0)

          transient_states = {'queued', 'pending', 'in_progress'}
          latest = None
          transient = []

          for index, deployment in enumerate(deployments, start=1):
              statuses = get_json(deployment['statuses_url'] + '?per_page=10')
              status = statuses[0] if statuses else {}
              state = status.get('state', 'NO_STATUS')
              row = {
                  'index': index,
                  'deployment_id': deployment.get('id'),
                  'sha': deployment.get('sha'),
                  'ref': deployment.get('ref'),
                  'task': deployment.get('task'),
                  'creator': (deployment.get('creator') or {}).get('login'),
                  'created_at': deployment.get('created_at'),
                  'status': state,
                  'status_created_at': status.get('created_at'),
                  'status_creator': (status.get('creator') or {}).get('login'),
                  'description': status.get('description'),
              }
              if latest is None:
                  latest = row
              if state in transient_states:
                  transient.append(row)
              print('DEPLOYMENT=' + json.dumps(row, ensure_ascii=False, sort_keys=True))

          print('LATEST_PRODUCTION_DEPLOYMENT=' + json.dumps(latest, ensure_ascii=False, sort_keys=True))
          print(f'TRANSIENT_PRODUCTION_DEPLOYMENTS={len(transient)}')
          for row in transient:
              print('TRANSIENT_DEPLOYMENT=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('DATABASE_MUTATION=NO')
          print('RUNTIME_MUTATION=NO')
          print('DEPLOYMENT_STATUS_MUTATION=NO')
          PY
