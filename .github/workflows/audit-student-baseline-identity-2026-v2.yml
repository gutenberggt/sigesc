name: "Audit — identidade matrícula baseline 2026 v2"

on:
  pull_request:
    paths:
      - '.github/workflows/audit-student-baseline-identity-2026-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Read-only identity audit v2
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
      IDENTITY_SALT: 88d3b6bbcb005a9a549ae06bef16a733
      IDENTITY_HASH: c6799ee6ef6c8966456247bd44e77b9c267865e4da67e48821a8fd5829cf493e

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "IDENTITY_AUDIT_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/identity_audit_key
          chmod 600 ~/.ssh/identity_audit_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve backend container
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/identity_audit_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' \
            --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Inspect identity sources without mutation
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        shell: bash
        run: |
          set -euo pipefail
          remote_command="timeout 600 docker exec -i -w /app -e PYTHONPATH=/app -e IDENTITY_SALT=${IDENTITY_SALT} -e IDENTITY_HASH=${IDENTITY_HASH} ${BACKEND_CONTAINER} python -"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/identity_audit_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" <<'PY'
          import asyncio, hashlib, os, re, unicodedata
          from motor.motor_asyncio import AsyncIOMotorClient

          TARGET_SCHOOL = "E M E I E F Monsenhor Augusto Dias de Brito"
          TARGET_CLASS = "7º ANO D"
          YEAR = 2026
          SPECIAL = {"aee", "recomposicao_aprendizagem", "reforco_escolar"}
          RX = re.compile(r"matr[ií]cula:\s*(\d+)", re.IGNORECASE)

          def norm(v):
              text = "".join(c for c in unicodedata.normalize("NFKD", str(v or "")) if not unicodedata.combining(c))
              return " ".join(text.casefold().strip().split())

          def n(v):
              return str(v or "").strip()

          def name_hash(salt, value):
              return hashlib.sha256(f"{salt}|name|{norm(value)}".encode()).hexdigest()

          async def main():
              mongo_url = os.environ.get("MONGO_URL", "").strip()
              db_name = os.environ.get("DB_NAME", "").strip()
              if not mongo_url or not db_name:
                  raise SystemExit("IDENTITY_AUDIT_DATABASE_ENV_MISSING")
              client = AsyncIOMotorClient(mongo_url)
              try:
                  db = client[db_name]
                  schools = await db.schools.find({}, {"_id":0,"id":1,"name":1,"mantenedora_id":1}).to_list(None)
                  schools = [s for s in schools if norm(s.get("name")) == norm(TARGET_SCHOOL)]
                  print(f"IDENTITY_AUDIT_TARGET_SCHOOLS={len(schools)}")
                  if len(schools) != 1:
                      raise SystemExit(2)
                  school = schools[0]
                  tenant = n(school.get("mantenedora_id"))
                  classes = await db.classes.find({"school_id":school.get("id"),"academic_year":{"$in":[YEAR,str(YEAR)]}}, {"_id":0,"id":1,"name":1,"atendimento_programa":1}).to_list(None)
                  classes = [c for c in classes if norm(c.get("name")) == norm(TARGET_CLASS)]
                  print(f"IDENTITY_AUDIT_TARGET_CLASSES={len(classes)}")
                  if len(classes) != 1:
                      raise SystemExit(3)
                  target_class_id = n(classes[0].get("id"))

                  matches=[]
                  async for s in db.students.find({"mantenedora_id":tenant},{"_id":0,"id":1,"full_name":1,"enrollment_number":1,"status":1}):
                      if name_hash(os.environ["IDENTITY_SALT"], s.get("full_name")) == os.environ["IDENTITY_HASH"]:
                          matches.append(s)
                  print(f"IDENTITY_AUDIT_STUDENT_MATCHES={len(matches)}")
                  if len(matches) != 1:
                      raise SystemExit(4)
                  student=matches[0]
                  sid=n(student.get("id"))

                  enrollments=await db.enrollments.find({"student_id":sid},{"_id":0}).to_list(None)
                  class_ids=sorted({n(e.get("class_id")) for e in enrollments if n(e.get("class_id"))})
                  class_docs=await db.classes.find({"id":{"$in":class_ids}},{"_id":0,"id":1,"atendimento_programa":1}).to_list(None) if class_ids else []
                  cmap={n(c.get("id")):c for c in class_docs}
                  regular=[]
                  for e in enrollments:
                      c=cmap.get(n(e.get("class_id")))
                      if c and norm(c.get("atendimento_programa")) not in SPECIAL:
                          regular.append(e)
                  target=[e for e in regular if n(e.get("school_id"))==n(school.get("id")) and n(e.get("class_id"))==target_class_id and n(e.get("academic_year"))==str(YEAR)]
                  print(f"IDENTITY_AUDIT_TARGET_ENROLLMENTS={len(target)}")
                  if len(target) != 1:
                      raise SystemExit(5)
                  target=target[0]

                  current={n(e.get("enrollment_number")) for e in regular if n(e.get("enrollment_number"))}
                  previous={n(e.get("previous_enrollment_number")) for e in regular if n(e.get("previous_enrollment_number"))}
                  all_numbers=current|previous
                  student_number=n(student.get("enrollment_number"))

                  logged=""
                  cursor=db.audit_logs.find({"collection":"students","document_id":sid,"extra_data.action_type":"matricula"},{"_id":0,"timestamp":1,"extra_data":1}).sort("timestamp",1)
                  async for log in cursor:
                      obs=n((log.get("extra_data") or {}).get("observations"))
                      m=RX.search(obs)
                      if m:
                          logged=m.group(1)
                          break

                  target_current=n(target.get("enrollment_number"))
                  target_previous=n(target.get("previous_enrollment_number"))
                  print(f"IDENTITY_AUDIT_CURRENT_VARIANTS={len(current)}")
                  print(f"IDENTITY_AUDIT_PREVIOUS_VARIANTS={len(previous)}")
                  print(f"IDENTITY_AUDIT_ALL_VARIANTS={len(all_numbers)}")
                  print("IDENTITY_AUDIT_TARGET_CURRENT_PRESENT=" + ("YES" if target_current else "NO"))
                  print("IDENTITY_AUDIT_TARGET_PREVIOUS_PRESENT=" + ("YES" if target_previous else "NO"))
                  print("IDENTITY_AUDIT_STUDENT_NUMBER_PRESENT=" + ("YES" if student_number else "NO"))
                  print("IDENTITY_AUDIT_LOGGED_NUMBER_PRESENT=" + ("YES" if logged else "NO"))

                  resolved=""
                  basis=""
                  conflict=False
                  if len(all_numbers)>1:
                      conflict=True
                      basis="MULTIPLE_ENROLLMENT_NUMBERS"
                  elif len(all_numbers)==1:
                      resolved=next(iter(all_numbers))
                      if logged and logged != resolved:
                          conflict=True
                          basis="LOG_CONTRADICTS_ENROLLMENT"
                      else:
                          basis="LOG_CONFIRMS_ENROLLMENT" if logged else "ENROLLMENT_ONLY"
                  elif student_number:
                      resolved=student_number
                      if logged and logged != resolved:
                          conflict=True
                          basis="LOG_CONTRADICTS_STUDENT"
                      else:
                          basis="STUDENT_ONLY"
                  elif logged:
                      conflict=True
                      basis="LOG_ONLY"
                  else:
                      basis="NO_IDENTITY"

                  print("IDENTITY_AUDIT_DECISION=" + ("CONFLICT" if conflict else ("RESOLVED" if resolved else "NONE")))
                  print(f"IDENTITY_AUDIT_BASIS={basis}")
                  if conflict or not resolved:
                      print("IDENTITY_AUDIT_DATABASE_MUTATION=NO")
                      raise SystemExit(6)

                  print("IDENTITY_AUDIT_TARGET_PREVIOUS_MATCH=" + ("YES" if target_previous == resolved and target_previous else "NO"))
                  print("IDENTITY_AUDIT_STUDENT_MATCH=" + ("YES" if student_number == resolved and student_number else "NO"))
                  print("IDENTITY_AUDIT_LOGGED_MATCH=" + ("YES" if logged == resolved and logged else "NO"))

                  other_students=await db.students.count_documents({"id":{"$ne":sid},"enrollment_number":resolved})
                  other_enrollments=await db.enrollments.count_documents({"student_id":{"$ne":sid},"$or":[{"enrollment_number":resolved},{"previous_enrollment_number":resolved}]})
                  same_active=sum(1 for e in regular if n(e.get("enrollment_number"))==resolved and norm(e.get("status")) in {"active","ativo"})
                  print(f"IDENTITY_AUDIT_OTHER_STUDENT_OWNERS={other_students+other_enrollments}")
                  print(f"IDENTITY_AUDIT_SAME_STUDENT_ACTIVE_HOLDERS={same_active}")
                  safe=(len(all_numbers)==1 and target_previous==resolved and other_students==0 and other_enrollments==0 and same_active==0)
                  print("IDENTITY_AUDIT_SAFE_TO_RESTORE_TARGET_NUMBER=" + ("YES" if safe else "NO"))
                  print("IDENTITY_AUDIT_DATABASE_MUTATION=NO")
                  if not safe:
                      raise SystemExit(7)
              finally:
                  client.close()

          asyncio.run(main())
          PY
