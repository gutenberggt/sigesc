name: CI - Build & Lint

# Roda em todo push para main e em pull requests para main.
# Objetivo: detectar erros que poderiam quebrar o deploy no Coolify
# antes de o código chegar à produção.
on:
  push:
    branches:
      - main
      - agent/alinhar-educacao-infantil-etapas

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-students-indicators-layout:
    name: Apply scoped students indicators layout
    if: github.ref == 'refs/heads/agent/alinhar-educacao-infantil-etapas' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/alinhar-educacao-infantil-etapas
          fetch-depth: 0

      - name: Apply scoped JSX change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/StudentsComplete.js')
          text = path.read_text(encoding='utf-8')

          start_marker = '                  {/* EDUCAÇÃO INFANTIL */}'
          end_marker = '                  {/* EJA E MODALIDADES/ATENDIMENTOS */}'

          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected exactly one start marker, found {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'Expected exactly one end marker, found {text.count(end_marker)}')

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* EDUCAÇÃO INFANTIL */}
                    <div data-testid="series-infantil-counts">
                      <p className="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2">
                        Educação Infantil
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {['Berçário I','Berçário II','Maternal I','Maternal II','Pré I','Pré II'].map((label) => (
                          <span
                            key={label}
                            className="inline-flex items-center px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 text-xs font-medium"
                          >
                            {label}: {seriesCounts[label.toUpperCase()] || 0}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* ETAPAS DE ENSINO */}
                    <div data-testid="etapas-ensino-counts">
                      <p className="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2">
                        Etapas de Ensino
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {/* Somas por agrupamento (totais destacados) */}
                        <span
                          data-testid="sum-educacao-infantil"
                          className="inline-flex items-center px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 text-xs font-bold"
                          title="Soma de todas as séries da Educação Infantil"
                        >
                          Educação Infantil: {totalEducacaoInfantil}
                        </span>
                        <span
                          data-testid="sum-anos-iniciais"
                          className="inline-flex items-center px-3 py-1.5 rounded-full bg-blue-100 text-blue-800 border border-blue-300 text-xs font-bold"
                          title="Soma do 1º ao 5º Ano (Anos Iniciais)"
                        >
                          Anos Iniciais: {totalAnosIniciais}
                        </span>
                        <span
                          data-testid="sum-anos-finais"
                          className="inline-flex items-center px-3 py-1.5 rounded-full bg-blue-100 text-blue-800 border border-blue-300 text-xs font-bold"
                          title="Soma do 6º ao 9º Ano (Anos Finais)"
                        >
                          Anos Finais: {totalAnosFinais}
                        </span>
                      </div>
                    </div>
                  </div>

'''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate and commit scoped change
        shell: bash
        run: |
          git diff --check
          git diff -- frontend/src/pages/StudentsComplete.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/StudentsComplete.js
          git diff --cached --quiet && { echo "No source change produced"; exit 1; }
          git commit -m "style(students): alinhar educação infantil e etapas de ensino"
          git push origin HEAD:agent/alinhar-educacao-infantil-etapas

  nomenclature-guard:
    name: Nomenclature - Estudante guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # O guard compara o HEAD com a base do PR (ou HEAD^ em push).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Aluno x Estudante nomenclature
        run: python .github/scripts/nomenclature_guard.py

  frontend-build:
    name: Frontend - yarn build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # O frontend possui atualmente um yarn.lock que pode estar
      # temporariamente dessincronizado com package.json.
      #
      # O Dockerfile de produção já possui o mesmo mecanismo:
      # tenta primeiro instalação estrita com --frozen-lockfile
      # e, somente se ela falhar, reconcilia as dependências
      # utilizando yarn install normal.
      #
      # Esta estratégia mantém o CI alinhado ao processo real
      # utilizado pelo Coolify durante o build da aplicação.
      - name: Install dependencies
        run: |
          echo "Tentando instalação com yarn.lock em modo estrito..."

          if yarn install --frozen-lockfile --network-timeout 600000; then
            echo "Dependências instaladas com yarn.lock sincronizado."
          else
            echo "::warning title=Lockfile desatualizado::frontend/yarn.lock não está sincronizado com package.json."
            echo "Executando fallback de instalação, conforme comportamento atual do Dockerfile de produção..."

            yarn install --network-timeout 600000
          fi

      - name: Build production bundle
        # Mesmo comando executado pelo Dockerfile utilizado pelo Coolify.
        # Se houver erro real de compilação do frontend, este job deve falhar.
        run: yarn build
        env:
          # Valor de teste usado exclusivamente pelo CI.
          # Em produção, a variável real é injetada pelo Coolify.
          REACT_APP_BACKEND_URL: https://placeholder.example.com

          # Mantém o comportamento de build em ambiente de integração contínua.
          CI: 'true'

          # Mantém o consumo de memória e o comportamento próximos
          # ao Dockerfile utilizado em produção.
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: '--max-old-space-size=2048'

  backend-lint:
    name: Backend - ruff lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        # Falha em erros que indicam problemas reais de sintaxe,
        # imports ou estruturas Python inválidas.
        #
        # Não torna warnings históricos de qualidade existentes
        # no projeto bloqueantes neste momento.
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile check
        # Compila todos os módulos Python para detectar
        # erros de sintaxe antes do deploy.
        run: python -m compileall -q .