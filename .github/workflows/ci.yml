name: CI - Build & Lint

# Roda em todo push para main e em pull requests para main.
# Objetivo: detectar erros que poderiam quebrar o deploy no Coolify
# antes de o código chegar à produção.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  global-time-one-shot:
    name: P0 - Aplicar contrato temporal global
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/global-local-time-contract-p0-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/global-local-time-contract-p0-v2
          fetch-depth: 0

      - name: Apply global patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/one-shot-global-local-time-p0.yml \
            | sed 's/^          //' > /tmp/apply-global-time.sh
          bash /tmp/apply-global-time.sh

      - name: Normalize render worker time-context block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/services/render_worker.py')
          source = path.read_text(encoding='utf-8')
          start = source.find("    try:\n        time_ctx = job.get('time_context') or {}")
          if start < 0:
              raise SystemExit('Generated render-worker time block not found')
          end = source.find("\n    except Exception as e:", start)
          if end < 0:
              raise SystemExit('render-worker except anchor not found')
          block = '''    try:
        time_ctx = job.get("time_context") or {}
        with use_time_context(
            timezone_name=time_ctx.get("timezone"),
            utc_offset_minutes=time_ctx.get("utc_offset_minutes"),
            source="render_job",
        ):
            result = await handler(job) or {}
        if not isinstance(result, dict):
            result = {}
        await _mark_completed(db, job_id=job_id, result=result, started_at=job.get("started_at"))
        logger.info("[render_worker] job %s completed (type=%s)", job_id, document_type)'''
          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove temporary automation and restore CI
        run: |
          git rm -f .github/workflows/one-shot-global-local-time-p0.yml
          git rm -f .github/workflows/one-shot-global-local-time-pr.yml
          git rm -f .github/workflows/one-shot-global-local-time-push2.yml
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Validate focused contract
        run: |
          python -m compileall -q backend/utils/client_time.py backend/audit_service.py backend/routers/audit_logs.py backend/services/render_worker.py backend/pdf
          python -m pytest -q backend/tests/test_global_local_time_contract_p0.py backend/tests/test_professor_attendance_entrypoint_p0.py

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(time): aplicar fuso local global em UI auditoria e documentos"
          git push origin HEAD:fix/global-local-time-contract-p0-v2

  nomenclature-guard:
    name: Nomenclature - Estudante guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # O guard compara o HEAD com a base do PR (ou HEAD^ em push).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Aluno x Estudante nomenclature
        run: python .github/scripts/nomenclature_guard.py

  frontend-build:
    name: Frontend - yarn build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # O frontend possui atualmente um yarn.lock que pode estar
      # temporariamente dessincronizado com package.json.
      #
      # O Dockerfile de produção já possui o mesmo mecanismo:
      # tenta primeiro instalação estrita com --frozen-lockfile
      # e, somente se ela falhar, reconcilia as dependências
      # utilizando yarn install normal.
      #
      # Esta estratégia mantém o CI alinhado ao processo real
      # utilizado pelo Coolify durante o build da aplicação.
      - name: Install dependencies
        run: |
          echo "Tentando instalação com yarn.lock em modo estrito..."

          if yarn install --frozen-lockfile --network-timeout 600000; then
            echo "Dependências instaladas com yarn.lock sincronizado."
          else
            echo "::warning title=Lockfile desatualizado::frontend/yarn.lock não está sincronizado com package.json."
            echo "Executando fallback de instalação, conforme comportamento atual do Dockerfile de produção..."

            yarn install --network-timeout 600000
          fi

      - name: Build production bundle
        # Mesmo comando executado pelo Dockerfile utilizado pelo Coolify.
        # Se houver erro real de compilação do frontend, este job deve falhar.
        run: yarn build
        env:
          # Valor de teste usado exclusivamente pelo CI.
          # Em produção, a variável real é injetada pelo Coolify.
          REACT_APP_BACKEND_URL: https://placeholder.example.com

          # Mantém o comportamento de build em ambiente de integração contínua.
          CI: 'true'

          # Mantém o consumo de memória e o comportamento próximos
          # ao Dockerfile utilizado em produção.
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: '--max-old-space-size=2048'

  backend-lint:
    name: Backend - ruff lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        # Falha em erros que indicam problemas reais de sintaxe,
        # imports ou estruturas Python inválidas.
        #
        # Não torna warnings históricos de qualidade existentes
        # no projeto bloqueantes neste momento.
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile check
        # Compila todos os módulos Python para detectar
        # erros de sintaxe antes do deploy.
        run: python -m compileall -q .

  diary-assignment-contract:
    name: Backend - Diário por Vínculo guards
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: pip install pytest pytest-asyncio python-dotenv motor

      - name: Run Fase 0 + Fase 1 + Fase 2 + Fase 3 + Fase 4 + Fase 5 + cutover 38A-38F + P0 + startup + professor diary + multi-role + AEE v2 guards
        # Estes testes são unitários/puros e não usam o conftest de integração,
        # que exige Mongo real e variáveis MONGO_URL/DB_NAME.
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_diary_assignment_contract_phase0.py \
            tests/test_diary_assignment_access_phase1.py \
            tests/test_content_assignment_scope_phase2.py \
            tests/test_content_assignment_scope_phase2_edges.py \
            tests/test_content_entry_indexes_phase2.py \
            tests/test_teacher_diaries_phase3.py \
            tests/test_attendance_assignment_scope_phase4.py \
            tests/test_attendance_assignment_indexes_phase4.py \
            tests/test_attendance_historical_backfill_p0.py \
            tests/test_grade_assignment_scope_phase5.py \
            tests/test_grade_assignment_adapter_phase5.py \
            tests/test_grade_assignment_hardening_phase5.py \
            tests/test_dvd_cutover_audit_phase38.py \
            tests/test_dvd_cutover_plan_phase38b.py \
            tests/test_dvd_schedule_blockers_phase38c.py \
            tests/test_dvd_schedule_recovery_phase38d.py \
            tests/test_dvd_first_wave_manifest_phase38e.py \
            tests/test_legacy_content_dvd_guard_phase38f.py \
            tests/test_content_harmonization_phase38f.py \
            tests/test_content_history_bridge_p0.py \
            tests/test_startup_attendance_index_authority.py \
            tests/test_professor_attendance_entrypoint_p0.py \
            tests/test_professor_attendance_tabs_parity_p0.py \
            tests/test_professor_attendance_pdf_status_p0.py \
            tests/test_professor_attendance_pdf_document_parity_p0.py \
            tests/test_professor_content_parity_p0.py \
            tests/test_professor_grades_history_parity_p0.py \
            tests/test_professor_grades_full_parity_p0.py \
            tests/test_professor_hybrid_grade_read_scope_p0.py \
            tests/test_multi_role_active_session_p0.py \
            tests/test_dvd_missing_bindings_p0.py \
            tests/test_aee_v2_p0.py
