name: CI - Build & Lint

# Roda em todo push para main e em pull requests para main.
# Objetivo: detectar erros que poderiam quebrar o deploy no Coolify
# antes de o código chegar à produção.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  nomenclature-guard:
    name: Nomenclature - Estudante guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # O guard compara o HEAD com a base do PR (ou HEAD^ em push).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Aluno x Estudante nomenclature
        run: python .github/scripts/nomenclature_guard.py

  frontend-build:
    name: Frontend - yarn build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # O frontend possui atualmente um yarn.lock que pode estar
      # temporariamente dessincronizado com package.json.
      #
      # O Dockerfile de produção já possui o mesmo mecanismo:
      # tenta primeiro instalação estrita com --frozen-lockfile
      # e, somente se ela falhar, reconcilia as dependências
      # utilizando yarn install normal.
      #
      # Esta estratégia mantém o CI alinhado ao processo real
      # utilizado pelo Coolify durante o build da aplicação.
      - name: Install dependencies
        run: |
          echo "Tentando instalação com yarn.lock em modo estrito..."

          if yarn install --frozen-lockfile --network-timeout 600000; then
            echo "Dependências instaladas com yarn.lock sincronizado."
          else
            echo "::warning title=Lockfile desatualizado::frontend/yarn.lock não está sincronizado com package.json."
            echo "Executando fallback de instalação, conforme comportamento atual do Dockerfile de produção..."

            yarn install --network-timeout 600000
          fi

      - name: Build production bundle
        # Mesmo comando executado pelo Dockerfile utilizado pelo Coolify.
        # Se houver erro real de compilação do frontend, este job deve falhar.
        run: yarn build
        env:
          # Valor de teste usado exclusivamente pelo CI.
          # Em produção, a variável real é injetada pelo Coolify.
          REACT_APP_BACKEND_URL: https://placeholder.example.com

          # Mantém o comportamento de build em ambiente de integração contínua.
          CI: 'true'

          # Mantém o consumo de memória e o comportamento próximos
          # ao Dockerfile utilizado em produção.
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: '--max-old-space-size=2048'

  backend-lint:
    name: Backend - ruff lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        # Falha em erros que indicam problemas reais de sintaxe,
        # imports ou estruturas Python inválidas.
        #
        # Não torna warnings históricos de qualidade existentes
        # no projeto bloqueantes neste momento.
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile check
        # Compila todos os módulos Python para detectar
        # erros de sintaxe antes do deploy.
        run: python -m compileall -q .

  diary-assignment-contract:
    name: Backend - Diário por Vínculo guards
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: pip install pytest pytest-asyncio

      - name: Run Fase 0 + Fase 1 + Fase 2 + Fase 3 + Fase 4 + Fase 5 guard tests
        # Estes testes são unitários/puros e não usam o conftest de integração,
        # que exige Mongo real e variáveis MONGO_URL/DB_NAME.
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_diary_assignment_contract_phase0.py \
            tests/test_diary_assignment_access_phase1.py \
            tests/test_content_assignment_scope_phase2.py \
            tests/test_content_assignment_scope_phase2_edges.py \
            tests/test_content_entry_indexes_phase2.py \
            tests/test_teacher_diaries_phase3.py \
            tests/test_attendance_assignment_scope_phase4.py \
            tests/test_attendance_assignment_indexes_phase4.py \
            tests/test_grade_assignment_scope_phase5.py
