name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Security boundary: only the repository owner can trigger paid Claude execution.
    # This prevents arbitrary public-repository comments from consuming credentials.
    if: >-
      github.actor == 'gutenberggt' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude')))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate Claude authentication
        if: env.HAS_CLAUDE_OAUTH != 'true' && env.HAS_ANTHROPIC_API_KEY != 'true'
        shell: bash
        run: |
          echo "::error::Configure CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in GitHub Actions Secrets."
          exit 1

      # OAuth wins when both secrets exist, avoiding accidental API-key billing.
      - name: Run Claude Code with OAuth
        if: env.HAS_CLAUDE_OAUTH == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Run Claude Code with Anthropic API key
        if: env.HAS_CLAUDE_OAUTH != 'true' && env.HAS_ANTHROPIC_API_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
