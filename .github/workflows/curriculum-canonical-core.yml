name: Curriculum Canonical Core

on:
  pull_request:
    paths:
      - 'backend/routers/curriculum_core.py'
      - 'backend/routers/curriculum_coverage_v2.py'
      - 'backend/routers/content_partial_cutover.py'
      - 'backend/routers/diary_dashboard.py'
      - 'backend/routers/monthly_reports.py'
      - 'backend/routers/__init__.py'
      - 'backend/services/content_form_canonical_cutover.py'
      - 'backend/services/content_reporting_projection.py'
      - 'backend/services/content_reporting_cutover_resolver.py'
      - 'backend/services/content_reporting_parity.py'
      - 'backend/services/content_reporting_dashboard_s5.py'
      - 'backend/services/content_reporting_structural_db.py'
      - 'backend/services/content_reporting_monthly_s5.py'
      - 'backend/services/monthly_report_service.py'
      - 'backend/services/monthly_report_scheduler.py'
      - 'backend/scripts/content_reporting_shadow_s4_readonly.py'
      - 'backend/tests/test_curriculum_canonical_core.py'
      - 'backend/tests/test_curriculum_teacher_writer_f4.py'
      - 'backend/tests/test_curriculum_coverage_v2.py'
      - 'backend/tests/test_curriculum_coverage_v2_frontend_contract.py'
      - 'backend/tests/test_content_reporting_projection.py'
      - 'backend/tests/test_content_reporting_cutover_resolver.py'
      - 'backend/tests/test_content_reporting_parity.py'
      - 'backend/tests/test_content_reporting_shadow_s4_readonly.py'
      - 'backend/tests/test_content_reporting_s5_dashboard.py'
      - 'backend/tests/test_content_reporting_structural_db.py'
      - 'backend/tests/test_content_reporting_s5_monthly.py'
      - 'frontend/src/pages/CurriculumCoverage.jsx'
      - 'frontend/src/services/curriculumCoverageV2.js'
      - '.github/workflows/curriculum-canonical-core.yml'
      - '.github/workflows/content-reporting-shadow-s4-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'backend/routers/curriculum_core.py'
      - 'backend/routers/curriculum_coverage_v2.py'
      - 'backend/routers/content_partial_cutover.py'
      - 'backend/routers/diary_dashboard.py'
      - 'backend/routers/monthly_reports.py'
      - 'backend/routers/__init__.py'
      - 'backend/services/content_form_canonical_cutover.py'
      - 'backend/services/content_reporting_projection.py'
      - 'backend/services/content_reporting_cutover_resolver.py'
      - 'backend/services/content_reporting_parity.py'
      - 'backend/services/content_reporting_dashboard_s5.py'
      - 'backend/services/content_reporting_structural_db.py'
      - 'backend/services/content_reporting_monthly_s5.py'
      - 'backend/services/monthly_report_service.py'
      - 'backend/services/monthly_report_scheduler.py'
      - 'backend/scripts/content_reporting_shadow_s4_readonly.py'
      - 'backend/tests/test_curriculum_canonical_core.py'
      - 'backend/tests/test_curriculum_teacher_writer_f4.py'
      - 'backend/tests/test_curriculum_coverage_v2.py'
      - 'backend/tests/test_curriculum_coverage_v2_frontend_contract.py'
      - 'backend/tests/test_content_reporting_projection.py'
      - 'backend/tests/test_content_reporting_cutover_resolver.py'
      - 'backend/tests/test_content_reporting_parity.py'
      - 'backend/tests/test_content_reporting_shadow_s4_readonly.py'
      - 'backend/tests/test_content_reporting_s5_dashboard.py'
      - 'backend/tests/test_content_reporting_structural_db.py'
      - 'backend/tests/test_content_reporting_s5_monthly.py'
      - 'frontend/src/pages/CurriculumCoverage.jsx'
      - 'frontend/src/services/curriculumCoverageV2.js'
      - '.github/workflows/curriculum-canonical-core.yml'
      - '.github/workflows/content-reporting-shadow-s4-readonly.yml'

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sigesc_ci_contract
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile curricular core, F4/F5 and reporting shadow
        run: python -m py_compile routers/curriculum_core.py routers/curriculum_coverage_v2.py routers/content_partial_cutover.py routers/diary_dashboard.py routers/monthly_reports.py services/content_form_canonical_cutover.py services/content_reporting_projection.py services/content_reporting_cutover_resolver.py services/content_reporting_parity.py services/content_reporting_dashboard_s5.py services/content_reporting_structural_db.py services/content_reporting_monthly_s5.py services/monthly_report_scheduler.py scripts/content_reporting_shadow_s4_readonly.py routers/__init__.py
      - name: Run curricular core contract tests
        run: pytest -q tests/test_curriculum_canonical_core.py tests/test_curriculum_teacher_writer_f4.py tests/test_curriculum_coverage_v2.py tests/test_curriculum_coverage_v2_frontend_contract.py tests/test_content_reporting_projection.py tests/test_content_reporting_cutover_resolver.py tests/test_content_reporting_parity.py tests/test_content_reporting_shadow_s4_readonly.py tests/test_content_reporting_s5_dashboard.py tests/test_content_reporting_structural_db.py tests/test_content_reporting_s5_monthly.py
