name: "SIGESC Dependência - Forense de vínculos desaparecidos"

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-disappearance-forensic-encrypted.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-disappearance-forensic-encrypted
  cancel-in-progress: false

jobs:
  guard:
    name: Guard dependency disappearance forensic read-only/privacy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce read-only and encrypted-output boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/dependency-disappearance-forensic-encrypted.yml').read_text(encoding='utf-8')
          for marker in [
              'student_dependencies','dependency_completions','audit_logs','attendance','grades',
              'TRACE_MISSING_DEPENDENCIES_FORENSIC_READ_ONLY','EXPECTED_MISSING_COUNT',
              'AUDIT_CERT_B64','openssl cms -encrypt','dependency-disappearance-forensic.cms',
              'database_mutation:false','PII_IN_PUBLIC_LOGS=NO','docker logs',
          ]:
              if marker not in text:
                  raise SystemExit(f'DEP_FORENSIC_REQUIRED_MARKER_MISSING:{marker}')
          start="cat > private/forensic.js <<'JS'"
          end="\n          JS\n"
          if start not in text or end not in text:
              raise SystemExit('DEP_FORENSIC_COLLECTOR_BLOCK_MISSING')
          collector=text.rsplit(start,1)[1].split(end,1)[0]
          for token in [
              '.insertOne(','.insertMany(','.updateOne(','.updateMany(','.replaceOne(',
              '.deleteOne(','.deleteMany(','.bulkWrite(','.findOneAndUpdate(',
              '.findOneAndDelete(','.findOneAndReplace(','.drop(','.dropDatabase(',
          ]:
              if token in collector:
                  raise SystemExit(f'DEP_FORENSIC_MUTATION_PRIMITIVE_FOUND:{token}')
          if re.search(r'^\s+path:\s*(?:private/|evidence/dependency-disappearance-forensic\.json)\s*$',text,re.MULTILINE):
              raise SystemExit('DEP_FORENSIC_PLAINTEXT_UPLOAD_FORBIDDEN')
          print('DEPENDENCY_DISAPPEARANCE_FORENSIC_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Trace missing 2026 dependency links in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[DEPENDENCY-DISAPPEARANCE-FORENSIC] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact owner-scoped forensic context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,re,urllib.request
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          issue=event.get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER'] or issue.get('state') != 'open':
              raise SystemExit('DEP_FORENSIC_OWNER_OPEN_ISSUE_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              k,v=raw.strip().split('=',1)
              if k in values: raise SystemExit(f'DEP_FORENSIC_DUPLICATE_FIELD:{k}')
              values[k]=v.strip()
          expected={
              'DEPENDENCY_DISAPPEARANCE_FORENSIC':'AUTHORIZED',
              'CONFIRMATION':'TRACE_MISSING_DEPENDENCIES_FORENSIC_READ_ONLY',
              'ACADEMIC_YEAR':'2026',
              'ANCHOR_SCHOOL':'E M E I E F Monsenhor Augusto Dias de Brito',
              'EXPECTED_MISSING_COUNT':'4',
          }
          for k,wanted in expected.items():
              if values.get(k) != wanted: raise SystemExit(f'DEP_FORENSIC_FIELD_INVALID:{k}')
          target=values.get('TARGET_SHA',''); production=values.get('EXPECTED_PRODUCTION_SHA','')
          cert_b64=values.get('AUDIT_CERT_B64',''); cert_sha=values.get('CERT_SHA256','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',production):
              raise SystemExit('DEP_FORENSIC_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{64}',cert_sha): raise SystemExit('DEP_FORENSIC_CERT_SHA_INVALID')
          if issue.get('title') != f'[DEPENDENCY-DISAPPEARANCE-FORENSIC] {target}':
              raise SystemExit('DEP_FORENSIC_TITLE_MISMATCH')
          try: cert=base64.b64decode(cert_b64,validate=True)
          except Exception: raise SystemExit('DEP_FORENSIC_CERT_B64_INVALID')
          if hashlib.sha256(cert).hexdigest()!=cert_sha or b'BEGIN CERTIFICATE' not in cert:
              raise SystemExit('DEP_FORENSIC_CERT_INVALID')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-disappearance-forensic'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          if get('branches/main')['commit']['sha'] != target: raise SystemExit('DEP_FORENSIC_MAIN_MOVED')
          if get('branches/production')['commit']['sha'] != production: raise SystemExit('DEP_FORENSIC_PRODUCTION_MOVED')
          cert_path=os.path.join(os.environ['RUNNER_TEMP'],'dependency_disappearance_forensic_cert.pem')
          open(cert_path,'wb').write(cert); os.chmod(cert_path,0o600)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={production}\nissue_number={issue.get("number")}\n')
          print('DEPENDENCY_DISAPPEARANCE_FORENSIC_CONTEXT=PASS')
          print('PII_IN_PUBLIC_LOGS=NO')
          print('DATABASE_MUTATION=NO')
          PY

      - name: Checkout exact reviewed forensic SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "DEP_FORENSIC_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dependency_disappearance_forensic_key
          chmod 600 ~/.ssh/dependency_disappearance_forensic_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'DEPENDENCY_DISAPPEARANCE_FORENSIC_SSH_TRUST=PASS'

      - name: Collect forensic database evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private evidence
          test -s "$RUNNER_TEMP/dependency_disappearance_forensic_cert.pem"

          cat > private/forensic.js <<'JS'
          const d=db.getSiblingDB("sigesc");
          const year=2026;
          const expectedMissing=4;
          const anchorName="E M E I E F Monsenhor Augusto Dias de Brito";
          const norm=v=>(v===undefined||v===null)?"":String(v);
          const yearEq=v=>norm(v)===String(year);
          const ts=x=>x.timestamp_local||x.timestamp_utc||x.timestamp||null;

          const anchors=d.schools.find({name:anchorName},{_id:0,id:1,mantenedora_id:1}).toArray();
          if(anchors.length!==1||!anchors[0].mantenedora_id){print("DEP_FORENSIC_ERROR=ANCHOR_TENANT_NOT_UNIQUE");quit(31);}
          const tenant=anchors[0].mantenedora_id;
          const schools=d.schools.find({mantenedora_id:tenant},{_id:0,id:1}).toArray();
          const schoolIds=new Set(schools.map(x=>x.id).filter(Boolean));
          const tenantUsers=d.users.find({mantenedora_id:tenant},{_id:0,id:1}).toArray();
          const userIds=new Set(tenantUsers.map(x=>x.id).filter(Boolean));
          const tenantLog=log=>{
            if(norm(log.mantenedora_id)===norm(tenant)) return true;
            if(log.mantenedora_id!==undefined&&log.mantenedora_id!==null&&norm(log.mantenedora_id)!=="") return false;
            return !!((log.school_id&&schoolIds.has(log.school_id))||(log.user_id&&userIds.has(log.user_id)));
          };

          const current=d.student_dependencies.find(
            {mantenedora_id:tenant,academic_year:{$in:[year,String(year)]}},
            {_id:0,id:1}
          ).toArray();
          const currentIds=new Set(current.map(x=>x.id).filter(Boolean));
          const depLogs=d.audit_logs.find(
            {collection:"student_dependencies"},
            {_id:0,action:1,document_id:1,mantenedora_id:1,user_id:1,school_id:1,description:1,timestamp:1,timestamp_utc:1,timestamp_local:1,old_value:1,new_value:1,changes:1}
          ).toArray().filter(tenantLog).filter(x=>yearEq((x.new_value||{}).academic_year)||yearEq((x.old_value||{}).academic_year));
          const creates=depLogs.filter(x=>x.action==="create"&&x.document_id);
          const missingIds=[...new Set(creates.map(x=>x.document_id).filter(id=>!currentIds.has(id)))];
          if(missingIds.length!==expectedMissing){print("DEP_FORENSIC_ERROR=MISSING_COUNT_CHANGED:"+missingIds.length);quit(32);}
          const missingSet=new Set(missingIds);
          const targetLogs=depLogs.filter(x=>missingSet.has(x.document_id));
          const baseById={};
          for(const x of creates) if(missingSet.has(x.document_id)&&!baseById[x.document_id]) baseById[x.document_id]=x.new_value||{};
          const studentIds=[...new Set(missingIds.map(id=>(baseById[id]||{}).student_id).filter(Boolean))];
          const students=d.students.find({mantenedora_id:tenant,id:{$in:studentIds}},{_id:0,id:1,full_name:1,status:1,dependency_mode:1,school_id:1,class_id:1,updated_at:1,updated_by:1}).toArray();
          const studentMap=Object.fromEntries(students.map(x=>[x.id,x]));

          const studentLogs=d.audit_logs.find(
            {collection:"students",document_id:{$in:studentIds}},
            {_id:0,action:1,document_id:1,mantenedora_id:1,user_id:1,school_id:1,timestamp:1,timestamp_utc:1,timestamp_local:1,changes:1}
          ).toArray().filter(tenantLog).map(x=>{
            const ch=x.changes||{};
            return {action:x.action,student_id:x.document_id,user_id:x.user_id||null,school_id:x.school_id||null,timestamp:ts(x),changes:{dependency_mode:ch.dependency_mode||null,status:ch.status||null,class_id:ch.class_id||null,school_id:ch.school_id||null}};
          }).filter(x=>Object.values(x.changes).some(Boolean));

          const completions=d.dependency_completions.find(
            {dependency_id:{$in:missingIds},student_id:{$in:studentIds}},
            {_id:0,id:1,dependency_id:1,student_id:1,completion_academic_year:1,completion_result:1,status_reason:1,issued_at:1,issued_by_user_id:1,revoked_at:1}
          ).toArray();
          const attendance=d.attendance.find(
            {dependency_id:{$in:missingIds},student_id:{$in:studentIds}},
            {_id:0,id:1,dependency_id:1,student_id:1,class_id:1,course_id:1,academic_year:1,date:1,created_at:1,updated_at:1,created_by:1,updated_by:1}
          ).toArray();
          const grades=d.grades.find(
            {dependency_id:{$in:missingIds},student_id:{$in:studentIds}},
            {_id:0,id:1,dependency_id:1,student_id:1,class_id:1,course_id:1,academic_year:1,created_at:1,updated_at:1,created_by:1,updated_by:1}
          ).toArray();

          const actorIds=[...new Set([
            ...targetLogs.map(x=>x.user_id),...studentLogs.map(x=>x.user_id),
            ...missingIds.map(id=>(baseById[id]||{}).created_by),
            ...attendance.flatMap(x=>[x.created_by,x.updated_by]),...grades.flatMap(x=>[x.created_by,x.updated_by]),
            ...completions.map(x=>x.issued_by_user_id),
          ].filter(Boolean))];
          const actors=actorIds.length?d.users.find({id:{$in:actorIds}},{_id:0,id:1,email:1,full_name:1,name:1,role:1,mantenedora_id:1,school_id:1}).toArray():[];
          const dependencies=missingIds.map(id=>{
            const b=baseById[id]||{}; const s=studentMap[b.student_id]||{};
            return {
              dependency_id:id,student_id:b.student_id||null,student_name:s.full_name||null,
              student_status_now:s.status||null,dependency_mode_now:s.dependency_mode||null,
              school_id:b.school_id||null,class_id:b.class_id||null,course_id:b.course_id||null,
              academic_year:b.academic_year||null,origin_academic_year:b.origin_academic_year||null,
              created_at:b.created_at||null,created_by:b.created_by||null,
              audit_events:targetLogs.filter(x=>x.document_id===id).map(x=>({action:x.action,user_id:x.user_id||null,school_id:x.school_id||null,timestamp:ts(x),old_status:norm((x.old_value||{}).status)||null,new_status:norm((x.new_value||{}).status)||null,description:x.description||null})),
              attendance_refs:attendance.filter(x=>x.dependency_id===id),
              grade_refs:grades.filter(x=>x.dependency_id===id),
              completion_refs:completions.filter(x=>x.dependency_id===id),
            };
          });
          const totals={
            missing_dependency_ids:missingIds.length,unique_students:studentIds.length,
            dependency_audit_events:targetLogs.length,create_events:targetLogs.filter(x=>x.action==="create").length,
            update_events:targetLogs.filter(x=>x.action==="update").length,delete_events:targetLogs.filter(x=>x.action==="delete").length,
            completion_snapshots:completions.length,attendance_refs:attendance.length,grade_refs:grades.length,
            related_student_state_events:studentLogs.length,resolved_actor_accounts:actors.length,
          };
          const result={schema:"SIGESC_DEPENDENCY_DISAPPEARANCE_FORENSIC_V1",academic_year:year,database_mutation:false,tenant_anchor_school:anchorName,scope:"four 2026 dependency links present in create audit but absent from student_dependencies",limitations:["audit_service is best-effort and may omit a delete/update audit event after a successful database mutation","container logs may have been rotated or removed by later deployments","this phase does not read shell history or restore backups"],totals,dependencies,related_student_state_events:studentLogs,actors};
          print("DEP_FORENSIC_JSON="+EJSON.stringify(result));
          print("DEP_FORENSIC_IDS="+missingIds.join(","));
          JS

          remote_command="timeout 90 docker exec -i ${MONGO_CONTAINER} mongosh --quiet --file /dev/stdin"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/dependency_disappearance_forensic_key" "${PROD_USER}@${PROD_HOST}" "$remote_command" < private/forensic.js > private/raw.log 2>&1
          rc=$?; set -e
          if [ "$rc" -ne 0 ]; then echo "DEPENDENCY_DISAPPEARANCE_FORENSIC_REMOTE_FAILED:$rc"; exit "$rc"; fi

          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('private/raw.log').read_text(encoding='utf-8',errors='replace').splitlines()
          rows=[x[len('DEP_FORENSIC_JSON='):] for x in raw if x.startswith('DEP_FORENSIC_JSON=')]
          ids=[x[len('DEP_FORENSIC_IDS='):] for x in raw if x.startswith('DEP_FORENSIC_IDS=')]
          if not rows or not ids: raise SystemExit('DEP_FORENSIC_RESULT_MARKER_MISSING')
          p=json.loads(rows[-1]); dep_ids=[x for x in ids[-1].split(',') if x]
          if p.get('schema')!='SIGESC_DEPENDENCY_DISAPPEARANCE_FORENSIC_V1' or p.get('database_mutation') is not False or len(dep_ids)!=4:
              raise SystemExit('DEP_FORENSIC_RESULT_INVALID')
          Path('private/dependency-disappearance-forensic.json').write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('private/ids.json').write_text(json.dumps(dep_ids),encoding='utf-8')
          summary={'schema':'SIGESC_DEPENDENCY_DISAPPEARANCE_FORENSIC_SUMMARY_V1','academic_year':2026,'database_mutation':False,'totals':p.get('totals') or {},'limitations':p.get('limitations') or []}
          Path('evidence/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          t=summary['totals']; print('DEPENDENCY_DISAPPEARANCE_FORENSIC_DB=PASS')
          for key in ['missing_dependency_ids','unique_students','dependency_audit_events','create_events','update_events','delete_events','completion_snapshots','attendance_refs','grade_refs','related_student_state_events','resolved_actor_accounts']:
              print(f'{key.upper()}={t.get(key,0)}')
          print('PII_IN_PUBLIC_LOGS=NO'); print('DATABASE_MUTATION=NO')
          PY

      - name: Search retained container logs for exact dependency IDs read-only
        shell: bash
        run: |
          set -euo pipefail
          remote_cmd=$(python - <<'PY'
          import json,shlex
          ids=json.load(open('private/ids.json',encoding='utf-8')); pattern='|'.join(ids)
          script="set -o pipefail; for c in $(docker ps -a --format '{{.Names}}'); do docker logs --timestamps \"$c\" 2>&1 | grep -E " + shlex.quote(pattern) + " | sed \"s#^#[container=$c] #\" || true; done"
          print(shlex.quote(script))
          PY
          )
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/dependency_disappearance_forensic_key" "${PROD_USER}@${PROD_HOST}" "bash -lc $remote_cmd" > private/container-id-matches.log 2>&1
          rc=$?; set -e
          if [ "$rc" -ne 0 ]; then echo "DEP_FORENSIC_CONTAINER_LOG_QUERY_FAILED:$rc"; exit "$rc"; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('private/dependency-disappearance-forensic.json',encoding='utf-8'))
          lines=[x for x in Path('private/container-id-matches.log').read_text(encoding='utf-8',errors='replace').splitlines() if x.strip()]
          p['container_log_matches']=lines; p['totals']['container_log_match_lines']=len(lines)
          Path('private/dependency-disappearance-forensic.json').write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding='utf-8')
          summary=json.load(open('evidence/summary.json',encoding='utf-8')); summary['totals']['container_log_match_lines']=len(lines)
          Path('evidence/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'CONTAINER_LOG_MATCH_LINES={len(lines)}'); print('PII_IN_PUBLIC_LOGS=NO'); print('DATABASE_MUTATION=NO')
          PY

      - name: Encrypt nominal forensic evidence
        shell: bash
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes256 \
            -in private/dependency-disappearance-forensic.json \
            -outform DER \
            -out evidence/dependency-disappearance-forensic.cms \
            "$RUNNER_TEMP/dependency_disappearance_forensic_cert.pem"
          test -s evidence/dependency-disappearance-forensic.cms
          rm -rf private
          rm -f "$RUNNER_TEMP/dependency_disappearance_forensic_cert.pem"
          echo 'DEPENDENCY_DISAPPEARANCE_FORENSIC_ENCRYPTION=PASS'

      - name: Upload encrypted forensic evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-disappearance-forensic-encrypted-${{ github.run_id }}
          path: |
            evidence/dependency-disappearance-forensic.cms
            evidence/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish sanitized forensic counts and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          p=json.load(open('evidence/summary.json',encoding='utf-8')); t=p.get('totals') or {}
          body=('Auditoria forense read-only dos vínculos de Dependência desaparecidos concluída.\n\n'
              f'- Ano letivo: `{p.get("academic_year")}`\n'
              f'- Vínculos desaparecidos reidentificados: `{t.get("missing_dependency_ids",0)}`\n'
              f'- Estudantes envolvidos: `{t.get("unique_students",0)}`\n'
              f'- Eventos de auditoria dos vínculos: `{t.get("dependency_audit_events",0)}` (create `{t.get("create_events",0)}`, update `{t.get("update_events",0)}`, delete `{t.get("delete_events",0)}`)\n'
              f'- Snapshots de conclusão: `{t.get("completion_snapshots",0)}`\n'
              f'- Referências de frequência em dependência: `{t.get("attendance_refs",0)}`\n'
              f'- Referências de notas em dependência: `{t.get("grade_refs",0)}`\n'
              f'- Eventos correlatos de estado do estudante: `{t.get("related_student_state_events",0)}`\n'
              f'- Contas de atores resolvidas na evidência criptografada: `{t.get("resolved_actor_accounts",0)}`\n'
              f'- Linhas retidas em logs de containers com os IDs exatos: `{t.get("container_log_match_lines",0)}`\n'
              '- Database mutation: **NO**\n- Nomes/PII em logs ou issue: **NO**\n- Evidência nominal: **criptografada**.')
          repo=os.environ['GITHUB_REPOSITORY']; issue=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-disappearance-forensic'}
          def req(path,method='POST',data=None):
              payload=None if data is None else json.dumps(data).encode(); r=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',data=payload,method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as response: return json.load(response)
          req(f'issues/{issue}/comments',data={'body':body}); req(f'issues/{issue}',method='PATCH',data={'state':'closed','state_reason':'completed'})
          PY
