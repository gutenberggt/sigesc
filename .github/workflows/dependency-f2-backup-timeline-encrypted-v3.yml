name: "SIGESC Dependência - F2 timeline backups v3"

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-f2-backup-timeline-encrypted-v3.yml'
      - 'backend/scripts/dependency_f2_backup_timeline_v3.sh'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-f2-backup-timeline-v3
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2 v3 forensic isolation/privacy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce F2 v3 boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n backend/scripts/dependency_f2_backup_timeline_v3.sh
          python - <<'PY'
          import re
          from pathlib import Path
          runner=Path('backend/scripts/dependency_f2_backup_timeline_v3.sh').read_text(encoding='utf-8')
          workflow=Path('.github/workflows/dependency-f2-backup-timeline-encrypted-v3.yml').read_text(encoding='utf-8')
          for marker in ['DEP_F2V3_ERROR_STAGE','student_dependencies','dependency_completions','audit_logs','grades','attendance','records.dependency_id','physical_count=0','--network none','BACKUP_MOUNT=READ_ONLY','PRODUCTION_DATABASE_TOUCHED=NO','mongosh --quiet --file /dev/stdin']:
              if marker not in runner: raise SystemExit(f'DEP_F2V3_RUNNER_MARKER_MISSING:{marker}')
          for marker in ['TRACE_DEPENDENCY_BACKUP_TIMELINE_V3_READ_ONLY','EXPECTED_MISSING_COUNT','openssl cms -encrypt','dependency-f2-backup-timeline-v3.cms','PII_IN_PUBLIC_LOGS=NO']:
              if marker not in workflow: raise SystemExit(f'DEP_F2V3_WORKFLOW_MARKER_MISSING:{marker}')
          for token in ['.insertOne(','.insertMany(','.updateOne(','.updateMany(','.replaceOne(','.deleteOne(','.deleteMany(','.bulkWrite(','.findOneAndUpdate(','.findOneAndDelete(','.drop(','.dropDatabase(']:
              if token in runner: raise SystemExit(f'DEP_F2V3_MONGO_MUTATION_PRIMITIVE_FOUND:{token}')
          for line in runner.splitlines():
              s=line.strip()
              if s.startswith('docker exec') and 'mongorestore' in s and 'docker exec "$drill"' not in s:
                  raise SystemExit(f'DEP_F2V3_UNSCOPED_MONGORESTORE:{s}')
          if 'docker exec -i "$mongo_container" mongosh --quiet --eval' in runner:
              raise SystemExit('DEP_F2V3_LIVE_EVAL_FORBIDDEN')
          if re.search(r'^\s+path:\s*(?:private/|evidence/dependency-f2-backup-timeline-v3\.json)\s*$',workflow,re.MULTILINE):
              raise SystemExit('DEP_F2V3_PLAINTEXT_UPLOAD_FORBIDDEN')
          print('DEPENDENCY_F2V3_STATIC_BOUNDARY=PASS')
          PY

  production-forensic:
    name: Reconstruct dependency disappearance timeline v3
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[DEPENDENCY-F2-BACKUP-TIMELINE-V3] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact owner-scoped v3 context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,re,urllib.request
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          issue=event.get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER'] or issue.get('state') != 'open':
              raise SystemExit('DEP_F2V3_OWNER_OPEN_ISSUE_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              k,v=raw.strip().split('=',1)
              if k in values: raise SystemExit(f'DEP_F2V3_DUPLICATE_FIELD:{k}')
              values[k]=v.strip()
          expected={
              'DEPENDENCY_F2_BACKUP_TIMELINE_V3':'AUTHORIZED',
              'CONFIRMATION':'TRACE_DEPENDENCY_BACKUP_TIMELINE_V3_READ_ONLY',
              'ACADEMIC_YEAR':'2026',
              'ANCHOR_SCHOOL':'E M E I E F Monsenhor Augusto Dias de Brito',
              'EXPECTED_MISSING_COUNT':'4',
          }
          for k,wanted in expected.items():
              if values.get(k)!=wanted: raise SystemExit(f'DEP_F2V3_FIELD_INVALID:{k}')
          target=values.get('TARGET_SHA',''); production=values.get('EXPECTED_PRODUCTION_SHA','')
          cert_b64=values.get('AUDIT_CERT_B64',''); cert_sha=values.get('CERT_SHA256','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',production): raise SystemExit('DEP_F2V3_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{64}',cert_sha): raise SystemExit('DEP_F2V3_CERT_SHA_INVALID')
          if issue.get('title') != f'[DEPENDENCY-F2-BACKUP-TIMELINE-V3] {target}': raise SystemExit('DEP_F2V3_TITLE_MISMATCH')
          try: cert=base64.b64decode(cert_b64,validate=True)
          except Exception: raise SystemExit('DEP_F2V3_CERT_B64_INVALID')
          if hashlib.sha256(cert).hexdigest()!=cert_sha or b'BEGIN CERTIFICATE' not in cert: raise SystemExit('DEP_F2V3_CERT_INVALID')
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-f2v3'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          if get('branches/main')['commit']['sha']!=target: raise SystemExit('DEP_F2V3_MAIN_MOVED')
          if get('branches/production')['commit']['sha']!=production: raise SystemExit('DEP_F2V3_PRODUCTION_MOVED')
          cert_path=os.path.join(os.environ['RUNNER_TEMP'],'dependency_f2v3_cert.pem')
          open(cert_path,'wb').write(cert); os.chmod(cert_path,0o600)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={production}\nissue_number={issue.get("number")}\n')
          print('DEPENDENCY_F2V3_CONTEXT=PASS'); print('PII_IN_PUBLIC_LOGS=NO'); print('PRODUCTION_DATABASE_TOUCHED=NO')
          PY

      - name: Checkout exact reviewed v3 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "DEP_F2V3_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dependency_f2v3_key
          chmod 600 ~/.ssh/dependency_f2v3_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'DEPENDENCY_F2V3_SSH_TRUST=PASS'

      - name: Execute diagnostic-safe timeline with isolated restores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private evidence
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/dependency_f2v3_key" "${PROD_USER}@${PROD_HOST}" \
            "bash -s -- ${MONGO_CONTAINER} ${GITHUB_RUN_ID}" < backend/scripts/dependency_f2_backup_timeline_v3.sh > private/raw.log 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            grep -E '^DEP_F2V3_(ERROR_STAGE|REMOTE_RC|BACKUP_ROOT_MISSING|BACKUP_TIMER_NOT_ACTIVE|PROD_MONGO_UNRESOLVED|MONGO_IMAGE_MISMATCH|SEED_ERROR|LIVE_SEED_FAILED|LIVE_SEED_MARKER_MISSING|GZIP_FAIL|SHA_COMPUTE_FAIL|SHA_SIDECAR_MISSING|METADATA_MISSING|SHA_FAIL|PROVENANCE_CONTAINER_FAIL|PROVENANCE_IMAGE_FAIL|BACKUP_COUNT_INVALID|ORDER_COUNT_MISMATCH|TEMP_MONGO_START_FAIL|NETWORK_ISOLATION_FAIL|PORT_ISOLATION_FAIL|RESTORE_FAILED|POINT_PROBE_FAILED|POINT_MARKER_MISSING)(:|=|$)|^PRODUCTION_DATABASE_TOUCHED=' private/raw.log | tail -n 30 || true
            echo "DEPENDENCY_F2V3_REMOTE_FAILED:$rc"
            exit "$rc"
          fi
          grep -E '^DEP_F2V3_(SEED_COUNT|VALIDATED_BACKUP_POINTS|POINT_COMPLETED)=|^PRODUCTION_DATABASE_TOUCHED=|^TEMP_RESTORE_NETWORK=|^TEMP_RESTORE_PORTS=|^BACKUP_MOUNT=|^TEMP_CONTAINERS_CLEANED=' private/raw.log

      - name: Build encrypted evidence and sanitized classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json
          from pathlib import Path
          lines=Path('private/raw.log').read_text(encoding='utf-8',errors='replace').splitlines()
          seed_lines=[x for x in lines if x.startswith('DEP_F2V3_PRIVATE_SEED_JSON=')]
          if len(seed_lines)!=1: raise SystemExit(f'DEP_F2V3_SEED_LINES:{len(seed_lines)}')
          seed=json.loads(seed_lines[0].split('=',1)[1])
          points=[]
          for line in lines:
              if line.startswith('DEP_F2V3_PRIVATE_POINT_JSON='): points.append(json.loads(line.split('=',1)[1]))
          expected=int(next((x.split('=',1)[1] for x in lines if x.startswith('DEP_F2V3_VALIDATED_BACKUP_POINTS=')),'0'))
          if not points or len(points)!=expected: raise SystemExit(f'DEP_F2V3_POINT_COUNT:{len(points)}:{expected}')
          points.sort(key=lambda x:(x.get('backup_stamp') or '',x.get('ordinal') or 0))
          ids=seed.get('dependency_ids') or []
          if len(ids)!=4 or len(set(ids))!=4: raise SystemExit(f'DEP_F2V3_ID_COUNT:{len(ids)}')
          seed_map={x.get('dependency_id'):x for x in (seed.get('details') or []) if x.get('dependency_id')}
          def parse_ts(v):
              if not v:return None
              try:return dt.datetime.fromisoformat(str(v).replace('Z','+00:00'))
              except Exception:return None
          oldest=points[0].get('backup_stamp'); newest=points[-1].get('backup_stamp')
          oldest_dt=parse_ts(oldest)
          per=[]
          for dep_id in ids:
              hist=[]
              for p in points:
                  detail=next((d for d in ((p.get('probe') or {}).get('details') or []) if d.get('id')==dep_id),None)
                  if detail is None: raise SystemExit('DEP_F2V3_POINT_DETAIL_MISSING')
                  hist.append({'backup_stamp':p.get('backup_stamp'),'ordinal':p.get('ordinal'),'source_class':p.get('source_class'),'sha_fingerprint':p.get('sha_fingerprint'),'present':bool(detail.get('present')),'status':detail.get('status'),'updated_at':detail.get('updated_at'),'status_reason':detail.get('status_reason'),'grade_refs':detail.get('grade_refs',0),'attendance_refs':detail.get('attendance_refs',0),'completion_refs':detail.get('completion_refs',0)})
              present=[h for h in hist if h['present']]
              seed_detail=seed_map.get(dep_id) or {}
              created_dt=parse_ts(seed_detail.get('created_at'))
              if not present:
                  cls='ABSENT_AT_ALL_RETAINED_BACKUPS'
                  bracket={'last_confirmed_present':None,'first_confirmed_absent':oldest,'inference':'disappearance_not_later_than_oldest_retained_backup' if created_dt and oldest_dt and created_dt<=oldest_dt else 'not_bracketed_by_retained_backups'}
              else:
                  last_present=max(present,key=lambda h:(h['backup_stamp'] or '',h['ordinal']))
                  later_absent=[h for h in hist if not h['present'] and (h['backup_stamp'] or '',h['ordinal'])>(last_present['backup_stamp'] or '',last_present['ordinal'])]
                  if later_absent:
                      first_absent=min(later_absent,key=lambda h:(h['backup_stamp'] or '',h['ordinal']))
                      cls='DISAPPEARANCE_BRACKETED_BETWEEN_BACKUPS'
                      bracket={'last_confirmed_present':last_present['backup_stamp'],'first_confirmed_absent':first_absent['backup_stamp'],'inference':'disappearance_between_retained_backups'}
                  elif last_present['backup_stamp']==newest:
                      cls='PRESENT_IN_NEWEST_BACKUP_BUT_MISSING_LIVE'
                      bracket={'last_confirmed_present':newest,'first_confirmed_absent':'LIVE_CURRENT_STATE','inference':'disappearance_after_newest_retained_backup'}
                  else:
                      cls='NON_MONOTONIC_OR_MIXED_TIMELINE'
                      bracket={'last_confirmed_present':last_present['backup_stamp'],'first_confirmed_absent':None,'inference':'manual_review_required'}
              per.append({'dependency_id':dep_id,'student':seed_detail,'classification':cls,'disappearance_bracket':bracket,'history':hist})
          counts={}
          for item in per: counts[item['classification']]=counts.get(item['classification'],0)+1
          if counts.get('DISAPPEARANCE_BRACKETED_BETWEEN_BACKUPS'):
              overall='AT_LEAST_ONE_DISAPPEARANCE_BRACKETED_BETWEEN_BACKUPS'
          elif counts.get('PRESENT_IN_NEWEST_BACKUP_BUT_MISSING_LIVE'):
              overall='AT_LEAST_ONE_DISAPPEARANCE_AFTER_NEWEST_RETAINED_BACKUP'
          elif counts.get('ABSENT_AT_ALL_RETAINED_BACKUPS')==4:
              overall='ALL_FOUR_ABSENT_FROM_ALL_RETAINED_BACKUPS'
          else:
              overall='MIXED_OR_REVIEW_REQUIRED'
          evidence={'schema':'SIGESC_DEPENDENCY_F2_BACKUP_TIMELINE_V3','academic_year':2026,'production_database_touched':False,'backup_points':points,'seed':seed,'per_dependency':per,'oldest_backup_stamp':oldest,'newest_backup_stamp':newest,'overall_classification':overall,'classification_counts':counts,'limitations':['Canonical retained local archive window only; inventory independently confirmed no canonical candidate before 2026-08-19.','If a link is absent from every retained backup, this phase cannot date its disappearance more precisely than the oldest retained point when its recorded creation predates that point.','Production Mongo is read-only; mongorestore targets only isolated disposable Mongo containers.']}
          Path('private/dependency-f2-backup-timeline-v3.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={'schema':'SIGESC_DEPENDENCY_F2_BACKUP_TIMELINE_V3_SUMMARY','academic_year':2026,'production_database_touched':False,'backup_points':len(points),'oldest_backup_stamp':oldest,'newest_backup_stamp':newest,'overall_classification':overall,'classification_counts':counts,'unique_students':seed.get('unique_students')}
          Path('evidence/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DEPENDENCY_F2V3_TIMELINE=PASS')
          print(f'BACKUP_POINTS={len(points)}')
          print(f'OLDEST_BACKUP_STAMP={oldest}')
          print(f'NEWEST_BACKUP_STAMP={newest}')
          print(f'OVERALL_CLASSIFICATION={overall}')
          print(f'CLASSIFICATION_COUNTS={json.dumps(counts,sort_keys=True)}')
          print('PII_IN_PUBLIC_LOGS=NO'); print('PRODUCTION_DATABASE_TOUCHED=NO')
          PY

      - name: Encrypt nominal timeline evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/dependency_f2v3_cert.pem"
          openssl cms -encrypt -binary -aes256 \
            -in private/dependency-f2-backup-timeline-v3.json \
            -outform DER \
            -out evidence/dependency-f2-backup-timeline-v3.cms \
            "$RUNNER_TEMP/dependency_f2v3_cert.pem"
          test -s evidence/dependency-f2-backup-timeline-v3.cms
          rm -rf private
          rm -f "$RUNNER_TEMP/dependency_f2v3_cert.pem"
          echo 'DEPENDENCY_F2V3_ENCRYPTION=PASS'

      - name: Upload encrypted evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-f2-backup-timeline-v3-encrypted-${{ github.run_id }}
          path: |
            evidence/dependency-f2-backup-timeline-v3.cms
            evidence/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          p=json.load(open('evidence/summary.json',encoding='utf-8'))
          body=('Fase Forense 2 v3 — linha do tempo por backups concluída.\n\n'
                f'- Ano letivo: `{p.get("academic_year")}`\n'
                f'- Pontos de backup validados: `{p.get("backup_points")}`\n'
                f'- Ponto mais antigo: `{p.get("oldest_backup_stamp")}`\n'
                f'- Ponto mais recente: `{p.get("newest_backup_stamp")}`\n'
                f'- Estudantes envolvidos: `{p.get("unique_students")}`\n'
                f'- Classificação global: `{p.get("overall_classification")}`\n'
                f'- Classificações por vínculo: `{json.dumps(p.get("classification_counts") or {},ensure_ascii=False)}`\n'
                '- Produção alterada: **NO**\n- Restore contra Mongo de produção: **NO**\n- Restore temporário: **isolado, network none, sem portas, backup read-only**\n- Nomes/IDs em logs ou issue: **NO**\n- Evidência nominal: **criptografada**.')
          repo=os.environ['GITHUB_REPOSITORY']; issue=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-f2v3'}
          def req(path,method='POST',data=None):
              payload=None if data is None else json.dumps(data).encode(); r=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',data=payload,method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as response: return json.load(response)
          req(f'issues/{issue}/comments',data={'body':body})
          req(f'issues/{issue}',method='PATCH',data={'state':'closed','state_reason':'completed'})
          PY
