          repo=os.environ['GITHUB_REPOSITORY']; issue=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-f2-backup-timeline'}
          def req(path,method='POST',data=None):
              payload=None if data is None else json.dumps(data).encode(); r=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',data=payload,method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as response: return json.load(response)
