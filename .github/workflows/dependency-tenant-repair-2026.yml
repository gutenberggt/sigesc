name: SIGESC Dependência - Reparo de tenant 2026

on:
  pull_request:
    paths:
      - 'backend/scripts/dependency_tenant_repair_2026.py'
      - '.github/workflows/dependency-tenant-repair-2026.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Guard — reparo tenant Dependência 2026
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enforce surgical metadata-only boundary
        shell: bash
        run: |
          set -euo pipefail
          p=backend/scripts/dependency_tenant_repair_2026.py
          test -s "$p"
          grep -q 'EXPECTED_TARGETS = 4' "$p"
          grep -q 'mantenedora_id:tenant' "$p"
          grep -q 'PRODUCTION_DATABASE_TOUCHED=YES_AUTHORIZED_TENANT_BACKFILL_ONLY' "$p"
          ! grep -Eq 'student_dependencies\.(deleteOne|deleteMany|findOneAndDelete|replaceOne|insertOne)' "$p"
          ! grep -Eq '(grades|attendance|students)\.(updateOne|updateMany|deleteOne|deleteMany|insertOne|replaceOne)' "$p"
          grep -q 'DEPENDENCY_CORE_MISMATCH' "$p"
          grep -q 'DEPENDENCY_SCHOOL_OUTSIDE_TENANT' "$p"
          grep -q 'ACADEMIC_DATA_CHANGED' "$p"
          python3 -m py_compile "$p"
          echo 'DEPENDENCY_TENANT_REPAIR_GUARD=PASS'

  execute:
    name: Preview/apply tenant repair Dependência 2026
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[DEPENDENCY-TENANT-REPAIR-2026] ')
    runs-on: ubuntu-24.04
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact owner-scoped context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')); issue=event.get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '')!=os.environ['REPOSITORY_OWNER'] or issue.get('state')!='open': raise SystemExit('DEP_TENANT_REPAIR_OWNER_OPEN_ISSUE_REQUIRED')
          vals={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              k,v=raw.strip().split('=',1)
              if k in vals: raise SystemExit('DEP_TENANT_REPAIR_DUPLICATE_FIELD:'+k)
              vals[k]=v.strip()
          expected={'DEPENDENCY_TENANT_REPAIR_2026':'AUTHORIZED','CONFIRMATION':'BACKFILL_TENANT_ON_VERIFIED_DEPENDENCY_LINKS','ACADEMIC_YEAR':'2026','EXPECTED_TARGET_COUNT':'4'}
          for k,v in expected.items():
              if vals.get(k)!=v: raise SystemExit('DEP_TENANT_REPAIR_FIELD_INVALID:'+k)
          mode=vals.get('MODE','').lower()
          if mode not in {'preview','apply'}: raise SystemExit('DEP_TENANT_REPAIR_MODE_INVALID')
          if mode=='apply' and vals.get('APPLY_CONFIRMATION')!='I_ACCEPT_AUTHORIZED_PRODUCTION_MUTATION': raise SystemExit('DEP_TENANT_REPAIR_APPLY_CONFIRMATION_REQUIRED')
          target=vals.get('TARGET_SHA',''); prod=vals.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod): raise SystemExit('DEP_TENANT_REPAIR_SHA_INVALID')
          if issue.get('title')!=f'[DEPENDENCY-TENANT-REPAIR-2026] {target}': raise SystemExit('DEP_TENANT_REPAIR_TITLE_MISMATCH')
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-tenant-repair'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers),timeout=30) as r:return json.load(r)
          if get('branches/main')['commit']['sha']!=target: raise SystemExit('DEP_TENANT_REPAIR_MAIN_MOVED')
          if get('branches/production')['commit']['sha']!=prod: raise SystemExit('DEP_TENANT_REPAIR_PRODUCTION_MOVED')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'target={target}\nprod={prod}\nmode={mode}\nissue={issue.get("number")}\n')
          print('DEPENDENCY_TENANT_REPAIR_CONTEXT=PASS')
          PY
      - name: Checkout exact reviewed SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target }}
          persist-credentials: false
          fetch-depth: 1
      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do test -n "${!v}" || { echo "DEP_TENANT_REPAIR_REQUIRED_SECRET_MISSING:$v"; exit 1; }; done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dependency_tenant_repair_key; chmod 600 ~/.ssh/dependency_tenant_repair_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
      - name: Execute fail-closed tenant repair
        id: exec
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/dependency_tenant_repair_key" "${PROD_USER}@${PROD_HOST}" "python3 - ${MONGO_CONTAINER} ${GITHUB_RUN_ID} ${{ steps.context.outputs.mode }}" < backend/scripts/dependency_tenant_repair_2026.py 2>&1)
          rc=$?; set -e
          printf '%s\n' "$out" | grep -E '^DEP_TENANT_REPAIR_|^PRODUCTION_DATABASE_TOUCHED=' || true
          [[ $rc -eq 0 ]] || exit "$rc"
          for key in TARGETS PLAN_PATCH PLAN_EXISTING INACTIVE_STUDENTS GRADE_RECORDS ATTENDANCE_RECORDS CONFLICTS; do
            val=$(printf '%s\n' "$out" | sed -n "s/^DEP_TENANT_REPAIR_${key}=//p" | tail -1); test -n "$val"; echo "${key,,}=$val" >> "$GITHUB_OUTPUT"
          done
          patched=$(printf '%s\n' "$out" | sed -n 's/^DEP_TENANT_REPAIR_APPLY_PATCHED=//p' | tail -1); echo "patched=${patched:-0}" >> "$GITHUB_OUTPUT"
          visible=$(printf '%s\n' "$out" | sed -n 's/^DEP_TENANT_REPAIR_POST_VISIBLE=//p' | tail -1); echo "visible=${visible:-0}" >> "$GITHUB_OUTPUT"
      - name: Publish sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue }}
          MODE: ${{ steps.context.outputs.mode }}
          TARGETS: ${{ steps.exec.outputs.targets }}
          PATCH: ${{ steps.exec.outputs.plan_patch }}
          EXISTING: ${{ steps.exec.outputs.plan_existing }}
          INACTIVE: ${{ steps.exec.outputs.inactive_students }}
          GRADES: ${{ steps.exec.outputs.grade_records }}
          ATTENDANCE: ${{ steps.exec.outputs.attendance_records }}
          CONFLICTS: ${{ steps.exec.outputs.conflicts }}
          PATCHED: ${{ steps.exec.outputs.patched }}
          VISIBLE: ${{ steps.exec.outputs.visible }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          mode=os.environ['MODE']; repo=os.environ['GITHUB_REPOSITORY']; issue=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          body=(f'Reparo tenant de Dependência 2026 — execução concluída.\n\n- Modo: `{mode}`\n- Vínculos-alvo auditados: `{os.environ["TARGETS"]}`\n- Vínculos sem tenant a reparar: `{os.environ["PATCH"]}`\n- Vínculos já tenant-scoped: `{os.environ["EXISTING"]}`\n- Estudantes atualmente inativos preservados sem alteração: `{os.environ["INACTIVE"]}`\n- Notas já vinculadas: `{os.environ["GRADES"]}`\n- Frequências já vinculadas: `{os.environ["ATTENDANCE"]}`\n- Conflitos: `{os.environ["CONFLICTS"]}`\n- Vínculos efetivamente corrigidos no apply: `{os.environ["PATCHED"]}`\n- Vínculos tenant-scoped após apply: `{os.environ["VISIBLE"]}`\n- Status de estudante alterado: **NO**\n- Notas/frequências alteradas: **NO**\n- Produção alterada: **{"YES — somente mantenedora_id dos vínculos alvo" if mode=="apply" else "NO"}**')
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-dependency-tenant-repair','Content-Type':'application/json'}
          urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/{issue}/comments',data=json.dumps({'body':body}).encode(),headers=headers,method='POST'),timeout=30).read()
          urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/{issue}',data=json.dumps({'state':'closed','state_reason':'completed'}).encode(),headers=headers,method='PATCH'),timeout=30).read()
          PY
