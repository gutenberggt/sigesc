name: DVD 38G - Preflight Guard

on:
  pull_request:
    branches: [main]

jobs:
  preflight-readonly:
    name: DVD 38G-A - manifest hash + backup guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install pytest python-dotenv motor

      - name: Run 38G-A guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_cutover_preflight_phase38g.py

      - name: Static read-only assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/prepare_dvd_cutover_phase38g.py')
          src = p.read_text(encoding='utf-8')
          forbidden = [
              '.insert_one(', '.insert_many(', '.update_one(', '.update_many(',
              '.replace_one(', '.delete_one(', '.delete_many(', '.bulk_write(',
              '.find_one_and_update(', '.find_one_and_delete(', '.find_one_and_replace(',
          ]
          # Tokens são declarados como strings no próprio guard; rejeita apenas usos
          # fora da declaração do tuple MONGO_MUTATOR_TOKENS.
          lines = src.splitlines()
          executable = '\n'.join(
              line for line in lines
              if not line.lstrip().startswith('"') and 'MONGO_MUTATOR_TOKENS' not in line
          )
          hits = [token for token in forbidden if token in executable]
          assert not hits, f'Mutadores Mongo proibidos no preflight: {hits}'
          print('38G-A read-only static guard PASS')
          PY

      - name: Run Segunda Onda 2A preflight guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_second_wave_2a_preflight.py

      - name: Static Segunda Onda 2A read-only assertion
        run: |
          PYTHONPATH=. python - <<'PY'
          from scripts.prepare_dvd_second_wave_2a import assert_script_read_only
          assert_script_read_only()
          print('Segunda Onda 2A read-only static guard PASS')
          PY

      - name: Run Segunda Onda 2A apply guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_second_wave_2a_apply.py

      - name: Run Segunda Onda 2A persistent seal guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_second_wave_2a_persistent_seal.py

      - name: Run Segunda Onda 2B preflight guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_second_wave_2b_preflight.py

      - name: Static Segunda Onda 2B read-only assertion
        run: |
          PYTHONPATH=. python - <<'PY'
          from scripts.prepare_dvd_second_wave_2b import assert_script_read_only
          assert_script_read_only()
          print('Segunda Onda 2B read-only static guard PASS')
          PY

      - name: Run Segunda Onda 2B apply + persistent seal guards
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_dvd_second_wave_2b_apply.py

      - name: Guard volume persistente de backup DVD no Coolify
        run: |
          PYTHONPATH=. pytest -q --noconftest tests/test_coolify_dvd_backup_volume_p0.py
