name: Enrollment Canonical Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/enrollment_service.py'
      - 'backend/services/school_docs_service.py'
      - 'backend/routers/enrollments.py'
      - 'backend/routers/pre_matricula.py'
      - 'backend/scripts/audit_enrollment_canonical.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_b.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_c.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_d.py'
      - 'backend/scripts/audit_enrollment_orphans_repair_plan_phase_e.py'
      - 'backend/scripts/reconcile_enrollment_p0_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_confirmed_date_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_legacy_relocation_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_legacy_relocation_historical_school_2026.py'
      - 'backend/tests/test_enrollment_canonical_contract.py'
      - 'backend/tests/test_enrollment_canonical_resilience.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_b.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_c.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_d.py'
      - 'backend/tests/test_audit_enrollment_orphans_repair_plan_phase_e.py'
      - 'backend/tests/test_reconcile_enrollment_p0_2026.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_2026.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_assessment.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_manifest.py'
      - 'backend/tests/test_reconcile_enrollment_p0_legacy_relocation_2026.py'
      - 'frontend/src/pages/PreMatriculaManagement.jsx'
      - '.github/workflows/enrollment-canonical-contract.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/enrollment_service.py'
      - 'backend/services/school_docs_service.py'
      - 'backend/routers/enrollments.py'
      - 'backend/routers/pre_matricula.py'
      - 'backend/scripts/audit_enrollment_canonical.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_b.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_c.py'
      - 'backend/scripts/audit_enrollment_orphans_forensic_phase_d.py'
      - 'backend/scripts/audit_enrollment_orphans_repair_plan_phase_e.py'
      - 'backend/scripts/reconcile_enrollment_p0_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_confirmed_date_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_legacy_relocation_2026.py'
      - 'backend/scripts/reconcile_enrollment_p0_legacy_relocation_historical_school_2026.py'
      - 'backend/tests/test_enrollment_canonical_contract.py'
      - 'backend/tests/test_enrollment_canonical_resilience.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_b.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_c.py'
      - 'backend/tests/test_audit_enrollment_orphans_forensic_phase_d.py'
      - 'backend/tests/test_audit_enrollment_orphans_repair_plan_phase_e.py'
      - 'backend/tests/test_reconcile_enrollment_p0_2026.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_2026.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_assessment.py'
      - 'backend/tests/test_reconcile_enrollment_p0_confirmed_date_manifest.py'
      - 'backend/tests/test_reconcile_enrollment_p0_legacy_relocation_2026.py'
      - 'frontend/src/pages/PreMatriculaManagement.jsx'
      - '.github/workflows/enrollment-canonical-contract.yml'

jobs:
  canonical-enrollment-contract:
    name: Backend - Matrícula canônica
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract dependencies
        run: pip install pytest pytest-asyncio pymongo motor python-dotenv

      - name: Compile changed enrollment modules
        run: |
          python -m py_compile \
            services/enrollment_service.py \
            services/school_docs_service.py \
            routers/enrollments.py \
            routers/pre_matricula.py \
            scripts/audit_enrollment_canonical.py \
            scripts/audit_enrollment_orphans_forensic.py \
            scripts/audit_enrollment_orphans_forensic_phase_b.py \
            scripts/audit_enrollment_orphans_forensic_phase_c.py \
            scripts/audit_enrollment_orphans_forensic_phase_d.py \
            scripts/audit_enrollment_orphans_repair_plan_phase_e.py \
            scripts/reconcile_enrollment_p0_2026.py \
            scripts/reconcile_enrollment_p0_confirmed_date_2026.py \
            scripts/reconcile_enrollment_p0_legacy_relocation_2026.py \
            scripts/reconcile_enrollment_p0_legacy_relocation_historical_school_2026.py \
            tests/test_enrollment_canonical_contract.py \
            tests/test_enrollment_canonical_resilience.py \
            tests/test_audit_enrollment_orphans_forensic.py \
            tests/test_audit_enrollment_orphans_forensic_phase_b.py \
            tests/test_audit_enrollment_orphans_forensic_phase_c.py \
            tests/test_audit_enrollment_orphans_forensic_phase_d.py \
            tests/test_audit_enrollment_orphans_repair_plan_phase_e.py \
            tests/test_reconcile_enrollment_p0_2026.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_2026.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_assessment.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_manifest.py \
            tests/test_reconcile_enrollment_p0_legacy_relocation_2026.py

      - name: Smoke direct execution of enrollment audit scripts
        run: |
          python scripts/reconcile_enrollment_p0_legacy_relocation_historical_school_2026.py --help >/dev/null
          python scripts/audit_enrollment_orphans_forensic.py --help >/dev/null
          python scripts/audit_enrollment_orphans_forensic_phase_b.py --help >/dev/null
          python scripts/audit_enrollment_orphans_forensic_phase_c.py --help >/dev/null
          python scripts/audit_enrollment_orphans_forensic_phase_d.py --help >/dev/null
          python scripts/audit_enrollment_orphans_repair_plan_phase_e.py --help >/dev/null

      - name: Run canonical enrollment guards
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_enrollment_canonical_contract.py \
            tests/test_enrollment_canonical_resilience.py \
            tests/test_audit_enrollment_orphans_forensic.py \
            tests/test_audit_enrollment_orphans_forensic_phase_b.py \
            tests/test_audit_enrollment_orphans_forensic_phase_c.py \
            tests/test_audit_enrollment_orphans_forensic_phase_d.py \
            tests/test_audit_enrollment_orphans_repair_plan_phase_e.py \
            tests/test_reconcile_enrollment_p0_2026.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_2026.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_assessment.py \
            tests/test_reconcile_enrollment_p0_confirmed_date_manifest.py \
            tests/test_reconcile_enrollment_p0_legacy_relocation_2026.py
