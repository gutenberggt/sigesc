name: Enrollment Rectification F2.1A - Attendance Guard

on:
  pull_request:
    paths:
      - 'backend/services/attendance_validation.py'
      - 'backend/services/enrollment_rectification_attendance.py'
      - 'backend/services/enrollment_rectification.py'
      - 'backend/services/enrollment_rectification_execution.py'
      - 'backend/routers/attendance.py'
      - 'backend/routers/enrollment_rectification.py'
      - 'backend/routers/enrollment_rectification_execution.py'
      - 'backend/tests/test_enrollment_rectification_f1_dry_run.py'
      - 'backend/tests/test_enrollment_rectification_f1_route_composition.py'
      - 'backend/tests/test_enrollment_rectification_f2_safety_kernel.py'
      - 'backend/tests/test_enrollment_rectification_f2_1a_attendance.py'
      - 'backend/tests/test_enrollment_rectification_f2_1a_attendance_hardening.py'
      - 'docs/governance/RETIFICACAO_MATRICULA_TURMA_F2_1A.md'
      - '.github/workflows/enrollment-rectification-f2-1a-attendance-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f2-1a-attendance:
    name: F2.1A - Frequência compensável sem execução pública
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mongomock mongomock-motor

      - name: Compile F1/F2/F2.1A contracts
        working-directory: backend
        run: |
          python -m py_compile \
            services/attendance_validation.py \
            services/enrollment_rectification_attendance.py \
            services/enrollment_rectification.py \
            services/enrollment_rectification_execution.py \
            routers/attendance.py \
            routers/enrollment_rectification.py \
            routers/enrollment_rectification_execution.py \
            tests/test_enrollment_rectification_f2_1a_attendance.py \
            tests/test_enrollment_rectification_f2_1a_attendance_hardening.py

      - name: Run F1 + F2 + F2.1A regression
        working-directory: backend
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017'
          DB_NAME: 'sigesc_rectification_f21a_guard_unused'
          JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_DRY_RUN_SECRET: 'ci-only-rectification-secret-0123456789abcdef0123456789abcdef'
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        run: |
          python -m pytest \
            tests/test_enrollment_rectification_f1_dry_run.py \
            tests/test_enrollment_rectification_f1_route_composition.py \
            tests/test_enrollment_rectification_f2_safety_kernel.py \
            tests/test_enrollment_rectification_f2_1a_attendance.py \
            tests/test_enrollment_rectification_f2_1a_attendance_hardening.py \
            -q --asyncio-mode=auto

      - name: Fail-closed structural guard
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          f1_router = Path('routers/enrollment_rectification.py').read_text(encoding='utf-8')
          f2_router = Path('routers/enrollment_rectification_execution.py').read_text(encoding='utf-8')
          attendance_router = Path('routers/attendance.py').read_text(encoding='utf-8')
          f2_exec = Path('services/enrollment_rectification_execution.py').read_text(encoding='utf-8')
          attendance_rectification = Path('services/enrollment_rectification_attendance.py').read_text(encoding='utf-8')

          for route_src in (f1_router, f2_router):
              if '@router.post("/execute")' in route_src:
                  raise SystemExit('F2.1A não pode expor /execute')
              if '@router.post("/rollback")' in route_src:
                  raise SystemExit('F2.1A não pode expor /rollback')

          if 'ACADEMIC_MUTATION_IMPLEMENTED = False' not in f2_exec:
              raise SystemExit('Gate global acadêmico deixou de estar fail-closed')
          if 'APIRouter' in attendance_rectification:
              raise SystemExit('Primitivo F2.1A não pode expor router próprio')
          if 'db.attendance.insert_one(' in attendance_rectification or 'db.attendance.insert_many(' in attendance_rectification:
              raise SystemExit('F2.1A não pode criar attendance no destino')
          if 'validate_attendance_institutional(' not in attendance_router:
              raise SystemExit('Router de frequência deixou de delegar validação ao serviço canônico')
          if 'unvalidate_attendance_institutional(' not in attendance_router:
              raise SystemExit('Router de frequência deixou de delegar desvalidação ao serviço canônico')

          print('F2.1A fail-closed structural guard: PASS')
          PY
