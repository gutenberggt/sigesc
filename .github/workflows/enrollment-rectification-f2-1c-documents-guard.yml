name: Enrollment Rectification F2.1C - Documents Guard

on:
  pull_request:
    paths:
      - 'backend/services/enrollment_rectification_documents.py'
      - 'backend/tests/test_enrollment_rectification_f2_1c_documents.py'
      - 'docs/governance/RETIFICACAO_MATRICULA_TURMA_F2_1C.md'
      - '.github/workflows/enrollment-rectification-f2-1c-documents-guard.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/enrollment_rectification_documents.py'
      - 'backend/tests/test_enrollment_rectification_f2_1c_documents.py'
      - 'docs/governance/RETIFICACAO_MATRICULA_TURMA_F2_1C.md'
      - '.github/workflows/enrollment-rectification-f2-1c-documents-guard.yml'

permissions:
  contents: read

jobs:
  f2-1c-documents:
    name: F2.1C - Documentos, resíduos e rollback eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mongomock mongomock-motor
      - name: Compile F2.1C
        working-directory: backend
        run: python -m py_compile services/enrollment_rectification_documents.py tests/test_enrollment_rectification_f2_1c_documents.py
      - name: Run F2.1C regressions
        working-directory: backend
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017'
          DB_NAME: 'sigesc_rectification_f21c_guard_unused'
          JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
        run: python -m pytest tests/test_enrollment_rectification_f2_1c_documents.py -q --asyncio-mode=auto
      - name: Structural fail-closed guard
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('services/enrollment_rectification_documents.py').read_text(encoding='utf-8')
          assert 'delete_many' not in text
          assert 'diary_snapshots' in text
          assert 'BLOCKED_DOCUMENT_REVIEW_REQUIRED' in text
          assert 'DIARY_SNAPSHOT_SUPERSESSION_REQUIRED' in text
          assert 'DOCUMENT_UNTRACKED_ACKNOWLEDGEMENT_REQUIRED' in text
          assert 'ROLLBACK_DOCUMENT_REVOCATION_IRREVERSIBLE' in text
          assert 'detect_rectification_origin_residues' in text
          print('F2.1C document guard: PASS')
          PY
