name: "Enrollment Rectification F2.3 - Case Preflight Read-only V2"

on:
  pull_request:
    paths:
      - 'backend/scripts/enrollment_rectification_f2_3_case_preflight.py'
      - 'backend/tests/test_enrollment_rectification_f2_3_case_preflight.py'
      - 'backend/Dockerfile'
      - '.github/workflows/enrollment-rectification-f2-3-case-preflight-v2.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: enrollment-rectification-f2-3-case-preflight-v2
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.3 V2 runtime path + read-only boundary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Focused tests
        env:
          PYTHONPATH: backend
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest motor pymongo
          python -m py_compile backend/scripts/enrollment_rectification_f2_3_case_preflight.py
          pytest -q --noconftest backend/tests/test_enrollment_rectification_f2_3_case_preflight.py

      - name: Enforce runtime topology and read-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          script_path = Path('backend/scripts/enrollment_rectification_f2_3_case_preflight.py')
          workflow_path = Path('.github/workflows/enrollment-rectification-f2-3-case-preflight-v2.yml')
          dockerfile_path = Path('backend/Dockerfile')
          script = script_path.read_text(encoding='utf-8')
          workflow = workflow_path.read_text(encoding='utf-8')
          dockerfile = dockerfile_path.read_text(encoding='utf-8')

          if 'WORKDIR /app' not in dockerfile:
              raise SystemExit('F2_3_V2_DOCKER_WORKDIR_CHANGED')
          if '-w /app ' not in workflow or 'PYTHONPATH=/app' not in workflow:
              raise SystemExit('F2_3_V2_RUNTIME_PATH_MISMATCH')
          if '/app/backend' in workflow:
              raise SystemExit('F2_3_V2_STALE_RUNTIME_PATH')

          tree = ast.parse(script)
          forbidden_calls = {
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
              'create_index','create_indexes','rename',
          }
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr in forbidden_calls:
                  hits.append(node.func.attr)
          if hits:
              raise SystemExit(f'F2_3_V2_MONGO_MUTATOR:{sorted(set(hits))}')

          for marker in (
              'prepare_rectification_saga_execution',
              'execute_rectification_saga',
              'rollback_rectification_saga',
              'method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"',
          ):
              if marker in script:
                  raise SystemExit(f'F2_3_V2_FORBIDDEN_MARKER:{marker}')

          for marker in (
              'build_rectification_dry_run',
              '"database_mutation": False',
              '"production_writes": False',
              '"feature_flag_modified": False',
              '"student_pii_emitted": False',
              '"technical_ids_emitted": False',
          ):
              if marker not in script:
                  raise SystemExit(f'F2_3_V2_REQUIRED_MARKER_MISSING:{marker}')

          print('F2_3_V2_GUARD=PASS')
          print('RUNTIME_WORKDIR=/app')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          PY

  production-preflight:
    name: Run F2.3 V2 canonical case preflight in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[ENROLLMENT-RECTIFICATION-F2.3-PREFLIGHT-V2] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request

          issue = (json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8')).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('F2_3_V2_OWNER_REQUIRED')

          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values:
                  raise SystemExit(f'F2_3_V2_DUPLICATE_FIELD:{key}')
              values[key]=value

          expected={
              'ENROLLMENT_RECTIFICATION_F2_3_PREFLIGHT_V2':'AUTHORIZED',
              'CONFIRMATION':'AUDIT_ENROLLMENT_RECTIFICATION_CASE_READ_ONLY_V2',
              'TRACKING_ISSUE':'580',
              'ACADEMIC_YEAR':'2026',
              'SOURCE_CLASS':'6º ANO B',
              'DESTINATION_CLASS':'7º ANO B',
              'SCHOOL':'E M E I E F Monsenhor Augusto Dias de Brito',
          }
          for key,wanted in expected.items():
              if values.get(key) != wanted:
                  raise SystemExit(f'F2_3_V2_FIELD_INVALID:{key}')

          target=values.get('TARGET_SHA','')
          expected_prod=values.get('EXPECTED_PRODUCTION_SHA','')
          salt=values.get('IDENTITY_SALT','')
          identity_hash=values.get('IDENTITY_HASH','')
          if not re.fullmatch(r'[0-9a-f]{40}',target): raise SystemExit('F2_3_V2_TARGET_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{40}',expected_prod): raise SystemExit('F2_3_V2_PROD_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{32}',salt): raise SystemExit('F2_3_V2_SALT_INVALID')
          if not re.fullmatch(r'[0-9a-f]{64}',identity_hash): raise SystemExit('F2_3_V2_IDENTITY_HASH_INVALID')
          if issue.get('title') != f'[ENROLLMENT-RECTIFICATION-F2.3-PREFLIGHT-V2] {target}':
              raise SystemExit('F2_3_V2_TITLE_MISMATCH')

          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-enrollment-rectification-f2-3-v2',
          }
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)

          main_sha=get('/branches/main')['commit']['sha']
          prod_sha=get('/branches/production')['commit']['sha']
          if main_sha != target: raise SystemExit(f'F2_3_V2_MAIN_MOVED:{main_sha}')
          if prod_sha != expected_prod: raise SystemExit(f'F2_3_V2_PRODUCTION_MOVED:{prod_sha}')
          if get('/issues/580').get('state') != 'open': raise SystemExit('F2_3_V2_TRACKING_NOT_OPEN')

          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'expected_production_sha={expected_prod}\n')
              out.write(f'identity_salt={salt}\n')
              out.write(f'identity_hash={identity_hash}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('F2_3_V2_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "F2_3_V2_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/f2_3_v2_prod_key
          chmod 600 ~/.ssh/f2_3_v2_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_v2_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute canonical dry-run preflight read-only
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
          F2_3_IDENTITY_SALT: ${{ steps.context.outputs.identity_salt }}
          F2_3_IDENTITY_HASH: ${{ steps.context.outputs.identity_hash }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/f2-3-v2-raw.log'
          remote_command="timeout 900 docker exec -i -w /app -e PYTHONPATH=/app -e F2_3_IDENTITY_SALT=${F2_3_IDENTITY_SALT} -e F2_3_IDENTITY_HASH=${F2_3_IDENTITY_HASH} ${BACKEND_CONTAINER} python -"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_v2_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/enrollment_rectification_f2_3_case_preflight.py > "$raw" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$raw" "$rc" <<'PY'
          import hashlib,re,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes(); text=data.decode('utf-8','replace')
          controlled=re.findall(r'F2_3_[A-Z0-9_:. -]+',text)
          print('F2_3_V2_REMOTE_EXIT='+sys.argv[2])
          print('F2_3_V2_CONTROLLED_ERROR='+(controlled[-1].strip() if controlled else '<none>'))
          print('F2_3_V2_RAW_SHA256='+hashlib.sha256(data).hexdigest())
          PY
            rm -f "$raw"
            exit "$rc"
          fi
          prefix='ENROLLMENT_RECTIFICATION_F2_3_PREFLIGHT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/preflight.json
          python -m json.tool evidence/preflight.json >/dev/null
          rm -f "$raw"

      - name: Validate strict read-only and fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/preflight.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'ENROLLMENT_RECTIFICATION_F2_3_CASE_PREFLIGHT_V1': raise SystemExit('F2_3_V2_SCHEMA_INVALID')
          if p.get('status') not in {'READY_FOR_REVIEW','BLOCKED'}: raise SystemExit('F2_3_V2_STATUS_INVALID')
          for key in ('database_mutation','production_writes','student_pii_emitted','technical_ids_emitted'):
              if p.get(key) is not False: raise SystemExit(f'F2_3_V2_BOUNDARY_FAILED:{key}')
          for key in ('prepare_execution_called','execute_called','rollback_called','feature_flag_modified'):
              if key in p and p.get(key) is not False: raise SystemExit(f'F2_3_V2_FORBIDDEN_ACTION:{key}')
          if p.get('execution_flag_enabled') is True: raise SystemExit('F2_3_V2_EXECUTION_FLAG_ENABLED')
          if p.get('identity_match_count') not in (None,1): raise SystemExit('F2_3_V2_IDENTITY_CARDINALITY_UNSAFE')
          if p.get('dry_run_token_emitted') is True or p.get('precondition_hash_emitted') is True:
              raise SystemExit('F2_3_V2_SECRET_MATERIAL_EMITTED')
          print('F2_3_V2_BOUNDARY=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('PII_EMITTED=NO')
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrollment-rectification-f2-3-case-preflight-v2-${{ github.run_id }}
          path: evidence/preflight.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ steps.context.outputs.expected_production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/preflight.json').read_text(encoding='utf-8'))
          summary={
              'status':p.get('status'),
              'reason':p.get('reason'),
              'contract_version':p.get('contract_version'),
              'can_execute_later':p.get('can_execute_later'),
              'student_projection_matches_source':p.get('student_projection_matches_source'),
              'execution_flag_enabled':p.get('execution_flag_enabled'),
              'counts':p.get('counts'),
              'grades_summary':p.get('grades_summary'),
              'attendance_summary':p.get('attendance_summary'),
              'documents':p.get('documents'),
              'blocker_code_counts':p.get('blocker_code_counts'),
              'warning_code_counts':p.get('warning_code_counts'),
          }
          body='## F2.3 V2 — preflight canônico read-only\n\n'+\
               f"Main audit SHA: `{os.environ['TARGET_SHA']}`\n\n"+\
               f"Production SHA: `{os.environ['EXPECTED_PRODUCTION_SHA']}`\n\n"+\
               '```json\n'+json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n```\n\n'+\
               '**Boundary:** somente leitura; sem PII/IDs técnicos; sem prepare/execute/rollback; feature flag não alterada.'
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f2-3-v2'}
          repo=os.environ['GITHUB_REPOSITORY']
          def request(method,path,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers,data=data,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response) if response.length else None
          request('POST',f"/issues/{os.environ['GATE_ISSUE']}/comments",{'body':body})
          request('PATCH',f"/issues/{os.environ['GATE_ISSUE']}",{'state':'closed','state_reason':'completed'})
          print('F2_3_V2_RESULT_RECORDED=YES')
          PY
