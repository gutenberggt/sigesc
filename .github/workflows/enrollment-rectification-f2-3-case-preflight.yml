name: "Enrollment Rectification F2.3 - Case Preflight Read-only"

on:
  pull_request:
    paths:
      - 'backend/scripts/enrollment_rectification_f2_3_case_preflight.py'
      - 'backend/tests/test_enrollment_rectification_f2_3_case_preflight.py'
      - '.github/workflows/enrollment-rectification-f2-3-case-preflight.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: enrollment-rectification-f2-3-case-preflight
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.3 case preflight read-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest motor pymongo

      - name: Compile and run focused tests
        shell: bash
        env:
          PYTHONPATH: backend
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/enrollment_rectification_f2_3_case_preflight.py
          pytest -q --noconftest backend/tests/test_enrollment_rectification_f2_3_case_preflight.py

      - name: Enforce static read-only and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/scripts/enrollment_rectification_f2_3_case_preflight.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          mongo_mutators = {
              'insert_one', 'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_one', 'delete_many', 'bulk_write', 'find_one_and_update',
              'find_one_and_delete', 'find_one_and_replace', 'drop', 'drop_database',
              'create_index', 'create_indexes', 'rename',
          }
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in mongo_mutators:
                      hits.append(node.func.attr)
          if hits:
              raise SystemExit(f'F2_3_PREFLIGHT_MONGO_MUTATOR:{sorted(set(hits))}')

          forbidden = (
              'prepare_rectification_saga_execution',
              'execute_rectification_saga',
              'rollback_rectification_saga',
              'document_acknowledgement',
              'Idempotency-Key',
              'guardian_name',
              'mother_name',
              'cpf',
          )
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'F2_3_PREFLIGHT_FORBIDDEN_MARKER:{marker}')

          required = (
              'build_rectification_dry_run',
              'F2_3_IDENTITY_SALT',
              'F2_3_IDENTITY_HASH',
              '"database_mutation": False',
              '"production_writes": False',
              '"prepare_execution_called": False',
              '"execute_called": False',
              '"rollback_called": False',
              '"feature_flag_modified": False',
              '"student_pii_emitted": False',
              '"technical_ids_emitted": False',
              '"dry_run_token_emitted": False',
              '"precondition_hash_emitted": False',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'F2_3_PREFLIGHT_REQUIRED_MARKER_MISSING:{marker}')

          print('F2_3_CASE_PREFLIGHT_STATIC_BOUNDARY=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('PII_PUBLICATION=NO')
          PY

  production-preflight:
    name: Run F2.3 canonical case preflight in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[ENROLLMENT-RECTIFICATION-F2.3-PREFLIGHT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          issue = event.get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('F2_3_PREFLIGHT_OWNER_REQUIRED')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key, value = raw.split('=', 1)
              key, value = key.strip(), value.strip()
              if key in values:
                  raise SystemExit(f'F2_3_PREFLIGHT_DUPLICATE_FIELD:{key}')
              values[key] = value

          expected = {
              'ENROLLMENT_RECTIFICATION_F2_3_PREFLIGHT': 'AUTHORIZED',
              'CONFIRMATION': 'AUDIT_ENROLLMENT_RECTIFICATION_CASE_READ_ONLY',
              'TRACKING_ISSUE': '580',
              'ACADEMIC_YEAR': '2026',
              'SOURCE_CLASS': '6º ANO B',
              'DESTINATION_CLASS': '7º ANO B',
              'SCHOOL': 'E M E I E F Monsenhor Augusto Dias de Brito',
          }
          for key, wanted in expected.items():
              if values.get(key) != wanted:
                  raise SystemExit(f'F2_3_PREFLIGHT_FIELD_INVALID:{key}')

          target = values.get('TARGET_SHA', '')
          expected_prod = values.get('EXPECTED_PRODUCTION_SHA', '')
          salt = values.get('IDENTITY_SALT', '')
          identity_hash = values.get('IDENTITY_HASH', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('F2_3_PREFLIGHT_TARGET_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{40}', expected_prod):
              raise SystemExit('F2_3_PREFLIGHT_PRODUCTION_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{32}', salt):
              raise SystemExit('F2_3_PREFLIGHT_IDENTITY_SALT_INVALID')
          if not re.fullmatch(r'[0-9a-f]{64}', identity_hash):
              raise SystemExit('F2_3_PREFLIGHT_IDENTITY_HASH_INVALID')
          if issue.get('title') != f'[ENROLLMENT-RECTIFICATION-F2.3-PREFLIGHT] {target}':
              raise SystemExit('F2_3_PREFLIGHT_TITLE_MISMATCH')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-enrollment-rectification-f2-3-preflight',
          }
          repo = os.environ['GITHUB_REPOSITORY']

          def get(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          main_sha = get('/branches/main')['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'F2_3_PREFLIGHT_MAIN_MOVED:{main_sha}')
          prod_sha = get('/branches/production')['commit']['sha']
          if prod_sha != expected_prod:
              raise SystemExit(f'F2_3_PREFLIGHT_PRODUCTION_MOVED:{prod_sha}')
          tracking = get('/issues/580')
          if tracking.get('state') != 'open':
              raise SystemExit('F2_3_PREFLIGHT_TRACKING_NOT_OPEN')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'expected_production_sha={expected_prod}\n')
              out.write(f'identity_salt={salt}\n')
              out.write(f'identity_hash={identity_hash}\n')
              out.write(f'gate_issue={issue.get("number")}\n')

          print('F2_3_PREFLIGHT_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('FEATURE_FLAG_CHANGE=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "F2_3_PREFLIGHT_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/f2_3_preflight_prod_key
          chmod 600 ~/.ssh/f2_3_preflight_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_preflight_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute canonical dry-run preflight read-only
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
          F2_3_IDENTITY_SALT: ${{ steps.context.outputs.identity_salt }}
          F2_3_IDENTITY_HASH: ${{ steps.context.outputs.identity_hash }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/f2-3-case-preflight-raw.log'
          remote_command="timeout 900 docker exec -i -w /app/backend -e PYTHONPATH=/app/backend -e F2_3_IDENTITY_SALT=${F2_3_IDENTITY_SALT} -e F2_3_IDENTITY_HASH=${F2_3_IDENTITY_HASH} ${BACKEND_CONTAINER} python -"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_preflight_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/enrollment_rectification_f2_3_case_preflight.py > "$raw" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$raw" "$rc" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          text = data.decode('utf-8', 'replace')
          controlled = re.findall(r'F2_3_[A-Z0-9_:. -]+', text)
          print('F2_3_PREFLIGHT_REMOTE_EXIT=' + sys.argv[2])
          print('F2_3_PREFLIGHT_CONTROLLED_ERROR=' + (controlled[-1].strip() if controlled else '<none>'))
          print('F2_3_PREFLIGHT_RAW_SHA256=' + hashlib.sha256(data).hexdigest())
          PY
            rm -f "$raw"
            exit "$rc"
          fi

          prefix='ENROLLMENT_RECTIFICATION_F2_3_PREFLIGHT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/preflight.json
          python -m json.tool evidence/preflight.json >/dev/null
          rm -f "$raw"

      - name: Validate strict read-only, privacy and fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('evidence/preflight.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'ENROLLMENT_RECTIFICATION_F2_3_CASE_PREFLIGHT_V1':
              raise SystemExit('F2_3_PREFLIGHT_SCHEMA_INVALID')
          if p.get('status') not in {'READY_FOR_REVIEW', 'BLOCKED'}:
              raise SystemExit('F2_3_PREFLIGHT_STATUS_INVALID')

          for key in ('database_mutation', 'production_writes', 'student_pii_emitted', 'technical_ids_emitted'):
              if p.get(key) is not False:
                  raise SystemExit(f'F2_3_PREFLIGHT_BOUNDARY_FAILED:{key}')
          for key in ('prepare_execution_called', 'execute_called', 'rollback_called', 'feature_flag_modified'):
              if key in p and p.get(key) is not False:
                  raise SystemExit(f'F2_3_PREFLIGHT_FORBIDDEN_ACTION:{key}')
          if p.get('execution_flag_enabled') is True:
              raise SystemExit('F2_3_PREFLIGHT_EXECUTION_FLAG_UNEXPECTEDLY_ENABLED')
          if p.get('identity_match_count') not in (None, 1):
              raise SystemExit('F2_3_PREFLIGHT_IDENTITY_CARDINALITY_UNSAFE')
          if p.get('dry_run_token_emitted') is True or p.get('precondition_hash_emitted') is True:
              raise SystemExit('F2_3_PREFLIGHT_SECRET_MATERIAL_EMITTED')

          print('F2_3_CASE_PREFLIGHT_BOUNDARY=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('FEATURE_FLAG_CHANGE=NO')
          print('PII_EMITTED=NO')
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrollment-rectification-f2-3-case-preflight-${{ github.run_id }}
          path: evidence/preflight.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          p = json.loads(Path('evidence/preflight.json').read_text(encoding='utf-8'))
          lines = [
              '## F2.3 — preflight read-only do primeiro caso real',
              '',
              f"Target: `{os.environ['TARGET_SHA']}`",
              f"Status: **{p.get('status')}**",
              f"Escola: {p.get('school') or 'n/d'}",
              f"Fluxo: **{p.get('source_class') or 'n/d'} → {p.get('destination_class') or 'n/d'}**",
              f"Identidade resolvida: **{'sim' if p.get('identity_match_count') == 1 else 'não'}**",
              f"Fingerprint pseudônimo: `{p.get('identity_fingerprint') or 'n/d'}`",
              f"Projeção students.class_id coincide com origem: **{p.get('student_projection_matches_source')}**",
              f"Feature flag de execução habilitada: **{p.get('execution_flag_enabled')}**",
              f"Can execute later (dry-run): **{p.get('can_execute_later')}**",
              '',
              f"Contagens canônicas: `{json.dumps(p.get('counts') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"Notas: `{json.dumps(p.get('grades_summary') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"Frequência: `{json.dumps(p.get('attendance_summary') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"Documentos: `{json.dumps(p.get('documents') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"Blockers: `{json.dumps(p.get('blocker_code_counts') or {}, ensure_ascii=False, sort_keys=True)}`",
              f"Warnings: `{json.dumps(p.get('warning_code_counts') or {}, ensure_ascii=False, sort_keys=True)}`",
          ]
          if p.get('reason'):
              lines.append(f"Motivo de bloqueio: `{p.get('reason')}`")
          if p.get('dry_run_error_code'):
              lines.append(f"Erro canônico do dry-run: `{p.get('dry_run_error_code')}`")
          lines += [
              '',
              '**Boundary:** Mongo read-only; apenas `build_rectification_dry_run()` canônico; sem `/prepare-execution`, sem `/execute`, sem `/rollback`, sem alteração de feature flag, sem PII ou IDs técnicos na evidência pública.',
          ]
          body = '\n'.join(lines)

          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-enrollment-rectification-f2-3-preflight',
              'Content-Type': 'application/json',
          }

          def request(method, path, payload):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          request('POST', '/issues/580/comments', {'body': body})
          request('POST', f"/issues/{os.environ['GATE_ISSUE']}/comments", {'body': body})
          request('PATCH', f"/issues/{os.environ['GATE_ISSUE']}", {'state': 'closed', 'state_reason': 'completed'})
          print('F2_3_PREFLIGHT_RESULT_RECORDED=YES')
          PY
