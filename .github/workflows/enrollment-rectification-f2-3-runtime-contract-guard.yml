name: "Enrollment Rectification F2.3 - Runtime Contract Guard"

on:
  pull_request:
    paths:
      - 'backend/services/enrollment_rectification_saga.py'
      - 'backend/services/enrollment_rectification_saga_runtime.py'
      - 'backend/services/enrollment_rectification_saga_ordinal_runtime.py'
      - 'backend/services/enrollment_rectification_execution.py'
      - 'backend/routers/enrollment_rectification_execution.py'
      - 'backend/routers/enrollment_rectification_saga.py'
      - 'backend/tests/test_enrollment_rectification_f2_3_saga_runtime_contract.py'
      - 'backend/tests/test_enrollment_rectification_f2_3d_saga_runtime.py'
      - '.github/workflows/enrollment-rectification-f2-3-runtime-contract-guard.yml'

permissions:
  contents: read

jobs:
  runtime-contract:
    name: F2.3 - prepare/execute runtime compatibility
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
      JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
      ENROLLMENT_RECTIFICATION_DRY_RUN_SECRET: 'ci-only-rectification-secret-0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio \
            fastapi \
            motor pymongo \
            passlib bcrypt python-dotenv python-jose

      - name: Compile runtime binding and routers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/services/enrollment_rectification_saga_runtime.py \
            backend/services/enrollment_rectification_saga_ordinal_runtime.py \
            backend/routers/enrollment_rectification_execution.py \
            backend/routers/enrollment_rectification_saga.py

      - name: Run focused runtime-contract tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q --noconftest \
            backend/tests/test_enrollment_rectification_f2_3_saga_runtime_contract.py \
            backend/tests/test_enrollment_rectification_f2_3d_saga_runtime.py

      - name: Enforce binding and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('backend/services/enrollment_rectification_saga_runtime.py').read_text(encoding='utf-8')
          ordinal_runtime = Path('backend/services/enrollment_rectification_saga_ordinal_runtime.py').read_text(encoding='utf-8')
          prep_router = Path('backend/routers/enrollment_rectification_execution.py').read_text(encoding='utf-8')
          saga_router = Path('backend/routers/enrollment_rectification_saga.py').read_text(encoding='utf-8')

          required_runtime = (
              '_core_prepare_id(tenant, student_id, key)',
              'await _core_reauthenticate(db, actor, password)',
              '_core_validate_human_gates(',
              'adapted["snapshot_digest"] = _core_snapshot_digest(snapshot)',
              '_saga.build_compensating_snapshot = build_compensating_snapshot',
          )
          for marker in required_runtime:
              if marker not in runtime:
                  raise SystemExit(f'F2_3_RUNTIME_REQUIRED_MISSING:{marker}')

          # O binding F2.3 nunca manipula a feature flag; ela continua no SSoT F2.2.
          if 'os.environ' in runtime or 'ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED' in runtime:
              raise SystemExit('F2_3_RUNTIME_MUST_NOT_MODIFY_FLAG')

          # PREPARED permanece ligado diretamente ao adaptador F2.3 existente.
          if 'services.enrollment_rectification_saga_runtime' not in prep_router:
              raise SystemExit('F2_3_PREP_ROUTER_BINDING_MISSING')

          # EXECUTE/ROLLBACK podem usar diretamente F2.3 ou a composição F2.3D,
          # mas esta última precisa delegar explicitamente ao runtime F2.3 e à
          # saga F2.2, sem duplicar a autoridade de execução ou a feature flag.
          direct_binding = 'services.enrollment_rectification_saga_runtime' in saga_router
          ordinal_binding = 'services.enrollment_rectification_saga_ordinal_runtime' in saga_router
          if not (direct_binding or ordinal_binding):
              raise SystemExit('F2_3_EXECUTE_ROUTER_BINDING_MISSING')

          if ordinal_binding:
              required_ordinal = (
                  'from services import enrollment_rectification_saga_runtime as _runtime',
                  'from services import enrollment_rectification_saga as _saga',
                  '_runtime.execute_rectification_saga(',
                  'rollback_rectification_saga = _runtime.rollback_rectification_saga',
                  '_saga._checkpoint = _checkpoint_with_ordinal',
                  '_saga._compensate_academic = _compensate_academic_with_ordinal',
                  'saga_execution_enabled = _runtime.saga_execution_enabled',
              )
              for marker in required_ordinal:
                  if marker not in ordinal_runtime:
                      raise SystemExit(f'F2_3D_COMPOSITION_REQUIRED_MISSING:{marker}')
              if 'os.environ' in ordinal_runtime or 'ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED' in ordinal_runtime:
                  raise SystemExit('F2_3D_RUNTIME_MUST_NOT_MODIFY_FLAG')
              print('F2_3_EXECUTE_BINDING=ORDINAL_COMPOSITION')
          else:
              print('F2_3_EXECUTE_BINDING=DIRECT_RUNTIME')

          print('F2_3_RUNTIME_CONTRACT=PASS')
          print('FEATURE_FLAG_MODIFIED=NO')
          print('ACADEMIC_MUTATION_DURING_GUARD=NO')
          PY
