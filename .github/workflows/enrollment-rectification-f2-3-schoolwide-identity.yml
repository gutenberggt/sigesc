name: "Enrollment Rectification F2.3 - Schoolwide Identity Read-only"

on:
  pull_request:
    paths:
      - 'backend/scripts/enrollment_rectification_f2_3_schoolwide_identity.py'
      - 'backend/tests/test_enrollment_rectification_f2_3_schoolwide_identity.py'
      - '.github/workflows/enrollment-rectification-f2-3-schoolwide-identity.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: enrollment-rectification-f2-3-schoolwide-identity
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.3 schoolwide identity read-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and focused tests
        env:
          PYTHONPATH: backend
          ENROLLMENT_RECTIFICATION_EXECUTION_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest motor pymongo python-dotenv
          python -m py_compile backend/scripts/enrollment_rectification_f2_3_schoolwide_identity.py
          pytest -q --noconftest backend/tests/test_enrollment_rectification_f2_3_schoolwide_identity.py
      - name: Enforce read-only and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          script=Path('backend/scripts/enrollment_rectification_f2_3_schoolwide_identity.py').read_text(encoding='utf-8')
          workflow=Path('.github/workflows/enrollment-rectification-f2-3-schoolwide-identity.yml').read_text(encoding='utf-8')
          tree=ast.parse(script)
          forbidden={'insert_one','insert_many','update_one','update_many','replace_one','delete_one','delete_many','bulk_write','find_one_and_update','find_one_and_delete','find_one_and_replace','drop','drop_database','create_index','create_indexes','rename'}
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  hits.append(node.func.attr)
          if hits: raise SystemExit(f'F2_3_SCHOOLWIDE_MONGO_MUTATOR:{sorted(set(hits))}')
          for marker in ('prepare_rectification_saga_execution','execute_rectification_saga','rollback_rectification_saga','build_rectification_dry_run'):
              if marker in script: raise SystemExit(f'F2_3_SCHOOLWIDE_FORBIDDEN:{marker}')
          runtime=[line.strip() for line in workflow.splitlines() if line.strip().startswith('remote_command=')]
          if len(runtime) != 1 or '-w /app ' not in runtime[0] or 'PYTHONPATH=/app' not in runtime[0]:
              raise SystemExit('F2_3_SCHOOLWIDE_RUNTIME_INVALID')
          print('F2_3_SCHOOLWIDE_GUARD=PASS')
          print('DATABASE_MUTATION=NO')
          print('RAW_PII=NO')
          PY

  production-resolution:
    name: Locate F2.3 identity across school read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[ENROLLMENT-RECTIFICATION-F2.3-SCHOOLWIDE-ID] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          issue=(json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']: raise SystemExit('F2_3_SCHOOLWIDE_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              k,v=raw.split('=',1); k=k.strip(); v=v.strip()
              if k in values: raise SystemExit(f'F2_3_SCHOOLWIDE_DUPLICATE:{k}')
              values[k]=v
          expected={'ENROLLMENT_RECTIFICATION_F2_3_SCHOOLWIDE_ID':'AUTHORIZED','CONFIRMATION':'AUDIT_SCHOOLWIDE_IDENTITY_READ_ONLY','TRACKING_ISSUE':'580','ACADEMIC_YEAR':'2026','SCHOOL':'E M E I E F Monsenhor Augusto Dias de Brito'}
          for k,w in expected.items():
              if values.get(k) != w: raise SystemExit(f'F2_3_SCHOOLWIDE_FIELD_INVALID:{k}')
          target=values.get('TARGET_SHA',''); prod=values.get('EXPECTED_PRODUCTION_SHA',''); salt=values.get('COMPONENT_SALT','')
          hashes={k:values.get(k,'') for k in ('NAME_HASH','DOB_HASH','CPF_HASH')}
          if not re.fullmatch(r'[0-9a-f]{40}',target): raise SystemExit('F2_3_SCHOOLWIDE_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{40}',prod): raise SystemExit('F2_3_SCHOOLWIDE_PROD_INVALID')
          if not re.fullmatch(r'[0-9a-f]{32}',salt): raise SystemExit('F2_3_SCHOOLWIDE_SALT_INVALID')
          if any(not re.fullmatch(r'[0-9a-f]{64}',v) for v in hashes.values()): raise SystemExit('F2_3_SCHOOLWIDE_HASH_INVALID')
          if issue.get('title') != f'[ENROLLMENT-RECTIFICATION-F2.3-SCHOOLWIDE-ID] {target}': raise SystemExit('F2_3_SCHOOLWIDE_TITLE_MISMATCH')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f2-3-schoolwide'}
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          if get('/branches/main')['commit']['sha'] != target: raise SystemExit('F2_3_SCHOOLWIDE_MAIN_MOVED')
          if get('/branches/production')['commit']['sha'] != prod: raise SystemExit('F2_3_SCHOOLWIDE_PRODUCTION_MOVED')
          if get('/issues/580').get('state') != 'open': raise SystemExit('F2_3_SCHOOLWIDE_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nexpected_production_sha={prod}\ncomponent_salt={salt}\nname_hash={hashes["NAME_HASH"]}\ndob_hash={hashes["DOB_HASH"]}\ncpf_hash={hashes["CPF_HASH"]}\ngate_issue={issue.get("number")}\n')
          print('F2_3_SCHOOLWIDE_CONTEXT=PASS')
          print('RAW_PII=NO')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do test -n "${!v}" || exit 1; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/f2_3_schoolwide_key && chmod 600 ~/.ssh/f2_3_schoolwide_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Resolve backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({ ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_schoolwide_key" "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend" && [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"
      - name: Execute schoolwide identity location
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
          F2_3_COMPONENT_SALT: ${{ steps.context.outputs.component_salt }}
          F2_3_NAME_HASH: ${{ steps.context.outputs.name_hash }}
          F2_3_DOB_HASH: ${{ steps.context.outputs.dob_hash }}
          F2_3_CPF_HASH: ${{ steps.context.outputs.cpf_hash }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/schoolwide-raw.log'
          remote_command="timeout 900 docker exec -i -w /app -e PYTHONPATH=/app -e F2_3_COMPONENT_SALT=${F2_3_COMPONENT_SALT} -e F2_3_NAME_HASH=${F2_3_NAME_HASH} -e F2_3_DOB_HASH=${F2_3_DOB_HASH} -e F2_3_CPF_HASH=${F2_3_CPF_HASH} ${BACKEND_CONTAINER} python -"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f2_3_schoolwide_key" "${PROD_USER}@${PROD_HOST}" "$remote_command" < backend/scripts/enrollment_rectification_f2_3_schoolwide_identity.py > "$raw" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "F2_3_SCHOOLWIDE_REMOTE_EXIT=$rc"; rm -f "$raw"; exit "$rc"; fi
          prefix='ENROLLMENT_RECTIFICATION_F2_3_SCHOOLWIDE_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/schoolwide.json
          python -m json.tool evidence/schoolwide.json >/dev/null
          rm -f "$raw"
      - name: Validate fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/schoolwide.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'ENROLLMENT_RECTIFICATION_F2_3_SCHOOLWIDE_IDENTITY_V1': raise SystemExit('F2_3_SCHOOLWIDE_SCHEMA_INVALID')
          if p.get('status') not in {'FOUND','BLOCKED'}: raise SystemExit('F2_3_SCHOOLWIDE_STATUS_INVALID')
          for k in ('database_mutation','production_writes','prepare_execution_called','execute_called','rollback_called','feature_flag_modified','student_pii_emitted','technical_ids_emitted'):
              if p.get(k) is not False: raise SystemExit(f'F2_3_SCHOOLWIDE_BOUNDARY:{k}')
          if p.get('execution_flag_enabled') is True: raise SystemExit('F2_3_SCHOOLWIDE_FLAG_ENABLED')
          print('F2_3_SCHOOLWIDE_BOUNDARY=PASS')
          print('STATUS='+p['status'])
          PY
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrollment-rectification-f2-3-schoolwide-${{ github.run_id }}
          path: evidence/schoolwide.json
          if-no-files-found: error
          retention-days: 90
      - name: Comment sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PROD_SHA: ${{ steps.context.outputs.expected_production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/schoolwide.json').read_text(encoding='utf-8'))
          keys=('status','reason','scope','candidate_count','name_exact_count','name_one_edit_count','dob_exact_count','cpf_exact_count','identity_match_count','identity_resolution_method','current_active_classes','active_enrollment_count','projection_class_name','declared_source_active','declared_destination_active','school_matches_target','unique_method_count','unique_method_agreement','execution_flag_enabled')
          summary={k:p.get(k) for k in keys if k in p}
          body='## F2.3 — localização escolar da identidade (read-only)\n\n'+f"Main audit SHA: `{os.environ['TARGET_SHA']}`\n\nProduction SHA: `{os.environ['PROD_SHA']}`\n\n"+'```json\n'+json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n```\n\n**Boundary:** somente leitura; PII/IDs técnicos não emitidos; nenhuma função acadêmica de escrita chamada.'
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f2-3-schoolwide'}
          repo=os.environ['GITHUB_REPOSITORY']
          def req(method,path,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers,data=data,method=method)
              with urllib.request.urlopen(request,timeout=30) as r: return json.load(r)
          issue=os.environ['GATE_ISSUE']
          req('POST',f'/issues/{issue}/comments',{'body':body})
          req('PATCH',f'/issues/{issue}',{'state':'closed','state_reason':'completed'})
          PY
