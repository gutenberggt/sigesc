name: "Issue 480 Canonical Diary Evidence Policy"

on:
  pull_request:
    paths:
      - 'backend/services/diary_canonical_evidence_policy.py'
      - 'backend/tests/test_diary_canonical_evidence_policy.py'
      - '.github/workflows/issue-480-canonical-diary-policy.yml'
      - 'memory/audit/ISSUE_480_CANONICAL_DIARY_REMEDIATION_PLAN_2026-09-06.md'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile policy
        run: python -m py_compile backend/services/diary_canonical_evidence_policy.py backend/tests/test_diary_canonical_evidence_policy.py
      - name: Run canonical diary evidence tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q --noconftest backend/tests/test_diary_canonical_evidence_policy.py
      - name: Enforce pure read-policy boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('backend/services/diary_canonical_evidence_policy.py')
          source = p.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden = {
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in forbidden:
                      hits.append(node.func.attr)
          if hits:
              raise SystemExit('ISSUE_480_POLICY_MUTATOR:' + ','.join(sorted(set(hits))))
          if 'teacher_id' not in source:
              raise SystemExit('ISSUE_480_AUTHORSHIP_CONTRACT_MISSING')
          print('ISSUE_480_CANONICAL_DIARY_POLICY_BOUNDARY=PASS')
          PY
