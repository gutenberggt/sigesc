name: "Issue 480 Canonical Diary Evidence Policy"

on:
  pull_request:
    paths:
      - 'backend/services/diary_canonical_evidence_policy.py'
      - 'backend/services/content_institutional_visibility_policy.py'
      - 'backend/routers/content_institutional_history_scope.py'
      - 'backend/routers/attendance_session_history_scope.py'
      - 'backend/routers/calendar_diary_state_canonical.py'
      - 'backend/routers/attendance_pdf_dvd_parity.py'
      - 'backend/tests/test_diary_canonical_evidence_policy.py'
      - 'backend/tests/test_content_institutional_history_scope_issue480.py'
      - 'backend/tests/test_attendance_session_history_scope_issue480.py'
      - 'backend/tests/test_calendar_diary_state_canonical_issue480.py'
      - '.github/workflows/issue-480-canonical-diary-policy.yml'
      - 'memory/audit/ISSUE_480_CANONICAL_DIARY_REMEDIATION_PLAN_2026-09-06.md'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi
      - name: Compile Issue 480 read policy
        run: |
          python -m py_compile \
            backend/services/diary_canonical_evidence_policy.py \
            backend/services/content_institutional_visibility_policy.py \
            backend/routers/content_institutional_history_scope.py \
            backend/routers/attendance_session_history_scope.py \
            backend/routers/calendar_diary_state_canonical.py \
            backend/routers/attendance_pdf_dvd_parity.py \
            backend/tests/test_diary_canonical_evidence_policy.py \
            backend/tests/test_content_institutional_history_scope_issue480.py \
            backend/tests/test_attendance_session_history_scope_issue480.py \
            backend/tests/test_calendar_diary_state_canonical_issue480.py
      - name: Run Issue 480 focused tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q --noconftest \
            backend/tests/test_diary_canonical_evidence_policy.py \
            backend/tests/test_content_institutional_history_scope_issue480.py \
            backend/tests/test_attendance_session_history_scope_issue480.py \
            backend/tests/test_calendar_diary_state_canonical_issue480.py
      - name: Enforce read-policy boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path('backend/services/diary_canonical_evidence_policy.py'),
              Path('backend/routers/content_institutional_history_scope.py'),
              Path('backend/routers/calendar_diary_state_canonical.py'),
          ]
          forbidden = {
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits=[]
          for path in paths:
              source=path.read_text(encoding='utf-8')
              tree=ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in forbidden:
                          hits.append(f'{path}:{node.func.attr}')
          if hits:
              raise SystemExit('ISSUE_480_READ_POLICY_MUTATOR:' + ','.join(hits))

          policy=Path('backend/services/diary_canonical_evidence_policy.py').read_text(encoding='utf-8')
          attendance=Path('backend/routers/attendance_session_history_scope.py').read_text(encoding='utf-8')
          content=Path('backend/routers/content_institutional_history_scope.py').read_text(encoding='utf-8')
          calendar=Path('backend/routers/calendar_diary_state_canonical.py').read_text(encoding='utf-8')
          for marker in (
              'teacher_id',
              'shadowed_legacy_attendance_ids',
              'HISTORICAL_ATTENDANCE_READ_ONLY',
              'authorship_is_visibility_key',
              'canonical_evidence_policy',
          ):
              if marker not in policy + attendance + content + calendar:
                  raise SystemExit('ISSUE_480_CONTRACT_MARKER_MISSING:' + marker)
          print('ISSUE_480_CANONICAL_DIARY_POLICY_BOUNDARY=PASS')
          PY
