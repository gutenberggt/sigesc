name: "Luiz Gomes F6.3c Retained Backup Forensics"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_f6_3c_backup_probe.js'
      - 'backend/scripts/luiz_gomes_f6_3c_retained_backup_runner.sh'
      - 'backend/tests/test_luiz_gomes_f6_3c_backup_forensics_contract.py'
      - '.github/workflows/luiz-gomes-f6-3c-retained-backup-forensics.yml'
      - 'memory/audit/LUIZ_GOMES_F6_3C_RETAINED_BACKUP_FORENSICS_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-f6-3c-retained-backup-forensics
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Luiz Gomes F6.3c retained backup forensics
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Syntax and focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/luiz_gomes_f6_3c_backup_probe.js
          bash -n backend/scripts/luiz_gomes_f6_3c_retained_backup_runner.sh
          python -m pip install --disable-pip-version-check pytest
          pytest -q --noconftest backend/tests/test_luiz_gomes_f6_3c_backup_forensics_contract.py

      - name: Enforce isolated-restore boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/luiz-gomes-f6-3c-retained-backup-forensics.yml').read_text(encoding='utf-8')
          runner=Path('backend/scripts/luiz_gomes_f6_3c_retained_backup_runner.sh').read_text(encoding='utf-8')
          js=Path('backend/scripts/luiz_gomes_f6_3c_backup_probe.js').read_text(encoding='utf-8')
          required_runner=(
              '--network none',
              'dst=/backup,readonly',
              'dst=/forensic/probe.js,readonly',
              "stat -Lc '%d:%i'",
              'gzip -t',
              'sha256sum',
              'PRODUCTION_DATABASE_TOUCHED=NO',
              'TEMP_RESTORE_NETWORK=none',
              'TEMP_RESTORE_PORTS=none',
              '--nsInclude=sigesc.learning_objects',
              '--nsInclude=sigesc.content_entries',
              '--nsInclude=sigesc.audit_logs',
          )
          for marker in required_runner:
              if marker not in runner:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_REQUIRED_MARKER_MISSING:{marker}')
          for banned in (
              '--nsInclude=sigesc.students',
              '--nsInclude=sigesc.enrollments',
              '--nsInclude=sigesc.attendance',
              '--nsInclude=sigesc.grades',
          ):
              if banned in runner:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_FORBIDDEN_NAMESPACE:{banned}')
          for banned in ('content: 1','methodology: 1','observations: 1','resources: 1','records: 1','student_id: 1'):
              if banned in js:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_SENSITIVE_PROJECTION:{banned}')
          for marker in (
              'TARGET_SHA', 'EXPECTED_PRODUCTION_SHA',
              'RESTORE_RETAINED_BACKUPS_IN_ISOLATED_TEMP_MONGO',
              'BACKUP_FORENSICS_PROBE_ERROR',
          ):
              if marker not in wf:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_WORKFLOW_MARKER_MISSING:{marker}')
          print('LUIZ_GOMES_F6_3C_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Scan all retained Mongo backups for Luiz historical Math in isolation
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-F6.3C-BACKUP-FORENSICS] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_F6_3C_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.split('=',1)
              key=key.strip(); value=value.strip()
              if key in values:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={
              'LUIZ_GOMES_F6_3C_BACKUP_FORENSICS':'AUTHORIZED',
              'CONFIRMATION':'RESTORE_RETAINED_BACKUPS_IN_ISOLATED_TEMP_MONGO',
              'ACADEMIC_YEAR':'2026',
              'TRACKING_ISSUE':'357',
          }
          for key,value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'LUIZ_GOMES_F6_3C_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA','')
          prod=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod):
              raise SystemExit('LUIZ_GOMES_F6_3C_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-F6.3C-BACKUP-FORENSICS] {target}':
              raise SystemExit('LUIZ_GOMES_F6_3C_TITLE_MISMATCH')
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-luiz-gomes-f6-3c',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          repo=os.environ['GITHUB_REPOSITORY']
          main_sha=get_json(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          prod_sha=get_json(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'LUIZ_GOMES_F6_3C_MAIN_MOVED:{main_sha}')
          if prod_sha != prod:
              raise SystemExit(f'LUIZ_GOMES_F6_3C_PRODUCTION_MOVED:{prod_sha}')
          if get_json(f'https://api.github.com/repos/{repo}/issues/357').get('state') != 'open':
              raise SystemExit('LUIZ_GOMES_F6_3C_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'production_sha={prod_sha}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_F6_3C_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare SSH and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "LUIZ_GOMES_F6_3C_SECRET_MISSING:$v"; exit 1; }
          done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/luiz_gomes_f6_3c_key
          chmod 600 ~/.ssh/luiz_gomes_f6_3c_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage metadata-only probe on host
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          remote_probe="/tmp/luiz-gomes-f6-3c-${GITHUB_RUN_ID}.js"
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_3c_key")
          cat backend/scripts/luiz_gomes_f6_3c_backup_probe.js | ssh "${ssh_opts[@]}" \
            "${PROD_USER}@${PROD_HOST}" "umask 077; cat > '$remote_probe'"
          echo "remote_probe=$remote_probe" >> "$GITHUB_OUTPUT"

      - name: Validate and scan every physically unique retained backup
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/f6-3c-sanitized.log'
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_3c_key")
          set +e
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" bash -s -- \
            "$MONGO_CONTAINER" "$GITHUB_RUN_ID" "${{ steps.stage.outputs.remote_probe }}" \
            < backend/scripts/luiz_gomes_f6_3c_retained_backup_runner.sh > "$raw" 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "LUIZ_GOMES_F6_3C_REMOTE_SCAN_RC=$rc"

      - name: Cleanup staged probe on host
        if: always() && steps.context.outcome == 'success' && steps.stage.outputs.remote_probe != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_3c_key")
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" \
            "rm -f '${{ steps.stage.outputs.remote_probe }}'" >/dev/null 2>&1

      - name: Build structured forensic result
        if: always() && steps.context.outcome == 'success'
        env:
          SCAN_RC: ${{ steps.scan.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          raw=Path('evidence/f6-3c-sanitized.log')
          lines=raw.read_text(encoding='utf-8',errors='replace').splitlines() if raw.exists() else []
          try:
              scan_rc=int(os.environ.get('SCAN_RC') or '999')
          except ValueError:
              scan_rc=999

          inventory=None
          metas=[]
          points=[]
          pending_meta=None
          flags={}
          safe_markers=[]
          marker_re=re.compile(r'^F63C_[A-Z0-9_]+(?::[A-Za-z0-9+_.-]+)?(?:=[A-Za-z0-9+_.:-]+)?$')
          for line in lines:
              if marker_re.fullmatch(line):
                  safe_markers.append(line)
              if line.startswith('F63C_INVENTORY_COUNT='):
                  try: inventory=int(line.split('=',1)[1])
                  except ValueError: pass
              elif line.startswith('F63C_POINT_META_JSON='):
                  pending_meta=json.loads(line.split('=',1)[1])
              elif line.startswith('LUIZ_GOMES_F6_3C_POINT_JSON='):
                  if pending_meta is None:
                      safe_markers.append('F63C_POINT_WITHOUT_META')
                      continue
                  point=json.loads(line.split('=',1)[1])
                  points.append({'backup':pending_meta,'probe':point})
                  pending_meta=None
              elif '=' in line and line.split('=',1)[0] in {
                  'PRODUCTION_DATABASE_TOUCHED','TEMP_RESTORE_NETWORK','TEMP_RESTORE_PORTS',
                  'BACKUP_MOUNT','TEMP_CONTAINERS_CLEANED'
              }:
                  key,value=line.split('=',1)
                  flags[key]=value

          complete=(
              scan_rc == 0 and inventory is not None and inventory > 0 and
              inventory == len(points) and pending_meta is None and
              flags.get('PRODUCTION_DATABASE_TOUCHED') == 'NO' and
              flags.get('TEMP_RESTORE_NETWORK') == 'none' and
              flags.get('TEMP_RESTORE_PORTS') == 'none' and
              flags.get('BACKUP_MOUNT') == 'read_only' and
              flags.get('TEMP_CONTAINERS_CLEANED') == 'YES'
          )

          classifications=[]
          for point in points:
              for target in (point.get('probe') or {}).get('targets') or []:
                  classifications.append(target.get('classification'))

          if not complete:
              status='INCONCLUSIVE'
              classification='BACKUP_FORENSICS_PROBE_ERROR'
          else:
              status='COMPLETED'
              if 'RECOVERABLE_LUIZ_MATH_CONTENT_CONFIRMED' in classifications:
                  classification='HISTORICAL_BACKUP_RECOVERY_SOURCE_CONFIRMED'
              elif 'LUIZ_MATH_ROWS_PRESENT_WITHOUT_PAYLOAD' in classifications:
                  classification='HISTORICAL_BACKUP_LUIZ_MATH_ROWS_WITHOUT_PAYLOAD'
              elif 'LUIZ_TARGET_ROWS_PRESENT_UNDER_NONMATH_COMPONENT' in classifications:
                  classification='HISTORICAL_BACKUP_LUIZ_NONMATH_ROWS_PRESENT'
              elif 'UNATTRIBUTED_MATH_CONTENT_CANDIDATES_PRESENT' in classifications:
                  classification='HISTORICAL_BACKUP_UNATTRIBUTED_MATH_CONTENT_CANDIDATES'
              elif 'UNATTRIBUTED_MATH_ROWS_WITHOUT_PAYLOAD' in classifications:
                  classification='HISTORICAL_BACKUP_UNATTRIBUTED_MATH_ROWS_WITHOUT_PAYLOAD'
              else:
                  classification='NO_RECOVERABLE_LUIZ_MATH_IN_ALL_RETAINED_BACKUPS'

          result={
              'schema':'LUIZ_GOMES_F6_3C_RETAINED_BACKUP_FORENSICS_V2',
              'status':status,
              'classification':classification,
              'inventory_physically_unique':inventory,
              'unique_retained_backups_scanned':len(points),
              'oldest_backup_date':points[0]['backup']['backup_date'] if points else None,
              'newest_backup_date':points[-1]['backup']['backup_date'] if points else None,
              'points':points,
              'operational_markers':safe_markers[-20:] if safe_markers else ([] if complete else ['F63C_SCAN_NOT_COMPLETED']),
              'production_database_touched':False if flags.get('PRODUCTION_DATABASE_TOUCHED') == 'NO' else None,
              'temporary_restore_network':flags.get('TEMP_RESTORE_NETWORK'),
              'temporary_restore_ports':flags.get('TEMP_RESTORE_PORTS'),
              'backup_mount':flags.get('BACKUP_MOUNT'),
              'temporary_containers_cleaned':True if flags.get('TEMP_CONTAINERS_CLEANED') == 'YES' else None,
              'production_writes':False,
              'temporary_forensic_restore':True,
              'pedagogical_plaintext_emitted':False,
              'pedagogical_payload_boolean_only':True,
              'attendance_records_read':False,
              'student_data_read':False,
              'technical_ids_emitted':False,
          }
          Path('evidence/runtime.json').write_text(
              json.dumps(result,ensure_ascii=False,sort_keys=True),encoding='utf-8'
          )
          if raw.exists():
              raw.unlink()
          PY

      - name: Validate taxonomy, isolation and evidence boundary
        if: always() && steps.context.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'LUIZ_GOMES_F6_3C_RETAINED_BACKUP_FORENSICS_V2':
              raise SystemExit('F63C_SCHEMA_INVALID')
          if p.get('production_writes') is not False:
              raise SystemExit('F63C_PRODUCTION_WRITES')
          for key in ('pedagogical_plaintext_emitted','attendance_records_read','student_data_read','technical_ids_emitted'):
              if p.get(key) is not False:
                  raise SystemExit(f'F63C_BOUNDARY:{key}')
          if p.get('pedagogical_payload_boolean_only') is not True:
              raise SystemExit('F63C_PAYLOAD_BOOLEAN_BOUNDARY')
          if p.get('status') == 'COMPLETED':
              if not p.get('unique_retained_backups_scanned'):
                  raise SystemExit('F63C_NO_POINTS')
              if p.get('inventory_physically_unique') != p.get('unique_retained_backups_scanned'):
                  raise SystemExit('F63C_INVENTORY_MISMATCH')
              if p.get('production_database_touched') is not False:
                  raise SystemExit('F63C_PRODUCTION_DB_TOUCHED')
              if p.get('temporary_restore_network') != 'none':
                  raise SystemExit('F63C_NETWORK_INVALID')
              if p.get('temporary_restore_ports') != 'none':
                  raise SystemExit('F63C_PORTS_INVALID')
              if p.get('backup_mount') != 'read_only':
                  raise SystemExit('F63C_BACKUP_MOUNT_INVALID')
              if p.get('temporary_containers_cleaned') is not True:
                  raise SystemExit('F63C_CLEANUP_INVALID')
          elif p.get('status') == 'INCONCLUSIVE':
              if p.get('classification') != 'BACKUP_FORENSICS_PROBE_ERROR':
                  raise SystemExit('F63C_INCONCLUSIVE_TAXONOMY_INVALID')
          else:
              raise SystemExit('F63C_STATUS_INVALID')
          for point in p.get('points') or []:
              probe=point.get('probe') or {}
              if probe.get('schema') != 'LUIZ_GOMES_F6_3C_BACKUP_POINT_METADATA_V2':
                  raise SystemExit('F63C_POINT_SCHEMA_INVALID')
              b=probe.get('boundaries') or {}
              for key in ('pedagogical_plaintext_emitted','attendance_records_read','student_data_read','technical_ids_emitted'):
                  if b.get(key) is not False:
                      raise SystemExit(f'F63C_POINT_BOUNDARY:{key}')
              if b.get('pedagogical_payload_boolean_only') is not True:
                  raise SystemExit('F63C_POINT_PAYLOAD_BOOLEAN_BOUNDARY')
          print('LUIZ_GOMES_F6_3C_FORENSICS=PASS')
          PY

      - name: Upload metadata-only forensic evidence
        if: always() && steps.context.outcome == 'success' && hashFiles('evidence/runtime.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luiz-gomes-f6-3c-backup-forensics-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment diagnosis and close gate
        if: always() && steps.context.outcome == 'success' && hashFiles('evidence/runtime.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PRODUCTION_SHA: ${{ steps.context.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          lines=[
              '## LUIZ-GOMES-F6.3c — forense dos backups retidos',
              '',
              f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Production observada: `{os.environ['PRODUCTION_SHA']}`",
              f"Status: **`{p.get('status')}`**",
              f"Classificação: **`{p.get('classification')}`**",
              f"Backups físicos únicos inventariados: **{p.get('inventory_physically_unique')}**",
              f"Backups examinados com probe: **{p.get('unique_retained_backups_scanned')}**",
              f"Janela examinada: **{p.get('oldest_backup_date')} → {p.get('newest_backup_date')}**",
              '',
          ]
          for point in p.get('points') or []:
              meta=point.get('backup') or {}
              probe=point.get('probe') or {}
              parts=[]
              for target in probe.get('targets') or []:
                  stores=target.get('stores') or []
                  lm=sum(int(s.get('luiz_math_payload_rows') or 0) for s in stores)
                  lr=sum(int(s.get('luiz_math_rows') or 0) for s in stores)
                  lo=sum(int(s.get('luiz_other_component_rows') or 0) for s in stores)
                  ua=sum(int(s.get('no_actor_math_payload_rows') or 0) for s in stores)
                  parts.append(
                      f"{target.get('class')}: {target.get('classification')} "
                      f"[Luiz+Mat+payload={lm}; Luiz+Mat-rows={lr}; Luiz-outro={lo}; Mat-sem-ator+payload={ua}]"
                  )
              lines.append(
                  f"- {meta.get('backup_date')} ({meta.get('tier')}, sha `{meta.get('sha_fingerprint')}`): "
                  + ' | '.join(parts)
              )
          if p.get('operational_markers'):
              lines += ['', 'Marcadores operacionais sanitizados: `' + ', '.join(p.get('operational_markers')) + '`']
          lines += [
              '',
              '**Boundary:** restore somente em Mongo temporário; `--network none`; zero portas; backup read-only; nenhuma escrita no Mongo de produção.',
              '**Dados excluídos:** estudantes, matrículas, frequência e notas não foram restaurados; nenhum texto pedagógico foi emitido. O probe calcula apenas presença booleana de payload.',
          ]
          body='\n'.join(lines)
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-luiz-gomes-f6-3c-finalizer',
              'Content-Type':'application/json',
          }
          repo=os.environ['GITHUB_REPOSITORY']
          def request(url,method,payload):
              req=urllib.request.Request(
                  url,data=json.dumps(payload).encode('utf-8'),headers=headers,method=method
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          request(f'https://api.github.com/repos/{repo}/issues/357/comments','POST',{'body':body})
          request(f'https://api.github.com/repos/{repo}/issues/{os.environ["GATE_ISSUE"]}/comments','POST',{'body':body})
          request(
              f'https://api.github.com/repos/{repo}/issues/{os.environ["GATE_ISSUE"]}',
              'PATCH',{'state':'closed','state_reason':'completed'}
          )
          print('LUIZ_GOMES_F6_3C_FINALIZER=PASS')
          PY
