name: "Luiz Gomes F6.3d.2 Historical Actor Inference"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh'
      - 'backend/tests/test_luiz_gomes_f6_3d_1_bson_dump_contract.py'
      - '.github/workflows/luiz-gomes-f6-3d-1-1-probe-localization.yml'
      - 'memory/audit/LUIZ_GOMES_F6_3D_1_1_PROBE_ERROR_LOCALIZATION_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-f6-3d-2-historical-actor
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Luiz Gomes F6.3d.2 historical actor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax and focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh
          python -m pip install --disable-pip-version-check pytest
          pytest -q --noconftest backend/tests/test_luiz_gomes_f6_3d_1_bson_dump_contract.py
      - name: Validate embedded F6.3d.2 probe syntax and boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          wf=Path('.github/workflows/luiz-gomes-f6-3d-1-1-probe-localization.yml').read_text(encoding='utf-8')
          runner=Path('backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh').read_text(encoding='utf-8')
          m=re.search(r"cat > \"\$probe_local\" <<'F63D2JS'\n(.*?)\nF63D2JS",wf,re.S)
          if not m: raise SystemExit('F63D2_EMBEDDED_PROBE_NOT_FOUND')
          probe=m.group(1)
          Path('/tmp/f63d2-probe.js').write_text(probe,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/f63d2-probe.js'],check=True)
          for marker in ('6º ANO A','6º ANO B','7º ANO A','7º ANO B','8º ANO A','9º ANO A',
                         'TEACHER_ASSIGNMENTS_EXACT_CONTROL_UNANIMOUS','LEARNING_OBJECT_METADATA_FOUR_CLASS_DOMINANT',
                         'actor_identity_derived_without_user_lookup: true','technical_ids_emitted: false'):
              if marker not in probe: raise SystemExit(f'F63D2_PROBE_MARKER_MISSING:{marker}')
          for banned in ('d.users','getCollection("users")','student_id: 1','records: 1'):
              if banned in probe: raise SystemExit(f'F63D2_FORBIDDEN_PROBE_LOOKUP:{banned}')
          for marker in ('--network none','dst=/dump,readonly','PRODUCTION_DATABASE_TOUCHED=NO','RAW_PROBE_OUTPUT_EMITTED=NO'):
              if marker not in runner: raise SystemExit(f'F63D2_RUNNER_BOUNDARY_MISSING:{marker}')
          for marker in ('[LUIZ-GOMES-F6.3D.2-ACTOR] ','INFER_20260818_LUIZ_ACTOR_FROM_CONTROL_CLASSES','TARGET_SHA','EXPECTED_PRODUCTION_SHA'):
              if marker not in wf: raise SystemExit(f'F63D2_WORKFLOW_MARKER_MISSING:{marker}')
          print('LUIZ_GOMES_F6_3D_2_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Infer Luiz historical actor from 6A-7B and inspect 8A-9A
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-F6.3D.2-ACTOR] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_F6_3D_2_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={'LUIZ_GOMES_F6_3D_2_HISTORICAL_ACTOR':'AUTHORIZED',
                    'CONFIRMATION':'INFER_20260818_LUIZ_ACTOR_FROM_CONTROL_CLASSES',
                    'ACADEMIC_YEAR':'2026','TRACKING_ISSUE':'357'}
          for key,value in expected.items():
              if values.get(key)!=value: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA',''); prod=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod): raise SystemExit('LUIZ_GOMES_F6_3D_2_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-F6.3D.2-ACTOR] {target}': raise SystemExit('LUIZ_GOMES_F6_3D_2_TITLE_MISMATCH')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f63d2'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          repo=os.environ['GITHUB_REPOSITORY']
          main=get(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          production=get(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if main!=target: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_MAIN_MOVED:{main}')
          if production!=prod: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_PRODUCTION_MOVED:{production}')
          if get(f'https://api.github.com/repos/{repo}/issues/357').get('state')!='open': raise SystemExit('LUIZ_GOMES_F6_3D_2_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={production}\ngate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_F6_3D_2_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare SSH and embedded metadata-only probe
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do test -n "${!v}" || { echo "F63D2_SECRET_MISSING:$v"; exit 1; }; done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/f63d2_key; chmod 600 ~/.ssh/f63d2_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          probe_local="evidence/f63d2-probe.js"
          cat > "$probe_local" <<'F63D2JS'
(() => {
  const d=db.getSiblingDB("sigesc");
  const PREFIX="LUIZ_GOMES_F6_3C_POINT_JSON=";
  const SCHOOL="E M E I E F Jose Pereira Barbosa";
  const CONTROLS=["6º ANO A","6º ANO B","7º ANO A","7º ANO B"];
  const TARGETS=["8º ANO A","9º ANO A"];
  const START="2026-02-01",END="2026-05-01";
  const ACTOR_FIELDS=["recorded_by","created_by","updated_by","teacher_id","staff_id"];
  const sid=v=>v===null||v===undefined?"":String(v).trim();
  const norm=v=>sid(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("pt-BR").replace(/º/g,"o").replace(/ª/g,"a").replace(/\s+/g," ").trim();
  const exists=n=>d.getCollectionNames().includes(n);
  const months=rows=>{const o={"02":0,"03":0,"04":0};for(const r of rows){const m=sid(r.date).slice(5,7);if(m in o)o[m]++;}return o;};
  const dates=rows=>[...new Set(rows.map(r=>sid(r.date).slice(0,10)).filter(Boolean))].sort();
  const emit=(status,classification,extra)=>print(PREFIX+JSON.stringify(Object.assign({schema:"LUIZ_GOMES_F6_3D_2_HISTORICAL_ACTOR_V1",status,overall_classification:classification,source_date:"2026-08-18",school:SCHOOL,period:{from:START,to_exclusive:END},boundaries:{actor_identity_derived_without_user_lookup:true,technical_ids_emitted:false,pedagogical_plaintext_emitted:false,pedagogical_payload_boolean_only:true,attendance_records_read:false,student_data_read:false,production_writes:false}},extra||{})));
  const missing=["schools","classes","courses","learning_objects"].filter(n=>!exists(n));
  if(missing.length){emit("INCONCLUSIVE","REQUIRED_COLLECTION_MISSING",{context:{missing_count:missing.length}});return;}
  const schools=d.schools.find({name:SCHOOL},{_id:0,id:1,name:1}).toArray().filter(r=>norm(r.name)===norm(SCHOOL));
  if(schools.length!==1||!sid((schools[0]||{}).id)){emit("INCONCLUSIVE","SCHOOL_CONTEXT_NOT_UNIQUE",{context:{school_matches:schools.length}});return;}
  const schoolId=sid(schools[0].id);
  const allClasses=d.classes.find({school_id:schoolId},{_id:0,id:1,name:1,academic_year:1}).toArray(),classByName={};
  for(const name of [...CONTROLS,...TARGETS]){const ms=allClasses.filter(r=>norm(r.name)===norm(name)&&(!sid(r.academic_year)||sid(r.academic_year)==="2026"));if(ms.length!==1||!sid(ms[0].id)){emit("INCONCLUSIVE","CLASS_CONTEXT_NOT_UNIQUE",{context:{class:name,matches:ms.length}});return;}classByName[name]=sid(ms[0].id);}
  const courses=d.courses.find({},{_id:0,id:1,name:1}).toArray(),mathIds=new Set(courses.filter(r=>norm(r.name)===norm("Matemática")).map(r=>sid(r.id)).filter(Boolean)),courseName={};
  for(const r of courses){if(sid(r.id))courseName[sid(r.id)]=sid(r.name)||"<unresolved>";}if(!mathIds.size){emit("INCONCLUSIVE","MATH_COURSE_IDENTITY_NOT_FOUND",{context:{math_identity_count:0}});return;}
  const staffById=new Map(),staffIdsByUser=new Map();if(exists("staff")){for(const r of d.staff.find({},{_id:0,id:1,user_id:1}).toArray()){const s=sid(r.id),u=sid(r.user_id);if(s)staffById.set(s,r);if(s&&u){if(!staffIdsByUser.has(u))staffIdsByUser.set(u,new Set());staffIdsByUser.get(u).add(s);}}}
  const assignments=exists("teacher_assignments")?d.teacher_assignments.find({},{_id:0,id:1,staff_id:1,class_id:1,course_id:1,academic_year:1,status:1}).toArray():[],assignmentStaff=new Map();for(const r of assignments){if(sid(r.id)&&sid(r.staff_id))assignmentStaff.set(sid(r.id),sid(r.staff_id));}
  const cid=r=>sid(r.course_id||r.component_id);
  const load=(classId,mathOnly)=>{const q={class_id:classId,date:{$gte:START,$lt:END}};if(mathOnly)q.$or=[{course_id:{$in:[...mathIds]}},{component_id:{$in:[...mathIds]}}];return d.learning_objects.aggregate([{$match:q},{$project:{_id:0,date:1,course_id:1,component_id:1,recorded_by:1,created_by:1,updated_by:1,teacher_id:1,staff_id:1,assignment_id:1,payload_present:{$or:[{$ne:[{$ifNull:["$content",""]},""]},{$ne:[{$ifNull:["$methodology",""]},""]},{$ne:[{$ifNull:["$observations",""]},""]}]}}}]).toArray();};
  const principalRaw=v=>{const x=sid(v);if(!x)return"";if(staffById.has(x))return`staff:${x}`;const ss=staffIdsByUser.get(x);if(ss&&ss.size===1)return`staff:${[...ss][0]}`;return`raw:${x}`;};
  const principals=r=>{const o=new Set();for(const f of ACTOR_FIELDS){const p=principalRaw(r[f]);if(p)o.add(p);}const a=sid(r.assignment_id);if(a)o.add(assignmentStaff.has(a)?`staff:${assignmentStaff.get(a)}`:`assignment:${a}`);return o;};
  const eligible=(r,classId,courseIds)=>{const y=sid(r.academic_year),st=norm(r.status);return sid(r.class_id)===classId&&courseIds.has(sid(r.course_id))&&(!y||y==="2026")&&!["inativo","inactive","cancelado","revogado"].includes(st);};
  const controls=[],controlRows=[],staffSets=[];
  for(const name of CONTROLS){const classId=classByName[name],rows=load(classId,true),payload=rows.filter(r=>r.payload_present===true);if(!payload.length){emit("INCONCLUSIVE","CONTROL_MATH_EVIDENCE_MISSING",{controls:[...controls,{class:name,math_rows:rows.length,math_payload_rows:0}]});return;}const present=new Set(rows.map(cid).filter(x=>mathIds.has(x))),ss=new Set(assignments.filter(r=>eligible(r,classId,present)).map(r=>sid(r.staff_id)).filter(Boolean));staffSets.push(ss);controls.push({class:name,math_rows:rows.length,math_payload_rows:payload.length,months:months(payload),dates:dates(payload),assignment_staff_candidates:ss.size});for(const r of rows)controlRows.push({className:name,row:r});}
  let inferred="",source="";if(staffSets.every(s=>s.size===1)){const vals=new Set(staffSets.map(s=>[...s][0]));if(vals.size===1){inferred=`staff:${[...vals][0]}`;source="TEACHER_ASSIGNMENTS_EXACT_CONTROL_UNANIMOUS";}}
  let meta=[];if(!inferred){const stats=new Map();for(const it of controlRows){for(const p of principals(it.row)){if(!stats.has(p))stats.set(p,{rows:0,payload:0,classes:new Set(),kind:p.split(":",1)[0]});const s=stats.get(p);s.rows++;if(it.row.payload_present===true)s.payload++;s.classes.add(it.className);}}meta=[...stats.entries()].map(([p,s])=>({principal:p,rows:s.rows,payload_rows:s.payload,class_support:s.classes.size,kind:s.kind,coverage:controlRows.length?s.rows/controlRows.length:0})).filter(x=>x.class_support===CONTROLS.length).sort((a,b)=>b.coverage-a.coverage||b.payload_rows-a.payload_rows||b.rows-a.rows);if(meta.length){const a=meta[0],b=meta[1],tie=b&&Math.abs(a.coverage-b.coverage)<1e-9&&a.payload_rows===b.payload_rows;if(!tie&&a.coverage>=0.80){inferred=a.principal;source="LEARNING_OBJECT_METADATA_FOUR_CLASS_DOMINANT";}}}
  if(!inferred){emit("INCONCLUSIVE","HISTORICAL_ACTOR_NOT_UNIQUELY_INFERRED",{controls,actor_inference:{status:"AMBIGUOUS_OR_INSUFFICIENT",assignment_unanimous:false,stable_metadata_candidate_count:meta.length,best_metadata_coverage_percent:meta.length?Math.round(meta[0].coverage*10000)/100:0}});return;}
  const inferredStaff=inferred.startsWith("staff:")?inferred.slice(6):"",topMeta=meta.find(x=>x.principal===inferred);
  const summarize=name=>{const classId=classByName[name],rows=load(classId,false),matching=rows.filter(r=>principals(r).has(inferred)),actorPayload=matching.filter(r=>r.payload_present===true),actorMath=matching.filter(r=>mathIds.has(cid(r))),actorMathPayload=actorMath.filter(r=>r.payload_present===true),otherPayload=actorPayload.filter(r=>!mathIds.has(cid(r))),unattrMath=rows.filter(r=>r.payload_present===true&&mathIds.has(cid(r))&&principals(r).size===0),bindings=inferredStaff?assignments.filter(r=>sid(r.staff_id)===inferredStaff&&sid(r.class_id)===classId&&mathIds.has(sid(r.course_id))&&(!sid(r.academic_year)||sid(r.academic_year)==="2026")&&!['inativo','inactive','cancelado','revogado'].includes(norm(r.status))):[],cc={};for(const r of matching){const n=courseName[cid(r)]||"<unresolved>";cc[n]=(cc[n]||0)+1;}let c="HISTORICAL_ACTOR_ABSENT_FROM_TARGET_20260818";if(actorMathPayload.length)c="RECOVERABLE_LUIZ_MATH_CONTENT_CONFIRMED";else if(otherPayload.length)c="LUIZ_HISTORICAL_ROWS_UNDER_NONMATH_COMPONENT";else if(matching.length)c="LUIZ_HISTORICAL_ROWS_PRESENT_WITHOUT_PAYLOAD";else if(unattrMath.length)c="TARGET_MATH_UNATTRIBUTED_CANDIDATES_PRESENT";else if(bindings.length)c="HISTORICAL_LUIZ_MATH_BINDING_PRESENT_CONTENT_ABSENT";return{class:name,classification:c,total_rows:rows.length,inferred_actor_rows:matching.length,inferred_actor_payload_rows:actorPayload.length,inferred_actor_math_rows:actorMath.length,inferred_actor_math_payload_rows:actorMathPayload.length,inferred_actor_math_payload_months:months(actorMathPayload),inferred_actor_math_payload_dates:dates(actorMathPayload),inferred_actor_nonmath_payload_rows:otherPayload.length,inferred_actor_nonmath_payload_dates:dates(otherPayload),unattributed_math_payload_rows:unattrMath.length,historical_math_assignment_matches:bindings.length,inferred_actor_course_name_counts:cc};};
  const targets=TARGETS.map(summarize),cs=targets.map(x=>x.classification);let overall="HISTORICAL_ACTOR_ABSENT_FROM_BOTH_TARGETS_20260818";if(cs.includes("RECOVERABLE_LUIZ_MATH_CONTENT_CONFIRMED"))overall="BSON_20260818_RECOVERY_SOURCE_CONFIRMED";else if(cs.includes("LUIZ_HISTORICAL_ROWS_UNDER_NONMATH_COMPONENT"))overall="BSON_20260818_LUIZ_ROWS_UNDER_NONMATH_COMPONENT";else if(cs.includes("LUIZ_HISTORICAL_ROWS_PRESENT_WITHOUT_PAYLOAD"))overall="BSON_20260818_LUIZ_ROWS_WITHOUT_PAYLOAD";else if(cs.includes("TARGET_MATH_UNATTRIBUTED_CANDIDATES_PRESENT"))overall="BSON_20260818_UNATTRIBUTED_MATH_CANDIDATES";else if(cs.includes("HISTORICAL_LUIZ_MATH_BINDING_PRESENT_CONTENT_ABSENT"))overall="BSON_20260818_BINDING_PRESENT_CONTENT_ABSENT";
  emit("COMPLETED",overall,{actor_inference:{status:"EXACT_CONTROL_DERIVED",source,principal_kind:inferred.split(":",1)[0],control_class_support:CONTROLS.length,metadata_coverage_percent:topMeta?Math.round(topMeta.coverage*10000)/100:null,technical_identity_emitted:false},controls,targets});
