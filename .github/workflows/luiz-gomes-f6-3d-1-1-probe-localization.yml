name: "Luiz Gomes F6.3d.2 Historical Actor Inference"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh'
      - 'backend/tests/test_luiz_gomes_f6_3d_1_bson_dump_contract.py'
      - '.github/workflows/luiz-gomes-f6-3d-1-1-probe-localization.yml'
      - 'memory/audit/LUIZ_GOMES_F6_3D_1_1_PROBE_ERROR_LOCALIZATION_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  F63D2_PROBE_B64: ""

concurrency:
  group: luiz-gomes-f6-3d-2-historical-actor
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Luiz Gomes F6.3d.2 historical actor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax and focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh
          python -m pip install --disable-pip-version-check pytest
          pytest -q --noconftest backend/tests/test_luiz_gomes_f6_3d_1_bson_dump_contract.py
      - name: Validate encoded F6.3d.2 probe syntax and boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          probe=base64.b64decode(os.environ['F63D2_PROBE_B64']).decode('utf-8')
          Path('/tmp/f63d2-probe.js').write_text(probe,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/f63d2-probe.js'],check=True)
          runner=Path('backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh').read_text(encoding='utf-8')
          wf=Path('.github/workflows/luiz-gomes-f6-3d-1-1-probe-localization.yml').read_text(encoding='utf-8')
          for marker in ('6º ANO A','6º ANO B','7º ANO A','7º ANO B','8º ANO A','9º ANO A','TEACHER_ASSIGNMENTS_EXACT_CONTROL_UNANIMOUS','LEARNING_OBJECT_METADATA_FOUR_CLASS_DOMINANT','actor_identity_derived_without_user_lookup:true','technical_ids_emitted:false'):
              if marker not in probe: raise SystemExit(f'F63D2_PROBE_MARKER_MISSING:{marker}')
          for banned in ('d.users','getCollection("users")','student_id:1','records:1'):
              if banned in probe: raise SystemExit(f'F63D2_FORBIDDEN_PROBE_LOOKUP:{banned}')
          for marker in ('--network none','dst=/dump,readonly','PRODUCTION_DATABASE_TOUCHED=NO','RAW_PROBE_OUTPUT_EMITTED=NO'):
              if marker not in runner: raise SystemExit(f'F63D2_RUNNER_BOUNDARY_MISSING:{marker}')
          for marker in ('[LUIZ-GOMES-F6.3D.2-ACTOR] ','INFER_20260818_LUIZ_ACTOR_FROM_CONTROL_CLASSES','TARGET_SHA','EXPECTED_PRODUCTION_SHA'):
              if marker not in wf: raise SystemExit(f'F63D2_WORKFLOW_MARKER_MISSING:{marker}')
          print('LUIZ_GOMES_F6_3D_2_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Infer Luiz historical actor from 6A-7B and inspect 8A-9A
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-F6.3D.2-ACTOR] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_F6_3D_2_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={'LUIZ_GOMES_F6_3D_2_HISTORICAL_ACTOR':'AUTHORIZED','CONFIRMATION':'INFER_20260818_LUIZ_ACTOR_FROM_CONTROL_CLASSES','ACADEMIC_YEAR':'2026','TRACKING_ISSUE':'357'}
          for key,value in expected.items():
              if values.get(key)!=value: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA',''); prod=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod): raise SystemExit('LUIZ_GOMES_F6_3D_2_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-F6.3D.2-ACTOR] {target}': raise SystemExit('LUIZ_GOMES_F6_3D_2_TITLE_MISMATCH')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f63d2'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          repo=os.environ['GITHUB_REPOSITORY']
          main=get(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']; production=get(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if main!=target: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_MAIN_MOVED:{main}')
          if production!=prod: raise SystemExit(f'LUIZ_GOMES_F6_3D_2_PRODUCTION_MOVED:{production}')
          if get(f'https://api.github.com/repos/{repo}/issues/357').get('state')!='open': raise SystemExit('LUIZ_GOMES_F6_3D_2_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f'target_sha={target}\nproduction_sha={production}\ngate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_F6_3D_2_CONTEXT=PASS')
          PY
      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare SSH and stage encoded probe
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do test -n "${!v}" || { echo "F63D2_SECRET_MISSING:$v"; exit 1; }; done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/f63d2_key; chmod 600 ~/.ssh/f63d2_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          probe_local="evidence/f63d2-probe.js"
          printf '%s' "$F63D2_PROBE_B64" | base64 -d > "$probe_local"
          node --check "$probe_local"
          remote_probe="/tmp/luiz-gomes-f6-3d2-${GITHUB_RUN_ID}.js"
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f63d2_key")
          cat "$probe_local" | ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" "umask 077; cat > '$remote_probe'"
          rm -f "$probe_local"
          echo "remote_probe=$remote_probe" >> "$GITHUB_OUTPUT"
      - name: Restore isolated 2026-08-18 dump and infer historical actor
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/f6-3d2-sanitized.log'
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f63d2_key")
          set +e
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" "$GITHUB_RUN_ID" "${{ steps.stage.outputs.remote_probe }}" < backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh > "$raw" 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "F63D2_REMOTE_SCAN_RC=$rc"
      - name: Cleanup staged probe on host
        if: always() && steps.context.outcome == 'success' && steps.stage.outputs.remote_probe != ''
        continue-on-error: true
        shell: bash
        run: |
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/f63d2_key")
          ssh "${ssh_opts[@]}" "${PROD_USER}@${PROD_HOST}" "rm -f '${{ steps.stage.outputs.remote_probe }}'" >/dev/null 2>&1 || true
      - name: Build structured result
        if: always() && steps.context.outcome == 'success'
        env:
          SCAN_RC: ${{ steps.scan.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          raw=Path('evidence/f6-3d2-sanitized.log'); lines=raw.read_text(encoding='utf-8',errors='replace').splitlines() if raw.exists() else []
          try: rc=int(os.environ.get('SCAN_RC') or '999')
          except ValueError: rc=999
          meta=None; point=None; restored=[]; flags={}; markers=[]
          for line in lines:
              if line.startswith('F63D1_GROUP_META_JSON='): meta=json.loads(line.split('=',1)[1])
              elif line.startswith('LUIZ_GOMES_F6_3C_POINT_JSON='): point=json.loads(line.split('=',1)[1])
              elif line.startswith('F63D1_RESTORED_COLLECTION:'): restored.append(line.split(':',1)[1])
              elif '=' in line and line.split('=',1)[0] in {'PRODUCTION_DATABASE_TOUCHED','TEMP_RESTORE_NETWORK','TEMP_RESTORE_PORTS','SOURCE_MOUNT','TEMP_CONTAINERS_CLEANED','PEDAGOGICAL_PLAINTEXT_EMITTED','RAW_PROBE_OUTPUT_EMITTED'}: k,v=line.split('=',1); flags[k]=v
              elif re.fullmatch(r'F63D1(?:1)?_[A-Z0-9_]+(?::[A-Za-z0-9_.-]+)?(?:=[A-Za-z0-9_.:-]+)?',line): markers.append(line)
          boundary=flags.get('PRODUCTION_DATABASE_TOUCHED')=='NO' and flags.get('TEMP_RESTORE_NETWORK')=='none' and flags.get('TEMP_RESTORE_PORTS')=='none' and flags.get('SOURCE_MOUNT')=='read_only' and flags.get('TEMP_CONTAINERS_CLEANED')=='YES' and flags.get('PEDAGOGICAL_PLAINTEXT_EMITTED')=='NO' and flags.get('RAW_PROBE_OUTPUT_EMITTED')=='NO'
          valid=isinstance(point,dict) and point.get('schema')=='LUIZ_GOMES_F6_3D_2_HISTORICAL_ACTOR_V1'
          ok=rc==0 and meta is not None and valid and boundary
          result={'schema':'LUIZ_GOMES_F6_3D_2_GATE_V1','status':(point or {}).get('status') if ok else 'INCONCLUSIVE','classification':(point or {}).get('overall_classification') if ok else 'F63D2_RUNTIME_OR_BOUNDARY_ERROR','source':meta,'actor_inference':(point or {}).get('actor_inference'),'controls':(point or {}).get('controls') or [],'targets':(point or {}).get('targets') or [],'probe_boundaries':(point or {}).get('boundaries'),'restored_collections':restored,'operational_markers':markers[-20:],'production_database_touched':False if flags.get('PRODUCTION_DATABASE_TOUCHED')=='NO' else None,'temporary_restore_network':flags.get('TEMP_RESTORE_NETWORK'),'temporary_restore_ports':flags.get('TEMP_RESTORE_PORTS'),'source_mount':flags.get('SOURCE_MOUNT'),'temporary_containers_cleaned':True if flags.get('TEMP_CONTAINERS_CLEANED')=='YES' else None,'raw_probe_output_emitted':False if flags.get('RAW_PROBE_OUTPUT_EMITTED')=='NO' else None,'production_writes':False,'pedagogical_plaintext_emitted':False,'student_data_read':False,'attendance_records_read':False}
          Path('evidence/runtime.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          if raw.exists(): raw.unlink()
          PY
      - name: Validate taxonomy and isolation boundary
        if: always() && steps.context.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema')!='LUIZ_GOMES_F6_3D_2_GATE_V1': raise SystemExit('F63D2_SCHEMA_INVALID')
          if p.get('production_writes') is not False or p.get('pedagogical_plaintext_emitted') is not False or p.get('student_data_read') is not False or p.get('attendance_records_read') is not False: raise SystemExit('F63D2_DATA_BOUNDARY_INVALID')
          if {'students','enrollments','attendance','grades','attendance_documentary'}.intersection(set(p.get('restored_collections') or [])): raise SystemExit('F63D2_FORBIDDEN_RESTORE')
          if p.get('status')=='COMPLETED':
              inf=p.get('actor_inference') or {}; pb=p.get('probe_boundaries') or {}
              if inf.get('status')!='EXACT_CONTROL_DERIVED': raise SystemExit('F63D2_INFERENCE_NOT_EXACT')
              if pb.get('actor_identity_derived_without_user_lookup') is not True or pb.get('technical_ids_emitted') is not False: raise SystemExit('F63D2_IDENTITY_BOUNDARY_INVALID')
          elif p.get('status')!='INCONCLUSIVE': raise SystemExit('F63D2_STATUS_INVALID')
          if p.get('production_database_touched') is not False or p.get('temporary_restore_network')!='none' or p.get('temporary_restore_ports')!='none' or p.get('source_mount')!='read_only' or p.get('temporary_containers_cleaned') is not True or p.get('raw_probe_output_emitted') is not False: raise SystemExit('F63D2_ISOLATION_INVALID')
          print('LUIZ_GOMES_F6_3D_2_RESULT=PASS')
          PY
      - name: Upload F6.3d.2 evidence
        if: always() && steps.context.outcome == 'success' && hashFiles('evidence/runtime.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luiz-gomes-f6-3d2-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90
      - name: Comment diagnosis and close gate
        if: always() && steps.context.outcome == 'success' && hashFiles('evidence/runtime.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text()); s=p.get('source') or {}; inf=p.get('actor_inference') or {}
          lines=['## LUIZ-GOMES-F6.3d.2 — ator histórico pelas turmas-controle','',f"Status: **`{p.get('status')}`**",f"Classificação: **`{p.get('classification')}`**",f"Fonte: data={s.get('snapshot_date')}; fingerprint={s.get('group_fingerprint')}; BSON={s.get('bson_files')}; proveniência={s.get('provenance')}",f"Inferência: status={inf.get('status')}; fonte={inf.get('source')}; tipo={inf.get('principal_kind')}; suporte={inf.get('control_class_support')} turmas; cobertura-metadata={inf.get('metadata_coverage_percent')}",'','### Controles']
          for r in p.get('controls') or []: lines.append(f"- {r.get('class')}: math={r.get('math_rows')}, payload={r.get('math_payload_rows')}, assignment_candidates={r.get('assignment_staff_candidates')}")
          lines += ['', '### Alvos']
          for r in p.get('targets') or []: lines.append(f"- {r.get('class')}: **`{r.get('classification')}`**; actor_rows={r.get('inferred_actor_rows')}; math_payload={r.get('inferred_actor_math_payload_rows')}; nonmath_payload={r.get('inferred_actor_nonmath_payload_rows')}; binding_math={r.get('historical_math_assignment_matches')}; unattributed_math_payload={r.get('unattributed_math_payload_rows')}")
          lines += ['', '**Boundary:** identidade derivada sem lookup em `users`; nenhum ID técnico emitido; Mongo temporário `--network none`, zero portas, source read-only; produção não tocada; nenhum plaintext pedagógico, dado estudantil ou `attendance.records`.']
          body='\n'.join(lines); headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-f63d2-finalizer','Content-Type':'application/json'}; repo=os.environ['GITHUB_REPOSITORY']
          def req(url,method,payload):
              r=urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as resp: return json.load(resp)
          req(f'https://api.github.com/repos/{repo}/issues/357/comments','POST',{'body':body}); req(f'https://api.github.com/repos/{repo}/issues/{os.environ["GATE_ISSUE"]}/comments','POST',{'body':body}); req(f'https://api.github.com/repos/{repo}/issues/{os.environ["GATE_ISSUE"]}','PATCH',{'state':'closed','state_reason':'completed'}); print('LUIZ_GOMES_F6_3D_2_FINALIZER=PASS')
          PY
