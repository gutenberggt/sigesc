name: "Luiz Gomes F6.4 Math Without Teacher Filter Read-only"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_f6_4_math_without_teacher_filter_readonly.py'
      - 'backend/tests/test_luiz_gomes_f6_4_math_without_teacher_filter_readonly.py'
      - '.github/workflows/luiz-gomes-f6-4-math-without-teacher-filter-readonly.yml'
      - 'memory/audit/LUIZ_GOMES_F6_4_MATH_WITHOUT_TEACHER_FILTER_READONLY_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-f6-4-math-without-teacher-filter-readonly
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Luiz Gomes F6.4 no-teacher filter
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          python -m py_compile backend/scripts/luiz_gomes_f6_4_math_without_teacher_filter_readonly.py
          pytest -q --noconftest backend/tests/test_luiz_gomes_f6_4_math_without_teacher_filter_readonly.py
      - name: Enforce read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('backend/scripts/luiz_gomes_f6_4_math_without_teacher_filter_readonly.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          forbidden={
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  hits.append(node.func.attr)
          if hits:
              raise SystemExit(f'LUIZ_GOMES_F6_4_MONGO_MUTATOR:{sorted(set(hits))}')
          required=(
              'TARGET_CLASSES = ("8º ANO A", "9º ANO A")',
              'TARGET_COMPONENT = "Matemática"',
              'START_DATE = "2026-02-01"',
              'END_DATE = "2026-05-01"',
              'collection.find({"class_id": class_id}, ROW_PROJECTION)',
              '"selection_teacher_filter_used": False',
              '"pedagogical_plaintext_read": False',
              '"attendance_read": False',
              '"student_data_read": False',
              '"grades_read": False',
              '"technical_ids_emitted": False',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'LUIZ_GOMES_F6_4_MARKER_MISSING:{marker}')
          for banned in ('db.students', 'db.enrollments', 'db.grades', 'db.attendance'):
              if banned in source:
                  raise SystemExit(f'LUIZ_GOMES_F6_4_FORBIDDEN_COLLECTION:{banned}')
          print('LUIZ_GOMES_F6_4_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Search Math by class/date without teacher filter in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-F6.4-MATH-NO-TEACHER] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_F6_4_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'LUIZ_GOMES_F6_4_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={
              'LUIZ_GOMES_F6_4_MATH_NO_TEACHER':'AUTHORIZED',
              'CONFIRMATION':'SEARCH_MATH_BY_CLASS_DATE_WITHOUT_TEACHER_FILTER',
              'ACADEMIC_YEAR':'2026',
              'TRACKING_ISSUE':'357',
          }
          for key,value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'LUIZ_GOMES_F6_4_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA',''); prod=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod):
              raise SystemExit('LUIZ_GOMES_F6_4_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-F6.4-MATH-NO-TEACHER] {target}':
              raise SystemExit('LUIZ_GOMES_F6_4_TITLE_MISMATCH')
          headers={
              'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-luiz-gomes-f6-4',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          repo=os.environ['GITHUB_REPOSITORY']
          main_sha=get_json(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          prod_sha=get_json(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if main_sha != target: raise SystemExit(f'LUIZ_GOMES_F6_4_MAIN_MOVED:{main_sha}')
          if prod_sha != prod: raise SystemExit(f'LUIZ_GOMES_F6_4_PRODUCTION_MOVED:{prod_sha}')
          if get_json(f'https://api.github.com/repos/{repo}/issues/357').get('state') != 'open':
              raise SystemExit('LUIZ_GOMES_F6_4_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={prod_sha}\ngate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_F6_4_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare SSH and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "LUIZ_GOMES_F6_4_SECRET_MISSING:$v"; exit 1; }
          done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/luiz_gomes_f6_4_key
          chmod 600 ~/.ssh/luiz_gomes_f6_4_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({ ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_4_key" \
            "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute F6.4 Math no-teacher audit
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/luiz-gomes-f6-4-raw.log'
          remote_command="timeout 420 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"luiz_gomes_f6_4_math_without_teacher_filter_readonly.py\",\"exec\"),ns); print(\"LUIZ_GOMES_F6_4_JSON=\"+json.dumps(ns[\"run_live_audit\"](),ensure_ascii=False,sort_keys=True))'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_4_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/luiz_gomes_f6_4_math_without_teacher_filter_readonly.py > "$raw" 2>&1
          prefix='LUIZ_GOMES_F6_4_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"

      - name: Validate boundary and result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'LUIZ_GOMES_F6_4_MATH_WITHOUT_TEACHER_FILTER_READ_ONLY_V1':
              raise SystemExit('LUIZ_GOMES_F6_4_SCHEMA_INVALID')
          if p.get('selection_teacher_filter_used') is not False:
              raise SystemExit('LUIZ_GOMES_F6_4_TEACHER_FILTER_WAS_USED')
          if len(p.get('targets') or []) != 2:
              raise SystemExit('LUIZ_GOMES_F6_4_SCOPE_INVALID')
          for key in (
              'database_mutation','production_writes','pedagogical_plaintext_read',
              'pedagogical_plaintext_emitted','attendance_read','attendance_records_read',
              'student_data_read','grades_read','technical_ids_emitted',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'LUIZ_GOMES_F6_4_BOUNDARY:{key}')
          if p.get('mongo_reads_only') is not True:
              raise SystemExit('LUIZ_GOMES_F6_4_READ_ONLY_INVALID')
          print('LUIZ_GOMES_F6_4_AUDIT=PASS')
          PY

      - name: Upload metadata-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luiz-gomes-f6-4-math-no-teacher-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment diagnosis and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PRODUCTION_SHA: ${{ steps.context.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          lines=[
              '## LUIZ-GOMES-F6.4 — Matemática sem filtro docente', '',
              f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Production observada: `{os.environ['PRODUCTION_SHA']}`",
              'Seleção: **turma + período + todas as identidades de Matemática; professor NÃO usado como filtro**',
              f"Identidades Matemática no catálogo: **{p.get('math_catalog_identity_count')}**", '',
          ]
          for target in p.get('targets') or []:
              lines += [
                  f"### {target.get('class')} / Matemática",
                  f"- classificação: `{json.dumps(target.get('classification'),ensure_ascii=False)}`",
                  f"- learning_objects: `{json.dumps(target.get('learning_objects'),ensure_ascii=False,sort_keys=True)}`",
                  f"- content_entries: `{json.dumps(target.get('content_entries'),ensure_ascii=False,sort_keys=True)}`",
                  f"- componentes não resolvidos no período: `{json.dumps(target.get('unresolved_component_rows_in_period'),ensure_ascii=False,sort_keys=True)}`",
              ]
          lines += [
              '', f"Resumo: `{json.dumps((p.get('summary') or {}).get('classification_counts'),ensure_ascii=False,sort_keys=True)}`", '',
              '**Boundary:** Mongo read-only; sem conteúdo pedagógico, attendance, estudantes, matrículas ou notas; nenhum ID técnico emitido; nenhuma mutação.',
          ]
          body='\n'.join(lines)
          headers={
              'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-luiz-gomes-f6-4',
              'Content-Type':'application/json',
          }
          repo=os.environ['GITHUB_REPOSITORY']
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response) if response.status != 204 else None
          request('POST',f'https://api.github.com/repos/{repo}/issues/357/comments',{'body':body})
          request('POST',f"https://api.github.com/repos/{repo}/issues/{os.environ['GATE_ISSUE']}/comments",{'body':body})
          request('PATCH',f"https://api.github.com/repos/{repo}/issues/{os.environ['GATE_ISSUE']}",{'state':'closed','state_reason':'completed'})
          print('LUIZ_GOMES_F6_4_GATE_CLOSED=YES')
          PY
