name: "Luiz Gomes F6 Temporal Provenance Read-only"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_f6_temporal_provenance_readonly.py'
      - 'backend/tests/test_luiz_gomes_f6_temporal_provenance_readonly.py'
      - '.github/workflows/luiz-gomes-f6-temporal-provenance-readonly.yml'
      - 'memory/audit/LUIZ_GOMES_F6_TEMPORAL_PROVENANCE_READONLY_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-f6-temporal-provenance-readonly
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Luiz Gomes F6 temporal provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          python -m py_compile backend/scripts/luiz_gomes_f6_temporal_provenance_readonly.py
          pytest -q --noconftest backend/tests/test_luiz_gomes_f6_temporal_provenance_readonly.py
      - name: Enforce metadata-only read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('backend/scripts/luiz_gomes_f6_temporal_provenance_readonly.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          forbidden={
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  hits.append(node.func.attr)
          if hits:
              raise SystemExit(f'LUIZ_GOMES_F6_MONGO_MUTATOR:{sorted(set(hits))}')
          required=(
              'TARGET_CLASSES = ("8º ANO A", "9º ANO A")',
              'START_DATE = "2026-02-01"',
              'END_DATE = "2026-05-01"',
              '"pedagogical_text_read": False',
              '"attendance_records_read": False',
              '"technical_ids_emitted": False',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'LUIZ_GOMES_F6_MARKER_MISSING:{marker}')
          print('LUIZ_GOMES_F6_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Audit Luiz historical content provenance in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-F6-TEMPORAL] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_F6_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw: continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'LUIZ_GOMES_F6_DUPLICATE_FIELD:{key}')
              values[key]=value
          if values.get('LUIZ_GOMES_F6_TEMPORAL') != 'AUTHORIZED':
              raise SystemExit('LUIZ_GOMES_F6_AUTH_INVALID')
          if values.get('CONFIRMATION') != 'AUDIT_HISTORICAL_CONTENT_PROVENANCE_READ_ONLY':
              raise SystemExit('LUIZ_GOMES_F6_CONFIRMATION_INVALID')
          if values.get('ACADEMIC_YEAR') != '2026':
              raise SystemExit('LUIZ_GOMES_F6_YEAR_INVALID')
          if values.get('TRACKING_ISSUE') != '357':
              raise SystemExit('LUIZ_GOMES_F6_TRACKING_INVALID')
          target=values.get('TARGET_SHA','')
          expected_prod=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target):
              raise SystemExit('LUIZ_GOMES_F6_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{40}',expected_prod):
              raise SystemExit('LUIZ_GOMES_F6_PROD_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-F6-TEMPORAL] {target}':
              raise SystemExit('LUIZ_GOMES_F6_TITLE_MISMATCH')
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-luiz-gomes-f6',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          repo=os.environ['GITHUB_REPOSITORY']
          main_sha=get_json(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'LUIZ_GOMES_F6_MAIN_MOVED:{main_sha}')
          prod_sha=get_json(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if prod_sha != expected_prod:
              raise SystemExit(f'LUIZ_GOMES_F6_PRODUCTION_MOVED:{prod_sha}')
          tracking=get_json(f'https://api.github.com/repos/{repo}/issues/357')
          if tracking.get('state') != 'open':
              raise SystemExit('LUIZ_GOMES_F6_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'production_sha={prod_sha}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_F6_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p evidence

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "LUIZ_GOMES_F6_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/luiz_gomes_f6_prod_key
          chmod 600 ~/.ssh/luiz_gomes_f6_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute temporal metadata-only Mongo audit
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          raw='evidence/luiz-gomes-f6-raw.log'
          remote_command="timeout 300 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"luiz_gomes_f6_temporal_provenance_readonly.py\",\"exec\"),ns); print(\"LUIZ_GOMES_F6_JSON=\"+json.dumps(ns[\"run_live_audit\"](),ensure_ascii=False,sort_keys=True))'"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_f6_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/luiz_gomes_f6_temporal_provenance_readonly.py > "$raw" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$raw" "$rc" <<'PY'
          import hashlib,re,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes(); text=data.decode('utf-8','replace')
          controlled=re.findall(r'LUIZ_GOMES_F6_[A-Z0-9_:.ºª -]+',text)
          print('LUIZ_GOMES_F6_REMOTE_EXIT='+sys.argv[2])
          print('LUIZ_GOMES_F6_CONTROLLED_ERROR='+(controlled[-1].strip() if controlled else '<none>'))
          print('LUIZ_GOMES_F6_RAW_SHA256='+hashlib.sha256(data).hexdigest())
          PY
            rm -f "$raw"
            exit "$rc"
          fi
          prefix='LUIZ_GOMES_F6_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"

      - name: Validate read-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'LUIZ_GOMES_F6_TEMPORAL_PROVENANCE_READ_ONLY_V1':
              raise SystemExit('LUIZ_GOMES_F6_SCHEMA_INVALID')
          if p.get('target_pair_count') != 2:
              raise SystemExit('LUIZ_GOMES_F6_SCOPE_INVALID')
          if p.get('period') != {'start':'2026-02-01','end_exclusive':'2026-05-01'}:
              raise SystemExit('LUIZ_GOMES_F6_PERIOD_INVALID')
          for key in (
              'database_mutation','production_writes','attendance_records_read',
              'student_data_read','student_pii_emitted','pedagogical_text_read',
              'technical_ids_emitted',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'LUIZ_GOMES_F6_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True or p.get('http_methods') != []:
              raise SystemExit('LUIZ_GOMES_F6_READ_ONLY_INVALID')
          if len(p.get('targets') or []) != 2:
              raise SystemExit('LUIZ_GOMES_F6_TARGETS_INVALID')
          print('LUIZ_GOMES_F6_AUDIT=PASS')
          PY

      - name: Upload metadata-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luiz-gomes-f6-temporal-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment diagnosis and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PRODUCTION_SHA: ${{ steps.context.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          lines=[
              '## LUIZ-GOMES-F6 — proveniência temporal read-only','',
              f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Production observada: `{os.environ['PRODUCTION_SHA']}`",
              'Período: **fevereiro–abril/2026**',
              '',
          ]
          for target in p.get('targets') or []:
              lines.append(f"### {target.get('class')} / Matemática")
              lines.append(f"- classificação: `{json.dumps(target.get('classification'),ensure_ascii=False)}`")
              for store,details in (target.get('stores') or {}).items():
                  summary=details.get('summary') or {}
                  lines.append(
                      f"- {store}: docs={summary.get('documents')} "
                      f"meses={json.dumps(summary.get('months'),ensure_ascii=False,sort_keys=True)} "
                      f"categorias=`{json.dumps(details.get('categories'),ensure_ascii=False,sort_keys=True)}`"
                  )
              inv=target.get('class_identity_inventory') or {}
              lines.append(f"- identidades de turma com mesmo nome na escola: {inv.get('same_name_in_school')}")
          lines += [
              '',
              f"Resumo: `{json.dumps((p.get('summary') or {}).get('classification_counts'),ensure_ascii=False,sort_keys=True)}`",
              '',
              '**Boundary:** Mongo read-only; sem HTTP; sem texto pedagógico; sem `attendance.records`; sem estudantes/PII; sem IDs técnicos brutos; nenhuma mutação.',
          ]
          body='\n'.join(lines)
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-luiz-gomes-f6',
              'Content-Type':'application/json',
          }
          repo=os.environ['GITHUB_REPOSITORY']
          def send(url,payload,method='POST'):
              req=urllib.request.Request(
                  url,data=json.dumps(payload).encode(),headers=headers,method=method
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          send(f'https://api.github.com/repos/{repo}/issues/357/comments',{'body':body})
          send(
              f"https://api.github.com/repos/{repo}/issues/{os.environ['GATE_ISSUE']}/comments",
              {'body':body},
          )
          send(
              f"https://api.github.com/repos/{repo}/issues/{os.environ['GATE_ISSUE']}",
              {'state':'closed','state_reason':'completed'},
              method='PATCH',
          )
          print('LUIZ_GOMES_F6_GATE_FINALIZED=PASS')
          PY
