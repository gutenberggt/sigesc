name: "Luiz Gomes R1.0A Reconstructibility Preflight Read-only"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py'
      - 'backend/tests/test_luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py'
      - '.github/workflows/luiz-gomes-r1-0a-reconstructibility-preflight-readonly.yml'
      - 'memory/audit/LUIZ_GOMES_R1_0A_RECONSTRUCTIBILITY_PREFLIGHT_READONLY_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-r1-0a-reconstructibility-preflight-readonly
  cancel-in-progress: false

jobs:
  guard:
    name: Guard R1.0A read-only contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          python -m py_compile backend/scripts/luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py
          pytest -q --noconftest backend/tests/test_luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py

      - name: Enforce static read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/scripts/luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden_mutators = {
              'insert_one', 'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_one', 'delete_many', 'bulk_write', 'find_one_and_update',
              'find_one_and_delete', 'find_one_and_replace', 'drop', 'drop_database',
          }
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in forbidden_mutators:
                      hits.append(node.func.attr)
          if hits:
              raise SystemExit(f'LUIZ_GOMES_R1_0A_MONGO_MUTATOR:{sorted(set(hits))}')

          required = (
              'TARGET_CLASSES = ("8º ANO A", "9º ANO A")',
              'TARGET_COMPONENT = "Matemática"',
              'START_DATE = "2026-02-01"',
              'END_DATE = "2026-05-01"',
              '"RECOVERABLE_EXACT"',
              '"RECOVERABLE_METADATA_ONLY"',
              '"ATTENDANCE_ANCHOR_ONLY"',
              '"CONFLICTING_EVIDENCE"',
              '"NO_EVIDENCE"',
              '"exact_payload_recovery_attempted": False',
              '"historical_backup_restore_attempted": False',
              '"attendance_records_read": False',
              '"student_data_read": False',
              '"enrollment_data_read": False',
              '"grades_read": False',
              '"pedagogical_plaintext_read": False',
              '"technical_ids_emitted": False',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'LUIZ_GOMES_R1_0A_MARKER_MISSING:{marker}')
          for banned in ('db.students', 'db.enrollments', 'db.grades'):
              if banned in source:
                  raise SystemExit(f'LUIZ_GOMES_R1_0A_FORBIDDEN_STORE:{banned}')

          module = {}
          exec(compile(source, str(path), 'exec'), module)
          if 'records' in module['ATTENDANCE_PROJECTION']:
              raise SystemExit('LUIZ_GOMES_R1_0A_ATTENDANCE_RECORDS_PROJECTED')
          forbidden_payload = {'content', 'methodology', 'observations', 'resources', 'attendance_records'}
          if forbidden_payload.intersection(module['CONTENT_PROJECTION']):
              raise SystemExit('LUIZ_GOMES_R1_0A_CONTENT_PAYLOAD_PROJECTED')
          if forbidden_payload.intersection(module['SNAPSHOT_PROJECTION']):
              raise SystemExit('LUIZ_GOMES_R1_0A_SNAPSHOT_PAYLOAD_PROJECTED')
          print('LUIZ_GOMES_R1_0A_STATIC_BOUNDARY=PASS')
          PY

  production-preflight:
    name: R1.0A reconstructibility preflight in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-R1.0A-PREFLIGHT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-gated exact-SHA context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('LUIZ_GOMES_R1_0A_OWNER_REQUIRED')
          values = {}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key, value = raw.split('=', 1)
              key, value = key.strip(), value.strip()
              if key in values:
                  raise SystemExit(f'LUIZ_GOMES_R1_0A_DUPLICATE_FIELD:{key}')
              values[key] = value
          expected = {
              'LUIZ_GOMES_R1_0A_PREFLIGHT': 'AUTHORIZED',
              'CONFIRMATION': 'RUN_RECONSTRUCTIBILITY_PREFLIGHT_READ_ONLY',
              'ACADEMIC_YEAR': '2026',
              'TRACKING_ISSUE': '418',
          }
          for key, value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'LUIZ_GOMES_R1_0A_CONTEXT_INVALID:{key}')
          target = values.get('TARGET_SHA', '')
          prod = values.get('EXPECTED_PRODUCTION_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target) or not re.fullmatch(r'[0-9a-f]{40}', prod):
              raise SystemExit('LUIZ_GOMES_R1_0A_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-R1.0A-PREFLIGHT] {target}':
              raise SystemExit('LUIZ_GOMES_R1_0A_TITLE_MISMATCH')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-luiz-gomes-r1-0a',
          }
          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          repo = os.environ['GITHUB_REPOSITORY']
          main_sha = get_json(f'https://api.github.com/repos/{repo}/branches/main')['commit']['sha']
          prod_sha = get_json(f'https://api.github.com/repos/{repo}/branches/production')['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'LUIZ_GOMES_R1_0A_MAIN_MOVED:{main_sha}')
          if prod_sha != prod:
              raise SystemExit(f'LUIZ_GOMES_R1_0A_PRODUCTION_MOVED:{prod_sha}')
          if get_json(f'https://api.github.com/repos/{repo}/issues/418').get('state') != 'open':
              raise SystemExit('LUIZ_GOMES_R1_0A_TRACKING_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'production_sha={prod_sha}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_R1_0A_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "LUIZ_GOMES_R1_0A_SECRET_MISSING:$v"; exit 1; }
          done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/luiz_gomes_r1_0a_key
          chmod 600 ~/.ssh/luiz_gomes_r1_0a_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_r1_0a_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute R1.0A preflight
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/luiz-gomes-r1-0a-raw.log'
          remote_command="timeout 420 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py\",\"exec\"),ns); print(\"LUIZ_GOMES_R1_0A_JSON=\"+json.dumps(ns[\"run_live_audit\"](),ensure_ascii=False,sort_keys=True))'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/luiz_gomes_r1_0a_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/luiz_gomes_r1_0a_reconstructibility_preflight_readonly.py > "$raw" 2>&1
          prefix='LUIZ_GOMES_R1_0A_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"

      - name: Validate runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'LUIZ_GOMES_R1_0A_RECONSTRUCTIBILITY_PREFLIGHT_READ_ONLY_V1':
              raise SystemExit('LUIZ_GOMES_R1_0A_SCHEMA_INVALID')
          if len(p.get('targets') or []) != 2:
              raise SystemExit('LUIZ_GOMES_R1_0A_SCOPE_INVALID')
          if p.get('mongo_reads_only') is not True:
              raise SystemExit('LUIZ_GOMES_R1_0A_READ_ONLY_INVALID')
          for key in (
              'database_mutation', 'production_writes', 'attendance_records_read',
              'student_data_read', 'enrollment_data_read', 'grades_read',
              'pedagogical_plaintext_read', 'pedagogical_plaintext_emitted',
              'technical_ids_emitted', 'exact_payload_recovery_attempted',
              'historical_backup_restore_attempted',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'LUIZ_GOMES_R1_0A_BOUNDARY:{key}')
          counts = p.get('classification_counts') or {}
          exact = int(counts.get('RECOVERABLE_EXACT') or 0)
          if bool(p.get('r1_1_gate_openable')) != (exact > 0):
              raise SystemExit('LUIZ_GOMES_R1_0A_GATE_MISMATCH')
          if exact:
              raise SystemExit('LUIZ_GOMES_R1_0A_EXACT_NOT_ALLOWED_IN_THIS_SUBPHASE')
          print('LUIZ_GOMES_R1_0A_RUNTIME=PASS')
          PY

      - name: Upload metadata-only matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luiz-gomes-r1-0a-preflight-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment result on tracking issue and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PRODUCTION_SHA: ${{ steps.context.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p = json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          lines = [
              '## LUIZ-GOMES-R1.0A — preflight de reconstruibilidade', '',
              f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Production observada: `{os.environ['PRODUCTION_SHA']}`", '',
          ]
          for target in p.get('targets') or []:
              lines += [
                  f"### {target.get('class')} / Matemática",
                  f"- datas âncora de frequência: **{target.get('attendance_anchor_dates')}**",
                  f"- conteúdo atual Matemática: `{json.dumps(target.get('current_math_content_counts'), ensure_ascii=False, sort_keys=True)}`",
                  f"- eventos auditáveis de identidade: **{target.get('audit_identity_events')}**",
                  f"- datas top-level em snapshots: **{target.get('snapshot_top_level_dates')}**",
                  f"- classificação: `{json.dumps(target.get('classification_counts'), ensure_ascii=False, sort_keys=True)}`",
                  '',
              ]
          lines += [
              f"Resumo: `{json.dumps(p.get('classification_counts'), ensure_ascii=False, sort_keys=True)}`",
              f"Gate R1.1 aberto: **{p.get('r1_1_gate_openable')}**", '',
              '**Boundary:** Mongo read-only; sem attendance.records; sem estudantes, matrículas ou notas; '
              'sem plaintext pedagógico; nenhum ID técnico bruto; nenhuma mutação.',
          ]
          body = '\n'.join(lines)
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'sigesc-luiz-gomes-r1-0a',
          }
          repo = os.environ['GITHUB_REPOSITORY']
          def request(method, url, payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()
          request('POST', f'https://api.github.com/repos/{repo}/issues/418/comments', {'body': body})
          gate = os.environ['GATE_ISSUE']
          request('POST', f'https://api.github.com/repos/{repo}/issues/{gate}/comments', {'body': body})
          request('PATCH', f'https://api.github.com/repos/{repo}/issues/{gate}', {'state': 'closed'})
          print('LUIZ_GOMES_R1_0A_COMMENTED=PASS')
          PY
