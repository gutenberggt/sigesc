name: "Luiz Gomes R1.0B.2 Historical Topology Bridge"

on:
  pull_request:
    paths:
      - 'backend/scripts/luiz_gomes_r1_0b2_historical_topology_probe.js'
      - 'backend/tests/test_luiz_gomes_r1_0b2_historical_topology_contract.py'
      - '.github/workflows/luiz-gomes-r1-0b2-historical-topology.yml'
      - 'memory/audit/LUIZ_GOMES_R1_0B2_HISTORICAL_TOPOLOGY_2026-09-05.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: luiz-gomes-r1-0b2-historical-topology
  cancel-in-progress: false

jobs:
  guard:
    name: Guard R1.0B.2 historical topology read-only contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax and focused contract
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/scripts/luiz_gomes_r1_0b2_historical_topology_probe.js
          bash -n backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh
          python -m pip install --disable-pip-version-check pytest
          pytest -q --noconftest backend/tests/test_luiz_gomes_r1_0b2_historical_topology_contract.py

  production-audit:
    name: Run isolated 2026-08-18 historical topology bridge
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[LUIZ-GOMES-R1.0B.2-HISTORICAL-TOPOLOGY] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact-SHA owner gate
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue=(json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('R1_0B2_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values:
                  raise SystemExit(f'R1_0B2_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={
              'LUIZ_GOMES_R1_0B2':'AUTHORIZED',
              'CONFIRMATION':'RUN_HISTORICAL_TOPOLOGY_BRIDGE_2026_08_18_READ_ONLY',
              'ACADEMIC_YEAR':'2026',
              'TRACKING_ISSUE':'435',
              'PARENT_TRACKING_ISSUE':'418',
              'ROOT_TRACKING_ISSUE':'357',
          }
          for key,value in expected.items():
              if values.get(key)!=value:
                  raise SystemExit(f'R1_0B2_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA',''); production=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',production):
              raise SystemExit('R1_0B2_SHA_INVALID')
          if issue.get('title') != f'[LUIZ-GOMES-R1.0B.2-HISTORICAL-TOPOLOGY] {target}':
              raise SystemExit('R1_0B2_TITLE_MISMATCH')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-r1-0b2'}
          def get(path):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          main=get('branches/main')['commit']['sha']; prod=get('branches/production')['commit']['sha']
          if main!=target: raise SystemExit(f'R1_0B2_MAIN_MOVED:{main}')
          if prod!=production: raise SystemExit(f'R1_0B2_PRODUCTION_MOVED:{prod}')
          for n in (435,418,357):
              if get(f'issues/{n}').get('state')!='open': raise SystemExit(f'R1_0B2_TRACKING_NOT_OPEN:{n}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={production}\ngate_issue={issue.get("number")}\n')
          print('LUIZ_GOMES_R1_0B2_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH and stage reviewed topology probe
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "R1_0B2_SECRET_MISSING:$v"; exit 1; }
          done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/r1b2_key; chmod 600 ~/.ssh/r1b2_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          probe='backend/scripts/luiz_gomes_r1_0b2_historical_topology_probe.js'
          node --check "$probe"
          remote_probe="/tmp/luiz-r1-0b2-historical-topology-${GITHUB_RUN_ID}.js"
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/r1b2_key")
          cat "$probe" | ssh "${opts[@]}" "${PROD_USER}@${PROD_HOST}" "umask 077; cat > '$remote_probe'"
          echo "remote_probe=$remote_probe" >> "$GITHUB_OUTPUT"

      - name: Restore isolated dump and run topology bridge
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/r1-0b2-sanitized.log'
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/r1b2_key")
          set +e
          ssh "${opts[@]}" "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" "$GITHUB_RUN_ID" "${{ steps.stage.outputs.remote_probe }}" < backend/scripts/luiz_gomes_f6_3d_1_bson_dump_runner.sh > "$raw" 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "R1_0B2_REMOTE_SCAN_RC=$rc"

      - name: Cleanup staged topology probe
        if: always() && steps.context.outcome == 'success' && steps.stage.outputs.remote_probe != ''
        continue-on-error: true
        shell: bash
        run: |
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/r1b2_key")
          ssh "${opts[@]}" "${PROD_USER}@${PROD_HOST}" "rm -f '${{ steps.stage.outputs.remote_probe }}'" >/dev/null 2>&1 || true

      - name: Build and validate sanitized topology result
        if: always() && steps.context.outcome == 'success'
        env:
          SCAN_RC: ${{ steps.scan.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw=Path('evidence/r1-0b2-sanitized.log')
          lines=raw.read_text(encoding='utf-8',errors='replace').splitlines() if raw.exists() else []
          try: rc=int(os.environ.get('SCAN_RC') or '999')
          except ValueError: rc=999
          point=None; flags={}; restored=[]; meta=None
          allow={'PRODUCTION_DATABASE_TOUCHED','TEMP_RESTORE_NETWORK','TEMP_RESTORE_PORTS','SOURCE_MOUNT','TEMP_CONTAINERS_CLEANED','PEDAGOGICAL_PLAINTEXT_EMITTED','RAW_PROBE_OUTPUT_EMITTED'}
          for line in lines:
              if line.startswith('LUIZ_GOMES_F6_3C_POINT_JSON='):
                  point=json.loads(line.split('=',1)[1])
              elif line.startswith('F63D1_GROUP_META_JSON='):
                  meta=json.loads(line.split('=',1)[1])
              elif line.startswith('F63D1_RESTORED_COLLECTION:'):
                  restored.append(line.split(':',1)[1])
              elif '=' in line:
                  k,v=line.split('=',1)
                  if k in allow: flags[k]=v
          boundary=(flags.get('PRODUCTION_DATABASE_TOUCHED')=='NO' and flags.get('TEMP_RESTORE_NETWORK')=='none' and flags.get('TEMP_RESTORE_PORTS')=='none' and flags.get('SOURCE_MOUNT')=='read_only' and flags.get('TEMP_CONTAINERS_CLEANED')=='YES' and flags.get('PEDAGOGICAL_PLAINTEXT_EMITTED')=='NO' and flags.get('RAW_PROBE_OUTPUT_EMITTED')=='NO')
          valid=isinstance(point,dict) and point.get('schema')=='LUIZ_GOMES_R1_0B2_HISTORICAL_TOPOLOGY_V1'
          probe_boundary=(point or {}).get('boundaries') or {}
          probe_ok=(probe_boundary.get('production_writes') is False and probe_boundary.get('student_data_read') is False and probe_boundary.get('attendance_read') is False and probe_boundary.get('attendance_records_read') is False and probe_boundary.get('grades_read') is False and probe_boundary.get('pedagogical_plaintext_emitted') is False and probe_boundary.get('technical_ids_emitted') is False and probe_boundary.get('current_ids_used_for_mapping') is False and probe_boundary.get('class_labels_used_for_mapping') is False and probe_boundary.get('fail_closed_on_graph_symmetry') is True)
          ok=rc==0 and valid and boundary and probe_ok and meta is not None
          result={
              'schema':'LUIZ_GOMES_R1_0B2_GATE_V1',
              'status':point.get('status') if ok else 'INCONCLUSIVE',
              'classification':point.get('overall_classification') if ok else 'HISTORICAL_TOPOLOGY_RUNTIME_OR_BOUNDARY_ERROR',
              'insufficiency_reason':point.get('insufficiency_reason') if valid else None,
              'source':meta,
              'topology_bridge':point.get('topology_bridge') if valid else None,
              'anonymous_nodes':point.get('anonymous_nodes') if valid else [],
              'date_path_candidate_count':point.get('date_path_candidate_count') if valid else None,
              'targets_total_math_rows':point.get('targets_total_math_rows') if valid else None,
              'targets_total_rows_with_payload':point.get('targets_total_rows_with_payload') if valid else None,
              'next_gate_r1_0c_open':bool(point.get('next_gate_r1_0c_open')) if valid else False,
              'restored_collections':restored,
              'production_writes':False,
              'technical_ids_emitted':False,
              'pedagogical_plaintext_emitted':False,
              'student_data_read':False,
              'attendance_read':False,
              'attendance_records_read':False,
              'grades_read':False,
          }
          Path('evidence/runtime.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          if raw.exists(): raw.unlink()
          if not ok: raise SystemExit('HISTORICAL_TOPOLOGY_RUNTIME_OR_BOUNDARY_ERROR')
          allowed={
              'HISTORICAL_TOPOLOGY_BRIDGE_RESOLVED_TARGET_PAYLOAD_PRESENT',
              'HISTORICAL_TOPOLOGY_BRIDGE_RESOLVED_TARGET_ROWS_WITHOUT_PAYLOAD',
              'HISTORICAL_TOPOLOGY_BRIDGE_RESOLVED_NO_TARGET_MATH_ROWS',
              'HISTORICAL_TOPOLOGY_BRIDGE_SYMMETRIC',
              'HISTORICAL_TOPOLOGY_BRIDGE_INCONCLUSIVE',
          }
          if result['classification'] not in allowed: raise SystemExit('R1_0B2_TAXONOMY_INVALID')
          if result['next_gate_r1_0c_open'] and result['classification'] not in {
              'HISTORICAL_TOPOLOGY_BRIDGE_RESOLVED_TARGET_PAYLOAD_PRESENT',
              'HISTORICAL_TOPOLOGY_BRIDGE_RESOLVED_TARGET_ROWS_WITHOUT_PAYLOAD',
          }:
              raise SystemExit('R1_0B2_GATE_CANNOT_OPEN_FROM_NON_TARGET_ROWS')
          print('LUIZ_GOMES_R1_0B2_RESULT=PASS')
          PY

      - name: Publish result and close execution gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('evidence/runtime.json',encoding='utf-8'))
          lines=[
              '## LUIZ-GOMES-R1.0B.2 — Bridge Relacional por Topologia Histórica',
              '', f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Status: **`{r['status']}`**",
              f"Classificação: **`{r['classification']}`**",
          ]
          if r.get('insufficiency_reason'): lines.append(f"Motivo: `{r['insufficiency_reason']}`")
          bridge=r.get('topology_bridge') or {}
          if bridge:
              lines += ['', '### Topologia sanitizada',
                        f"- vizinhança de seis nós resolvida: **{bool(bridge.get('six_node_neighborhood_resolved'))}**",
                        f"- nós candidatos: {bridge.get('candidate_class_node_count')}",
                        f"- assinaturas distintas: {bridge.get('distinct_topology_signature_count')}",
                        f"- grupos simétricos: {bridge.get('symmetric_group_count')}",
                        f"- papéis 6A/6B/7A/7B/8A/9A resolvidos: **{bool(bridge.get('role_mapping_resolved'))}**"]
          nodes=r.get('anonymous_nodes') or []
          if nodes:
              lines += ['', f"Nós anônimos publicados: {len(nodes)} (somente fingerprints/contagens; nenhum ID técnico)."]
          lines += [
              f"- alvos: math_rows={r.get('targets_total_math_rows')}; payload_rows={r.get('targets_total_rows_with_payload')}",
              f"- Gate R1.0C aberto: **{bool(r.get('next_gate_r1_0c_open'))}**",
              '',
              '**Regra semântica:** `None` significa não determinado, nunca zero. Encontrar seis nós não autoriza nomeá-los como seis turmas se a bijeção não for única.',
              '',
              '**Boundary:** dump read-only em Mongo temporário `--network none`; produção sem escrita; sem estudantes/matrículas/frequência/notas; nenhum ID técnico bruto ou plaintext pedagógico emitido; sem deploy.',
          ]
          body='\n'.join(lines)
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sigesc-r1-0b2'}
          repo=os.environ['GITHUB_REPOSITORY']
          def req(method,path,payload):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers,data=json.dumps(payload).encode(),method=method)
              with urllib.request.urlopen(q,timeout=30) as x: return x.read()
          req('POST','issues/435/comments',{'body':body})
          req('POST',f"issues/{os.environ['GATE_ISSUE']}/comments",{'body':body})
          req('PATCH',f"issues/{os.environ['GATE_ISSUE']}",{'state':'closed','state_reason':'completed'})
          PY
