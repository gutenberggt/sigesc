name: Mantenedora - Access Control Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/mantenedora_access_policy.py'
      - 'backend/routers/mantenedora_access_control.py'
      - 'backend/routers/mantenedoras.py'
      - 'backend/tenant_scope.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_mantenedora_access_policy.py'
      - 'frontend/src/contexts/MantenedoraContext.js'
      - 'frontend/src/components/ProtectedRoute.js'
      - 'frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx'
      - 'frontend/src/pages/MantenedoraDesativada.jsx'
      - 'frontend/src/pages/MantenedoraManutencao.jsx'
      - 'frontend/src/pages/Mantenedora.js'
      - '.github/workflows/mantenedora-access-control.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/services/mantenedora_access_policy.py'
      - 'backend/routers/mantenedora_access_control.py'
      - 'backend/routers/mantenedoras.py'
      - 'backend/tenant_scope.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_mantenedora_access_policy.py'
      - 'frontend/src/contexts/MantenedoraContext.js'
      - 'frontend/src/components/ProtectedRoute.js'
      - 'frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx'
      - 'frontend/src/pages/MantenedoraDesativada.jsx'
      - 'frontend/src/pages/MantenedoraManutencao.jsx'
      - 'frontend/src/pages/Mantenedora.js'
      - '.github/workflows/mantenedora-access-control.yml'

jobs:
  access-control-contract:
    name: Backend - Mantenedora availability + maintenance contract
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test dependencies
        run: pip install pytest fastapi

      - name: Compile access-control runtime
        run: |
          python -m py_compile \
            services/mantenedora_access_policy.py \
            routers/mantenedora_access_control.py \
            routers/mantenedoras.py \
            tenant_scope.py

      - name: Run access-control policy tests
        run: PYTHONPATH=. pytest -q --noconftest tests/test_mantenedora_access_policy.py

      - name: Guard frontend integration points
        run: |
          grep -q 'MantenedoraAccessControlPanel' ../frontend/src/pages/Mantenedora.js
          grep -q 'TENANT_INACTIVE' ../frontend/src/components/ProtectedRoute.js
          grep -q 'TENANT_MAINTENANCE' ../frontend/src/components/ProtectedRoute.js
          grep -q 'MantenedoraManutencao' ../frontend/src/components/ProtectedRoute.js
          grep -q 'SUPER_ADMIN_INACTIVE_CONTROL_PATHS' ../frontend/src/components/ProtectedRoute.js
          grep -q 'direção da sua escola' ../frontend/src/pages/MantenedoraDesativada.jsx
          grep -q 'Sistema em manutenção' ../frontend/src/pages/MantenedoraManutencao.jsx
          grep -q 'Seus dados permanecem preservados' ../frontend/src/pages/MantenedoraManutencao.jsx
          grep -q 'apiFetch' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'getActiveTenantId' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'TENANTS_API' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'mantenedora_id=' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'tenants.map' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'mantenedora-access-card-current' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'mantenedora-control-cards-grid' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'mantenedora-active-switch' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'mantenedora-maintenance-card' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'mantenedora-maintenance-switch' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'MAINTENANCE_CONTROL_API' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'role="switch"' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'Acesso excepcional enquanto desativada' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'Secretário Escolar' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'mantenedora-access-selector' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'Mantenedora a gerenciar' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'Verificar conexões' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          ! grep -q 'Sim, desativar' ../frontend/src/components/mantenedora/MantenedoraAccessControlPanel.jsx
          grep -q 'CROSS_TENANT_CONTROL_FORBIDDEN' routers/mantenedora_access_control.py
          grep -q 'query and query != header' routers/mantenedora_access_control.py
          grep -q 'management_allowed' routers/mantenedora_access_control.py
          grep -q 'super_admin_management_bypass' routers/mantenedora_access_control.py
          grep -q 'maintenance-control' routers/mantenedora_access_control.py
          grep -q 'mantenedora_maintenance_updated' routers/mantenedora_access_control.py
          grep -q 'TENANT_MAINTENANCE' tenant_scope.py
          grep -q 'MANTENEDORA_AVAILABILITY_REQUIRES_ACCESS_CONTROL' routers/mantenedoras.py
