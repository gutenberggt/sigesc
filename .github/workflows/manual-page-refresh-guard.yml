name: Manual Page Refresh Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/pages/**'
      - 'backend/tests/test_frontend_manual_page_refresh_policy.py'
      - '.github/workflows/manual-page-refresh-guard.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/pages/**'
      - 'backend/tests/test_frontend_manual_page_refresh_policy.py'
      - '.github/workflows/manual-page-refresh-guard.yml'

jobs:
  manual-page-refresh-policy:
    name: Páginas sem refresh temporizado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Enforce manual page refresh policy
        run: pytest -q --noconftest backend/tests/test_frontend_manual_page_refresh_policy.py
