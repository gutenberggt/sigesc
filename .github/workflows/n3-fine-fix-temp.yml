name: N3 - Ajuste fino (temporário)

on:
  push:
    branches:
      - feat/n3-backend-api-estudante

permissions:
  contents: write

jobs:
  fine-fix:
    if: ${{ !contains(github.event.head_commit.message, '[n3-fine-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/n3-backend-api-estudante
          fetch-depth: 0

      - name: Restaurar constantes internas e formatação incidental
        run: |
          git checkout 3c1b555c79dce586c13cf9477a5beb5efbc7fb20 -- backend/utils/diary_constants.py
          git checkout 3c1b555c79dce586c13cf9477a5beb5efbc7fb20 -- backend/routers/student_intelligence.py

      - name: Reaplicar somente mensagem pública e corrigir rótulo de auditoria
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/routers/student_intelligence.py')
          text = p.read_text(encoding='utf-8')
          old = 'raise HTTPException(status_code=404, detail="Aluno não encontrado")'
          new = 'raise HTTPException(status_code=404, detail="Estudante não encontrado")'
          assert old in text
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/audit_service.py')
          text = p.read_text(encoding='utf-8')
          old = "    'students': 'aluno',"
          new = "    'students': 'estudante',"
          assert old in text
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar fronteiras
        run: |
          grep -F '"Aluno dependência"' backend/utils/diary_constants.py
          grep -F "'students': 'estudante'" backend/audit_service.py
          grep -F 'detail="Estudante não encontrado"' backend/routers/student_intelligence.py
          git diff --check

      - name: Commitar ajustes finos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/utils/diary_constants.py backend/routers/student_intelligence.py backend/audit_service.py
          git commit -m "chore(n3): corrigir fronteiras da normalização [n3-fine-auto]"
          git push origin HEAD:feat/n3-backend-api-estudante
