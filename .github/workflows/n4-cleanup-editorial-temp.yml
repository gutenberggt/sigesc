name: N4 - Limpeza editorial (temporário)

on:
  push:
    branches:
      - chore/n4-docs-nomenclature-guard

permissions:
  contents: write

jobs:
  cleanup:
    name: N4 editorial cleanup
    if: ${{ !contains(github.event.head_commit.message, '[n4-cleanup-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove duplicate editorial notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('docs/ACADEMIC_EVENT_CONTRACT.md'),
              Path('docs/DIARY_API_CONTRACT.md'),
              Path('docs/HISTORICO_ESCOLAR_CONTRACT.md'),
          ]
          valid = 'normalização da nomenclatura institucional **Aluno → Estudante**'
          duplicate = 'normalização da nomenclatura institucional **Estudante → Estudante**'
          waiver = 'nomenclature-allow: registro editorial da migração terminológica'

          for path in targets:
              lines = path.read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if duplicate not in line]
              text = '\n'.join(lines) + '\n'
              assert text.count(valid) == 1, f'{path}: nota válida count={text.count(valid)}'
              assert text.count(waiver) == 1, f'{path}: waiver count={text.count(waiver)}'
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate guard and diff
        env:
          NOMENCLATURE_BASE: b374329b24f390c912a7637c7bdff4a945f47fbf
        run: |
          python .github/scripts/nomenclature_guard.py
          git diff --check
          git diff --stat
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- docs/; then
            echo "Nenhuma limpeza necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACADEMIC_EVENT_CONTRACT.md docs/DIARY_API_CONTRACT.md docs/HISTORICO_ESCOLAR_CONTRACT.md
          git commit -m "docs(n4): remover notas editoriais duplicadas [n4-cleanup-auto]"
          git push origin HEAD:chore/n4-docs-nomenclature-guard
