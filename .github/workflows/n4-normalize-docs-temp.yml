name: N4 - Normalizar documentação viva (temporário)

on:
  push:
    branches:
      - chore/n4-docs-nomenclature-guard

permissions:
  contents: write

jobs:
  normalize-docs:
    name: N4 docs normalization
    if: ${{ !contains(github.event.head_commit.message, '[n4-docs-auto]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize README and docs
        run: python scripts/n4_normalize_docs.py

      - name: Validate diff formatting
        run: git diff --check

      - name: Smoke test nomenclature guard
        env:
          NOMENCLATURE_BASE: b374329b24f390c912a7637c7bdff4a945f47fbf
        run: python .github/scripts/nomenclature_guard.py

      - name: Show diff summary
        run: git diff --stat && git diff -- README.md docs/

      - name: Commit normalized documentation
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/; then
            echo "Nenhuma alteração documental necessária."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git commit -m "docs(n4): padronizar Estudante na documentação viva [n4-docs-auto]"
          git push origin HEAD:chore/n4-docs-nomenclature-guard
