name: One-shot Content Browser Local Date P0

on:
  push:
    branches:
      - fix/content-browser-local-date-p0
    paths:
      - .github/workflows/one-shot-fix-content-browser-local-date-p0.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/content-browser-local-date-p0
          fetch-depth: 0

      - name: Apply local civil-date rule to LearningObjects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/LearningObjects.js')
          source = path.read_text(encoding='utf-8')

          import_anchor = "import { learningObjectsAPI, schoolsAPI, classesAPI, coursesAPI, professorAPI, teacherAssignmentAPI, attendanceAPI, calendarAPI, curriculumAPI } from '@/services/api';"
          import_replacement = import_anchor + "\nimport { browserLocalDateISO, browserLocalTodayISO } from '@/utils/browserLocalDate';"
          if "browserLocalTodayISO" not in source:
              if import_anchor not in source:
                  raise SystemExit('Import anchor not found')
              source = source.replace(import_anchor, import_replacement, 1)

          replacements = {
              "sabLetivos.add(d.toISOString().split('T')[0]);": "sabLetivos.add(browserLocalDateISO(d));",
              "blocked.add(d.toISOString().split('T')[0]);": "blocked.add(browserLocalDateISO(d));",
              "const isToday = dateStr === new Date().toISOString().split('T')[0];": "const isToday = dateStr === browserLocalTodayISO();",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected pattern not found: {old}')
              source = source.replace(old, new, 1)

          if "new Date().toISOString().split('T')[0]" in source:
              raise SystemExit('UTC calendar-day pattern still present in LearningObjects.js')

          path.write_text(source, encoding='utf-8')

          test_path = Path('backend/tests/test_professor_attendance_entrypoint_p0.py')
          test_source = test_path.read_text(encoding='utf-8')
          const_anchor = 'BROWSER_LOCAL_DATE = REPO_ROOT / "frontend/src/utils/browserLocalDate.js"\n'
          const_replacement = const_anchor + 'LEARNING_OBJECTS = REPO_ROOT / "frontend/src/pages/LearningObjects.js"\n'
          if 'LEARNING_OBJECTS = ' not in test_source:
              if const_anchor not in test_source:
                  raise SystemExit('Test constant anchor not found')
              test_source = test_source.replace(const_anchor, const_replacement, 1)

          test_anchor = '    assert "new Date().toISOString().split(\'T\')[0]" not in records\n'
          test_append = test_anchor + '''\n\n\ndef test_learning_objects_today_and_calendar_dates_use_browser_local_day():\n    source = _read(LEARNING_OBJECTS)\n\n    assert "browserLocalDateISO" in source\n    assert "browserLocalTodayISO" in source\n    assert "const isToday = dateStr === browserLocalTodayISO();" in source\n    assert "sabLetivos.add(browserLocalDateISO(d));" in source\n    assert "blocked.add(browserLocalDateISO(d));" in source\n    assert "new Date().toISOString().split('T')[0]" not in source\n'''
          if 'test_learning_objects_today_and_calendar_dates_use_browser_local_day' not in test_source:
              if test_anchor not in test_source:
                  raise SystemExit('Test append anchor not found')
              test_source = test_source.replace(test_anchor, test_append, 1)
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/LearningObjects.js backend/tests/test_professor_attendance_entrypoint_p0.py
          git diff --cached --check
          git commit -m "fix(content): usar data civil local no calendário"
          git push origin HEAD:fix/content-browser-local-date-p0
