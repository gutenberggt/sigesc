name: One-shot Global Local Time P0

on:
  push:
    branches:
      - fix/global-local-time-contract-p0
    paths:
      - .github/workflows/one-shot-global-local-time-p0.yml

permissions:
  contents: write

jobs:
  apply-global-time-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-local-time-contract-p0
          fetch-depth: 0

      - name: Apply global client-local time contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def add_import(text, anchor, addition):
              if addition in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f'Import anchor not found: {anchor}')
              return text.replace(anchor, anchor + '\n' + addition, 1)

          # -----------------------------------------------------------------
          # Frontend bootstrap: envia o fuso do computador em axios + fetch.
          # -----------------------------------------------------------------
          p = 'frontend/src/index.js'
          s = read(p)
          s = add_import(s, 'import "@/utils/contentCopyErrorNormalizer";', 'import { installClientTimeContext } from "@/utils/clientTimeContext";')
          if 'installClientTimeContext();' not in s:
              s = s.replace('const root = ReactDOM.createRoot', 'installClientTimeContext();\n\nconst root = ReactDOM.createRoot', 1)
          write(p, s)

          # -----------------------------------------------------------------
          # Backend middleware + CORS para os headers de contexto temporal.
          # -----------------------------------------------------------------
          p = 'backend/server.py'
          s = read(p)
          if 'from utils.client_time import ClientTimeContextMiddleware' not in s:
              s = s.replace(
                  'from utils.connection_manager import ConnectionManager, ActiveSessionsTracker',
                  'from utils.connection_manager import ConnectionManager, ActiveSessionsTracker\nfrom utils.client_time import ClientTimeContextMiddleware',
                  1,
              )
          if 'app.add_middleware(ClientTimeContextMiddleware)' not in s:
              s = s.replace(
                  'app = FastAPI(title="SIGESC API", version="1.0.0")',
                  'app = FastAPI(title="SIGESC API", version="1.0.0")\napp.add_middleware(ClientTimeContextMiddleware)',
                  1,
              )
          old_headers = 'allow_headers=["Authorization", "Content-Type", "X-CSRF-Token", "X-Requested-With", "X-Mantenedora-Id"]'
          new_headers = 'allow_headers=["Authorization", "Content-Type", "X-CSRF-Token", "X-Requested-With", "X-Mantenedora-Id", "X-SIGESC-Timezone", "X-SIGESC-UTC-Offset-Minutes", "X-SIGESC-Local-Date"]'
          if old_headers in s:
              s = s.replace(old_headers, new_headers, 1)
          elif '"X-SIGESC-Timezone"' not in s:
              raise SystemExit('CORS allow_headers anchor not found')
          write(p, s)

          # -----------------------------------------------------------------
          # Frontend: toda DATA CIVIL automática usa o helper local.
          # -----------------------------------------------------------------
          civil_files = {
              'frontend/src/pages/Attendance.js': [
                  ("import { useOffline } from '@/contexts/OfflineContext';", "import { browserLocalTodayISO } from '@/utils/browserLocalDate';"),
              ],
              'frontend/src/pages/Enrollments.js': [
                  ("import { extractErrorMessage } from '@/utils/errorHandler';", "import { browserLocalTodayISO } from '@/utils/browserLocalDate';"),
              ],
              'frontend/src/hooks/useStaff.js': [
                  ("import { normalizeForSearch } from '@/utils/searchUtils';", "import { browserLocalTodayISO } from '@/utils/browserLocalDate';"),
              ],
              'frontend/src/pages/DiarioAEE.js': [
                  ("import", None),
              ],
              'frontend/src/pages/StudentsComplete.js': [
                  ("import", None),
              ],
          }

          for path, imports in civil_files.items():
              s = read(path)
              if "new Date().toISOString().split('T')[0]" not in s:
                  continue
              if "browserLocalTodayISO" not in s:
                  anchor, addition = imports[0]
                  if addition and anchor in s:
                      s = add_import(s, anchor, addition)
                  else:
                      # Inserção genérica após o último import do bloco inicial.
                      lines = s.splitlines()
                      idx = max(i for i, line in enumerate(lines[:120]) if line.startswith('import '))
                      lines.insert(idx + 1, "import { browserLocalTodayISO } from '@/utils/browserLocalDate';")
                      s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
              s = s.replace("new Date().toISOString().split('T')[0]", "browserLocalTodayISO()")
              write(path, s)

          # LearningObjects: Hoje + datas civis iteradas de calendário.
          p = 'frontend/src/pages/LearningObjects.js'
          s = read(p)
          if "browserLocalTodayISO" not in s:
              anchor = "import { learningObjectsAPI, schoolsAPI, classesAPI, coursesAPI, professorAPI, teacherAssignmentAPI, attendanceAPI, calendarAPI, curriculumAPI } from '@/services/api';"
              s = add_import(s, anchor, "import { browserLocalDateISO, browserLocalTodayISO } from '@/utils/browserLocalDate';")
          s = s.replace("sabLetivos.add(d.toISOString().split('T')[0]);", "sabLetivos.add(browserLocalDateISO(d));")
          s = s.replace("blocked.add(d.toISOString().split('T')[0]);", "blocked.add(browserLocalDateISO(d));")
          s = s.replace("const isToday = dateStr === new Date().toISOString().split('T')[0];", "const isToday = dateStr === browserLocalTodayISO();")
          write(p, s)

          # DiaryCalendar: função todayISO deixa de converter para UTC.
          p = 'frontend/src/pages/DiaryCalendar.jsx'
          s = read(p)
          if "browserLocalTodayISO" not in s:
              anchor = "import SnapshotsDrawer from '@/components/diary/SnapshotsDrawer';"
              s = add_import(s, anchor, "import { browserLocalTodayISO } from '@/utils/browserLocalDate';")
          s = s.replace("function todayISO() {\n  const d = new Date();\n  return d.toISOString().slice(0, 10);\n}", "function todayISO() {\n  return browserLocalTodayISO();\n}")
          write(p, s)

          # Substituição de servidor — datas de início/fim são civis.
          p = 'frontend/src/components/staff/SubstituicaoSection.js'
          s = read(p)
          if "toISOString().slice(0, 10)" in s:
              if "browserLocalTodayISO" not in s:
                  lines = s.splitlines()
                  idx = max(i for i, line in enumerate(lines[:100]) if line.startswith('import '))
                  lines.insert(idx + 1, "import { browserLocalTodayISO } from '@/utils/browserLocalDate';")
                  s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
              s = s.replace("new Date().toISOString().slice(0, 10)", "browserLocalTodayISO()")
          write(p, s)

          # Auditoria frontend: filename local; linhas novas preferem timestamp_local.
          p = 'frontend/src/pages/AuditLogs.jsx'
          s = read(p)
          if "browserLocalTodayISO" not in s:
              anchor = "import { downloadBlob } from '@/utils/downloadBlob';"
              s = add_import(s, anchor, "import { browserLocalTodayISO } from '@/utils/browserLocalDate';")
          s = s.replace("new Date().toISOString().slice(0, 10)", "browserLocalTodayISO()")
          s = s.replace("formatDate(log.timestamp)", "formatDate(log.timestamp_local || log.timestamp)")
          write(p, s)

          # -----------------------------------------------------------------
          # Auditoria backend: UTC canônico + carimbo local imutável do evento.
          # -----------------------------------------------------------------
          p = 'backend/audit_service.py'
          s = read(p)
          if 'from utils.client_time import current_time_context, local_day_bounds_utc, local_now' not in s:
              s = s.replace(
                  'import logging\n',
                  'import logging\n\nfrom utils.client_time import current_time_context, local_day_bounds_utc, local_now\n',
                  1,
              )
          old = "            # Monta o registro de auditoria\n            audit_record = {"
          if old in s and 'time_ctx = current_time_context' not in s:
              s = s.replace(old, "            # Monta o registro de auditoria. UTC é canônico; local é evidência civil.\n            now_utc = datetime.now(timezone.utc)\n            time_ctx = current_time_context(now_utc)\n            audit_record = {", 1)
          s = s.replace("'academic_year': academic_year or datetime.now().year,", "'academic_year': academic_year or local_now(now_utc).year,")
          s = s.replace("'timestamp': datetime.now(timezone.utc).isoformat(),", "'timestamp': now_utc.isoformat(),\n                'timestamp_utc': time_ctx['timestamp_utc'],\n                'timestamp_local': time_ctx['timestamp_local'],\n                'timezone': time_ctx['timezone'],\n                'utc_offset_minutes': time_ctx['utc_offset_minutes'],\n                'timezone_source': time_ctx['timezone_source'],")
          old_filter = """            # Filtro de data
            if filters.get('start_date') or filters.get('end_date'):
                query['timestamp'] = {}
                if filters.get('start_date'):
                    query['timestamp']['$gte'] = filters['start_date']
                if filters.get('end_date'):
                    query['timestamp']['$lte'] = filters['end_date'] + 'T23:59:59'
"""
          new_filter = """            # Filtro por DATA CIVIL do usuário; converte os limites para UTC.
            if filters.get('start_date') or filters.get('end_date'):
                start_utc, end_utc = local_day_bounds_utc(filters.get('start_date'), filters.get('end_date'))
                query['timestamp'] = {}
                if start_utc:
                    query['timestamp']['$gte'] = start_utc
                if end_utc:
                    query['timestamp']['$lte'] = end_utc
"""
          if old_filter in s:
              s = s.replace(old_filter, new_filter, 1)
          write(p, s)

          # PDF da auditoria: linhas no fuso em que o evento ocorreu; geração no fuso do solicitante.
          p = 'backend/routers/audit_logs.py'
          s = read(p)
          if 'from utils.client_time import local_now' not in s:
              s = s.replace('from auth_middleware import AuthMiddleware\n', 'from auth_middleware import AuthMiddleware\nfrom utils.client_time import local_now\n', 1)
          old_fmt = """        def _fmt_dt(ts):
            try:
                d = datetime.fromisoformat(str(ts).replace('Z', '+00:00'))
                return d.strftime('%d/%m/%Y %H:%M')
            except Exception:
                return str(ts or '-')
"""
          new_fmt = """        def _fmt_dt(ts, *, event_local=False):
            try:
                d = datetime.fromisoformat(str(ts).replace('Z', '+00:00'))
                if not event_local:
                    d = local_now(d.astimezone(timezone.utc))
                return d.strftime('%d/%m/%Y %H:%M')
            except Exception:
                return str(ts or '-')
"""
          if old_fmt in s:
              s = s.replace(old_fmt, new_fmt, 1)
          s = s.replace("Paragraph(_fmt_dt(lg.get('timestamp')), cell),", "Paragraph(_fmt_dt(lg.get('timestamp_local') or lg.get('timestamp'), event_local=bool(lg.get('timestamp_local'))), cell),")
          s = s.replace("gen_at = datetime.now(timezone.utc).astimezone().strftime('%d/%m/%Y %H:%M')", "gen_at = local_now().strftime('%d/%m/%Y %H:%M')")
          s = s.replace("filename = f\"logs_auditoria_{datetime.now().strftime('%Y%m%d_%H%M')}.pdf\"", "filename = f\"logs_auditoria_{local_now().strftime('%Y%m%d_%H%M')}.pdf\"")
          write(p, s)

          # -----------------------------------------------------------------
          # PDFs síncronos: emissão/data do documento usa contexto local.
          # NÃO toca datetime.now(timezone.utc): metadado técnico permanece UTC.
          # -----------------------------------------------------------------
          pdf_candidates = list(Path('backend/pdf').glob('*.py')) + [Path('backend/hr_pdf_generator.py')]
          for path in pdf_candidates:
              s = path.read_text(encoding='utf-8')
              before = s
              s = s.replace('datetime.now(timezone.utc).astimezone()', 'local_now()')
              s = s.replace('datetime.now().', 'local_now().')
              s = s.replace('datetime.now()', 'local_now()')
              s = s.replace('date.today()', 'local_today()')
              if s != before and 'from utils.client_time import local_now, local_today' not in s:
                  lines = s.splitlines()
                  # Coloca após import datetime/date, preservando __future__.
                  idx = next((i for i, line in enumerate(lines) if line.startswith('from datetime import') or line == 'import datetime'), None)
                  if idx is None:
                      idx = max(i for i, line in enumerate(lines[:120]) if line.startswith(('import ', 'from ')))
                  lines.insert(idx + 1, 'from utils.client_time import local_now, local_today')
                  s = '\n'.join(lines) + ('\n' if before.endswith('\n') else '')
              path.write_text(s, encoding='utf-8')

          # -----------------------------------------------------------------
          # Render jobs: captura o fuso da requisição e restaura no worker.
          # -----------------------------------------------------------------
          job_routers = [
              'backend/routers/bulletin_pdf.py',
              'backend/routers/history_pdf.py',
              'backend/routers/diary_snapshots.py',
              'backend/routers/render_jobs.py',
          ]
          for p in job_routers:
              s = read(p)
              if 'document_render_jobs.insert_one' not in s:
                  continue
              if 'from utils.client_time import current_time_context' not in s:
                  lines = s.splitlines()
                  idx = max(i for i, line in enumerate(lines[:120]) if line.startswith(('import ', 'from ')))
                  lines.insert(idx + 1, 'from utils.client_time import current_time_context')
                  s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
              # Todo job persistido recebe o snapshot do contexto temporal da emissão.
              s = s.replace('"audit_trail": [', '"time_context": current_time_context(),\n            "audit_trail": [')
              write(p, s)

          p = 'backend/services/render_worker.py'
          s = read(p)
          if 'from utils.client_time import use_time_context' not in s:
              s = s.replace('from utils.render_jobs import (', 'from utils.client_time import use_time_context\nfrom utils.render_jobs import (', 1)
          old_handler = '        result = await handler(job) or {}'
          new_handler = """        time_ctx = job.get('time_context') or {}
        with use_time_context(
            timezone_name=time_ctx.get('timezone'),
            utc_offset_minutes=time_ctx.get('utc_offset_minutes'),
            source='render_job',
        ):
            result = await handler(job) or {}"""
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)
          write(p, s)

          # Verificações públicas guardam também o carimbo civil da emissão.
          for p in ['backend/services/bulletin_renderer.py', 'backend/services/history_renderer.py']:
              s = read(p)
              if 'from utils.client_time import current_time_context' not in s:
                  lines = s.splitlines()
                  idx = max(i for i, line in enumerate(lines[:100]) if line.startswith(('import ', 'from ')))
                  lines.insert(idx + 1, 'from utils.client_time import current_time_context')
                  s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
              if 'time_ctx = current_time_context()' not in s:
                  s = s.replace('now = datetime.now(timezone.utc).isoformat()', 'now = datetime.now(timezone.utc).isoformat()\n    time_ctx = current_time_context()', 1)
              s = s.replace('"created_at": now,', '"created_at": now,\n        "created_at_local": time_ctx["timestamp_local"],\n        "timezone": time_ctx["timezone"],')
              write(p, s)

          for p in ['backend/routers/bulletin_pdf.py', 'backend/routers/history_pdf.py']:
              s = read(p)
              s = s.replace('"issued_at": v.get("created_at"),', '"issued_at": v.get("created_at"),\n            "issued_at_local": v.get("created_at_local"),\n            "timezone": v.get("timezone"),')
              write(p, s)

          # -----------------------------------------------------------------
          # Guard global de regressão.
          # -----------------------------------------------------------------
          test = Path('backend/tests/test_global_local_time_contract_p0.py')
          test.write_text(r'''from datetime import datetime, timezone
from pathlib import Path

from utils.client_time import local_date_iso, local_now, use_time_context


ROOT = Path(__file__).resolve().parents[2]


def test_utc_minus_3_keeps_21_august_until_local_midnight():
    instant = datetime(2026, 8, 22, 1, 0, 0, tzinfo=timezone.utc)
    with use_time_context(timezone_name="America/Belem", source="test"):
        assert local_date_iso(instant) == "2026-08-21"
        assert local_now(instant).strftime("%d/%m/%Y %H:%M") == "21/08/2026 22:00"


def test_frontend_bootstrap_propagates_browser_timezone_globally():
    source = (ROOT / "frontend/src/index.js").read_text(encoding="utf-8")
    helper = (ROOT / "frontend/src/utils/clientTimeContext.js").read_text(encoding="utf-8")
    assert "installClientTimeContext();" in source
    assert "Intl.DateTimeFormat().resolvedOptions().timeZone" in helper
    assert "axios.interceptors.request.use" in helper
    assert "window.fetch =" in helper


def test_backend_request_context_and_cors_are_installed():
    source = (ROOT / "backend/server.py").read_text(encoding="utf-8")
    assert "ClientTimeContextMiddleware" in source
    assert '"X-SIGESC-Timezone"' in source
    assert '"X-SIGESC-UTC-Offset-Minutes"' in source
    assert '"X-SIGESC-Local-Date"' in source


def test_audit_keeps_utc_canonical_and_records_local_event_time():
    source = (ROOT / "backend/audit_service.py").read_text(encoding="utf-8")
    assert "'timestamp': now_utc.isoformat()" in source
    assert "'timestamp_local': time_ctx['timestamp_local']" in source
    assert "'timezone': time_ctx['timezone']" in source
    assert "local_day_bounds_utc" in source


def test_no_known_frontend_civil_today_uses_utc_conversion():
    files = [
        "frontend/src/pages/Attendance.js",
        "frontend/src/pages/LearningObjects.js",
        "frontend/src/pages/Enrollments.js",
        "frontend/src/pages/DiarioAEE.js",
        "frontend/src/pages/StudentsComplete.js",
        "frontend/src/hooks/useStaff.js",
        "frontend/src/components/staff/SubstituicaoSection.js",
        "frontend/src/pages/AuditLogs.jsx",
        "frontend/src/pages/DiaryCalendar.jsx",
    ]
    forbidden = [
        "new Date().toISOString().split('T')[0]",
        "new Date().toISOString().slice(0, 10)",
    ]
    for rel in files:
        text = (ROOT / rel).read_text(encoding="utf-8")
        for pattern in forbidden:
            assert pattern not in text, f"{rel} ainda usa data civil UTC: {pattern}"


def test_pdf_layer_does_not_use_server_naive_today_for_emission():
    candidates = list((ROOT / "backend/pdf").glob("*.py")) + [ROOT / "backend/hr_pdf_generator.py"]
    for path in candidates:
        text = path.read_text(encoding="utf-8")
        assert "date.today()" not in text, f"{path} ainda usa date.today() do servidor"
        assert "datetime.now()" not in text, f"{path} ainda usa datetime.now() ingênuo do servidor"


def test_background_render_job_restores_request_time_context():
    worker = (ROOT / "backend/services/render_worker.py").read_text(encoding="utf-8")
    assert "with use_time_context(" in worker
    for rel in [
        "backend/routers/bulletin_pdf.py",
        "backend/routers/history_pdf.py",
        "backend/routers/diary_snapshots.py",
        "backend/routers/render_jobs.py",
    ]:
        text = (ROOT / rel).read_text(encoding="utf-8")
        if "document_render_jobs.insert_one" in text:
            assert '"time_context": current_time_context()' in text, rel
''', encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-global-local-time-p0.yml

      - name: Validate syntax and focused tests
        run: |
          python -m compileall -q backend/utils/client_time.py backend/audit_service.py backend/routers/audit_logs.py backend/services/render_worker.py backend/pdf
          python -m pytest -q backend/tests/test_global_local_time_contract_p0.py backend/tests/test_professor_attendance_entrypoint_p0.py

      - name: Commit global time contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(time): aplicar fuso local global em UI auditoria e documentos"
          git push origin HEAD:fix/global-local-time-contract-p0
