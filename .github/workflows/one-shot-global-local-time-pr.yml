name: One-shot Global Local Time PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/global-local-time-contract-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-local-time-contract-p0
          fetch-depth: 0

      - name: Run patch source from one-shot workflow
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/one-shot-global-local-time-p0.yml \
            | sed 's/^          //' > /tmp/apply-global-time.sh
          bash /tmp/apply-global-time.sh

      - name: Normalize render worker time-context block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/render_worker.py')
          source = path.read_text(encoding='utf-8')
          start = source.find("    try:\n        time_ctx = job.get('time_context') or {}")
          if start < 0:
              raise SystemExit('Generated render-worker time block not found')
          end = source.find("\n    except Exception as e:", start)
          if end < 0:
              raise SystemExit('render-worker except anchor not found')
          block = '''    try:
        time_ctx = job.get("time_context") or {}
        with use_time_context(
            timezone_name=time_ctx.get("timezone"),
            utc_offset_minutes=time_ctx.get("utc_offset_minutes"),
            source="render_job",
        ):
            result = await handler(job) or {}
        if not isinstance(result, dict):
            result = {}
        await _mark_completed(db, job_id=job_id, result=result, started_at=job.get("started_at"))
        logger.info("[render_worker] job %s completed (type=%s)", job_id, document_type)'''
          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/one-shot-global-local-time-p0.yml
          git rm .github/workflows/one-shot-global-local-time-pr.yml

      - name: Validate syntax and focused tests
        run: |
          python -m compileall -q backend/utils/client_time.py backend/audit_service.py backend/routers/audit_logs.py backend/services/render_worker.py backend/pdf
          python -m pytest -q backend/tests/test_global_local_time_contract_p0.py backend/tests/test_professor_attendance_entrypoint_p0.py

      - name: Commit generated global fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(time): aplicar fuso local global em UI auditoria e documentos"
          git push origin HEAD:fix/global-local-time-contract-p0
