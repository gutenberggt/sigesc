name: "P0 #250 F2.3 Content Projection Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/p0_250_f2_3_content_projection_audit.py'
      - 'backend/tests/test_p0_250_f2_3_content_projection_audit.py'
      - '.github/workflows/p0-250-f2-3-content-projection-readonly-audit.yml'
      - 'memory/audit/P0_250_F2_3_CONTENT_PROJECTION_READONLY_2026-08-30.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-250-f2-3-content-projection-readonly-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.3 content projection collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test structural projection classifications
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/p0_250_f2_3_content_projection_audit.py
          python -m py_compile backend/tests/test_p0_250_f2_3_content_projection_audit.py
          pip install pytest
          pytest -q --noconftest backend/tests/test_p0_250_f2_3_content_projection_audit.py

      - name: Enforce Mongo read-only and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/scripts/p0_250_f2_3_content_projection_audit.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden_attrs = {
              'insert_one', 'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_one', 'delete_many', 'bulk_write', 'find_one_and_update',
              'find_one_and_delete', 'find_one_and_replace', 'drop', 'drop_database',
          }
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in forbidden_attrs:
                      raise SystemExit(f'P0_250_F2_3_MONGO_MUTATOR_CALL_FOUND:{node.func.attr}')

          required = [
              '"database_mutation": False',
              '"production_writes": False',
              '"mongo_reads_only": True',
              '"record_content_emitted": False',
              '"record_ids_emitted": False',
              '"teacher_ids_emitted": False',
              '"student_ids_emitted": False',
              '"student_pii_emitted": False',
              '"access_token_used": False',
              'EXPECTED_COMPONENTS = 9',
              'TARGET_MONTH = 6',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'P0_250_F2_3_REQUIRED_CONTRACT_MISSING:{marker}')
          print('P0_250_F2_3_STATIC_READ_ONLY_PRIVACY_GATE=PASS')
          PY

  production-audit:
    name: Compare management legacy and professor DVD content projections
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[P0-250-F2.3-CONTENT-AUDIT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-scoped F2.3 authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              event = json.load(fh)
          issue = event.get('issue') or {}
          owner = os.environ['REPOSITORY_OWNER']
          creator = ((issue.get('user') or {}).get('login') or '')
          if creator != owner:
              raise SystemExit('P0_250_F2_3_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('P0_250_F2_3_ISSUE_MUST_BE_OPEN')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              line = raw.strip()
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key, value = key.strip(), value.strip()
              if key in values:
                  raise SystemExit(f'P0_250_F2_3_DUPLICATE_FIELD:{key}')
              values[key] = value

          if values.get('P0_250_F2_3_AUDIT') != 'AUTHORIZED':
              raise SystemExit('P0_250_F2_3_AUTHORIZATION_INVALID')
          if values.get('CONFIRMATION') != 'VERIFY_P0_250_F2_3_CONTENT_PROJECTION_READ_ONLY':
              raise SystemExit('P0_250_F2_3_CONFIRMATION_INVALID')

          target = values.get('TARGET_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('P0_250_F2_3_TARGET_SHA_INVALID')
          if issue.get('title') != f'[P0-250-F2.3-CONTENT-AUDIT] {target}':
              raise SystemExit('P0_250_F2_3_TITLE_MISMATCH')

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sigesc-p0-250-f2-3-content-readonly-audit',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              main_sha = json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'P0_250_F2_3_MAIN_MOVED:{main_sha}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'issue_number={issue.get("number")}\n')
          print('P0_250_F2_3_AUDIT_CONTEXT=PASS')
          print(f'TARGET_SHA={target}')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('MONGO_ACCESS=READ_ONLY')
          print('RECORD_CONTENT_EMITTED=NO')
          print('RECORD_IDS_EMITTED=NO')
          print('TEACHER_IDS_EMITTED=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "P0_250_F2_3_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/p0_250_f2_3_prod_key
          chmod 600 ~/.ssh/p0_250_f2_3_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'P0_250_F2_3_SSH_TRUST=PASS'

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/p0_250_f2_3_prod_key" \
              "${PROD_USER}@${PROD_HOST}" \
              bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps \
            --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' \
            --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend" || { echo 'P0_250_F2_3_BACKEND_CONTAINER_NOT_FOUND'; exit 1; }
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'P0_250_F2_3_BACKEND_CONTAINER_INVALID'; exit 1; }
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"
          echo 'P0_250_F2_3_BACKEND_CONTAINER_RESOLVED=PASS'

      - name: Execute live content projection audit inside backend container
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/p0-250-f2-3-raw.log'
          snapshot='evidence/p0-250-f2-3-snapshot.json'
          remote_command="timeout 180 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"p0_250_f2_3_content_projection_audit.py\",\"exec\"),ns); print(\"P0_250_F2_3_AUDIT_JSON=\" + json.dumps(ns[\"run_live_audit\"](), ensure_ascii=False))'"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/p0_250_f2_3_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "$remote_command" \
            < backend/scripts/p0_250_f2_3_content_projection_audit.py \
            > "$raw" 2>&1

          prefix='P0_250_F2_3_AUDIT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then
            echo 'P0_250_F2_3_SNAPSHOT_MARKER_NOT_FOUND'
            tail -n 30 "$raw" || true
            exit 2
          fi
          printf '%s' "${line#${prefix}}" > "$snapshot"
          python -m json.tool "$snapshot" >/dev/null
          rm -f "$raw"
          echo 'P0_250_F2_3_LIVE_COLLECTION=PASS'

      - name: Publish structural diagnosis only
        id: diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path('evidence/p0-250-f2-3-snapshot.json').read_text(encoding='utf-8'))
          for key in (
              'database_mutation', 'production_writes', 'record_content_emitted',
              'record_ids_emitted', 'teacher_ids_emitted', 'student_ids_emitted',
              'student_pii_emitted', 'access_token_used',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'P0_250_F2_3_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True:
              raise SystemExit('P0_250_F2_3_MONGO_READ_BOUNDARY_FAILED')
          if p.get('http_methods') != []:
              raise SystemExit('P0_250_F2_3_HTTP_BOUNDARY_FAILED')

          a = p.get('analysis') or {}
          print(f"AUDIT_STATUS={p.get('status')}")
          print(f"CLASSIFICATION={p.get('classification')}")
          print(f"ASSIGNMENT_COMPONENTS={a.get('assignment_component_count')}")
          print(f"LEGACY_TEACHER_ASSIGNMENT_COMPONENTS={a.get('legacy_teacher_assignment_component_count')}")
          print(f"MANAGEMENT_LEGACY_RECORDS={a.get('management_legacy_record_count')}")
          print(f"PROFESSOR_PROJECTION_RECORDS={a.get('professor_projection_record_count')}")
          print(f"COMMON_SLOTS={a.get('common_slot_count')}")
          print(f"MANAGEMENT_ONLY_SLOTS={a.get('management_only_slot_count')}")
          print(f"PROFESSOR_ONLY_SLOTS={a.get('professor_only_slot_count')}")
          print(f"UNEXPECTED_MANAGEMENT_ONLY={a.get('unexpected_management_only_slot_count')}")
          print(f"SCOPE_EXPLAINED_MANAGEMENT_ONLY={a.get('scope_explained_management_only_slot_count')}")
          print(f"CUTOVER_EXPLAINED_MANAGEMENT_ONLY={a.get('cutover_explained_management_only_slot_count')}")
          for row in a.get('management_only_slots') or []:
              print(
                  'MANAGEMENT_ONLY_DATE=' + str(row.get('date'))
                  + '|COURSE=' + str(row.get('course_name') or row.get('course_id'))
                  + '|REASON=' + str(row.get('reason'))
                  + '|COUNT=' + str(row.get('management_record_count'))
              )
          for row in a.get('professor_only_slots') or []:
              print(
                  'PROFESSOR_ONLY_DATE=' + str(row.get('date'))
                  + '|COURSE=' + str(row.get('course_name') or row.get('course_id'))
                  + '|SOURCES=' + ','.join(row.get('sources') or [])
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"classification={p.get('classification')}\n")
              out.write(f"assignment_components={a.get('assignment_component_count')}\n")
              out.write(f"management_records={a.get('management_legacy_record_count')}\n")
              out.write(f"professor_records={a.get('professor_projection_record_count')}\n")
              out.write(f"management_only={a.get('management_only_slot_count')}\n")
              out.write(f"unexpected_management_only={a.get('unexpected_management_only_slot_count')}\n")
          PY

      - name: Upload private structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-250-f2-3-content-projection-readonly-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Annotate and close F2.3 audit trigger issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          CLASSIFICATION: ${{ steps.diagnosis.outputs.classification }}
          ASSIGNMENT_COMPONENTS: ${{ steps.diagnosis.outputs.assignment_components }}
          MANAGEMENT_RECORDS: ${{ steps.diagnosis.outputs.management_records }}
          PROFESSOR_RECORDS: ${{ steps.diagnosis.outputs.professor_records }}
          MANAGEMENT_ONLY: ${{ steps.diagnosis.outputs.management_only }}
          UNEXPECTED_MANAGEMENT_ONLY: ${{ steps.diagnosis.outputs.unexpected_management_only }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ISSUE_NUMBER" || exit 0
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          classification = os.environ.get('CLASSIFICATION') or 'AUDIT_INCOMPLETE'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-p0-250-f2-3-content-readonly-audit',
          }
          body = {
              'body': (
                  f'P0 #250 F2.3 content projection read-only audit: **{classification}**\n\n'
                  f'- Target SHA: `{os.environ.get("TARGET_SHA")}`\n'
                  f'- Workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
                  f'- Professor content components: `{os.environ.get("ASSIGNMENT_COMPONENTS")}`\n'
                  f'- Management legacy records: `{os.environ.get("MANAGEMENT_RECORDS")}`\n'
                  f'- Professor projection records: `{os.environ.get("PROFESSOR_RECORDS")}`\n'
                  f'- Management-only date/component slots: `{os.environ.get("MANAGEMENT_ONLY")}`\n'
                  f'- Unexpected management-only slots inside authorized scope: `{os.environ.get("UNEXPECTED_MANAGEMENT_ONLY")}`\n'
                  '- MongoDB access: **READ ONLY**\n'
                  '- Database mutation: **NO**\n'
                  '- Record content/record IDs/teacher IDs emitted: **NO**\n'
                  '- Student data emitted: **NO**'
              )
          }
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              data=json.dumps(body).encode(),
              method='POST',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30):
              pass
          if classification != 'AUDIT_INCOMPLETE':
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}',
                  data=json.dumps({'state': 'closed'}).encode(),
                  method='PATCH',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30):
                  pass
          PY
