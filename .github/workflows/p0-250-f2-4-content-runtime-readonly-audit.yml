name: "P0 #250 F2.4 Content Runtime Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/p0_250_f2_4_content_runtime_contract_audit.py'
      - 'backend/tests/test_p0_250_f2_4_content_runtime_contract_audit.py'
      - 'memory/audit/tools/p0_250_f2_4_browser_probe.js'
      - '.github/workflows/p0-250-f2-4-content-runtime-readonly-audit.yml'
      - 'memory/audit/P0_250_F2_4_CONTENT_RUNTIME_PARITY_2026-08-30.md'
      - 'frontend/src/services/contentDvdBridge.js'
      - 'frontend/src/pages/LearningObjects.js'
      - 'backend/routers/learning_objects.py'
      - 'backend/services/legacy_content_dvd_guard.py'
      - 'backend/services/teacher_diaries.py'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-250-f2-4-content-runtime-readonly-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.4 runtime contract collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test runtime classifications
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/p0_250_f2_4_content_runtime_contract_audit.py
          python -m py_compile backend/tests/test_p0_250_f2_4_content_runtime_contract_audit.py
          pip install pytest
          pytest -q --noconftest backend/tests/test_p0_250_f2_4_content_runtime_contract_audit.py

      - name: Enforce Mongo read-only and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('backend/scripts/p0_250_f2_4_content_runtime_contract_audit.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden_attrs = {
              'insert_one', 'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_one', 'delete_many', 'bulk_write', 'find_one_and_update',
              'find_one_and_delete', 'find_one_and_replace', 'drop', 'drop_database',
          }
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in forbidden_attrs:
                      raise SystemExit(f'P0_250_F2_4_MONGO_MUTATOR_CALL_FOUND:{node.func.attr}')

          required = [
              '"database_mutation": False',
              '"production_writes": False',
              '"http_methods": []',
              '"mongo_reads_only": True',
              '"record_content_emitted": False',
              '"record_ids_emitted": False',
              '"teacher_ids_emitted": False',
              '"student_ids_emitted": False',
              '"student_pii_emitted": False',
              '"access_token_used": False',
              'CONTENT_RUNTIME_LEGACY_FALLBACK_BLOCKED',
              'EXPECTED_COMPONENTS = 9',
              'TARGET_MONTH = 6',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'P0_250_F2_4_REQUIRED_CONTRACT_MISSING:{marker}')
          print('P0_250_F2_4_STATIC_READ_ONLY_PRIVACY_GATE=PASS')
          PY

      - name: Pin the current frontend/backend runtime semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bridge = Path('frontend/src/services/contentDvdBridge.js').read_text(encoding='utf-8')
          page = Path('frontend/src/pages/LearningObjects.js').read_text(encoding='utf-8')
          router = Path('backend/routers/learning_objects.py').read_text(encoding='utf-8')
          guard = Path('backend/services/legacy_content_dvd_guard.py').read_text(encoding='utf-8')
          diaries = Path('backend/services/teacher_diaries.py').read_text(encoding='utf-8')
          probe = Path('memory/audit/tools/p0_250_f2_4_browser_probe.js').read_text(encoding='utf-8')

          markers = {
              'bridge_legacy_fallback': 'if (candidates.length === 0) return config;' in bridge,
              'router_legacy_guard': 'await _block_legacy_if_dvd(current_user, class_id, course_id)' in router,
              'guard_enabled_assignment': '"diary_settings.enabled": True' in guard,
              'diaries_canonical_revalidation': 'authorize_assignment_access(' in diaries,
              'load_records_error_is_silent': "console.error('Erro ao carregar registros:', error);" in page,
              'probe_get_only': "meta.method === 'GET'" in probe,
          }
          missing = [name for name, present in markers.items() if not present]
          if missing:
              raise SystemExit('P0_250_F2_4_RUNTIME_MARKER_MISSING:' + ','.join(missing))

          start = page.index('const loadRecords = async () => {')
          end = page.index('// Carregar componentes curriculares da turma selecionada', start)
          load_records = page[start:end]
          catch_pos = load_records.index('} catch (error) {')
          catch_body = load_records[catch_pos:]
          if 'setRecords([])' in catch_body:
              raise SystemExit('P0_250_F2_4_STALE_STATE_ASSUMPTION_CHANGED')

          forbidden_probe = ['fetch(', 'axios.', 'localStorage.setItem', 'sessionStorage.setItem']
          for token in forbidden_probe:
              if token in probe:
                  raise SystemExit(f'P0_250_F2_4_BROWSER_PROBE_WRITE_OR_REQUEST_FOUND:{token}')
          print('P0_250_F2_4_RUNTIME_CONTRACT_PIN=PASS')
          PY

  production-audit:
    name: Evaluate professor content runtime contract in production
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[P0-250-F2.4-RUNTIME-AUDIT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-scoped F2.4 authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              event = json.load(fh)
          issue = event.get('issue') or {}
          owner = os.environ['REPOSITORY_OWNER']
          if ((issue.get('user') or {}).get('login') or '') != owner:
              raise SystemExit('P0_250_F2_4_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('P0_250_F2_4_ISSUE_MUST_BE_OPEN')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              line = raw.strip()
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key, value = key.strip(), value.strip()
              if key in values:
                  raise SystemExit(f'P0_250_F2_4_DUPLICATE_FIELD:{key}')
              values[key] = value

          if values.get('P0_250_F2_4_AUDIT') != 'AUTHORIZED':
              raise SystemExit('P0_250_F2_4_AUTHORIZATION_INVALID')
          if values.get('CONFIRMATION') != 'VERIFY_P0_250_F2_4_CONTENT_RUNTIME_READ_ONLY':
              raise SystemExit('P0_250_F2_4_CONFIRMATION_INVALID')

          target = values.get('TARGET_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('P0_250_F2_4_TARGET_SHA_INVALID')
          if issue.get('title') != f'[P0-250-F2.4-RUNTIME-AUDIT] {target}':
              raise SystemExit('P0_250_F2_4_TITLE_MISMATCH')

          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sigesc-p0-250-f2-4-runtime-readonly-audit',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              main_sha = json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'P0_250_F2_4_MAIN_MOVED:{main_sha}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'issue_number={issue.get("number")}\n')
          print('P0_250_F2_4_AUDIT_CONTEXT=PASS')
          print(f'TARGET_SHA={target}')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('HTTP_METHODS=NONE')
          print('MONGO_ACCESS=READ_ONLY')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "P0_250_F2_4_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/p0_250_f2_4_prod_key
          chmod 600 ~/.ssh/p0_250_f2_4_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'P0_250_F2_4_SSH_TRUST=PASS'

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/p0_250_f2_4_prod_key" \
              "${PROD_USER}@${PROD_HOST}" \
              bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps \
            --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' \
            --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend" || { echo 'P0_250_F2_4_BACKEND_CONTAINER_NOT_FOUND'; exit 1; }
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'P0_250_F2_4_BACKEND_CONTAINER_INVALID'; exit 1; }
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"
          echo 'P0_250_F2_4_BACKEND_CONTAINER_RESOLVED=PASS'

      - name: Execute live runtime contract audit inside backend container
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/p0-250-f2-4-raw.log'
          snapshot='evidence/p0-250-f2-4-snapshot.json'
          remote_command="timeout 180 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"p0_250_f2_4_content_runtime_contract_audit.py\",\"exec\"),ns); print(\"P0_250_F2_4_AUDIT_JSON=\" + json.dumps(ns[\"run_live_audit\"](), ensure_ascii=False))'"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/p0_250_f2_4_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "$remote_command" \
            < backend/scripts/p0_250_f2_4_content_runtime_contract_audit.py \
            > "$raw" 2>&1

          prefix='P0_250_F2_4_AUDIT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then
            echo 'P0_250_F2_4_SNAPSHOT_MARKER_NOT_FOUND'
            tail -n 30 "$raw" || true
            exit 2
          fi
          printf '%s' "${line#${prefix}}" > "$snapshot"
          python -m json.tool "$snapshot" >/dev/null
          rm -f "$raw"
          echo 'P0_250_F2_4_LIVE_COLLECTION=PASS'

      - name: Publish structural diagnosis only
        id: diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path('evidence/p0-250-f2-4-snapshot.json').read_text(encoding='utf-8'))
          for key in (
              'database_mutation', 'production_writes', 'record_content_emitted',
              'record_ids_emitted', 'teacher_ids_emitted', 'student_ids_emitted',
              'student_pii_emitted', 'access_token_used',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'P0_250_F2_4_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True:
              raise SystemExit('P0_250_F2_4_MONGO_READ_BOUNDARY_FAILED')
          if p.get('http_methods') != []:
              raise SystemExit('P0_250_F2_4_HTTP_BOUNDARY_FAILED')

          a = p.get('analysis') or {}
          print(f"AUDIT_STATUS={p.get('status')}")
          print(f"CLASSIFICATION={p.get('classification')}")
          print(f"FRONTEND_EXPECTED_ROUTE={a.get('frontend_expected_route')}")
          print(f"BACKEND_LEGACY_EXPECTED_STATUS={a.get('backend_legacy_expected_status')}")
          print(f"CONTENT_ENABLED_DIARIES={a.get('content_enabled_diary_count')}")
          print(f"LEGACY_GUARD_MATCHES={a.get('legacy_guard_match_count')}")
          print(f"LEGACY_RECORDS={a.get('legacy_record_count')}")
          print(f"TEACHER_ASSIGNMENT_COMPONENTS={a.get('teacher_assignment_component_count')}")
          print(f"TARGET_DIARIES={a.get('target_diary_count')}")
          print(f"BLOCKED_DIARIES={a.get('blocked_diary_count')}")
          print(f"STALE_UI_RISK={a.get('stale_ui_risk_if_previous_records_exist')}")
          print('REPORTED_DATE_COUNTS=' + json.dumps(a.get('reported_date_record_counts') or {}, ensure_ascii=False))

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"classification={p.get('classification')}\n")
              out.write(f"frontend_route={a.get('frontend_expected_route')}\n")
              out.write(f"legacy_status={a.get('backend_legacy_expected_status')}\n")
              out.write(f"content_enabled={a.get('content_enabled_diary_count')}\n")
              out.write(f"guard_matches={a.get('legacy_guard_match_count')}\n")
              out.write(f"legacy_records={a.get('legacy_record_count')}\n")
              out.write(f"stale_ui_risk={str(bool(a.get('stale_ui_risk_if_previous_records_exist'))).lower()}\n")
          PY

      - name: Upload private structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-250-f2-4-content-runtime-readonly-${{ github.run_id }}
          path: evidence/p0-250-f2-4-snapshot.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment diagnosis on #250 and close gate issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.issue_number }}
          CLASSIFICATION: ${{ steps.diagnosis.outputs.classification }}
          FRONTEND_ROUTE: ${{ steps.diagnosis.outputs.frontend_route }}
          LEGACY_STATUS: ${{ steps.diagnosis.outputs.legacy_status }}
          CONTENT_ENABLED: ${{ steps.diagnosis.outputs.content_enabled }}
          GUARD_MATCHES: ${{ steps.diagnosis.outputs.guard_matches }}
          LEGACY_RECORDS: ${{ steps.diagnosis.outputs.legacy_records }}
          STALE_UI_RISK: ${{ steps.diagnosis.outputs.stale_ui_risk }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          body = (
              '## F2.4 — runtime contract read-only em produção\n\n'
              f"Target: `{os.environ['TARGET_SHA']}`\n\n"
              f"Classificação: **{os.environ['CLASSIFICATION']}**\n\n"
              f"- frontend expected route: `{os.environ['FRONTEND_ROUTE']}`\n"
              f"- backend legacy expected status: `{os.environ['LEGACY_STATUS']}`\n"
              f"- content-enabled diaries: `{os.environ['CONTENT_ENABLED']}`\n"
              f"- legacy guard matches: `{os.environ['GUARD_MATCHES']}`\n"
              f"- legacy records in June: `{os.environ['LEGACY_RECORDS']}`\n"
              f"- stale UI risk if an earlier record set exists: `{os.environ['STALE_UI_RISK']}`\n\n"
              'Boundaries: MongoDB read-only; no HTTP request executed by the collector; '
              'no content, record IDs, teacher IDs, student IDs, student data or auth material emitted.'
          )

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'sigesc-p0-250-f2-4-runtime-readonly-audit',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          request('POST', '/issues/250/comments', {'body': body})
          gate = os.environ['GATE_ISSUE']
          request('PATCH', f'/issues/{gate}', {'state': 'closed', 'state_reason': 'completed'})
          print('P0_250_F2_4_GITHUB_REPORT=PASS')
          PY
