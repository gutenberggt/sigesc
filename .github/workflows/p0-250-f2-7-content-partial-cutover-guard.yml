name: "P0 #250 F2.7 Content Partial Cutover Guard"

on:
  pull_request:
    paths:
      - 'backend/services/professor_content_projection.py'
      - 'backend/services/content_form_canonical_cutover.py'
      - 'backend/services/content_pdf_partial_cutover.py'
      - 'backend/routers/content_partial_cutover.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_p0_250_f2_7_content_partial_cutover.py'
      - 'backend/tests/test_p0_content_explicit_assignment_bridge.py'
      - 'backend/tests/test_content_pdf_partial_cutover.py'
      - 'backend/tests/test_curriculum_teacher_writer_f4.py'
      - 'frontend/src/services/contentPartialCutoverResolver.js'
      - 'frontend/src/hooks/useDiaryPrefill.js'
      - '.github/workflows/p0-250-f2-7-content-partial-cutover-guard.yml'
      - 'memory/audit/P0_250_F2_7_CONTENT_PARTIAL_CUTOVER_2026-08-30.md'

permissions:
  contents: read

jobs:
  guard:
    name: Guard 7 DVD + 2 legacy mixed projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run F2.7/F4 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/services/professor_content_projection.py
          python -m py_compile backend/services/content_form_canonical_cutover.py
          python -m py_compile backend/services/content_pdf_partial_cutover.py
          python -m py_compile backend/routers/content_partial_cutover.py
          python -m py_compile backend/tests/test_p0_250_f2_7_content_partial_cutover.py
          python -m py_compile backend/tests/test_p0_content_explicit_assignment_bridge.py
          python -m py_compile backend/tests/test_content_pdf_partial_cutover.py
          pip install pytest pytest-asyncio
          PYTHONPATH=backend pytest -q --noconftest \
            backend/tests/test_p0_250_f2_7_content_partial_cutover.py \
            backend/tests/test_p0_content_explicit_assignment_bridge.py \
            backend/tests/test_content_pdf_partial_cutover.py

      - name: Enforce fail-closed mixed-source and canonical-write contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          projection_path = Path('backend/services/professor_content_projection.py')
          writer_path = Path('backend/services/content_form_canonical_cutover.py')
          pdf_path = Path('backend/services/content_pdf_partial_cutover.py')
          adapter_path = Path('backend/routers/content_partial_cutover.py')
          resolver_path = Path('frontend/src/services/contentPartialCutoverResolver.js')
          hook_path = Path('frontend/src/hooks/useDiaryPrefill.js')

          projection = projection_path.read_text(encoding='utf-8')
          writer = writer_path.read_text(encoding='utf-8')
          pdf = pdf_path.read_text(encoding='utf-8')
          adapter = adapter_path.read_text(encoding='utf-8')
          resolver = resolver_path.read_text(encoding='utf-8')
          hook = hook_path.read_text(encoding='utf-8')

          required_projection = [
              '"status": "ativo"',
              '"class_id": class_id',
              '"academic_year": academic_year',
              '"mantenedora_id": mantenedora_id',
              'legacy_only_course_ids = entitled_course_ids - canonical_course_ids',
              '"course_id": {"$in": sorted(legacy_only_course_ids)}',
              'await list_assignment_content_history(',
              'await list_teacher_diaries(',
              'CANONICAL_CONTENT_HISTORY_UNAVAILABLE',
          ]
          for marker in required_projection:
              if marker not in projection:
                  raise SystemExit(f'P0_250_F2_7_REQUIRED_PROJECTION_MARKER_MISSING:{marker}')

          required_adapter = [
              'list_learning_objects_cutover(',
              'create_from_learning_object_form(',
              'update_from_learning_object_form(',
              'delete_from_learning_object_form(',
              'generate_professor_classwide_pdf(',
              'current_user.get("role") != "professor"',
          ]
          for marker in required_adapter:
              if marker not in adapter:
                  raise SystemExit(f'P0_250_F4_ADAPTER_CONTRACT_CHANGED:{marker}')

          required_writer = [
              'save_content_canonical(',
              '_active_entitled_course_ids(',
              'filter_visible_content_entries(',
              'FORM_WRITER_ORIGIN = "learning_objects_form_f4"',
          ]
          for marker in required_writer:
              if marker not in writer:
                  raise SystemExit(f'P0_250_F4_WRITER_CONTRACT_CHANGED:{marker}')

          required_pdf = [
              'list_learning_objects_cutover(',
              'legacy_items=[]',
              'period_start <= str(item.get("date") or "")[:10] <= period_end',
          ]
          for marker in required_pdf:
              if marker not in pdf:
                  raise SystemExit(f'P0_250_F4_PDF_CONTRACT_CHANGED:{marker}')

          required_frontend = [
              "window.location.pathname === '/professor/objetos-conhecimento'",
              'if (!classId || componentId) return config;',
              'config.__skipContentDvdBridge = true;',
          ]
          for marker in required_frontend:
              if marker not in resolver:
                  raise SystemExit(f'P0_250_F2_7_FRONTEND_GATE_CHANGED:{marker}')
          if "@/services/contentPartialCutoverResolver" not in hook:
              raise SystemExit('P0_250_F2_7_FRONTEND_RESOLVER_NOT_INSTALLED')

          # A projeção F2.7 e o serviço de PDF são estritamente read-only. A F4
          # pode mutar somente o writer canônico/adapter; nunca estas camadas.
          forbidden_mutators = {
              'insert_one', 'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_one', 'delete_many', 'bulk_write', 'find_one_and_update',
              'find_one_and_delete', 'find_one_and_replace', 'drop', 'drop_database',
          }
          for path, source in ((projection_path, projection), (pdf_path, pdf)):
              tree = ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in forbidden_mutators:
                          raise SystemExit(
                              f'P0_250_F2_7_READ_ONLY_MUTATOR_FOUND:{path}:{node.func.attr}'
                          )

          # F4 nunca deve reabrir escrita em learning_objects. O legado pode ser
          # consultado somente pelo projection service já entitlement-scoped.
          forbidden_legacy_writes = [
              'learning_objects.insert_one',
              'learning_objects.insert_many',
              'learning_objects.update_one',
              'learning_objects.update_many',
              'learning_objects.replace_one',
              'learning_objects.delete_one',
              'learning_objects.delete_many',
          ]
          for path, source in ((adapter_path, adapter), (writer_path, writer), (pdf_path, pdf)):
              for marker in forbidden_legacy_writes:
                  if marker in source:
                      raise SystemExit(f'P0_250_F4_LEGACY_WRITE_REOPENED:{path}:{marker}')

          # Não é permitido reabrir o legado class-wide sem um $in derivado dos
          # teacher_assignments do professor.
          if 'db.learning_objects.find(' in adapter or 'learning_objects.find(' in pdf:
              raise SystemExit('P0_250_F2_7_ROUTER_MUST_NOT_REIMPLEMENT_LEGACY_QUERY')
          if 'course_id": {"$in": sorted(legacy_only_course_ids)}' not in projection:
              raise SystemExit('P0_250_F2_7_LEGACY_FALLBACK_NOT_ENTITLEMENT_SCOPED')

          print('P0_250_F2_7_PARTIAL_CUTOVER_GUARD=PASS')
          print('P0_250_F4_CANONICAL_WRITER_GUARD=PASS')
          print('P0_250_F4_CLASSWIDE_PDF_GUARD=PASS')
          print('PROJECTION_DATABASE_MUTATION=NO')
          print('PDF_DATABASE_MUTATION=NO')
          print('LEGACY_DATABASE_WRITE=NO')
          print('RBAC_EXPANSION=NO')
          print('LEGACY_CLASSWIDE_UNRESTRICTED=NO')
          PY
