name: "P0 #250 F2.8 Global DVD Reconciliation Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/p0_250_f2_8_global_dvd_reconciliation_audit.py'
      - 'backend/tests/test_p0_250_f2_8_global_dvd_reconciliation_audit.py'
      - '.github/workflows/p0-250-f2-8-global-dvd-reconciliation-readonly-audit.yml'
      - 'memory/audit/P0_250_F2_8_GLOBAL_DVD_RECONCILIATION_2026-08-30.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-250-f2-8-global-dvd-reconciliation-readonly-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.8 global reconciliation collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run synthetic classifications
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/p0_250_f2_8_global_dvd_reconciliation_audit.py
          python -m py_compile backend/tests/test_p0_250_f2_8_global_dvd_reconciliation_audit.py
          pip install pytest pymongo
          pytest -q --noconftest backend/tests/test_p0_250_f2_8_global_dvd_reconciliation_audit.py
      - name: Enforce Mongo read-only and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('backend/scripts/p0_250_f2_8_global_dvd_reconciliation_audit.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden = {
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr in forbidden:
                  raise SystemExit(f'P0_250_F2_8_MONGO_MUTATOR_CALL_FOUND:{node.func.attr}')
          required = [
              '"database_mutation": False',
              '"production_writes": False',
              '"http_methods": []',
              '"mongo_reads_only": True',
              '"academic_data_read": False',
              '"record_ids_emitted": False',
              '"assignment_ids_emitted": False',
              '"teacher_ids_emitted": False',
              '"staff_ids_emitted": False',
              '"student_data_read": False',
              '"user_pii_emitted": False',
              'GLOBAL_DVD_PARTIAL_CUTOVER_PRESENT',
              'PARTIAL_CUTOVER_COMPONENT_MISSING',
              'CANONICAL_COVERED',
              'OUT_OF_DVD_SCOPE',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'P0_250_F2_8_CONTRACT_MISSING:{marker}')
          print('P0_250_F2_8_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Inventory global teacher assignment cutover in production
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[P0-250-F2.8-GLOBAL-CUTOVER-AUDIT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve owner-scoped exact-SHA authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, os, re, urllib.request
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              issue = (json.load(fh).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('P0_250_F2_8_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('P0_250_F2_8_ISSUE_MUST_BE_OPEN')
          values = {}
          for raw in (issue.get('body') or '').splitlines():
              line = raw.strip()
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in values:
                  raise SystemExit(f'P0_250_F2_8_DUPLICATE_FIELD:{key}')
              values[key] = value.strip()
          if values.get('P0_250_F2_8_AUDIT') != 'AUTHORIZED':
              raise SystemExit('P0_250_F2_8_AUTHORIZATION_INVALID')
          if values.get('CONFIRMATION') != 'VERIFY_P0_250_F2_8_GLOBAL_DVD_RECONCILIATION_READ_ONLY':
              raise SystemExit('P0_250_F2_8_CONFIRMATION_INVALID')
          if values.get('ACADEMIC_YEAR') != '2026':
              raise SystemExit('P0_250_F2_8_ACADEMIC_YEAR_INVALID')
          target = values.get('TARGET_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('P0_250_F2_8_TARGET_SHA_INVALID')
          if issue.get('title') != f'[P0-250-F2.8-GLOBAL-CUTOVER-AUDIT] {target}':
              raise SystemExit('P0_250_F2_8_TITLE_MISMATCH')
          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches/main',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'sigesc-p0-250-f2-8-readonly-audit',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              main_sha = json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'P0_250_F2_8_MAIN_MOVED:{main_sha}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'issue_number={issue.get("number")}\n')
          print('P0_250_F2_8_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('MONGO_ACCESS=READ_ONLY')
          print('ACADEMIC_DATA_READ=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "P0_250_F2_8_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/p0_250_f2_8_prod_key
          chmod 600 ~/.ssh/p0_250_f2_8_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/p0_250_f2_8_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute global Mongo read-only inventory
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/p0-250-f2-8-raw.log'
          snapshot='evidence/p0-250-f2-8-snapshot.json'
          remote_command="timeout 300 docker exec -i -e P0_250_F2_8_ACADEMIC_YEAR=2026 ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"p0_250_f2_8_global_dvd_reconciliation_audit.py\",\"exec\"),ns); print(\"P0_250_F2_8_AUDIT_JSON=\" + json.dumps(ns[\"run_live_audit\"](), ensure_ascii=False))'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/p0_250_f2_8_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/p0_250_f2_8_global_dvd_reconciliation_audit.py > "$raw" 2>&1
          prefix='P0_250_F2_8_AUDIT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line" || { tail -n 80 "$raw" || true; exit 2; }
          printf '%s' "${line#${prefix}}" > "$snapshot"
          python -m json.tool "$snapshot" >/dev/null
          rm -f "$raw"

      - name: Validate global structural diagnosis
        id: diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('evidence/p0-250-f2-8-snapshot.json').read_text(encoding='utf-8'))
          for key in (
              'database_mutation','production_writes','academic_data_read','record_content_emitted',
              'record_ids_emitted','assignment_ids_emitted','teacher_ids_emitted','staff_ids_emitted',
              'student_data_read','student_pii_emitted','user_pii_emitted',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'P0_250_F2_8_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True or p.get('http_methods') != []:
              raise SystemExit('P0_250_F2_8_READ_BOUNDARY_FAILED')
          a = p.get('analysis') or {}
          print('CLASSIFICATION=' + str(p.get('classification')))
          print('ACTIVE_LEGACY_COMPONENT_PAIRS=' + str(a.get('active_legacy_component_pairs')))
          print('DVD_ELIGIBLE_COMPONENT_PAIRS=' + str(a.get('dvd_eligible_component_pairs')))
          print('CANONICAL_COMPONENT_PAIRS=' + str(a.get('canonical_component_pairs')))
          print('UNRESOLVED_ELIGIBLE_COMPONENT_PAIRS=' + str(a.get('unresolved_eligible_component_pairs')))
          print('GROUP_STATES=' + json.dumps(a.get('teacher_class_classification_counts') or {}, sort_keys=True))
          print('COMPONENT_STATES=' + json.dumps(a.get('component_classification_counts') or {}, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"classification={p.get('classification')}\n")
              out.write(f"active_pairs={a.get('active_legacy_component_pairs')}\n")
              out.write(f"eligible_pairs={a.get('dvd_eligible_component_pairs')}\n")
              out.write(f"canonical_pairs={a.get('canonical_component_pairs')}\n")
              out.write(f"unresolved_pairs={a.get('unresolved_eligible_component_pairs')}\n")
          PY

      - name: Upload private structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-250-f2-8-global-dvd-reconciliation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Comment aggregate diagnosis on #250 and close gate issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.issue_number }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          CLASSIFICATION: ${{ steps.diagnosis.outputs.classification }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p = json.loads(Path('evidence/p0-250-f2-8-snapshot.json').read_text(encoding='utf-8'))
          a = p.get('analysis') or {}
          body = (
              '## F2.8 — inventário global read-only de reconciliação docente/DVD\n\n'
              f"Target: `{os.environ['TARGET_SHA']}`\n"
              f"Classificação: **{os.environ['CLASSIFICATION']}**\n"
              f"Pares ativos legado (professor/turma/componente): **{a.get('active_legacy_component_pairs')}**\n"
              f"Pares elegíveis ao DVD: **{a.get('dvd_eligible_component_pairs')}**\n"
              f"Pares já cobertos canonicamente: **{a.get('canonical_component_pairs')}**\n"
              f"Pares elegíveis ainda não reconciliados: **{a.get('unresolved_eligible_component_pairs')}**\n"
              f"Estados professor+turma: `{json.dumps(a.get('teacher_class_classification_counts') or {}, sort_keys=True)}`\n"
              f"Estados por componente: `{json.dumps(a.get('component_classification_counts') or {}, sort_keys=True)}`\n"
              f"Falhas estruturais DVD: `{json.dumps(a.get('invalid_dvd_reason_counts') or {}, sort_keys=True)}`\n\n"
              'A auditoria é global para 2026 e não usa nomes de professor, escola ou componente. '
              'Boundaries: MongoDB read-only; sem HTTP de aplicação; sem leitura de notas, frequência ou conteúdo; sem IDs/PII emitidos.'
          )
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def request(method, path, payload):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'), method=method,
                  headers={
                      'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}',
                      'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-p0-250-f2-8-readonly-audit',
                      'Content-Type':'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()
          request('POST', '/issues/250/comments', {'body': body})
          request('PATCH', f"/issues/{os.environ['GATE_ISSUE']}", {'state':'closed','state_reason':'completed'})
          PY
