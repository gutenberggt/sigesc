name: "P0 #250 F2.9C.1 Authorized 48 DVD Backfill Retry"

on:
  pull_request:
    paths:
      - '.github/workflows/p0-250-f2-9c1-authorized-backfill-48-retry.yml'
      - 'memory/audit/P0_250_F2_9C1_ARTIFACT_TRANSPORT_2026-08-31.md'
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: p0-250-f2-9c1-authorized-backfill-48-retry
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2.9C.1 transport-only retry contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable planner, sealer and executor blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object backend/scripts/p0_250_f2_9a_global_dvd_reconciliation_plan.py)" = "42178d99c479ab43d4345c4a5346cac6735eefd3"
          test "$(git hash-object backend/scripts/p0_250_f2_9b_seal_safe_backfill_targets.py)" = "940e171b434b04914887e080dc8af6a8e9296c4a"
          test "$(git hash-object backend/scripts/p0_250_f2_9c_authorized_backfill_48.py)" = "fbf075ba7dbad3e544d157bc163c3ea57aa31dcf"

      - name: Re-run exact F2.9C focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/p0_250_f2_9c_authorized_backfill_48.py
          python -m pip install pytest pymongo
          pytest -q --noconftest backend/tests/test_p0_250_f2_9c_authorized_backfill_48.py

      - name: Guard retry changes only artifact transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/p0-250-f2-9c1-authorized-backfill-48-retry.yml').read_text(encoding='utf-8')
          required = [
              'gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9745250820"',
              'gh run download 33356353896',
              'p0-250-f2-9b-sealed-48-targets-33356353896',
              'fbfe46dd455e45ad65c510d75022d52918c8993c21cc76593f1915d5324fb177',
              'f3fb8c4b7d8d3a9e51939b8cf2d40e756759744e431471d073afd038295b47e5',
              'ddca5bb662a5670b96459ad5f5748f123ed65e52bdd2fe739e933b18d4d164d4',
              'SOURCE_F2_9B_ARTIFACT_ID',
              'Execute same sealed 48-target backfill',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit('P0_250_F2_9C1_CONTRACT_MISSING:' + marker)
          forbidden = [
              'insert_many', 'update_one', 'update_many', 'replace_one',
              'delete_many', 'bulk_write', 'drop_database',
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit('P0_250_F2_9C1_WORKFLOW_MUTATION_EXPANSION:' + marker)
          print('P0_250_F2_9C1_TRANSPORT_GUARD=PASS')
          PY

  production-execute:
    name: Execute same sealed 48-target backfill
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[P0-250-F2.9C1-EXECUTE-48-TARGETS] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve owner exact-SHA authorization for identical sealed scope
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              issue = (json.load(fh).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('P0_250_F2_9C1_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('P0_250_F2_9C1_ISSUE_MUST_BE_OPEN')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              line = raw.strip()
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in values:
                  raise SystemExit(f'P0_250_F2_9C1_DUPLICATE_FIELD:{key}')
              values[key] = value.strip()

          expected = {
              'P0_250_F2_9C1_EXECUTE': 'AUTHORIZED',
              'CONFIRMATION': 'APPLY_P0_250_F2_9C1_SAME_SEALED_48_TARGETS',
              'ACADEMIC_YEAR': '2026',
              'REFERENCE_DATE': '2026-08-31',
              'SOURCE_F2_9B_TARGET_SHA': 'eea0ee3b9905b65e82e440243566b6f44926f7af',
              'SOURCE_F2_9B_ARTIFACT_ID': '9745250820',
              'SOURCE_F2_9B_ARTIFACT_DIGEST': '26d0904d231a7ed23f41487a57a8e2fd08b0e0b6ac96b14ef7897d130123ddfd',
              'SEALED_TARGETS_SHA256': 'fbfe46dd455e45ad65c510d75022d52918c8993c21cc76593f1915d5324fb177',
              'SEALED_OPERATIONS_SHA256': 'f3fb8c4b7d8d3a9e51939b8cf2d40e756759744e431471d073afd038295b47e5',
              'SEALED_BUNDLE_SHA256': 'ddca5bb662a5670b96459ad5f5748f123ed65e52bdd2fe739e933b18d4d164d4',
          }
          for key, value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'P0_250_F2_9C1_AUTH_FIELD_INVALID:{key}')

          target = values.get('TARGET_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('P0_250_F2_9C1_TARGET_SHA_INVALID')
          if issue.get('title') != f'[P0-250-F2.9C1-EXECUTE-48-TARGETS] {target}':
              raise SystemExit('P0_250_F2_9C1_TITLE_MISMATCH')

          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sigesc-p0-250-f2-9c1-executor',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              main_sha = json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'P0_250_F2_9C1_MAIN_MOVED:{main_sha}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'issue_number={issue.get("number")}\n')
          print('P0_250_F2_9C1_AUTHORIZATION=PASS')
          print('PRODUCTION_DATABASE_WRITES=EXPLICITLY_AUTHORIZED_SAME_SCOPE')
          PY

      - name: Checkout exact authorized retry SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable planner, sealer and executor blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object backend/scripts/p0_250_f2_9a_global_dvd_reconciliation_plan.py)" = "42178d99c479ab43d4345c4a5346cac6735eefd3"
          test "$(git hash-object backend/scripts/p0_250_f2_9b_seal_safe_backfill_targets.py)" = "940e171b434b04914887e080dc8af6a8e9296c4a"
          test "$(git hash-object backend/scripts/p0_250_f2_9c_authorized_backfill_48.py)" = "fbf075ba7dbad3e544d157bc163c3ea57aa31dcf"

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "P0_250_F2_9C1_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/p0_250_f2_9c1_prod_key
          chmod 600 ~/.ssh/p0_250_f2_9c1_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/p0_250_f2_9c1_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private F2.9B artifact via GitHub CLI
        id: sealed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sealed/unpacked
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9745250820" > evidence/sealed/artifact-metadata.private.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path('evidence/sealed/artifact-metadata.private.json').read_text(encoding='utf-8'))
          if int(metadata.get('id') or 0) != 9745250820:
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_ID_MISMATCH')
          if metadata.get('expired') is not False:
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_EXPIRED')
          if metadata.get('digest') != 'sha256:26d0904d231a7ed23f41487a57a8e2fd08b0e0b6ac96b14ef7897d130123ddfd':
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_DIGEST_MISMATCH')
          if metadata.get('name') != 'p0-250-f2-9b-sealed-48-targets-33356353896':
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_NAME_MISMATCH')
          run = metadata.get('workflow_run') or {}
          if int(run.get('id') or 0) != 33356353896:
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_RUN_MISMATCH')
          if run.get('head_sha') != 'eea0ee3b9905b65e82e440243566b6f44926f7af':
              raise SystemExit('P0_250_F2_9C1_ARTIFACT_HEAD_SHA_MISMATCH')
          print('P0_250_F2_9C1_ARTIFACT_METADATA=PASS')
          PY
          rm -f evidence/sealed/artifact-metadata.private.json

          gh run download 33356353896 \
            --repo "$GITHUB_REPOSITORY" \
            --name p0-250-f2-9b-sealed-48-targets-33356353896 \
            --dir evidence/sealed/unpacked

          mapfile -t manifests < <(find evidence/sealed/unpacked -type f \
            -name 'p0-250-f2-9b-private-sealed-manifest.json' -print)
          test "${#manifests[@]}" -eq 1
          echo "manifest_path=${manifests[0]}" >> "$GITHUB_OUTPUT"
          echo 'P0_250_F2_9C1_ARTIFACT_DOWNLOAD=PASS'

      - name: Execute identical sealed scope with live reseal and compensating rollback
        id: execute
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
          MANIFEST_PATH: ${{ steps.sealed.outputs.manifest_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64
          import os
          import textwrap
          from pathlib import Path

          planner = Path('backend/scripts/p0_250_f2_9a_global_dvd_reconciliation_plan.py').read_bytes()
          sealer = Path('backend/scripts/p0_250_f2_9b_seal_safe_backfill_targets.py').read_bytes()
          executor = Path('backend/scripts/p0_250_f2_9c_authorized_backfill_48.py').read_bytes()
          manifest = Path(os.environ['MANIFEST_PATH']).read_bytes()

          def b64(raw):
              return base64.b64encode(raw).decode('ascii')

          bootstrap = textwrap.dedent(f'''
          import base64,json,types
          def load_module(name, encoded, extra=None):
              module = types.ModuleType(name)
              module.__dict__["__name__"] = name
              if extra:
                  module.__dict__.update(extra)
              source = base64.b64decode(encoded).decode("utf-8")
              exec(compile(source, name + ".py", "exec"), module.__dict__)
              return module

          planner = load_module("p0_250_f2_9a_exact", "{b64(planner)}")
          sealer = load_module(
              "p0_250_f2_9b_exact",
              "{b64(sealer)}",
              {{"_PLANNER_OVERRIDE": planner}},
          )
          executor = load_module("p0_250_f2_9c_exact", "{b64(executor)}")
          manifest = json.loads(base64.b64decode("{b64(manifest)}").decode("utf-8"))

          def live_reseal():
              return sealer.run_live_seal()["private"]

          try:
              result = executor.run_authorized_backfill(
                  manifest,
                  explicit_authorization=True,
                  authorization_marker=executor.AUTHORIZATION_MARKER,
                  live_reseal_factory=live_reseal,
              )
          except Exception as exc:
              print("P0_250_F2_9C1_ERROR=" + type(exc).__name__ + ":" + str(exc))
              raise SystemExit(2)

          print(
              "P0_250_F2_9C1_PUBLIC="
              + json.dumps(result["public"], ensure_ascii=False, separators=(",", ":"))
          )
          print(
              "P0_250_F2_9C1_PRIVATE="
              + json.dumps(result["private"], ensure_ascii=False, separators=(",", ":"))
          )
          ''').lstrip()
          Path('evidence/p0-250-f2-9c1-remote-bootstrap.private.py').write_text(
              bootstrap,
              encoding='utf-8',
          )
          PY

          raw='evidence/p0-250-f2-9c1-raw.private'
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/p0_250_f2_9c1_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "timeout 420 docker exec -i \
              -e P0_250_F2_9A_ACADEMIC_YEAR=2026 \
              -e P0_250_F2_9A_REFERENCE_DATE=2026-08-31 \
              ${BACKEND_CONTAINER} python -" \
            < evidence/p0-250-f2-9c1-remote-bootstrap.private.py \
            > "$raw" 2>&1
          status=$?
          set -e
          rm -f evidence/p0-250-f2-9c1-remote-bootstrap.private.py

          if [ "$status" -ne 0 ]; then
            error_line="$(grep '^P0_250_F2_9C1_ERROR=' "$raw" | tail -n 1 || true)"
            rm -f "$raw"
            test -n "$error_line" && printf '%s\n' "$error_line"
            exit "$status"
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path('evidence/p0-250-f2-9c1-raw.private')
          raw = raw_path.read_text(encoding='utf-8')
          public_prefix = 'P0_250_F2_9C1_PUBLIC='
          private_prefix = 'P0_250_F2_9C1_PRIVATE='
          public = private = None
          for line in raw.splitlines():
              if line.startswith(public_prefix):
                  public = json.loads(line[len(public_prefix):])
              elif line.startswith(private_prefix):
                  private = json.loads(line[len(private_prefix):])
          if public is None or private is None:
              raise SystemExit('P0_250_F2_9C1_EXECUTION_OUTPUT_MISSING')
          Path('evidence/p0-250-f2-9c1-public-receipt.json').write_text(
              json.dumps(public, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          Path('evidence/p0-250-f2-9c1-private-receipt.json').write_text(
              json.dumps(private, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          raw_path.unlink()
          PY

      - name: Validate execution receipt boundary
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          public = json.loads(Path('evidence/p0-250-f2-9c1-public-receipt.json').read_text(encoding='utf-8'))
          private = json.loads(Path('evidence/p0-250-f2-9c1-private-receipt.json').read_text(encoding='utf-8'))
          allowed = {
              'F2_9C_48_TARGETS_APPLIED_AND_VERIFIED',
              'F2_9C_48_TARGETS_ALREADY_APPLIED_EXACT',
          }
          if public.get('status') != 'PASS' or public.get('classification') not in allowed:
              raise SystemExit('P0_250_F2_9C1_RECEIPT_CLASSIFICATION_INVALID')
          if public.get('target_count') != 48 or public.get('verified_count') != 48:
              raise SystemExit('P0_250_F2_9C1_RECEIPT_COUNTS_INVALID')
          if public.get('sealed_targets_sha256') != 'fbfe46dd455e45ad65c510d75022d52918c8993c21cc76593f1915d5324fb177':
              raise SystemExit('P0_250_F2_9C1_TARGETS_SHA_INVALID')
          if public.get('sealed_operations_sha256') != 'f3fb8c4b7d8d3a9e51939b8cf2d40e756759744e431471d073afd038295b47e5':
              raise SystemExit('P0_250_F2_9C1_OPERATIONS_SHA_INVALID')
          if public.get('sealed_bundle_sha256') != 'ddca5bb662a5670b96459ad5f5748f123ed65e52bdd2fe739e933b18d4d164d4':
              raise SystemExit('P0_250_F2_9C1_BUNDLE_SHA_INVALID')
          if public.get('rollback_performed') is not False or public.get('rollback_complete') is not True:
              raise SystemExit('P0_250_F2_9C1_ROLLBACK_STATE_INVALID')
          for key in (
              'target_ids_emitted', 'teacher_ids_emitted', 'staff_ids_emitted',
              'student_data_read', 'academic_data_read', 'user_pii_emitted',
              'private_receipt_emitted_to_logs',
          ):
              if public.get(key) is not False:
                  raise SystemExit(f'P0_250_F2_9C1_PRIVACY_INVALID:{key}')
          if public.get('classification') == 'F2_9C_48_TARGETS_APPLIED_AND_VERIFIED':
              if public.get('new_writes') != 48 or public.get('production_writes') is not True:
                  raise SystemExit('P0_250_F2_9C1_WRITE_RECEIPT_INVALID')
          else:
              if public.get('new_writes') != 0 or public.get('idempotent_replay') is not True:
                  raise SystemExit('P0_250_F2_9C1_IDEMPOTENT_RECEIPT_INVALID')
          receipt_sha = str(public.get('execution_receipt_sha256') or '')
          if not re.fullmatch(r'[0-9a-f]{64}', receipt_sha):
              raise SystemExit('P0_250_F2_9C1_RECEIPT_SHA_INVALID')
          if private.get('execution_receipt_sha256') != receipt_sha:
              raise SystemExit('P0_250_F2_9C1_PUBLIC_PRIVATE_SHA_MISMATCH')
          if len(private.get('operations') or []) != 48:
              raise SystemExit('P0_250_F2_9C1_PRIVATE_OPERATION_COUNT_INVALID')

          print('CLASSIFICATION=' + public['classification'])
          print('TARGET_COUNT=48')
          print('NEW_WRITES=' + str(public['new_writes']))
          print('VERIFIED_COUNT=48')
          print('EXECUTION_RECEIPT_SHA256=' + receipt_sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"classification={public['classification']}\n")
              out.write(f"new_writes={public['new_writes']}\n")
              out.write('verified_count=48\n')
              out.write(f"receipt_sha={receipt_sha}\n")
          PY

      - name: Upload private F2.9C execution evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-250-f2-9c1-execution-receipt-${{ github.run_id }}
          path: |
            evidence/p0-250-f2-9c1-public-receipt.json
            evidence/p0-250-f2-9c1-private-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment receipt on #250 and close retry gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.issue_number }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          CLASSIFICATION: ${{ steps.receipt.outputs.classification }}
          NEW_WRITES: ${{ steps.receipt.outputs.new_writes }}
          VERIFIED_COUNT: ${{ steps.receipt.outputs.verified_count }}
          RECEIPT_SHA: ${{ steps.receipt.outputs.receipt_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          body = (
              '## F2.9C — executor/backfill controlado dos 48 targets selados\n\n'
              f"Executor/retry SHA: `{os.environ['TARGET_SHA']}`\n"
              f"Classificação: **{os.environ['CLASSIFICATION']}**\n"
              f"Novas escritas: **{os.environ['NEW_WRITES']}**\n"
              f"Targets verificados: **{os.environ['VERIFIED_COUNT']}**\n"
              f"Execution receipt SHA-256: `{os.environ['RECEIPT_SHA']}`\n"
              f"Artifact privado F2.9C: `{os.environ.get('ARTIFACT_ID')}`\n"
              f"Artifact digest: `{os.environ.get('ARTIFACT_DIGEST')}`\n\n"
              'Fonte selada F2.9B: artifact `9745250820`, bundle '
              '`ddca5bb662a5670b96459ad5f5748f123ed65e52bdd2fe739e933b18d4d164d4`.\n\n'
