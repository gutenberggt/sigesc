name: "P0 #250 F2 Professor Promotion Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0_250_f2_promotion_case_audit_js.py'
      - 'backend/tests/test_p0_250_f2_promotion_case_audit.py'
      - '.github/workflows/p0-250-f2-professor-promotion-readonly-audit.yml'
      - 'memory/audit/P0_250_F2_PROFESSOR_PROMOTION_READONLY_AUDIT_2026-08-30.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-250-f2-professor-promotion-readonly-audit
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F2 read-only collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sigesc_ci_inert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test bounded collector
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/build_p0_250_f2_promotion_case_audit_js.py
          python -m py_compile backend/tests/test_p0_250_f2_promotion_case_audit.py
          pip install pytest pymongo python-dotenv
          pytest -q backend/tests/test_p0_250_f2_promotion_case_audit.py

      - name: Enforce generated Mongo collector is read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          python backend/scripts/build_p0_250_f2_promotion_case_audit_js.py \
            --db sigesc_ci_inert \
            --js runtime/p0-250-f2-audit.js
          for token in '.insertOne(' '.insertMany(' '.updateOne(' '.updateMany(' '.replaceOne(' '.deleteOne(' '.deleteMany(' '.bulkWrite(' '.findOneAndUpdate(' '.findOneAndDelete(' '.findOneAndReplace(' '.drop(' '.dropDatabase('; do
            if grep -Fq "$token" runtime/p0-250-f2-audit.js; then
              echo "P0_250_F2_MUTATION_PRIMITIVE_FOUND:$token"
              exit 1
            fi
          done
          grep -Fq 'grade_values_emitted: false' runtime/p0-250-f2-audit.js
          grep -Fq 'database_mutation: false' runtime/p0-250-f2-audit.js
          echo 'P0_250_F2_READ_ONLY_STATIC_GATE=PASS'

  production-audit:
    name: Audit professor promotion case in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[P0-250-F2-AUDIT] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
      DB_NAME: sigesc

    steps:
      - name: Resolve owner-scoped read-only audit context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              event = json.load(fh)
          issue = event.get('issue') or {}
          owner = os.environ['REPOSITORY_OWNER']
          creator = ((issue.get('user') or {}).get('login') or '')
          if creator != owner:
              raise SystemExit('P0_250_F2_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('P0_250_F2_ISSUE_MUST_BE_OPEN')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              line = raw.strip()
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key, value = key.strip(), value.strip()
              if key in values:
                  raise SystemExit(f'P0_250_F2_DUPLICATE_FIELD:{key}')
              values[key] = value

          if values.get('P0_250_F2_AUDIT') != 'AUTHORIZED':
              raise SystemExit('P0_250_F2_AUTHORIZATION_INVALID')
          if values.get('CONFIRMATION') != 'VERIFY_P0_250_F2_READ_ONLY':
              raise SystemExit('P0_250_F2_CONFIRMATION_INVALID')

          target = values.get('TARGET_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('P0_250_F2_TARGET_SHA_INVALID')
          if issue.get('title') != f'[P0-250-F2-AUDIT] {target}':
              raise SystemExit('P0_250_F2_TITLE_MISMATCH')

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sigesc-p0-250-f2-readonly-audit',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              main = json.load(response)
          main_sha = main['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'P0_250_F2_MAIN_MOVED:{main_sha}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'issue_number={issue.get("number")}\n')
          print('P0_250_F2_AUDIT_CONTEXT=PASS')
          print(f'TARGET_SHA={target}')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          print('GRADE_VALUES_EMITTED=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and statically seal bounded collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime evidence
          python backend/scripts/build_p0_250_f2_promotion_case_audit_js.py \
            --db "$DB_NAME" \
            --js runtime/p0-250-f2-audit.js
          for token in '.insertOne(' '.insertMany(' '.updateOne(' '.updateMany(' '.replaceOne(' '.deleteOne(' '.deleteMany(' '.bulkWrite(' '.findOneAndUpdate(' '.findOneAndDelete(' '.findOneAndReplace(' '.drop(' '.dropDatabase('; do
            if grep -Fq "$token" runtime/p0-250-f2-audit.js; then
              echo "P0_250_F2_MUTATION_PRIMITIVE_FOUND:$token"
              exit 1
            fi
          done
          sha256sum runtime/p0-250-f2-audit.js | tee evidence/collector-sha256.txt
          echo 'P0_250_F2_COLLECTOR_STATIC_GATE=PASS'

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "P0_250_F2_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/p0_250_f2_prod_key
          chmod 600 ~/.ssh/p0_250_f2_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'P0_250_F2_SSH_TRUST=PASS'

      - name: Collect production structural snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/p0-250-f2-raw.log'
          snapshot='evidence/p0-250-f2-snapshot.json'
          remote_command="timeout 60 docker exec -i ${MONGO_CONTAINER} mongosh --quiet --file /dev/stdin"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/p0_250_f2_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "$remote_command" \
            < runtime/p0-250-f2-audit.js \
            > "$raw" 2>&1

          prefix='P0_250_F2_AUDIT_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line" || {
            echo 'P0_250_F2_SNAPSHOT_MARKER_NOT_FOUND'
            tail -n 30 "$raw" || true
            exit 2
          }
          printf '%s' "${line#${prefix}}" > "$snapshot"
          python -m json.tool "$snapshot" >/dev/null
          rm -f "$raw"
          echo 'P0_250_F2_PRODUCTION_READ_ONLY_COLLECTION=PASS'

      - name: Publish structural diagnosis without grade values
        id: diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path('evidence/p0-250-f2-snapshot.json').read_text(encoding='utf-8'))
          if p.get('database_mutation') is not False:
              raise SystemExit('P0_250_F2_MUTATION_BOUNDARY_FAILED')
          if p.get('grade_values_emitted') is not False:
              raise SystemExit('P0_250_F2_GRADE_VALUE_BOUNDARY_FAILED')

          print(f"AUDIT_STATUS={p.get('status')}")
          print(f"CLASSIFICATION={p.get('classification')}")
          print(f"ASSIGNMENTS={p.get('assignment_count', 'n/a')}")
          print(f"PROMOTION_STUDENTS={p.get('promotion_student_universe_count', 'n/a')}")
          print(f"BYCLASS_STUDENTS={p.get('by_class_student_universe_count', 'n/a')}")
          for c in p.get('course_summaries') or []:
              print(
                  'COURSE=' + str(c.get('course_name'))
                  + '|COURSE_ID=' + str(c.get('course_id'))
                  + '|ASSIGNMENTS=' + str(c.get('assignment_count'))
                  + '|GRADE_DOCS=' + str(c.get('grade_documents'))
                  + '|RECORDED=' + str(c.get('grade_documents_with_any_recorded_field'))
                  + '|PROMOTION_MATCH=' + str(c.get('promotion_student_matches'))
                  + '|BYCLASS_MATCH=' + str(c.get('by_class_student_matches'))
                  + '|DUP_GROUPS=' + str(c.get('duplicate_grade_student_groups'))
                  + '|SAME_NAME_IDS=' + str(c.get('same_name_course_count'))
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"classification={p.get('classification')}\n")
          PY

      - name: Upload private read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-250-f2-readonly-audit-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Annotate and close audit trigger issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          CLASSIFICATION: ${{ steps.diagnosis.outputs.classification }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ISSUE_NUMBER" || exit 0
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          classification = os.environ.get('CLASSIFICATION') or 'AUDIT_INCOMPLETE'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-p0-250-f2-readonly-audit',
          }
          body = {
              'body': (
                  f'P0 #250 F2 production read-only audit: **{classification}**\n\n'
                  f'- Target SHA: `{os.environ.get("TARGET_SHA")}`\n'
                  f'- Workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
                  '- Database mutation: **NO**\n'
                  '- Grade values emitted: **NO**'
              )
          }
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              data=json.dumps(body).encode(), method='POST', headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30):
              pass
          if classification != 'AUDIT_INCOMPLETE':
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}',
                  data=json.dumps({'state': 'closed'}).encode(), method='PATCH', headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30):
                  pass
          PY
