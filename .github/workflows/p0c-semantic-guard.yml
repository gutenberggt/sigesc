name: P0-C Semantic Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  p0c-semantic-guard:
    name: P0-C - Legacy migration semantic guard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: pip install pytest pytest-asyncio python-dotenv motor

      - name: Run semantic P0-C guards
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_p0_teacher_binding_integrity.py \
            tests/test_p0c_teacher_identity_preflight.py \
            tests/test_p0c_teacher_assignment_semantics.py
