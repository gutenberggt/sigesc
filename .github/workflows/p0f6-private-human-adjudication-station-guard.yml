name: P0-F6 Private Human Adjudication Station Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f6_private_human_adjudication_station.py'
      - 'backend/scripts/build_p0f6_private_human_adjudication_station_hotfix.py'
      - 'backend/scripts/build_p0f6_private_human_adjudication_station_human_ui.py'
      - 'backend/tests/test_p0f6_private_human_adjudication_station.py'
      - 'backend/tests/test_p0f6_js_newline_hotfix.py'
      - 'backend/tests/test_p0f6_human_readable_ui.py'
      - 'backend/scripts/audit_duplicate_course_*.py'
      - 'backend/tests/test_p0f*.py'
      - '.github/workflows/p0f6-private-human-adjudication-station-guard.yml'
      - 'memory/audit/P0F6_PRIVATE_HUMAN_ADJUDICATION_STATION_2026-08-28.md'
      - 'memory/audit/P0F6_2_HUMAN_READABLE_UI_2026-08-28.md'

permissions:
  contents: read

jobs:
  p0f6-offline-human-adjudication-read-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: pip install pytest python-dotenv motor

      - name: Run P0-F through P0-F6 guards
        working-directory: backend
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_p0_teacher_binding_integrity.py \
            tests/test_p0f_duplicate_course_identity_forensic.py \
            tests/test_p0f2_duplicate_course_pair_preflight.py \
            tests/test_p0f3_duplicate_course_semantic_collision.py \
            tests/test_p0f4_duplicate_course_conflict_provenance.py \
            tests/test_p0f5_duplicate_course_human_review_packet.py \
            tests/test_p0f6_private_human_adjudication_station.py \
            tests/test_p0f6_js_newline_hotfix.py \
            tests/test_p0f6_human_readable_ui.py
