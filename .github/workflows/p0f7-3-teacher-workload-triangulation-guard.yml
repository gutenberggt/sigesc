name: P0-F7.3 Teacher Workload Triangulation Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/audit_p0f7_3_teacher_workload_triangulation.py'
      - 'backend/scripts/audit_p0f7_2_teacher_assignment_forensic.py'
      - 'backend/tests/test_p0f7_3_teacher_workload_triangulation.py'
      - '.github/workflows/p0f7-3-teacher-workload-triangulation-guard.yml'
      - 'memory/audit/P0F7_3_TEACHER_WORKLOAD_TRIANGULATION_2026-08-28.md'

permissions:
  contents: read

jobs:
  p0f7-3-read-only-triangulation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: pip install pytest python-dotenv motor

      - name: Run P0-F7.3 guards
        working-directory: backend
        run: |
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_p0f7_3_teacher_workload_triangulation.py

      - name: Compile P0-F7.3
        working-directory: backend
        run: python -m py_compile scripts/audit_p0f7_3_teacher_workload_triangulation.py

      - name: Guard no executable mutation surface
        working-directory: backend
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/audit_p0f7_3_teacher_workload_triangulation.py')
          spec = importlib.util.spec_from_file_location('p0f73_guard', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.assert_read_only()
          source = path.read_text(encoding='utf-8')
          assert '--apply' not in source
          print('P0F7_3_READ_ONLY_GUARD=PASS')
          PY
