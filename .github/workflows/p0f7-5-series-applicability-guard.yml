name: P0-F7.5 Series Applicability Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/audit_p0f7_5_series_applicability.py'
      - 'backend/tests/test_p0f7_5_series_applicability.py'
      - '.github/workflows/p0f7-5-series-applicability-guard.yml'
      - 'memory/audit/P0F7_5_SERIES_APPLICABILITY_2026-08-28.md'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sigesc_ci_inert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: pip install pytest pymongo python-dotenv

      - name: Compile auditor
        run: python -m py_compile backend/scripts/audit_p0f7_5_series_applicability.py

      - name: Run P0-F7.5 tests
        run: pytest -q backend/tests/test_p0f7_5_series_applicability.py

      - name: Enforce offline read-only surface
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('backend/scripts/audit_p0f7_5_series_applicability.py')
          spec = importlib.util.spec_from_file_location('p0f75', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.assert_read_only()
          source = p.read_text(encoding='utf-8')
          assert 'AsyncIOMotorClient' not in source
          assert 'MongoClient' not in source
          assert '--apply' not in source
          assert 'automatic_course_decision": False' in source
          assert 'automatic_workload_decision": False' in source
          print('P0-F7.5 OFFLINE READ-ONLY GUARD = PASS')
          PY
