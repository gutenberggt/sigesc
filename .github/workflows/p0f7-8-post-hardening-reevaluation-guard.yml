name: P0-F7.8.2 Offline Snapshot Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/audit_p0f7_8_post_hardening_reevaluation.py'
      - 'backend/scripts/audit_p0f7_8_1_bounded_reevaluation.py'
      - 'backend/scripts/audit_p0f7_8_2_offline_snapshot.py'
      - 'backend/scripts/audit_p0f7_8_2_offline_runner.py'
      - 'backend/scripts/build_p0f7_8_2_snapshot_js.py'
      - 'backend/tests/test_p0f7_8_post_hardening_reevaluation.py'
      - 'backend/tests/test_p0f7_8_2_snapshot_builder.py'
      - 'scripts/p0f7_8_2_analyze_local.ps1'
      - 'backend/utils/curriculum_resolver.py'
      - '.github/workflows/p0f7-8-post-hardening-reevaluation-guard.yml'
      - 'memory/audit/P0F7_8_2_OFFLINE_SNAPSHOT_2026-08-28.md'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: pip install pytest motor pymongo python-dotenv

      - name: Assert production Python auditor entrypoints removed
        run: |
          test ! -e backend/scripts/audit_p0f7_8_post_hardening_reevaluation.py
          test ! -e backend/scripts/audit_p0f7_8_1_bounded_reevaluation.py

      - name: Compile offline tools and tests
        run: |
          python -m py_compile backend/scripts/audit_p0f7_8_2_offline_snapshot.py
          python -m py_compile backend/scripts/audit_p0f7_8_2_offline_runner.py
          python -m py_compile backend/scripts/build_p0f7_8_2_snapshot_js.py
          python -m py_compile backend/tests/test_p0f7_8_post_hardening_reevaluation.py
          python -m py_compile backend/tests/test_p0f7_8_2_snapshot_builder.py

      - name: Parse PowerShell wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/p0f7_8_2_analyze_local.ps1',
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Output 'P0-F7.8.2 POWERSHELL PARSE = PASS'

      - name: Run focused tests
        run: |
          pytest -q \
            backend/tests/test_p0f7_8_post_hardening_reevaluation.py \
            backend/tests/test_p0f7_8_2_snapshot_builder.py

      - name: Enforce offline-only execution boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('backend/scripts/audit_p0f7_8_2_offline_snapshot.py').read_text(encoding='utf-8')
          runner = Path('backend/scripts/audit_p0f7_8_2_offline_runner.py').read_text(encoding='utf-8')
          builder = Path('backend/scripts/build_p0f7_8_2_snapshot_js.py').read_text(encoding='utf-8')
          ps = Path('scripts/p0f7_8_2_analyze_local.ps1').read_text(encoding='utf-8')

          forbidden_runner = [
              'from motor', 'import motor', 'AsyncIOMotorClient', 'MongoClient(',
              'MONGO_URL', 'DB_NAME', 'subprocess.', 'docker exec',
          ]
          assert not any(token in runner for token in forbidden_runner)
          assert 'from motor' not in core
          assert 'import motor' not in core
          assert 'MONGO_URL' not in core
          assert 'DB_NAME' not in core
          assert 'from motor' not in builder
          assert 'import motor' not in builder
          assert 'AsyncIOMotorClient' not in builder
          assert '--apply' not in runner
          assert '--apply' not in core
          assert '--apply' not in builder

          forbidden_ps = ['ssh.exe', 'scp.exe', 'docker exec', 'mongosh', 'Invoke-WebRequest']
          assert not any(token in ps for token in forbidden_ps)
          assert 'PRODUCTION_ACCESS=NO' in ps

          assert 'EXPECTED_PRODUCTION_QUERY_CALLS = 9' in core
          assert 'QUERY_BUDGET = 9' in builder
          assert 'student_records_read": 0' in core
          assert 'enrollment_records_read": 0' in core
          assert 'grade_records_read": 0' in core
          assert 'attendance_records_read": 0' in core
          assert 'production_python_executions": 0' in core
          assert 'production_backend_exec_calls": 0' in core
          assert 'production_writes_executed": False' in core
          assert 'not_authorization_for_executor": True' in core
          print('P0-F7.8.2 OFFLINE EXECUTION BOUNDARY = PASS')
          PY

      - name: Enforce post-hardening SSoT contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('backend/utils/curriculum_resolver.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          functions = {
              node.name: ast.get_source_segment(source, node) or ''
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          pick = functions['_pick_winner']
          fit = functions['_curricular_fit']
          assert pick.find('curricular_rank') < pick.find('evidence_score')
          assert 'COURSE_LEVEL_UNKNOWN_REQUIRES_REVIEW' in fit
          assert 'LEVEL_MISMATCH' in fit
          assert 'SERIES_SCOPE_CONFLICT_REQUIRES_REVIEW' in fit
          print('P0-F7.8.2 POST-HARDENING SSOT CONTRACT = PASS')
          PY
