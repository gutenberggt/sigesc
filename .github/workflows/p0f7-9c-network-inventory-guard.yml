name: P0-F7.9C Network Inventory Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9c_inventory_snapshot_js.py'
      - 'backend/scripts/audit_p0f7_9c_inventory_offline.py'
      - 'backend/tests/test_p0f7_9c_network_inventory.py'
      - 'scripts/p0f7_9c_inventory_local.ps1'
      - 'memory/audit/P0F7_9C_NETWORK_AUDIT_2026-08-29.md'
      - '.github/workflows/p0f7-9c-network-inventory-guard.yml'
  workflow_dispatch:

jobs:
  inventory-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile local tools
        run: |
          python -m py_compile backend/scripts/build_p0f7_9c_inventory_snapshot_js.py
          python -m py_compile backend/scripts/audit_p0f7_9c_inventory_offline.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9c_network_inventory.py

      - name: Guard counts-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/scripts/build_p0f7_9c_inventory_snapshot_js.py').read_text(encoding='utf-8')
          assert 'QUERY_BUDGET = 6' in text
          for forbidden in (
              'students.', 'enrollments.', 'grades.', 'attendance.',
              'insertOne(', 'insertMany(', 'updateOne(', 'updateMany(',
              'deleteOne(', 'deleteMany(', 'replaceOne(', 'bulkWrite('
          ):
              assert forbidden not in text, forbidden
          print('P0F7_9C_COUNTS_ONLY_CONTRACT=PASS')
          PY

      - name: Guard offline analyzer has no database or remote access
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/scripts/audit_p0f7_9c_inventory_offline.py').read_text(encoding='utf-8')
          for forbidden in ('pymongo', 'motor.', 'MongoClient', 'requests.', 'httpx.', 'subprocess.', 'docker ', 'mongosh', 'ssh '):
              assert forbidden not in text, forbidden
          print('P0F7_9C_OFFLINE_ANALYZER_REMOTE_ACCESS=NO')
          PY

      - name: Guard local wrapper has no remote execution
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/p0f7_9c_inventory_local.ps1').read_text(encoding='utf-8')
          for forbidden in ('ssh ', 'scp ', 'docker exec', 'mongosh', 'Invoke-WebRequest'):
              assert forbidden not in text, forbidden
          print('P0F7_9C_LOCAL_WRAPPER_REMOTE_ACCESS=NO')
          PY
