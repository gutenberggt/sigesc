name: P0-F7.9D3 Collision Preflight Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d3_collision_snapshot_js.py'
      - 'backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py'
      - 'backend/tests/test_p0f7_9d3_collision_preflight.py'
      - 'scripts/p0f7_9d3_collision_preflight_local.ps1'
      - '.github/workflows/p0f7-9d3-collision-preflight-guard.yml'
      - 'memory/audit/P0F7_9D3_COLLISION_PREFLIGHT_2026-08-29.md'
  workflow_dispatch:

jobs:
  collision-preflight-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D3 tools
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d3_collision_snapshot_js.py
          python -m py_compile backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py

      - name: Run focused regressions
        run: PYTHONPATH=. pytest -q --noconftest backend/tests/test_p0f7_9d3_collision_preflight.py

      - name: Guard bounded read-only collector
        run: |
          grep -q 'QUERY_BUDGET = 2' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py
          grep -q 'MAX_MATCHING_ASSIGNMENTS = 200' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py
          grep -q 'countDocuments' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py
          ! grep -Eiq 'updateOne|updateMany|deleteOne|deleteMany|insertOne|insertMany|bulkWrite' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py

      - name: Guard identity minimization
        run: |
          grep -q 'staff_id:1' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py
          ! grep -Eiq 'full_name|staff_name|nome:1|email|cpf' backend/scripts/build_p0f7_9d3_collision_snapshot_js.py

      - name: Guard offline analyzer and no remediation
        run: |
          ! grep -Eiq 'pymongo|motor|mongosh|docker exec|ssh |requests\.|httpx\.|subprocess' backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py
          grep -q '"database_mutation": False' backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py
          grep -q '"production_writes": False' backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py
          grep -q '"remediation_executed": False' backend/scripts/audit_p0f7_9d3_collision_preflight_offline.py
