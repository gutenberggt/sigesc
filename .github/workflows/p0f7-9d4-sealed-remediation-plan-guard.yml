name: P0-F7.9D4 Sealed Remediation Plan Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py'
      - 'backend/tests/test_p0f7_9d4_sealed_remediation_plan.py'
      - 'scripts/p0f7_9d4_sealed_remediation_plan_local.ps1'
      - '.github/workflows/p0f7-9d4-sealed-remediation-plan-guard.yml'
      - 'memory/audit/P0F7_9D4_SEALED_REMEDIATION_PLAN_2026-08-29.md'
  workflow_dispatch:

jobs:
  sealed-remediation-plan-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile planner
        run: python -m py_compile backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d4_sealed_remediation_plan.py

      - name: Guard offline-only planner
        run: |
          ! grep -Eiq 'pymongo|motor|mongosh|docker exec|ssh |subprocess|requests\.|httpx\.' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
          ! grep -Eiq 'mongosh|docker exec|ssh ' scripts/p0f7_9d4_sealed_remediation_plan_local.ps1

      - name: Guard no database writer primitives
        run: |
          ! grep -Eiq 'update_one|update_many|insert_one|insert_many|delete_one|delete_many|bulk_write' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py

      - name: Guard sealed fail-closed contract
        run: |
          grep -q 'SEALED_PROPOSAL_ONLY_NON_EXECUTABLE' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
          grep -q 'requires_separate_explicit_production_write_authorization' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
          grep -q 'FAIL_CLOSED_NO_PARTIAL_GUESSING' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
          grep -q '"production_writes": False' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
          grep -q '"remediation_executed": False' backend/scripts/build_p0f7_9d4_sealed_remediation_plan.py
