name: P0-F7.9D5 Last-mile Preflight Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py'
      - 'backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py'
      - 'backend/tests/test_p0f7_9d5_last_mile_preflight.py'
      - 'scripts/p0f7_9d5_last_mile_preflight_local.ps1'
      - '.github/workflows/p0f7-9d5-last-mile-preflight-guard.yml'
      - 'memory/audit/P0F7_9D5_LAST_MILE_PREFLIGHT_2026-08-29.md'
  workflow_dispatch:

jobs:
  last-mile-preflight-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D5 scripts
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py
          python -m py_compile backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d5_last_mile_preflight.py

      - name: Guard collector read-only contract
        run: |
          grep -q 'QUERY_BUDGET = 5' backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py
          grep -q 'runCommand({{hello:1}})' backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py
          grep -q 'countDocuments' backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py
          ! grep -Eiq 'updateOne|updateMany|insertOne|insertMany|deleteOne|deleteMany|bulkWrite|findOneAndUpdate|replaceOne' backend/scripts/build_p0f7_9d5_last_mile_snapshot_js.py

      - name: Guard analyzer offline and SSoT reuse
        run: |
          ! grep -Eiq 'pymongo|motor|subprocess|requests\.|httpx\.' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'validate_teacher_assignment_curriculum' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'TeacherAssignmentIntegrityError' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'FAIL_CLOSED_NO_PARTIAL_GUESSING' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'requires_separate_explicit_production_write_authorization' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py

      - name: Guard local wrapper has no remote execution
        run: |
          ! grep -Eiq '^[[:space:]]*(ssh|scp|mongosh|docker)[[:space:]]' scripts/p0f7_9d5_last_mile_preflight_local.ps1
          grep -q 'PRODUCTION_WRITES=NO' scripts/p0f7_9d5_last_mile_preflight_local.ps1
          grep -q 'REMEDIATION_EXECUTED=NO' scripts/p0f7_9d5_last_mile_preflight_local.ps1

      - name: Guard topology strategy contract
        run: |
          grep -q 'REPLICA_SET_TRANSACTION_CAPABLE' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'MONGODB_MULTI_DOCUMENT_TRANSACTION_REQUIRED' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
          grep -q 'CAS_WITH_COMPENSATING_ROLLBACK_REQUIRED' backend/scripts/audit_p0f7_9d5_last_mile_preflight_offline.py
