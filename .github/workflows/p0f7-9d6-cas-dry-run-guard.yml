name: P0-F7.9D6 CAS Dry-run Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d6_cas_dry_run_package.py'
      - 'backend/scripts/simulate_p0f7_9d6_cas_dry_run.py'
      - 'backend/tests/test_p0f7_9d6_cas_dry_run.py'
      - 'scripts/p0f7_9d6_cas_dry_run_local.ps1'
      - '.github/workflows/p0f7-9d6-cas-dry-run-guard.yml'
      - 'memory/audit/P0F7_9D6_CAS_DRY_RUN_2026-08-29.md'
  workflow_dispatch:

jobs:
  cas-dry-run-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D6 scripts
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          python -m py_compile backend/scripts/simulate_p0f7_9d6_cas_dry_run.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d6_cas_dry_run.py

      - name: Guard offline-only implementation
        run: |
          ! grep -Eiq 'pymongo|motor|mongosh|docker exec|subprocess|requests\.|httpx\.' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          ! grep -Eiq 'pymongo|motor|mongosh|docker exec|subprocess|requests\.|httpx\.' backend/scripts/simulate_p0f7_9d6_cas_dry_run.py

      - name: Guard no database writer primitives
        run: |
          ! grep -Eiq 'update_one|update_many|replace_one|bulk_write|insert_one|insert_many|delete_one|delete_many|find_one_and_update' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          ! grep -Eiq 'update_one|update_many|replace_one|bulk_write|insert_one|insert_many|delete_one|delete_many|find_one_and_update' backend/scripts/simulate_p0f7_9d6_cas_dry_run.py

      - name: Guard non-executable fail-closed contract
        run: |
          grep -q 'DRY_RUN_ONLY_NON_EXECUTABLE' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          grep -q 'writer_implementation_present.*False' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          grep -q 'requires_separate_explicit_production_write_authorization.*True' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          grep -q 'CAS_WITH_COMPENSATING_ROLLBACK_REQUIRED' backend/scripts/build_p0f7_9d6_cas_dry_run_package.py
          grep -q 'FAIL_CLOSED_NO_PARTIAL_GUESSING' backend/scripts/simulate_p0f7_9d6_cas_dry_run.py
