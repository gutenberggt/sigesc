name: P0-F7.9D7 Authorized Production Executor Guard

on:
  pull_request:
  push:
    branches:
      - feat/p0f7-9d7-authorized-production-executor
      - fix/p0f7-9d71-intra-batch-collision-preflight

jobs:
  authorized-executor-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D7 and D7.1 scripts
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d7_authorized_executor_js.py
          python -m py_compile backend/scripts/validate_p0f7_9d7_execution_receipt_offline.py
          python -m py_compile backend/scripts/analyze_p0f7_9d71_intra_batch_collisions.py

      - name: Run focused regressions
        run: |
          pytest -q --noconftest backend/tests/test_p0f7_9d7_authorized_executor.py
          pytest -q --noconftest backend/tests/test_p0f7_9d71_intra_batch_collisions.py

      - name: Guard exact writer primitive surface
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=backend/scripts/build_p0f7_9d7_authorized_executor_js.py
          grep -Fq 'updateOne(' "$BUILDER"
          if grep -Eq 'updateMany\(|deleteOne\(|deleteMany\(|insertOne\(|insertMany\(|replaceOne\(|bulkWrite\(' "$BUILDER"; then
            echo 'Forbidden MongoDB mutation primitive detected.' >&2
            exit 1
          fi
          grep -Fq '{{$set:{{course_id:String(e.target_course_id)}}}}' "$BUILDER"
          grep -Fq '{{$set:{{course_id:String(e.source_course_id)}}}}' "$BUILDER"
          if grep -Fq 'updated_at' "$BUILDER"; then
            echo 'D7 must mutate course_id only.' >&2
            exit 1
          fi

      - name: Guard CAS and compensating rollback contract
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=backend/scripts/build_p0f7_9d7_authorized_executor_js.py
          grep -Fq 'CAS_WITH_COMPENSATING_ROLLBACK_REQUIRED' "$BUILDER"
          grep -Fq 'applied.length - 1' "$BUILDER"
          grep -Fq 'P0F79D7_CAS_UPDATE_FAILED' "$BUILDER"
          grep -Fq 'P0F79D7_POSTCONDITION_FAILED' "$BUILDER"
          grep -Fq 'P0F79D7_POSTWRITE_COLLISION' "$BUILDER"
          grep -Fq 'P0F79D7_FINAL_POSTCONDITION_FAILED' "$BUILDER"
          grep -Fq 'CRITICAL_ROLLBACK_INCOMPLETE' "$BUILDER"

      - name: Guard explicit authorization arming
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=backend/scripts/build_p0f7_9d7_authorized_executor_js.py
          WRAPPER=scripts/p0f7_9d7_authorized_execution_local.ps1
          grep -Fq 'P0F7_9D7_EXPLICIT_AUTHORIZATION_REQUIRED' "$BUILDER"
          grep -Fq -- '--authorize-production-writes' "$BUILDER"
          grep -Fq 'AuthorizeProductionWrites' "$WRAPPER"
          grep -Fq 'D7_EXPLICIT_PRODUCTION_WRITE_AUTHORIZATION_REQUIRED' "$WRAPPER"

      - name: Guard D7.1 cumulative collision gate
        shell: bash
        run: |
          set -euo pipefail
          ANALYZER=backend/scripts/analyze_p0f7_9d71_intra_batch_collisions.py
          D71_WRAPPER=scripts/p0f7_9d71_intra_batch_collision_preflight_local.ps1
          D7_WRAPPER=scripts/p0f7_9d7_authorized_execution_local.ps1
          grep -Fq 'target_tuple_fingerprint_sha256' "$ANALYZER"
          grep -Fq 'HUMAN_ADJUDICATION_BEFORE_ANY_REVISED_WRITE_PLAN' "$ANALYZER"
          grep -Fq 'execution_gate_open' "$ANALYZER"
          grep -Fq "ValidateSet('StaticCheck','Analyze')" "$D71_WRAPPER"
          grep -Fq 'D71Report' "$D7_WRAPPER"
          grep -Fq 'D71_INTRA_BATCH_COLLISION_GATE_CLOSED' "$D7_WRAPPER"
          grep -Fq 'safe_noncolliding -ne 23' "$D7_WRAPPER"
          grep -Fq 'blocked_intra_batch -ne 0' "$D7_WRAPPER"

      - name: Guard offline-only D7.1 analyzer and wrappers
        shell: bash
        run: |
          set -euo pipefail
          ANALYZER=backend/scripts/analyze_p0f7_9d71_intra_batch_collisions.py
          D71_WRAPPER=scripts/p0f7_9d71_intra_batch_collision_preflight_local.ps1
          D7_WRAPPER=scripts/p0f7_9d7_authorized_execution_local.ps1
          if grep -Ei '(^|[[:space:]])(pymongo|motor|requests|httpx|subprocess)([[:space:].]|$)' "$ANALYZER"; then
            echo 'Network/database dependency detected in D7.1 analyzer.' >&2
            exit 1
          fi
          if grep -Ei '(^|[[:space:]])(ssh|scp|docker|mongosh)([[:space:]]|$)' "$D71_WRAPPER" "$D7_WRAPPER"; then
            echo 'Remote execution primitive detected in local wrapper.' >&2
            exit 1
          fi
          grep -Fq 'PRODUCTION_WRITES=NO' "$D71_WRAPPER"
          grep -Fq 'EXECUTION_NOT_PERFORMED=YES' "$D7_WRAPPER"

      - name: Guard receipt validator is offline only
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR=backend/scripts/validate_p0f7_9d7_execution_receipt_offline.py
          if grep -Ei '(^|[[:space:]])(pymongo|motor|requests|httpx|subprocess)([[:space:].]|$)' "$VALIDATOR"; then
            echo 'Network/database dependency detected in receipt validator.' >&2
            exit 1
          fi
          grep -Fq 'REMEDIATION_APPLIED_AND_VERIFIED' "$VALIDATOR"
          grep -Fq 'SAFE_ROLLBACK' "$VALIDATOR"
          grep -Fq 'MANUAL_RECOVERY_REQUIRED' "$VALIDATOR"
