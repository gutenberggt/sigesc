name: P0-F7.9D7.2 Duplicate Pair Forensic Guard

on:
  pull_request:
  push:
    branches:
      - feat/p0f7-9d72-duplicate-pair-forensics

jobs:
  duplicate-pair-forensic-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D7.2 scripts
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d72_duplicate_pair_snapshot_js.py
          python -m py_compile backend/scripts/analyze_p0f7_9d72_duplicate_pair_forensic.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d72_duplicate_pair_forensic.py

      - name: Guard collector is read-only and bounded
        shell: bash
        run: |
          set -euo pipefail
          B=backend/scripts/build_p0f7_9d72_duplicate_pair_snapshot_js.py
          grep -Fq 'QUERY_BUDGET = 5' "$B"
          grep -Fq 'teacher_assignments.find(' "$B"
          grep -Fq 'audit_logs.find(' "$B"
          grep -Fq 'class_schedules.find(' "$B"
          if grep -Eq 'updateOne\(|updateMany\(|deleteOne\(|deleteMany\(|insertOne\(|insertMany\(|replaceOne\(|bulkWrite\(' "$B"; then
            echo 'Mutation primitive detected in D7.2 collector template.' >&2
            exit 1
          fi
          if grep -Eq 'students|enrollments' "$B"; then
            echo 'Student-data collection token detected in D7.2 collector.' >&2
            exit 1
          fi

      - name: Guard analyzer is offline and non-executable
        shell: bash
        run: |
          set -euo pipefail
          A=backend/scripts/analyze_p0f7_9d72_duplicate_pair_forensic.py
          if grep -Ei '(^|[[:space:]])(pymongo|motor|requests|httpx|subprocess)([[:space:].]|$)' "$A"; then
            echo 'Network/database dependency detected in D7.2 analyzer.' >&2
            exit 1
          fi
          grep -Fq 'automatic_survivor_selection": False' "$A"
          grep -Fq 'automatic_workload_decision": False' "$A"
          grep -Fq 'current_23_write_authorization_reusable": False' "$A"
          grep -Fq 'staff_id_exposed_in_report": False' "$A"

      - name: Guard local wrapper cannot execute remote work
        shell: bash
        run: |
          set -euo pipefail
          W=scripts/p0f7_9d72_duplicate_pair_forensic_local.ps1
          grep -Fq "ValidateSet('StaticCheck','Build','Analyze')" "$W"
          if grep -Ei '(^|[[:space:]])(ssh|scp|docker|mongosh)([[:space:]]|$)' "$W"; then
            echo 'Remote execution primitive detected in D7.2 local wrapper.' >&2
            exit 1
          fi
