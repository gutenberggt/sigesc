name: P0-F7.9D7.3 Duplicate Pair Adjudication Guard

on:
  pull_request:
  push:
    branches:
      - feat/p0f7-9d73-duplicate-pair-adjudication

jobs:
  duplicate-pair-adjudication-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D7.3 adjudicator
        run: python -m py_compile backend/scripts/adjudicate_p0f7_9d73_duplicate_pair.py

      - name: Run focused regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d73_duplicate_pair_adjudication.py

      - name: Guard real D7.2 seal is pinned
        shell: bash
        run: |
          set -euo pipefail
          A=backend/scripts/adjudicate_p0f7_9d73_duplicate_pair.py
          grep -Fq 'EXPECTED_D72_REPORT_SHA256 = "228e809edbe151797b055f12c467243e9b5db1db6bb64107a3f27fd83b1d7ea3"' "$A"
          grep -Fq 'EXPECTED_PLAN_SHA256 = "6d39d8425c0555b36b69c8f5d00832fc8f93e1c4f38c35c0f29ea8e72fcf1312"' "$A"

      - name: Guard non-executable revised plan contract
        shell: bash
        run: |
          set -euo pipefail
          A=backend/scripts/adjudicate_p0f7_9d73_duplicate_pair.py
          grep -Fq '"operation_type": "RETIRE_DUPLICATE_ASSIGNMENT"' "$A"
          grep -Fq '"operation_type": "CONSOLIDATE_SURVIVOR"' "$A"
          grep -Fq 'RETIRE_STATUS = "inativo"' "$A"
          grep -Fq '"executable": False' "$A"
          grep -Fq '"old_23_write_authorization_reusable": False' "$A"
          grep -Fq '"requires_new_explicit_production_write_authorization": True' "$A"
          grep -Fq '"hard_delete": False' "$A"

      - name: Guard adjudicator has no production runtime surface
        shell: bash
        run: |
          set -euo pipefail
          A=backend/scripts/adjudicate_p0f7_9d73_duplicate_pair.py
          if grep -Ei '(^|[[:space:]])(pymongo|motor|requests|httpx|subprocess|paramiko)([[:space:].]|$)' "$A"; then
            echo 'Network/database dependency detected in D7.3.' >&2
            exit 1
          fi
          if grep -Eq '\-\-apply|\-\-execute|\-\-rollback' "$A"; then
            echo 'Executor switch detected in D7.3.' >&2
            exit 1
          fi

      - name: Guard local wrapper cannot execute remote work
        shell: bash
        run: |
          set -euo pipefail
          W=scripts/p0f7_9d73_duplicate_pair_adjudication_local.ps1
          grep -Fq "ValidateSet('StaticCheck','Build','Seal')" "$W"
          if grep -Ei '(^|[[:space:]])(ssh|scp|docker|mongosh)([[:space:]]|$)' "$W"; then
            echo 'Remote execution primitive detected in D7.3 local wrapper.' >&2
            exit 1
          fi
