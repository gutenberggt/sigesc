name: P0-F7.9D7.3.1 Curricular Workload Policy Guard

on:
  pull_request:
    paths:
      - 'backend/utils/curricular_workload_policy.py'
      - 'backend/scripts/adjudicate_p0f7_9d731_curricular_policy.py'
      - 'backend/tests/test_p0f7_9d731_curricular_workload_policy.py'
      - 'backend/tests/test_p0f7_9d731_policy_adjudication.py'
      - 'scripts/p0f7_9d731_curricular_policy_local.ps1'
      - '.github/workflows/p0f7-9d731-curricular-workload-policy-guard.yml'
      - 'memory/audit/P0F7_9D731_CURRICULAR_WORKLOAD_POLICY_2026-08-29.md'
  workflow_dispatch:

jobs:
  curricular-workload-policy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile policy and adapter
        run: |
          python -m py_compile backend/utils/curricular_workload_policy.py
          python -m py_compile backend/scripts/adjudicate_p0f7_9d731_curricular_policy.py
      - name: Run policy matrix regressions
        run: python -m pytest -q --noconftest backend/tests/test_p0f7_9d731_curricular_workload_policy.py
      - name: Run policy adjudication regressions
        run: python -m pytest -q --noconftest backend/tests/test_p0f7_9d731_policy_adjudication.py
      - name: Preserve D7.3 base regressions
        run: python -m pytest -q --noconftest backend/tests/test_p0f7_9d73_duplicate_pair_adjudication.py
      - name: Guard offline boundary
        shell: bash
        run: |
          set -euo pipefail
          A=backend/scripts/adjudicate_p0f7_9d731_curricular_policy.py
          if grep -Ei '(^|[[:space:]])(pymongo|motor|requests|httpx|subprocess|paramiko|fabric)([[:space:].]|$)' "$A"; then
            echo 'Network/database dependency detected in D7.3.1.' >&2
            exit 1
          fi
          if grep -Eq '(insert_one|insert_many|update_one|update_many|replace_one|delete_one|delete_many|bulk_write|find_one_and_update)[[:space:]]*\(' "$A"; then
            echo 'Database mutator call detected in D7.3.1.' >&2
            exit 1
          fi
          if grep -Eq '\-\-apply|\-\-execute|\-\-rollback' scripts/p0f7_9d731_curricular_policy_local.ps1; then
            echo 'Executor switch detected in D7.3.1 wrapper.' >&2
            exit 1
          fi
      - name: Guard canonical current case
        run: |
          PYTHONPATH=backend python - <<'PY'
          from utils.curricular_workload_policy import resolve_curricular_workload
          r = resolve_curricular_workload(
              component_name='Geografia',
              class_level='eja_final',
              class_series=['EJA 3ª ETAPA', 'EJA 4ª ETAPA'],
          )
          assert r['canonical_annual_workload'] == 80
          assert r['canonical_weekly_workload'] == 2
          assert r['multigrade_rule'] == 'MAX_ANNUAL_WORKLOAD'
          print('P0F7_9D731_CURRENT_CASE=PASS')
          PY
