name: P0-F7.9D7.4 Revised Last-mile Preflight Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py'
      - 'backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py'
      - 'backend/tests/test_p0f7_9d74_revised_preflight.py'
      - 'scripts/p0f7_9d74_revised_preflight_local.ps1'
      - '.github/workflows/p0f7-9d74-revised-last-mile-preflight-guard.yml'
      - 'memory/audit/P0F7_9D74_REVISED_LAST_MILE_PREFLIGHT_2026-08-30.md'
  workflow_dispatch:

jobs:
  revised-last-mile-preflight-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D7.4 scripts
        run: |
          python -m py_compile backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          python -m py_compile backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py

      - name: Exercise supported CLI import path
        run: |
          PYTHONPATH=backend python backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py --help
          PYTHONPATH=backend python backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py --help

      - name: Run focused D7.4 regressions
        run: pytest -q --noconftest backend/tests/test_p0f7_9d74_revised_preflight.py

      - name: Guard exact sealed input and workload policy
        run: |
          grep -q 'b6cfcfd3fec964fe58ebdcc7aea6e9fe1953207d7178da35b7e1bd4dea8c39fb' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'canonical_annual_workload.*80' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'canonical_monthly_workload.*10' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'canonical_weekly_workload.*2' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'ha / 8 = hm' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'hm / 5 = hs' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py

      - name: Guard collector read-only boundary
        run: |
          grep -q 'QUERY_BUDGET = 5' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'countDocuments' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q '\.find(' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          ! grep -Eiq 'updateOne\(|updateMany\(|insertOne\(|insertMany\(|deleteOne\(|deleteMany\(|bulkWrite\(|findOneAndUpdate\(|replaceOne\(' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py

      - name: Guard analyzer offline and fail-closed
        run: |
          ! grep -Eiq 'pymongo|motor|requests\.|httpx\.|subprocess|paramiko|fabric' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'validate_teacher_assignment_curriculum' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'FAIL_CLOSED_NO_PARTIAL_GUESSING' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'REVERSE_OPERATION_ORDER' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'requires_separate_explicit_production_write_authorization' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py

      - name: Guard revised pair ordering
        run: |
          grep -q 'RETIRE_DUPLICATE_BEFORE_CONSOLIDATE_SURVIVOR' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'RETIRE_DUPLICATE_ASSIGNMENT' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'CONSOLIDATE_SURVIVOR' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py
          grep -q 'hard_delete' backend/scripts/build_p0f7_9d74_revised_preflight_snapshot_js.py

      - name: Guard wrapper has no remote execution
        run: |
          ! grep -Eiq '^[[:space:]]*(ssh|scp|mongosh|docker)[[:space:]]' scripts/p0f7_9d74_revised_preflight_local.ps1
          grep -q 'PRODUCTION_WRITES=NO' scripts/p0f7_9d74_revised_preflight_local.ps1
          grep -q 'EXECUTOR_AUTHORIZED=NO' scripts/p0f7_9d74_revised_preflight_local.ps1
          grep -q 'REMEDIATION_EXECUTED=NO' scripts/p0f7_9d74_revised_preflight_local.ps1

      - name: Guard topology strategy contract
        run: |
          grep -q 'REPLICA_SET_TRANSACTION_CAPABLE' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'MONGODB_MULTI_DOCUMENT_TRANSACTION_REQUIRED' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
          grep -q 'CAS_WITH_COMPENSATING_ROLLBACK_REQUIRED' backend/scripts/audit_p0f7_9d74_revised_preflight_offline.py
