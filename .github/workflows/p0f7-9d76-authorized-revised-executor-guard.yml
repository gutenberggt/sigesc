name: P0-F7.9D7.6 Authorized Revised Executor Guard

on:
  pull_request:
    paths:
      - 'backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py'
      - 'backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py'
      - 'backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py'
      - 'backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py'
      - 'backend/tests/test_p0f7_9d76_authorized_revised_executor.py'
      - 'backend/tests/test_p0f7_9d761_retire_status_cas_contract.py'
      - 'backend/tests/test_p0f7_9d763_mongosh_projection_contract.py'
      - 'scripts/p0f7_9d76_authorized_revised_execution_local.ps1'
      - 'memory/audit/P0F7_9D76_AUTHORIZED_REVISED_EXECUTION_2026-08-30.md'
      - 'memory/audit/P0F7_9D761_RETIRE_STATUS_CAS_CONTRACT_2026-08-30.md'
      - 'memory/audit/P0F7_9D762_RECEIPT_VALIDATOR_CONTRACT_2026-08-30.md'
      - 'memory/audit/P0F7_9D763_MONGOSH_PROJECTION_AND_RECEIPT_CAPTURE_2026-08-30.md'
      - '.github/workflows/p0f7-9d76-authorized-revised-executor-guard.yml'

jobs:
  authorized-revised-executor-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile D7.6 scripts
        run: |
          python -m py_compile \
            backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py \
            backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py \
            backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py \
            backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py

      - name: Exercise supported CLI import paths
        run: |
          python backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py --help >/dev/null
          python backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py --help >/dev/null
          python backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py --help >/dev/null
          python backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py --help >/dev/null

      - name: Run focused D7.6 regressions
        run: |
          pytest -q --noconftest \
            backend/tests/test_p0f7_9d76_authorized_revised_executor.py \
            backend/tests/test_p0f7_9d761_retire_status_cas_contract.py \
            backend/tests/test_p0f7_9d763_mongosh_projection_contract.py

      - name: Guard exact authorization chain
        run: |
          grep -Fq '89e0f72d97f7cfa8b2d4b5dd7b5d35a01376a813d69d46f5bce7fa9c11440fcc' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'b6cfcfd3fec964fe58ebdcc7aea6e9fe1953207d7178da35b7e1bd4dea8c39fb' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'b835f5393e035dee0703f1aa0ae0dd52c779b81d5f73b8c05d0adff3fbcedc9e' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'CAS_WITH_COMPENSATING_ROLLBACK_REQUIRED' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py

      - name: Guard exact sealed retire status compatibility
        run: |
          grep -Fq 'status not in d76.ACTIVE_STATUSES' backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py
          grep -Fq 'P0F7_9D761_RETIRE_ROLLBACK_STATUS_MISMATCH' backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py
          grep -Fq 'validated["cas_expected"]["status"] = status_raw' backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py

      - name: Guard mongosh projection contract
        run: |
          grep -Fq 'build_p0f7_9d763_authorized_revised_executor_js.py' scripts/p0f7_9d76_authorized_revised_execution_local.ps1
          grep -Fq 'MONGOSH_FINDONE_PROJECTION=DIRECT_SECOND_ARGUMENT' scripts/p0f7_9d76_authorized_revised_execution_local.ps1
          grep -Fq 'P0F7_9D763_PROJECTION_TEMPLATE_DRIFT' backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py
          grep -Fq 'if "{projection:" in _TEMPLATE' backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py

      - name: Guard receipt validator uses D7.6.1 contract
        run: |
          grep -Fq 'build_p0f7_9d761_authorized_revised_executor_js.py' backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py
          grep -Fq 'builder = compat_builder.d76' backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py
          ! grep -Fq 'BUILDER_PATH = Path(__file__).with_name("build_p0f7_9d76_authorized_revised_executor_js.py")' backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py

      - name: Guard writer is narrow and no hard delete exists
        run: |
          grep -Fq 'targetDb.teacher_assignments.updateOne' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          ! grep -Eq 'deleteOne|deleteMany|insertOne|insertMany|replaceOne|bulkWrite|drop\(' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'P0F79D76_GLOBAL_CAS_BLOCKED' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'P0F79D76_IMMEDIATE_COLLISION' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          grep -Fq 'ROLLBACK_INCOMPLETE' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py

      - name: Guard local wrapper never performs remote execution
        run: |
          ! grep -Eiq '\bssh\b|\bmongosh\b|docker exec|Invoke-WebRequest|curl.exe' scripts/p0f7_9d76_authorized_revised_execution_local.ps1
          grep -Fq 'REMOTE_EXECUTION_BY_WRAPPER=NO' scripts/p0f7_9d76_authorized_revised_execution_local.ps1

      - name: Guard builder itself has no network/database client
        run: |
          ! grep -Eiq 'pymongo|motor|requests|httpx|urllib|socket|subprocess|os\.system' backend/scripts/build_p0f7_9d76_authorized_revised_executor_js.py
          ! grep -Eiq 'pymongo|motor|requests|httpx|urllib|socket|subprocess|os\.system' backend/scripts/build_p0f7_9d761_authorized_revised_executor_js.py
          ! grep -Eiq 'pymongo|motor|requests|httpx|urllib|socket|subprocess|os\.system' backend/scripts/build_p0f7_9d763_authorized_revised_executor_js.py
          ! grep -Eiq 'pymongo|motor|requests|httpx|urllib|socket|subprocess|os\.system' backend/scripts/validate_p0f7_9d76_execution_receipt_offline.py
