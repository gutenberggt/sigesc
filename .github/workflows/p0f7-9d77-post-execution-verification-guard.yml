name: P0-F7.9D7.7 Post-execution Verification Guard

on:
  pull_request:
    paths:
      - '.github/workflows/p0f7-9d77-post-execution-verification.yml'
      - '.github/workflows/p0f7-9d77-post-execution-verification-guard.yml'
      - 'backend/scripts/build_p0f7_9d77_post_execution_verifier_js.py'
      - 'backend/scripts/seal_p0f7_9d77_post_execution.py'
      - 'backend/tests/test_p0f7_9d77_post_execution_verification.py'
      - 'memory/audit/P0F7_9D77_POST_EXECUTION_VERIFICATION_2026-08-30.md'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard manual-only read-only production verification
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/p0f7-9d77-post-execution-verification.yml'
          grep -Fq 'workflow_dispatch:' "$workflow"
          ! grep -Eq '^  (push|schedule|pull_request):' "$workflow"
          grep -Fq 'environment: production' "$workflow"
          grep -Fq 'VERIFY_P0F79D77_READ_ONLY' "$workflow"
          echo 'P0F79D77_TRIGGER_GUARD=PASS'
      - name: Guard exact immutable chain and expected counts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '89e0f72d97f7cfa8b2d4b5dd7b5d35a01376a813d69d46f5bce7fa9c11440fcc' backend/scripts/seal_p0f7_9d77_post_execution.py
          grep -Fq 'b6cfcfd3fec964fe58ebdcc7aea6e9fe1953207d7178da35b7e1bd4dea8c39fb' backend/scripts/seal_p0f7_9d77_post_execution.py
          grep -Fq 'b835f5393e035dee0703f1aa0ae0dd52c779b81d5f73b8c05d0adff3fbcedc9e' backend/scripts/seal_p0f7_9d77_post_execution.py
          grep -Fq 'aa61676f8e3841436b34d8f345d235304380eda866984319b815ceec638e4e5b' backend/scripts/seal_p0f7_9d77_post_execution.py
          grep -Fq 'operations_verified:23' backend/scripts/build_p0f7_9d77_post_execution_verifier_js.py
          grep -Fq 'active_unique_tuples_verified:22' backend/scripts/build_p0f7_9d77_post_execution_verifier_js.py
          echo 'P0F79D77_CHAIN_GUARD=PASS'
      - name: Guard verifier contains no mutation primitive
        shell: bash
        run: |
          set -euo pipefail
          file='backend/scripts/build_p0f7_9d77_post_execution_verifier_js.py'
          for token in '.updateOne(' '.updateMany(' '.replaceOne(' '.deleteOne(' '.deleteMany(' '.insertOne(' '.insertMany(' '.bulkWrite(' '.findOneAndUpdate(' '.findOneAndDelete(' '.findOneAndReplace('; do
            if grep -F "$token" "$file" | grep -v 'BANNED_MUTATION_TOKENS' >/dev/null 2>&1; then
              echo "P0F79D77_MUTATION_TOKEN_IN_SOURCE:$token"
              exit 1
            fi
          done
          grep -Fq 'QUERY_BUDGET=2' "$file"
          echo 'P0F79D77_READ_ONLY_SOURCE_GUARD=PASS'
      - name: Run focused tests without repository conftest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q --confcutdir=backend/tests backend/tests/test_p0f7_9d77_post_execution_verification.py
