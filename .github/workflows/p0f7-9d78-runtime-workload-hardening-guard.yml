name: P0-F7.9D7.8 Runtime Workload Hardening Guard

on:
  pull_request:
    paths:
      - 'backend/services/teacher_assignment_integrity.py'
      - 'backend/routers/assignments.py'
      - 'backend/utils/curricular_workload_policy.py'
      - 'backend/tests/test_p0f7_9b_teacher_assignment_integrity.py'
      - 'backend/tests/test_p0f7_9d731_curricular_workload_policy.py'
      - 'backend/tests/test_p0f7_9d78_runtime_workload_hardening.py'
      - '.github/workflows/p0f7-9d78-runtime-workload-hardening-guard.yml'
      - 'memory/audit/P0F7_9D78_RUNTIME_WORKLOAD_HARDENING_2026-08-30.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-workload-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile hardened write boundary
        run: |
          python -m py_compile backend/services/teacher_assignment_integrity.py
          python -m py_compile backend/utils/curricular_workload_policy.py
          python -m py_compile backend/routers/assignments.py

      - name: Run curricular and workload regressions
        run: |
          python -m pytest -q --noconftest \
            backend/tests/test_p0f7_9b_teacher_assignment_integrity.py \
            backend/tests/test_p0f7_9d731_curricular_workload_policy.py \
            backend/tests/test_p0f7_9d78_runtime_workload_hardening.py

      - name: Guard domain SSoT and purity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          service = Path('backend/services/teacher_assignment_integrity.py').read_text(encoding='utf-8')
          router = Path('backend/routers/assignments.py').read_text(encoding='utf-8')

          assert 'from utils.curricular_workload_policy import' in service
          assert 'resolve_curricular_workload(' in service
          assert 'curricular_workload_policy' not in router
          assert router.count('validate_teacher_assignment_workload(') >= 3
          assert 'is_active_teacher_assignment_status(' in router

          for forbidden in ('find_one(', 'insert_one(', 'update_one(', 'delete_one(', 'motor.', 'pymongo'):
              assert forbidden not in service, forbidden

          for duplicated_rule in ('MAX_ANNUAL_WORKLOAD', 'ha / 40', 'ANNUAL_TO_WEEKLY', '_RULES'):
              assert duplicated_rule not in router, duplicated_rule

          print('P0F79D78_SSoT_AND_PURITY_GUARD=PASS')
          PY

      - name: Guard active writers and historical retirement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/routers/assignments.py').read_text(encoding='utf-8')
          assert text.count('validate_teacher_assignment_curriculum(') >= 3
          assert text.count('validate_teacher_assignment_workload(') >= 3
          assert text.count('{"$in": ["ativo", "active"]}') >= 2
          assert 'INACTIVE_REMEDIATION_ALLOWED' in text
          assert 'TEACHER_ASSIGNMENT_HARD_DELETE_DISABLED_P0' in text
          assert "action='create'" in text
          assert "action='update'" in text
          assert "action='delete_blocked'" in text
          print('P0F79D78_WRITER_CONTRACT=PASS')
          PY
