name: Phase 38F apply

on:
  push:
    branches: [agent/dvd-cutover-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dvd-cutover-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded 38F patch
        run: python tools/phase38f_apply.py

      - name: Compile changed backend modules
        run: python -m compileall -q backend/routers/learning_objects.py backend/services/legacy_content_dvd_guard.py

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary applicator
        run: rm tools/phase38f_apply.py .github/workflows/phase38f-apply.yml

      - name: Commit final 38F patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(dvd): harmonizar conteúdos por vínculo"
          git push origin HEAD:agent/dvd-cutover-audit
