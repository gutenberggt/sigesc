name: Phase 38F correct apply

on:
  push:
    branches: [agent/dvd-cutover-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dvd-cutover-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded correction patch
        run: python tools/phase38f_correct_apply.py

      - name: Validate backend syntax and diff
        run: |
          python -m compileall -q backend/routers/content_entries.py
          git diff --check

      - name: Remove temporary applicator
        run: rm tools/phase38f_correct_apply.py .github/workflows/phase38f-correct-apply.yml

      - name: Commit final correction patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dvd): preservar correção publicada de conteúdos"
          git push origin HEAD:agent/dvd-cutover-audit
