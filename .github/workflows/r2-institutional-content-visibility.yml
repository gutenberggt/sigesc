name: R2.0g.5 Institutional Content Visibility Guard

on:
  pull_request:
    paths:
      - 'backend/services/content_institutional_visibility_policy.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_r2g5_institutional_content_visibility.py'
      - 'backend/tests/test_r2g4_legacy_canonical_visibility.py'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityBridge.js'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityPolicy.js'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityPolicy.test.js'
      - 'frontend/src/services/contentInstitutionalVisibilityParity.test.js'
      - 'memory/audit/R2_0G5_INSTITUTIONAL_CONTENT_VISIBILITY_2026-09-06.md'
      - '.github/workflows/r2-institutional-content-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/content_institutional_visibility_policy.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_r2g5_institutional_content_visibility.py'
      - 'backend/tests/test_r2g4_legacy_canonical_visibility.py'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityBridge.js'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityPolicy.js'
      - 'frontend/src/services/contentLegacyCanonicalVisibilityPolicy.test.js'
      - 'frontend/src/services/contentInstitutionalVisibilityParity.test.js'
      - '.github/workflows/r2-institutional-content-visibility.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused backend test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate institutional view policy
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q --noconftest backend/tests/test_r2g5_institutional_content_visibility.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Validate professor + management projection behavior
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          yarn test --watchAll=false --runTestsByPath \
            src/services/contentLegacyCanonicalVisibilityPolicy.test.js \
            src/services/contentInstitutionalVisibilityParity.test.js
      - name: Syntax-check institutional projection bridge
        run: |
          node --check frontend/src/services/contentLegacyCanonicalVisibilityPolicy.js
          node --check frontend/src/services/contentLegacyCanonicalVisibilityBridge.js
