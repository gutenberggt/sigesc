name: "R2.0e Source Semantic Calibration"

on:
  pull_request:
    paths:
      - 'backend/scripts/sibling_class_reconstruction_source_semantic_calibration.py'
      - 'backend/tests/test_sibling_class_reconstruction_source_semantic_calibration.py'
      - 'memory/audit/R2_0E_SOURCE_SEMANTIC_CALIBRATION_9B_2026-09-05.md'
      - '.github/workflows/r2-source-semantic-calibration.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: r2-source-semantic-calibration
  cancel-in-progress: false

jobs:
  guard:
    name: Guard R2.0e source semantic calibration contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile composed engine and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          cat backend/scripts/sibling_class_reconstruction_preflight_readonly.py \
              backend/scripts/sibling_class_reconstruction_mirror_policy.py \
              backend/scripts/sibling_class_reconstruction_global_ordinal_policy.py \
              backend/scripts/sibling_class_reconstruction_orphan_adjudication.py \
              backend/scripts/sibling_class_reconstruction_orphan_structural_discrimination.py \
              backend/scripts/sibling_class_reconstruction_session_ordinal_policy.py \
              backend/scripts/sibling_class_reconstruction_source_semantic_calibration.py \
              > /tmp/r2e-composed.py
          python -m py_compile /tmp/r2e-composed.py
          pytest -q --noconftest \
            backend/tests/test_sibling_class_reconstruction_preflight_readonly.py \
            backend/tests/test_sibling_class_reconstruction_mirror_policy.py \
            backend/tests/test_sibling_class_reconstruction_global_ordinal_policy.py \
            backend/tests/test_sibling_class_reconstruction_orphan_adjudication.py \
            backend/tests/test_sibling_class_reconstruction_orphan_structural_discrimination.py \
            backend/tests/test_sibling_class_reconstruction_session_ordinal_policy.py \
            backend/tests/test_sibling_class_reconstruction_source_semantic_calibration.py

  production-preflight:
    name: Run R2.0e production source semantic calibration read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[R2-SOURCE-SEMANTIC-CALIBRATION] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}
    steps:
      - name: Resolve exact-SHA owner gate
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          issue=(json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('R2E_OWNER_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.split('=',1); key=key.strip(); value=value.strip()
              if key in values: raise SystemExit(f'R2E_DUPLICATE_FIELD:{key}')
              values[key]=value
          expected={
              'R2_SOURCE_SEMANTIC_CALIBRATION':'AUTHORIZED',
              'CONFIRMATION':'RUN_LUIZ_MATH_9B_2026_FEB_APR_SOURCE_SEMANTIC_READ_ONLY',
              'CASE_FILE':'backend/reconstruction_cases/luiz_math_r2_2026_feb_apr_global.json',
              'TRACKING_ISSUE':'456',
              'PREFLIGHT_TRACKING_ISSUE':'439',
              'PARENT_TRACKING_ISSUE':'438',
              'ROOT_TRACKING_ISSUE':'418',
          }
          for key,value in expected.items():
              if values.get(key)!=value: raise SystemExit(f'R2E_CONTEXT_INVALID:{key}')
          target=values.get('TARGET_SHA',''); production=values.get('EXPECTED_PRODUCTION_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',production):
              raise SystemExit('R2E_SHA_INVALID')
          if issue.get('title') != f'[R2-SOURCE-SEMANTIC-CALIBRATION] {target}':
              raise SystemExit('R2E_TITLE_MISMATCH')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-r2e'}
          def get(path):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          main=get('branches/main')['commit']['sha']; prod=get('branches/production')['commit']['sha']
          if main!=target: raise SystemExit(f'R2E_MAIN_MOVED:{main}')
          if prod!=production: raise SystemExit(f'R2E_PRODUCTION_MOVED:{prod}')
          for n in (456,439,438,418):
              if get(f'issues/{n}').get('state')!='open': raise SystemExit(f'R2E_TRACKING_NOT_OPEN:{n}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\nproduction_sha={production}\ngate_issue={issue.get("number")}\n')
          print('R2E_CONTEXT=PASS')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare SSH and composed engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence ~/.ssh
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "R2E_SECRET_MISSING:$v"; exit 1; }
          done
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/r2e_key; chmod 600 ~/.ssh/r2e_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          cat backend/scripts/sibling_class_reconstruction_preflight_readonly.py \
              backend/scripts/sibling_class_reconstruction_mirror_policy.py \
              backend/scripts/sibling_class_reconstruction_global_ordinal_policy.py \
              backend/scripts/sibling_class_reconstruction_orphan_adjudication.py \
              backend/scripts/sibling_class_reconstruction_orphan_structural_discrimination.py \
              backend/scripts/sibling_class_reconstruction_session_ordinal_policy.py \
              backend/scripts/sibling_class_reconstruction_source_semantic_calibration.py \
              > evidence/r2e-composed.py
          python -m py_compile evidence/r2e-composed.py

      - name: Resolve running backend container
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/r2e_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" \
            --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute composed R2.0e calibration
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/r2e-raw.log'
          case_b64="$(base64 -w0 backend/reconstruction_cases/luiz_math_r2_2026_feb_apr_global.json)"
          remote_command="timeout 420 docker exec -e SIBLING_RECONSTRUCTION_CASE_B64='${case_b64}' -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"r2e-composed.py\",\"exec\"),ns); case=ns[\"load_case_from_env\"](); print(\"R2E_CALIBRATION_JSON=\"+json.dumps(ns[\"run_source_semantic_calibration\"](case),ensure_ascii=False,sort_keys=True))'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/r2e_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < evidence/r2e-composed.py > "$raw" 2>&1
          prefix='R2E_CALIBRATION_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          test -n "$line"
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw" evidence/r2e-composed.py

      - name: Validate sanitized calibration and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema')!='SIBLING_CLASS_SOURCE_SEMANTIC_CALIBRATION_V1': raise SystemExit('R2E_SCHEMA_INVALID')
          if p.get('source_class')!='9º ANO B': raise SystemExit('R2E_SCOPE_INVALID')
          b=p.get('boundaries') or {}
          required_false=(
              'production_writes','attendance_records_read','students_read','enrollments_read',
              'grades_read','audit_logs_read','attendance_written','content_written',
              'source_payload_plaintext_emitted','technical_ids_emitted',
              'automatic_semantic_rule_application','deploy_performed'
          )
          if any(b.get(k) is not False for k in required_false): raise SystemExit('R2E_BOUNDARY_INVALID')
          if b.get('mongo_reads_only') is not True or b.get('fail_closed_on_mixed_or_inconclusive') is not True: raise SystemExit('R2E_READONLY_INVALID')
          raw=json.dumps(p,ensure_ascii=False,sort_keys=True)
          uuid_re=re.compile(r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b')
          objectid_re=re.compile(r'(?i)(?<![0-9a-f])[0-9a-f]{24}(?![0-9a-f])')
          if uuid_re.search(raw) or objectid_re.search(raw): raise SystemExit('R2E_RAW_TECHNICAL_ID_DETECTED')
          if not re.fullmatch(r'[0-9a-f]{64}',str(p.get('calibration_hash') or '')): raise SystemExit('R2E_HASH_INVALID')
          classification=(p.get('summary') or {}).get('classification')
          allowed={
              'ONE_CONTENT_PER_DATE_COVERS_SESSION_DOCUMENTS_SUPPORTED',
              'ONE_CONTENT_PER_DATE_COVERS_DECLARED_LOAD_SUPPORTED',
              'ONE_CONTENT_PER_SESSION_SUPPORTED',
              'MIXED_HISTORICAL_GRANULARITY',
              'INSUFFICIENT_OR_CONFLICTING_EVIDENCE',
          }
          if classification not in allowed: raise SystemExit('R2E_CLASSIFICATION_INVALID')
          print('R2E_RUNTIME=PASS')
          PY

      - name: Upload sanitized R2.0e calibration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2e-source-semantic-calibration-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish result and close execution gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PRODUCTION_SHA: ${{ steps.context.outputs.production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          s=p.get('summary') or {}
          lines=[
              '## R2.0e — Calibração semântica no próprio 9º B','',
              f"Target main: `{os.environ['TARGET_SHA']}`",
              f"Production observada: `{os.environ['PRODUCTION_SHA']}`",
              f"Calibration hash: `{p.get('calibration_hash')}`",
              f"Classificação: **`{s.get('classification')}`**",
              f"Ação: **`{s.get('recommended_action')}`**",'',
              f"- conteúdos: {s.get('content_record_total')}",
              f"- datas de conteúdo: {s.get('content_distinct_date_total')}",
              f"- carga declarada dos conteúdos: {s.get('content_declared_load_total')}",
              f"- documentos/sessões de frequência: {s.get('attendance_document_total')}",
              f"- datas de frequência: {s.get('attendance_distinct_date_total')}",
              f"- carga declarada da frequência: {s.get('attendance_declared_load_total')}",
              f"- sessões com aula_numero: {s.get('attendance_aula_numero_present_count')}",
              f"- sessões com period: {s.get('attendance_period_present_count')}",
              f"- datas alinhadas conteúdo/frequência: {s.get('aligned_date_count')}",
              f"- datas com 1 conteúdo: {s.get('single_content_date_count')}",
              f"- datas com >1 conteúdo: {s.get('multiple_content_date_count')}",
              f"- datas em que carga do conteúdo = carga da frequência: {s.get('single_content_load_matches_attendance_load_date_count')}",
              f"- datas em que carga do conteúdo = nº documentos de frequência: {s.get('single_content_load_matches_attendance_documents_date_count')}",
              f"- colisões de sessão: {s.get('session_collision_day_count')}",
              f"- blockers: {', '.join(s.get('blockers') or []) or 'nenhum'}",'',
              '**Boundary:** read-only; `attendance.records` não lido; sem estudantes/matrículas/notas/audit_logs; nenhuma escrita; sem IDs técnicos ou plaintext pedagógico; sem deploy.'
          ]
          body='\n'.join(lines)
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sigesc-r2e'}
          base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          req=urllib.request.Request(f"{base}/issues/{os.environ['GATE_ISSUE']}/comments",data=json.dumps({'body':body}).encode(),headers=headers,method='POST')
          urllib.request.urlopen(req,timeout=30).read()
          req=urllib.request.Request(f"{base}/issues/{os.environ['GATE_ISSUE']}",data=json.dumps({'state':'closed','state_reason':'completed'}).encode(),headers=headers,method='PATCH')
          urllib.request.urlopen(req,timeout=30).read()
          tracking_body='R2.0e executada pelo gate #'+os.environ['GATE_ISSUE']+'\n\n'+body
          req=urllib.request.Request(f"{base}/issues/456/comments",data=json.dumps({'body':tracking_body}).encode(),headers=headers,method='POST')
          urllib.request.urlopen(req,timeout=30).read()
          PY
