name: SGP Audit Tenant Scope Fix

on:
  push:
    branches:
      - feat/sgp-student-canonical-alignment

permissions:
  contents: write

jobs:
  fix-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sgp-student-canonical-alignment
          fetch-depth: 0

      - name: Apply fail-closed tenant scope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/routers/students.py')
          text = path.read_text(encoding='utf-8')
          old = """        base_filter = {}\n        if current_user.get('role') != 'super_admin':\n            tenant_id = current_user.get('mantenedora_id')\n            if tenant_id:\n                base_filter['mantenedora_id'] = tenant_id\n\n        color_counts = {}\n"""
          new = """        # Usa o helper canônico de multi-tenancy: super_admin respeita\n        # escopo ativo e demais perfis operam em modo fail-closed.\n        base_filter = apply_tenant_filter({}, current_user, request)\n\n        color_counts = {}\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Bloco territorial esperado não encontrado')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate backend
        run: |
          python -m py_compile backend/routers/students.py backend/tenant_scope.py backend/utils/student_demographics.py
          python backend/tests/test_student_demographics.py

      - name: Remove temporary workflow
        run: rm -f .github/workflows/sgp-audit-scope-fix.yml

      - name: Commit clean correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(sgp): aplicar escopo fail-closed na auditoria demográfica"
          git push origin HEAD:feat/sgp-student-canonical-alignment
