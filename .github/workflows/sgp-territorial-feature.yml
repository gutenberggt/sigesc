name: SGP Student Canonical Feature Validation

on:
  push:
    branches:
      - feat/sgp-student-canonical-alignment

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sgp-student-canonical-alignment
          fetch-depth: 0

      - name: Apply territorial transformation
        run: python backend/scripts/apply_sgp_territorial_alignment.py

      - name: Apply student identity transformation
        run: python backend/scripts/apply_sgp_student_identity_alignment.py

      - name: Apply enrollment transformation
        run: python backend/scripts/apply_sgp_enrollment_alignment.py

      - name: Apply guardian transformation
        run: python backend/scripts/apply_sgp_guardian_alignment.py

      - name: Apply demographic audit containment
        run: python backend/scripts/apply_sgp_demographic_audit.py

      - name: Update canonical matrix decision
        run: python backend/scripts/update_sgp_matrix_address_decision.py

      - name: Validate Python syntax
        run: python -m py_compile backend/models.py backend/routers/mantenedora.py backend/routers/enrollments.py backend/routers/guardians.py backend/routers/students.py backend/utils/guardian_links.py backend/utils/student_demographics.py

      - name: Test guardian canonical links
        run: python backend/tests/test_guardian_links.py

      - name: Test demographic audit rules
        run: python backend/tests/test_student_demographics.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --network-timeout 600000 || yarn install --network-timeout 600000

      - name: Run canonical unit tests
        working-directory: frontend
        run: yarn test src/utils/ibgeAddress.test.js src/utils/specialEducation.test.js --watchAll=false --runInBand

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: yarn build

      - name: Remove temporary feature tooling
        run: |
          rm -f \
            backend/scripts/apply_sgp_territorial_alignment.py \
            backend/scripts/apply_sgp_student_identity_alignment.py \
            backend/scripts/apply_sgp_enrollment_alignment.py \
            backend/scripts/apply_sgp_guardian_alignment.py \
            backend/scripts/apply_sgp_demographic_audit.py \
            backend/scripts/update_sgp_matrix_address_decision.py \
            .github/workflows/sgp-territorial-feature.yml

      - name: Commit clean feature state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore(sgp): remover ferramentas temporárias da feature"
          git push origin HEAD:feat/sgp-student-canonical-alignment
