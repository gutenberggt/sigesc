name: SIGESC Production Release Guard

on:
  pull_request:
    paths:
      - '.github/workflows/sigesc-production-deploy.yml'
      - '.github/workflows/sigesc-production-deploy-guard.yml'
      - 'docker-compose.coolify.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docs/operations/GITHUB_ONLY_PRODUCTION_DEPLOY.md'
      - 'memory/audit/SIGESC_PRODUCTION_DEPLOY_INCIDENT_2026-08-30.md'
      - 'scripts/ops/sigesc_github_only_deploy.sh'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Guard protected source-promotion contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          required = (
              'name: SIGESC Production Release',
              'workflow_dispatch:',
              'environment: production',
              'contents: write',
              'actions: read',
              'group: sigesc-production-release',
              'cancel-in-progress: false',
              'PROMOTE_SIGESC_MAIN_TO_PRODUCTION',
              'github.ref_name',
              "= 'main'",
              '/git/refs/heads/production',
              "'force': False",
              "'force': True",
              'PRODUCTION_NOT_FAST_FORWARDABLE',
              'CI - Build & Lint',
              'SIGESC_PRODUCTION_RELEASE=APPLIED',
              'SIGESC_PRODUCTION_RELEASE=SAFE_ROLLBACK',
              'AMBIGUOUS_OR_ROLLBACK_INCOMPLETE',
              'retention-days: 90',
          )
          for marker in required:
              assert marker in workflow, marker

          trigger_prefix = workflow.split('permissions:', 1)[0]
          assert 'pull_request:' not in trigger_prefix
          assert '\n  push:' not in trigger_prefix
          print('SIGESC_RELEASE_PROMOTION_CONTRACT_GUARD=PASS')
          PY

      - name: Guard Coolify as sole runtime mutator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          legacy = Path('scripts/ops/sigesc_github_only_deploy.sh')
          assert not legacy.exists(), 'legacy direct Docker executor must be removed'

          forbidden = (
              'docker compose ',
              'docker build ',
              'docker restart ',
              'docker stop ',
              'docker start ',
              'docker rm ',
              'docker image tag ',
              'scp ',
              'git pull',
              'git push',
              'mongosh',
              'mongoimport',
              'updateOne(',
              'deleteOne(',
          )
          for token in forbidden:
              assert token not in workflow, token

          assert 'docker inspect' in workflow
          assert 'docker ps -a' in workflow
          assert 'RUNTIME_MUTATION_OWNER=COOLIFY' in workflow
          assert 'DIRECT_DOCKER_MUTATION=NO' in workflow
          assert 'EXPLICIT_DATABASE_MIGRATION=NO' in workflow
          print('SIGESC_RELEASE_COOLIFY_OWNERSHIP_GUARD=PASS')
          PY

      - name: Guard source commit provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.coolify.yml').read_text(encoding='utf-8')
          backend = Path('backend/Dockerfile').read_text(encoding='utf-8')
          frontend = Path('frontend/Dockerfile').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')

          assert compose.count('SIGESC_GIT_SHA') >= 2
          assert compose.count('${SOURCE_COMMIT:-unknown}') >= 2
          for text in (backend, frontend):
              assert 'ARG SIGESC_GIT_SHA=unknown' in text
              assert 'org.opencontainers.image.revision=$SIGESC_GIT_SHA' in text
          assert '/usr/share/nginx/html/version.json' in frontend
          assert 'PUBLIC_FRONTEND_SHA' in workflow
          assert "printf '%s_IMAGE_REVISION=%s" in workflow
          assert 'test "$revision" = "$target"' in workflow
          print('SIGESC_RELEASE_SHA_PROVENANCE_GUARD=PASS')
          PY

      - name: Guard Mongo persistence and source rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          required = (
              'MONGO_DATA_VOLUME',
              'MONGO_VOLUME_CONTINUITY=PASS',
              'MONGO_PERSISTENT_VOLUME_REQUIRED=YES',
              'MONGO_IMAGE=mongo:7',
              'PREVIOUS_PRODUCTION_SHA',
              'PRODUCTION_BRANCH_ROLLBACK_SHA',
              'PRODUCTION_SOURCE_ROLLBACK=APPLIED',
              'ROLLBACK_PUBLIC_HEALTH=PASS',
          )
          for marker in required:
              assert marker in workflow, marker
          print('SIGESC_RELEASE_MONGO_AND_ROLLBACK_GUARD=PASS')
          PY
