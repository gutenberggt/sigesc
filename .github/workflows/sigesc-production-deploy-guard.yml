name: SIGESC Production Release Guard

on:
  pull_request:
    paths:
      - '.github/workflows/sigesc-production-deploy.yml'
      - '.github/workflows/sigesc-production-deploy-guard.yml'
      - 'docker-compose.coolify.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'frontend/public/sw.js'
      - 'docs/operations/GITHUB_ONLY_PRODUCTION_DEPLOY.md'
      - 'memory/audit/SIGESC_PRODUCTION_DEPLOY_INCIDENT_2026-08-30.md'
      - 'memory/audit/SIGESC_AUTOMATIC_PRODUCTION_RELEASE_REQUEST_2026-08-30.md'
      - 'scripts/ops/sigesc_github_only_deploy.sh'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Guard protected source-promotion contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          required = (
              'name: SIGESC Production Release',
              'workflow_dispatch:',
              'issues:',
              'types: [opened]',
              'environment: production',
              'contents: write',
              'actions: read',
              'issues: write',
              'group: sigesc-production-release',
              'cancel-in-progress: false',
              'PROMOTE_SIGESC_MAIN_TO_PRODUCTION',
              'SIGESC_PRODUCTION_RELEASE_REQUEST',
              "!= 'AUTHORIZED'",
              "github.event.issue.user.login == github.repository_owner",
              '[SIGESC-PROD-RELEASE] ',
              'EXPECTED_PRODUCTION_SHA',
              'PRODUCTION_BASELINE_MOVED',
              '/git/refs/heads/production',
              "'force': False",
              "'force': True",
              'PRODUCTION_NOT_FAST_FORWARDABLE',
              'CI - Build & Lint',
              'SIGESC_PRODUCTION_RELEASE=APPLIED',
              'SIGESC_PRODUCTION_RELEASE=SAFE_ROLLBACK',
              'AMBIGUOUS_OR_ROLLBACK_INCOMPLETE',
              'retention-days: 90',
          )
          for marker in required:
              assert marker in workflow, marker

          trigger_prefix = workflow.split('permissions:', 1)[0]
          assert 'pull_request:' not in trigger_prefix
          assert '\n  push:' not in trigger_prefix
          assert 'workflow_dispatch:' in trigger_prefix
          assert 'issues:' in trigger_prefix
          print('SIGESC_RELEASE_PROMOTION_CONTRACT_GUARD=PASS')
          PY

      - name: Guard automatic request is owner-scoped and baseline-pinned
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          required = (
              "event_name == 'issues'",
              "creator != owner",
              'SIGESC_PRODUCTION_RELEASE_REQUEST_OWNER_REQUIRED',
              'SIGESC_PRODUCTION_RELEASE_REQUEST_MUST_BE_OPEN',
              'SIGESC_PRODUCTION_RELEASE_DUPLICATE_FIELD',
              'SIGESC_PRODUCTION_RELEASE_REQUEST_INVALID',
              'SIGESC_PRODUCTION_RELEASE_REQUEST_TITLE_MISMATCH',
              "sha_re = re.compile(r'^[0-9a-f]{40}$')",
              "expected_previous = values.get('EXPECTED_PRODUCTION_SHA', '')",
              "if expected_previous and previous != expected_previous:",
              'PRODUCTION_BASELINE_MOVED',
              "request_mode = 'owner_issue'",
              'Annotate automatic release request',
              "'state': 'closed'",
          )
          for marker in required:
              assert marker in workflow, marker
          print('SIGESC_RELEASE_AUTOMATIC_REQUEST_GUARD=PASS')
          PY

      - name: Guard evidence workspace survives checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          checkout = workflow.index('- name: Checkout exact release SHA')
          evidence = workflow.index('- name: Initialize release evidence workspace')
          gate = workflow.index('- name: Fail closed unless main, production baseline and push CI are green')
          assert checkout < evidence < gate
          assert 'SIGESC_RELEASE_EVIDENCE_WORKSPACE=READY' in workflow
          assert workflow.count('mkdir -p evidence') >= 3
          assert "tee evidence/github-release-gate.txt" in workflow
          assert "> evidence/release-summary.txt" in workflow
          assert 'SIGESC_PRODUCTION_RELEASE_EVIDENCE_V3' in workflow
          print('SIGESC_RELEASE_EVIDENCE_WORKSPACE_GUARD=PASS')
          PY

      - name: Guard Coolify as sole runtime mutator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          legacy = Path('scripts/ops/sigesc_github_only_deploy.sh')
          assert not legacy.exists(), 'legacy direct Docker executor must be removed'

          forbidden = (
              'docker compose ',
              'docker build ',
              'docker restart ',
              'docker stop ',
              'docker start ',
              'docker rm ',
              'docker image tag ',
              'scp ',
              'git pull',
              'git push',
              'mongosh',
              'mongoimport',
              'updateOne(',
              'deleteOne(',
          )
          for token in forbidden:
              assert token not in workflow, token

          assert 'docker inspect' in workflow
          assert 'docker ps --filter' in workflow
          assert 'RUNTIME_MUTATION_OWNER=COOLIFY' in workflow
          assert 'DIRECT_DOCKER_MUTATION=NO' in workflow
          assert 'EXPLICIT_DATABASE_MIGRATION=NO' in workflow
          print('SIGESC_RELEASE_COOLIFY_OWNERSHIP_GUARD=PASS')
          PY

      - name: Guard bounded runtime stabilization and source commit provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.coolify.yml').read_text(encoding='utf-8')
          backend = Path('backend/Dockerfile').read_text(encoding='utf-8')
          frontend = Path('frontend/Dockerfile').read_text(encoding='utf-8')
          sw = Path('frontend/public/sw.js').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')

          assert compose.count('SIGESC_GIT_SHA') >= 2
          assert compose.count('${SOURCE_COMMIT:-unknown}') >= 2
          for text in (backend, frontend):
              assert 'ARG SIGESC_GIT_SHA=unknown' in text
              assert 'org.opencontainers.image.revision=$SIGESC_GIT_SHA' in text

          assert '/usr/share/nginx/html/version.json' in frontend
          assert "const RELEASE_SHA = '__SIGESC_GIT_SHA__';" in sw
          assert 'sigesc-cache-v22-${RELEASE_SHA.slice(0, 12)}' in sw
          assert "grep -Fq '__SIGESC_GIT_SHA__' /usr/share/nginx/html/sw.js" in frontend
          assert 'sed -i "s/__SIGESC_GIT_SHA__/${SIGESC_GIT_SHA}/g" /usr/share/nginx/html/sw.js' in frontend
          assert "! grep -Fq '__SIGESC_GIT_SHA__' /usr/share/nginx/html/sw.js" in frontend
          assert 'PUBLIC_FRONTEND_SHA' in workflow
          assert "printf '%s_IMAGE_REVISION=%s" in workflow

          # Prova local do contrato de renderização do SW por release.
          sample_sha = 'a' * 40
          rendered_sw = sw.replace('__SIGESC_GIT_SHA__', sample_sha)
          assert '__SIGESC_GIT_SHA__' not in rendered_sw
          assert f"const RELEASE_SHA = '{sample_sha}';" in rendered_sw

          # Runtime verification must tolerate only bounded transient startup.
          required_runtime = (
              'wait_seconds=180',
              'poll_interval=5',
              'docker ps --filter',
              'revision_ok=1',
              'revision_ok=0',
              '"$state" = \'running\'',
              '"$health" = \'healthy\'',
              '[ "$revision" != "$target" ]',
              'RUNTIME_WAIT service=',
              'RUNTIME_HEALTH_TIMEOUT:',
              'exit 1',
          )
          for marker in required_runtime:
              assert marker in workflow, marker

          # Backend/frontend revision mismatch can never settle successfully.
          revision_mismatch = workflow.index('if [ "$service" != \'mongo\' ] && [ "$revision" != "$target" ]; then')
          revision_reject = workflow.index('revision_ok=0', revision_mismatch)
          settle = workflow.index('if [ "$state" = \'running\' ] && [ "$health" = \'healthy\' ] && [ "$revision_ok" -eq 1 ]; then')
          assert revision_mismatch < revision_reject < settle

          print('SIGESC_RELEASE_RUNTIME_STABILIZATION_AND_SHA_GUARD=PASS')
          PY

      - name: Guard Mongo persistence and source rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sigesc-production-deploy.yml').read_text(encoding='utf-8')
          required = (
              'MONGO_DATA_VOLUME',
              'MONGO_VOLUME_CONTINUITY=PASS',
              'MONGO_PERSISTENT_VOLUME_REQUIRED=YES',
              'MONGO_IMAGE=mongo:7',
              'PREVIOUS_PRODUCTION_SHA',
              'PRODUCTION_BRANCH_ROLLBACK_SHA',
              'PRODUCTION_SOURCE_ROLLBACK=APPLIED',
              'ROLLBACK_PUBLIC_HEALTH=PASS',
          )
          for marker in required:
              assert marker in workflow, marker
          print('SIGESC_RELEASE_MONGO_AND_ROLLBACK_GUARD=PASS')
          PY
