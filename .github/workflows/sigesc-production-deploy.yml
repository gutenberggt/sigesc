name: SIGESC Production Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PROMOTE_SIGESC_MAIN_TO_PRODUCTION to release the exact current main SHA'
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: sigesc-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote exact main SHA and verify Coolify deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '[SIGESC-PROD-RELEASE] ') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve protected production release context
        id: context
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          event_name = os.environ['GITHUB_EVENT_NAME']
          output = os.environ['GITHUB_OUTPUT']
          sha_re = re.compile(r'^[0-9a-f]{40}$')
          confirmation_value = 'PROMOTE_SIGESC_MAIN_TO_PRODUCTION'
          ci_exception = ''

          if event_name == 'workflow_dispatch':
              if os.environ.get('DISPATCH_CONFIRMATION') != confirmation_value:
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_CONFIRMATION_INVALID')
              if os.environ.get('REF_NAME') != 'main':
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_MAIN_REQUIRED')
              target = os.environ.get('EVENT_SHA', '')
              if not sha_re.fullmatch(target):
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_SHA_INVALID')
              expected_previous = ''
              request_mode = 'workflow_dispatch'
              issue_number = ''
          elif event_name == 'issues':
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
                  event = json.load(fh)
              issue = event.get('issue') or {}
              owner = os.environ.get('REPOSITORY_OWNER', '')
              creator = ((issue.get('user') or {}).get('login') or '')
              if creator != owner:
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_REQUEST_OWNER_REQUIRED')
              if issue.get('state') != 'open':
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_REQUEST_MUST_BE_OPEN')

              values = {}
              for raw in (issue.get('body') or '').splitlines():
                  line = raw.strip()
                  if not line or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip()
                  value = value.strip()
                  if key in values:
                      raise SystemExit(f'SIGESC_PRODUCTION_RELEASE_DUPLICATE_FIELD:{key}')
                  values[key] = value

              if values.get('SIGESC_PRODUCTION_RELEASE_REQUEST') != 'AUTHORIZED':
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_REQUEST_INVALID')
              if values.get('CONFIRMATION') != confirmation_value:
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_CONFIRMATION_INVALID')

              target = values.get('TARGET_SHA', '')
              expected_previous = values.get('EXPECTED_PRODUCTION_SHA', '')
              ci_exception = values.get('CI_EXCEPTION', '')
              if not sha_re.fullmatch(target):
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_TARGET_SHA_INVALID')
              if not sha_re.fullmatch(expected_previous):
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_BASELINE_SHA_INVALID')
              expected_title = f'[SIGESC-PROD-RELEASE] {target}'
              if issue.get('title') != expected_title:
                  raise SystemExit('SIGESC_PRODUCTION_RELEASE_REQUEST_TITLE_MISMATCH')

              request_mode = 'owner_issue'
              issue_number = str(issue.get('number') or '')
          else:
              raise SystemExit(f'SIGESC_PRODUCTION_RELEASE_EVENT_FORBIDDEN:{event_name}')

          with open(output, 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'expected_previous_sha={expected_previous}\n')
              out.write(f'request_mode={request_mode}\n')
              out.write(f'issue_number={issue_number}\n')
              out.write(f'ci_exception={ci_exception}\n')

          print('SIGESC_PRODUCTION_RELEASE_CONTEXT=PASS')
          print(f'REQUEST_MODE={request_mode}')
          print(f'TARGET_SHA={target}')
          if expected_previous:
              print(f'EXPECTED_PRODUCTION_SHA={expected_previous}')
          if issue_number:
              print(f'RELEASE_REQUEST_ISSUE={issue_number}')
          if ci_exception:
              print(f'CI_EXCEPTION_REQUESTED={ci_exception}')
          PY

      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize release evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence
          printf '%s\n' 'SIGESC_RELEASE_EVIDENCE_WORKSPACE=READY' > evidence/workspace.txt
          cat evidence/workspace.txt

      - name: Fail closed unless main, production baseline and push CI are green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          EXPECTED_PREVIOUS_SHA: ${{ steps.context.outputs.expected_previous_sha }}
          CI_EXCEPTION: ${{ steps.context.outputs.ci_exception }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY' | tee evidence/github-release-gate.txt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          target = os.environ['TARGET_SHA']
          expected_previous = os.environ.get('EXPECTED_PREVIOUS_SHA', '').strip()
          ci_exception = os.environ.get('CI_EXCEPTION', '').strip()
          token = os.environ['GH_TOKEN']

          # Exceção one-shot autorizada para a publicação da MT-1.
          # Ela NÃO altera nem mascara o workflow de Transferência: apenas permite
          # que o release deste SHA específico trate a falha conhecida como
          # explicitamente adiada. Qualquer outro SHA/workflow/conclusão continua
          # fail-closed.
          one_shot_target = '0bcf9c073259427ae125d7ca52a1e89a0a640813'
          one_shot_workflow = 'Gate - Transferência (Regressão)'
          one_shot_token = 'MT1_TRANSFER_GATE_DEFERRED_0BCF9C0'
          one_shot_active = target == one_shot_target and ci_exception == one_shot_token

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-production-release',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          main = get_json(f'https://api.github.com/repos/{repo}/branches/main')
          main_sha = main['commit']['sha']
          if main_sha != target:
              if not one_shot_active:
                  raise SystemExit(f'MAIN_MOVED: expected {target}, current {main_sha}')

              # A exceção precisa morar em main para ser executável, então main
              # pode estar à frente do SHA alvo SOMENTE por alterações neste
              # workflow de release. Qualquer outra mudança invalida a exceção.
              target_to_main = get_json(
                  f'https://api.github.com/repos/{repo}/compare/{target}...{main_sha}'
              )
              changed_paths = {
                  item.get('filename') for item in target_to_main.get('files', [])
              }
              allowed_paths = {'.github/workflows/sigesc-production-deploy.yml'}
              if (
                  target_to_main.get('status') != 'ahead'
                  or not changed_paths
                  or not changed_paths.issubset(allowed_paths)
              ):
                  raise SystemExit(
                      'ONE_SHOT_EXCEPTION_MAIN_DRIFT:'
                      f'{target_to_main.get("status")}:{sorted(changed_paths)}'
                  )
              print(f'ONE_SHOT_EXCEPTION_MAIN_SHA={main_sha}')
              print('ONE_SHOT_EXCEPTION_MAIN_DRIFT=RELEASE_WORKFLOW_ONLY')

          production = get_json(f'https://api.github.com/repos/{repo}/branches/production')
          previous = production['commit']['sha']
          if expected_previous and previous != expected_previous:
              raise SystemExit(
                  f'PRODUCTION_BASELINE_MOVED: expected {expected_previous}, current {previous}'
              )

          compare = get_json(f'https://api.github.com/repos/{repo}/compare/{previous}...{target}')
          if compare.get('status') not in {'ahead', 'identical'}:
              raise SystemExit(f'PRODUCTION_NOT_FAST_FORWARDABLE:{compare.get("status")}')

          query = urllib.parse.urlencode({'head_sha': target, 'event': 'push', 'per_page': 100})
          runs_url = f'https://api.github.com/repos/{repo}/actions/runs?{query}'
          deadline = time.time() + 600
          waived = []
          while True:
              runs = get_json(runs_url).get('workflow_runs', [])
              ci = [r for r in runs if r.get('name') == 'CI - Build & Lint']
              pending = [r for r in runs if r.get('status') != 'completed']
              bad = [
                  r for r in runs
                  if r.get('status') == 'completed'
                  and r.get('conclusion') not in {'success', 'skipped', 'neutral'}
              ]
              waived = [
                  r for r in bad
                  if one_shot_active
                  and r.get('name') == one_shot_workflow
                  and r.get('conclusion') == 'failure'
              ]
              blocking = [r for r in bad if r not in waived]

              for r in waived:
                  print(
                      'AUTHORIZED_PUSH_WORKFLOW_EXCEPTION='
                      f"{r.get('name')}:{r.get('conclusion')}:{r.get('id')}"
                  )

              if blocking:
                  for r in blocking:
                      print(
                          f"FAILED_PUSH_WORKFLOW={r.get('name')}:"
                          f"{r.get('conclusion')}:{r.get('id')}"
                      )
                  raise SystemExit('PUSH_CI_NOT_GREEN')

              if (
                  ci
                  and ci[0].get('status') == 'completed'
                  and ci[0].get('conclusion') == 'success'
                  and not pending
              ):
                  break
              if time.time() >= deadline:
                  raise SystemExit('PUSH_CI_GATE_TIMEOUT')
              time.sleep(10)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'previous_sha={previous}\n')
              out.write(
                  f'ci_exception_applied={"true" if waived else "false"}\n'
              )

          print(f'MAIN_SHA={main_sha}')
          print(f'PRODUCTION_SHA_BEFORE={previous}')
          if expected_previous:
              print(f'EXPECTED_PRODUCTION_SHA={expected_previous}')
          print(f'COMPARE_STATUS={compare.get("status")}')
          print(f'PUSH_WORKFLOW_COUNT={len(runs)}')
          print('CI_BUILD_LINT=success')
          if waived:
              print('ALL_NON_EXCEPTED_PUSH_WORKFLOWS_GREEN=YES')
              print('CI_EXCEPTION_APPLIED=YES')
          else:
              print('ALL_PUSH_WORKFLOWS_GREEN=YES')
              print('CI_EXCEPTION_APPLIED=NO')
          print('SIGESC_PRODUCTION_RELEASE_GATE=PASS')
          PY

      - name: Configure pinned SSH trust for read-only verification
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "SIGESC_PRODUCTION_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/sigesc_prod_key
          chmod 600 ~/.ssh/sigesc_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo 'SIGESC_PRODUCTION_READONLY_SSH_TRUST=PASS'

      - name: Capture pre-release Mongo persistence anchor read-only
        id: pre_runtime
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/pre-release-runtime.txt'
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/sigesc_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            bash -s -- "$MONGO_CONTAINER" > "$raw" <<'REMOTE'
          set -euo pipefail
          mongo="$1"
          docker inspect "$mongo" >/dev/null
          state="$(docker inspect -f '{{.State.Status}}' "$mongo")"
          health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$mongo")"
          volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$mongo")"
          image="$(docker inspect -f '{{.Config.Image}}' "$mongo")"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo")"
          printf 'MONGO_STATE=%s\n' "$state"
          printf 'MONGO_HEALTH=%s\n' "$health"
          printf 'MONGO_DATA_VOLUME=%s\n' "$volume"
          printf 'MONGO_IMAGE=%s\n' "$image"
          printf 'COMPOSE_PROJECT=%s\n' "$project"
          REMOTE
          cat "$raw"
          grep -Fq 'MONGO_STATE=running' "$raw"
          grep -Fq 'MONGO_HEALTH=healthy' "$raw"
          grep -Fq 'MONGO_IMAGE=mongo:7' "$raw"
          volume="$(sed -n 's/^MONGO_DATA_VOLUME=//p' "$raw")"
          test -n "$volume" || { echo 'SIGESC_MONGO_PERSISTENT_VOLUME_MISSING'; exit 1; }
          echo "mongo_volume=$volume" >> "$GITHUB_OUTPUT"
          echo 'SIGESC_PRE_RELEASE_RUNTIME=PASS'

      - name: Promote production branch to exact main SHA
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          PREVIOUS_SHA: ${{ steps.gate.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/production-promotion.txt
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          target = os.environ['TARGET_SHA']
          previous = os.environ['PREVIOUS_SHA']
          token = os.environ['GH_TOKEN']

          if previous == target:
              print('PRODUCTION_BRANCH_ALREADY_AT_TARGET=YES')
              print(f'PRODUCTION_SHA_AFTER={target}')
              raise SystemExit(0)

          payload = json.dumps({'sha': target, 'force': False}).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/refs/heads/production',
              data=payload,
              method='PATCH',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sigesc-production-release',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          actual = result['object']['sha']
          if actual != target:
              raise SystemExit(f'PRODUCTION_PROMOTION_SHA_MISMATCH:{actual}')
          print(f'PRODUCTION_SHA_BEFORE={previous}')
          print(f'PRODUCTION_SHA_AFTER={actual}')
          print('PRODUCTION_BRANCH_PROMOTION=APPLIED')
          PY

      - name: Wait for public SHA and health from Coolify native deploy
        id: public_smoke
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/public-release-smoke.txt
          import json
          import os
          import time
          import urllib.request

          target = os.environ['TARGET_SHA']
          deadline = time.time() + 1200
          last_version = None
          last_health = None

          def read_json(url):
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'sigesc-production-release'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          while time.time() < deadline:
              try:
                  last_version = read_json(f'https://sigesc.aprenderdigital.top/version.json?sha={target}&t={int(time.time())}')
                  last_health = read_json('https://api.sigesc.aprenderdigital.top/api/health')
                  if (
                      last_version.get('git_sha') == target
                      and last_health.get('status') == 'healthy'
                      and last_health.get('database') == 'connected'
                  ):
                      print(f'PUBLIC_FRONTEND_SHA={target}')
                      print('PUBLIC_API_HEALTH=healthy')
                      print('PUBLIC_DATABASE=connected')
                      print('SIGESC_COOLIFY_NATIVE_DEPLOY_SMOKE=PASS')
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'WAIT_RETRY={type(exc).__name__}')
              time.sleep(10)

          print(f'LAST_VERSION={last_version}')
          print(f'LAST_HEALTH={last_health}')
          raise SystemExit('COOLIFY_NATIVE_DEPLOY_TIMEOUT_OR_HEALTH_FAILURE')
          PY

      - name: Verify runtime provenance and Mongo volume continuity read-only
        id: runtime_verify
        if: steps.public_smoke.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          EXPECTED_MONGO_VOLUME: ${{ steps.pre_runtime.outputs.mongo_volume }}
        shell: bash
        run: |
          set -euo pipefail
          raw='evidence/post-release-runtime.txt'
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/sigesc_prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            bash -s -- "$MONGO_CONTAINER" "$TARGET_SHA" "$EXPECTED_MONGO_VOLUME" > "$raw" <<'REMOTE'
          set -euo pipefail
          mongo="$1"
          target="$2"
          expected_volume="$3"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo")"

          for service in mongo backend frontend; do
            upper="$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')"
            cname="$(docker ps -a --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$service" --format '{{.Names}}' | head -n 1)"
            test -n "$cname"
            state="$(docker inspect -f '{{.State.Status}}' "$cname")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cname")"
            printf '%s_CONTAINER=%s\n' "$upper" "$cname"
            printf '%s_STATE=%s\n' "$upper" "$state"
            printf '%s_HEALTH=%s\n' "$upper" "$health"
            test "$state" = 'running'
            test "$health" = 'healthy'
            if [ "$service" != 'mongo' ]; then
              image_id="$(docker inspect -f '{{.Image}}' "$cname")"
              revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")"
              printf '%s_IMAGE_REVISION=%s\n' "$upper" "$revision"
              test "$revision" = "$target"
            fi
          done

          current_volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$mongo")"
          printf 'MONGO_DATA_VOLUME=%s\n' "$current_volume"
          test "$current_volume" = "$expected_volume"
          printf 'MONGO_VOLUME_CONTINUITY=PASS\n'
          REMOTE
          cat "$raw"
          echo 'SIGESC_POST_RELEASE_RUNTIME=PASS'

      - name: Compensating rollback production branch on failed release
        id: rollback
        if: steps.promote.outcome == 'success' && (steps.public_smoke.outcome == 'failure' || steps.runtime_verify.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.gate.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/production-rollback.txt
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          previous = os.environ['PREVIOUS_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-production-release',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/refs/heads/production',
              data=json.dumps({'sha': previous, 'force': True}).encode(),
              method='PATCH', headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result['object']['sha'] != previous:
              raise SystemExit('PRODUCTION_ROLLBACK_REF_MISMATCH')
          print(f'PRODUCTION_BRANCH_ROLLBACK_SHA={previous}')

          deadline = time.time() + 1200
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(f'https://sigesc.aprenderdigital.top/version.json?rollback={int(time.time())}', timeout=20) as response:
                      version = json.load(response)
                  with urllib.request.urlopen('https://api.sigesc.aprenderdigital.top/api/health', timeout=20) as response:
                      health = json.load(response)
                  if version.get('git_sha') == previous and health.get('status') == 'healthy' and health.get('database') == 'connected':
                      print('PRODUCTION_SOURCE_ROLLBACK=APPLIED')
                      print('ROLLBACK_PUBLIC_HEALTH=PASS')
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(10)
          raise SystemExit('PRODUCTION_SOURCE_ROLLBACK_INCOMPLETE')
          PY

      - name: Write release evidence summary
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          {
            echo 'SIGESC_PRODUCTION_RELEASE_EVIDENCE_V3'
            echo 'REQUEST_MODE=${{ steps.context.outputs.request_mode }}'
            echo 'RELEASE_REQUEST_ISSUE=${{ steps.context.outputs.issue_number }}'
            echo 'TARGET_SHA=${{ steps.context.outputs.target_sha }}'
            echo 'EXPECTED_PRODUCTION_SHA=${{ steps.context.outputs.expected_previous_sha }}'
            echo 'PREVIOUS_PRODUCTION_SHA=${{ steps.gate.outputs.previous_sha }}'
            echo 'CI_EXCEPTION_REQUESTED=${{ steps.context.outputs.ci_exception }}'
            echo 'CI_EXCEPTION_APPLIED=${{ steps.gate.outputs.ci_exception_applied }}'
            echo 'RUN_ID=${{ github.run_id }}'
            echo 'PROMOTION_OUTCOME=${{ steps.promote.outcome }}'
            echo 'PUBLIC_SMOKE_OUTCOME=${{ steps.public_smoke.outcome }}'
            echo 'RUNTIME_VERIFY_OUTCOME=${{ steps.runtime_verify.outcome }}'
            echo 'ROLLBACK_OUTCOME=${{ steps.rollback.outcome }}'
            echo 'EXPLICIT_DATABASE_MIGRATION=NO'
            echo 'MONGO_PERSISTENT_VOLUME_REQUIRED=YES'
            echo 'RUNTIME_MUTATION_OWNER=COOLIFY'
            echo 'DIRECT_DOCKER_MUTATION=NO'
          } > evidence/release-summary.txt
          cat evidence/release-summary.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigesc-production-release-${{ github.run_id }}-${{ steps.context.outputs.target_sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Annotate automatic release request
        if: always() && github.event_name == 'issues'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          CI_EXCEPTION_APPLIED: ${{ steps.gate.outputs.ci_exception_applied }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
          RUNTIME_VERIFY_OUTCOME: ${{ steps.runtime_verify.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ISSUE_NUMBER" || exit 0
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          ci_exception_applied = os.environ.get('CI_EXCEPTION_APPLIED', '')
          promote = os.environ.get('PROMOTION_OUTCOME', '')
          smoke = os.environ.get('PUBLIC_SMOKE_OUTCOME', '')
          runtime = os.environ.get('RUNTIME_VERIFY_OUTCOME', '')
          rollback = os.environ.get('ROLLBACK_OUTCOME', '')

          if promote == smoke == runtime == 'success':
              state = 'APPLIED'
              close_issue = True
          elif rollback == 'success':
              state = 'SAFE_ROLLBACK'
              close_issue = True
          else:
              state = 'AMBIGUOUS_OR_ROLLBACK_INCOMPLETE'
              close_issue = False

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-production-release',
          }
          comment = {
              'body': (
                  f'Automated production release result: **{state}**\n\n'
                  f'- Target SHA: `{target}`\n'
                  f'- Workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
                  f'- CI exception applied: `{ci_exception_applied or "false"}`\n'
                  f'- Runtime mutator: Coolify\n'
                  f'- Explicit database migration: NO'
              )
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              data=json.dumps(comment).encode(), method='POST', headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30):
              pass

          if close_issue:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}',
                  data=json.dumps({'state': 'closed'}).encode(), method='PATCH', headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30):
                  pass
          PY

      - name: Final production release gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          promote='${{ steps.promote.outcome }}'
          smoke='${{ steps.public_smoke.outcome }}'
          runtime='${{ steps.runtime_verify.outcome }}'
          rollback='${{ steps.rollback.outcome }}'

          if [ "$promote" = 'success' ] && [ "$smoke" = 'success' ] && [ "$runtime" = 'success' ]; then
            echo 'SIGESC_PRODUCTION_RELEASE=APPLIED'
            exit 0
          fi
          if [ "$rollback" = 'success' ]; then
            echo 'SIGESC_PRODUCTION_RELEASE=SAFE_ROLLBACK'
            echo 'Do not rerun automatically.'
            exit 1
          fi
          echo 'SIGESC_PRODUCTION_RELEASE=AMBIGUOUS_OR_ROLLBACK_INCOMPLETE'
          echo 'Hard stop. Do not rerun automatically.'
          exit 1
