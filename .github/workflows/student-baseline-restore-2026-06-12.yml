name: "SIGESC Matrícula - Restauração baseline 2026-06-12"

on:
  pull_request:
    paths:
      - 'backend/scripts/student_baseline_restore_2026_06_12.py'
      - '.github/workflows/student-baseline-restore-2026-06-12.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: student-baseline-restore-2026-06-12
  cancel-in-progress: false

jobs:
  guard:
    name: Guard — restauração cirúrgica de matrícula 2026
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce privacy, canonical projection and academic preservation
        shell: bash
        run: |
          set -euo pipefail
          p=backend/scripts/student_baseline_restore_2026_06_12.py
          w=.github/workflows/student-baseline-restore-2026-06-12.yml
          test -s "$p" && test -s "$w"
          python3 -m py_compile "$p"
          grep -Fq 'BASELINE_DATE = "2026-06-12"' "$p"
          grep -Fq 'EXPECTED_POST_HISTORY = 8' "$p"
          grep -Fq 'TARGET_CLASS = "7º ANO D"' "$p"
          grep -Fq 'IGNORED_CLASS = "7º ANO A"' "$p"
          grep -Fq 'STUDENT_IDENTITY_CARDINALITY' "$p"
          grep -Fq 'READY_FOR_APPLY' "$p"
          grep -Fq 'PRODUCTION_DATABASE_TOUCHED=NO' "$p"
          grep -Fq 'YES_AUTHORIZED_STUDENT_BASELINE_RESTORE_ONLY' "$p"
          grep -Fq 'student_recovery_archives.insert_one' "$p"
          grep -Fq 'student_history.delete_many' "$p"
          grep -Fq 'enrollments.delete_many' "$p"
          grep -Fq 'enrollments.update_one' "$p"
          grep -Fq 'rebuild_student_home_projection' "$p"
          ! grep -Fq 'db.students.update_one' "$p"
          grep -Fq 'audit_logs.insert_one' "$p"
          grep -Fq '_compensate' "$p"
          ! grep -Eiq 'Brenda[[:space:]]+Vitoria|Ferreira[[:space:]]+da[[:space:]]+Silva' "$p" "$w"
          ! grep -Eq 'db\.(grades|attendance|student_dependencies)\.(insert_one|insert_many|update_one|update_many|replace_one|delete_one|delete_many|bulk_write)' "$p"
          grep -Fq "environment: production" "$w"
          grep -Fq "APPLY_CONFIRMATION" "$w"
          grep -Fq "EXPECTED_PRODUCTION_SHA" "$w"
          echo 'STUDENT_BASELINE_RESTORE_GUARD=PASS'
          echo 'STUDENT_PII_IN_REPOSITORY=NO'
          echo 'STUDENT_PROJECTION_WRITER=CANONICAL_SERVICE'
          echo 'ACADEMIC_COLLECTION_MUTATION=NO'

  execute:
    name: Preview/apply restauração baseline de matrícula 2026
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[STUDENT-BASELINE-RESTORE-2026-06-12] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve exact owner-scoped context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          issue=(json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {})
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER'] or issue.get('state') != 'open':
              raise SystemExit('STUDENT_BASELINE_RESTORE_OWNER_OPEN_ISSUE_REQUIRED')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.strip().split('=',1)
              if key in values:
                  raise SystemExit('STUDENT_BASELINE_RESTORE_DUPLICATE_FIELD:'+key)
              values[key]=value.strip()
          expected={
              'STUDENT_BASELINE_RESTORE_2026_06_12':'AUTHORIZED',
              'CONFIRMATION':'RESTORE_CANONICAL_ENROLLMENT_TO_VALID_BASELINE',
              'ACADEMIC_YEAR':'2026',
              'EXPECTED_POST_HISTORY_COUNT':'8',
          }
          for key,wanted in expected.items():
              if values.get(key) != wanted:
                  raise SystemExit('STUDENT_BASELINE_RESTORE_FIELD_INVALID:'+key)
          mode=values.get('MODE','').lower()
          if mode not in {'preview','apply'}:
              raise SystemExit('STUDENT_BASELINE_RESTORE_MODE_INVALID')
          if mode == 'apply' and values.get('APPLY_CONFIRMATION') != 'I_ACCEPT_AUTHORIZED_STUDENT_BASELINE_RESTORE':
              raise SystemExit('STUDENT_BASELINE_RESTORE_APPLY_CONFIRMATION_REQUIRED')
          target=values.get('TARGET_SHA','')
          prod=values.get('EXPECTED_PRODUCTION_SHA','')
          salt=values.get('IDENTITY_SALT','').lower()
          identity_hash=values.get('IDENTITY_HASH','').lower()
          if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',prod):
              raise SystemExit('STUDENT_BASELINE_RESTORE_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{32}',salt) or not re.fullmatch(r'[0-9a-f]{64}',identity_hash):
              raise SystemExit('STUDENT_BASELINE_RESTORE_FINGERPRINT_INVALID')
          if issue.get('title') != f'[STUDENT-BASELINE-RESTORE-2026-06-12] {target}':
              raise SystemExit('STUDENT_BASELINE_RESTORE_TITLE_MISMATCH')
          repo=os.environ['GITHUB_REPOSITORY']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-student-baseline-restore',
          }
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          if get('branches/main')['commit']['sha'] != target:
              raise SystemExit('STUDENT_BASELINE_RESTORE_MAIN_MOVED')
          if get('branches/production')['commit']['sha'] != prod:
              raise SystemExit('STUDENT_BASELINE_RESTORE_PRODUCTION_MOVED')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target={target}\nprod={prod}\nmode={mode}\nsalt={salt}\nidentity_hash={identity_hash}\nissue={issue.get("number")}\n')
          print('STUDENT_BASELINE_RESTORE_CONTEXT=PASS')
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.context.outputs.target }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "STUDENT_BASELINE_RESTORE_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/student_baseline_restore_key
          chmod 600 ~/.ssh/student_baseline_restore_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve backend container
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/student_baseline_restore_key" "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend" && [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute fail-closed baseline restoration
        id: exec
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
          MODE: ${{ steps.context.outputs.mode }}
          IDENTITY_SALT: ${{ steps.context.outputs.salt }}
          IDENTITY_HASH: ${{ steps.context.outputs.identity_hash }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw=evidence/raw.log
          remote_command="timeout 900 docker exec -i -w /app -e PYTHONPATH=/app ${BACKEND_CONTAINER} python - ${MODE} ${GITHUB_RUN_ID} ${IDENTITY_SALT} ${IDENTITY_HASH}"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/student_baseline_restore_key" "${PROD_USER}@${PROD_HOST}" "$remote_command" < backend/scripts/student_baseline_restore_2026_06_12.py > "$raw" 2>&1
          rc=$?
          set -e
          grep -E '^STUDENT_BASELINE_RESTORE_|^PRODUCTION_DATABASE_TOUCHED=' "$raw" > evidence/sanitized.log || true
          cat evidence/sanitized.log
          touched="$(sed -n 's/^PRODUCTION_DATABASE_TOUCHED=//p' evidence/sanitized.log | tail -1)"
          test -n "$touched" || { rm -f "$raw"; echo 'STUDENT_BASELINE_RESTORE_TOUCH_MARKER_MISSING'; exit 90; }
          ready="$(sed -n 's/^STUDENT_BASELINE_RESTORE_READY_FOR_APPLY=//p' evidence/sanitized.log | tail -1)"
          noop="$(sed -n 's/^STUDENT_BASELINE_RESTORE_APPLY_NOOP=//p' evidence/sanitized.log | tail -1)"
          if [ "$rc" -ne 0 ]; then
            case "$touched" in
              NO) outcome=BLOCKED ;;
              COMPENSATED) outcome=FAILED_COMPENSATED ;;
              *) rm -f "$raw"; echo "STUDENT_BASELINE_RESTORE_UNSAFE_FAILURE:$touched"; exit "$rc" ;;
            esac
          elif [ "$MODE" = preview ]; then
            [ "$ready" = YES ] && outcome=READY || outcome=BLOCKED
          elif [ "$noop" = ALREADY_RESTORED ]; then
            outcome=NOOP
          else
            outcome=APPLIED
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          for key in TARGET_STUDENTS BASELINE_EVENTS POST_HISTORY POST_TARGET_SCHOOL POST_IGNORED_SCHOOL POST_NA TARGET_ENROLLMENTS IGNORED_ENROLLMENTS OTHER_REGULAR_ENROLLMENTS ACTIVE_REGULAR_ENROLLMENTS IGNORED_GRADES IGNORED_ATTENDANCE IGNORED_DEPENDENCIES CONFLICTS HISTORY_REMOVED IGNORED_ENROLLMENTS_REMOVED TARGET_ENROLLMENT_REACTIVATED STUDENT_PROJECTION_RESTORED POST_HISTORY_AFTER_BASELINE POST_IGNORED_ENROLLMENTS AUDIT_EVENTS; do
            val="$(sed -n "s/^STUDENT_BASELINE_RESTORE_${key}=//p" evidence/sanitized.log | tail -1)"
            echo "${key,,}=${val:-N/A}" >> "$GITHUB_OUTPUT"
          done
          conflicts="$(sed -n 's/^STUDENT_BASELINE_RESTORE_CONFLICT_TYPES=//p' evidence/sanitized.log | tail -1)"
          echo "conflict_types=${conflicts:-NONE}" >> "$GITHUB_OUTPUT"
          rm -f "$raw"

      - name: Publish sanitized result and close gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue }}
          MODE: ${{ steps.context.outputs.mode }}
          OUTCOME: ${{ steps.exec.outputs.outcome }}
          TOUCHED: ${{ steps.exec.outputs.touched }}
          TARGET_STUDENTS: ${{ steps.exec.outputs.target_students }}
          BASELINE_EVENTS: ${{ steps.exec.outputs.baseline_events }}
          POST_HISTORY: ${{ steps.exec.outputs.post_history }}
          POST_TARGET: ${{ steps.exec.outputs.post_target_school }}
          POST_IGNORED: ${{ steps.exec.outputs.post_ignored_school }}
          POST_NA: ${{ steps.exec.outputs.post_na }}
          TARGET_ENROLLMENTS: ${{ steps.exec.outputs.target_enrollments }}
          IGNORED_ENROLLMENTS: ${{ steps.exec.outputs.ignored_enrollments }}
          OTHER_REGULAR: ${{ steps.exec.outputs.other_regular_enrollments }}
          ACTIVE_REGULAR: ${{ steps.exec.outputs.active_regular_enrollments }}
          GRADES: ${{ steps.exec.outputs.ignored_grades }}
          ATTENDANCE: ${{ steps.exec.outputs.ignored_attendance }}
          DEPENDENCIES: ${{ steps.exec.outputs.ignored_dependencies }}
          CONFLICTS: ${{ steps.exec.outputs.conflicts }}
          CONFLICT_TYPES: ${{ steps.exec.outputs.conflict_types }}
          HISTORY_REMOVED: ${{ steps.exec.outputs.history_removed }}
          ENROLLMENTS_REMOVED: ${{ steps.exec.outputs.ignored_enrollments_removed }}
          POST_HISTORY_AFTER: ${{ steps.exec.outputs.post_history_after_baseline }}
          POST_IGNORED_ENROLLMENTS: ${{ steps.exec.outputs.post_ignored_enrollments }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          body=(
              '## Restauração baseline de matrícula 2026 — resultado sanitizado\n\n'
              f"- Modo: `{os.environ['MODE']}`\n"
              f"- Resultado: **{os.environ['OUTCOME']}**\n"
              f"- Estudantes resolvidos pela fingerprint: `{os.environ['TARGET_STUDENTS']}`\n"
              f"- Eventos-base em 12/06: `{os.environ['BASELINE_EVENTS']}`\n"
              f"- Eventos posteriores ao baseline: `{os.environ['POST_HISTORY']}`\n"
              f"- Eventos posteriores na escola/turma de origem: `{os.environ['POST_TARGET']}`\n"
              f"- Eventos posteriores na escola/turma a ignorar: `{os.environ['POST_IGNORED']}`\n"
              f"- Eventos posteriores sem escola/turma: `{os.environ['POST_NA']}`\n"
              f"- Matrículas canônicas na origem: `{os.environ['TARGET_ENROLLMENTS']}`\n"
              f"- Matrículas na escola/turma a ignorar: `{os.environ['IGNORED_ENROLLMENTS']}`\n"
              f"- Outras matrículas regulares 2026: `{os.environ['OTHER_REGULAR']}`\n"
              f"- Matrículas regulares ativas no preflight: `{os.environ['ACTIVE_REGULAR']}`\n"
              f"- Notas na turma a ignorar: `{os.environ['GRADES']}`\n"
              f"- Registros de frequência na turma a ignorar: `{os.environ['ATTENDANCE']}`\n"
              f"- Vínculos de Dependência na turma a ignorar: `{os.environ['DEPENDENCIES']}`\n"
              f"- Conflitos: `{os.environ['CONFLICTS']}` (`{os.environ['CONFLICT_TYPES']}`)\n"
              f"- Eventos retirados da trilha operacional no apply: `{os.environ['HISTORY_REMOVED']}`\n"
              f"- Matrículas retiradas da turma a ignorar no apply: `{os.environ['ENROLLMENTS_REMOVED']}`\n"
              f"- Eventos posteriores restantes após apply: `{os.environ['POST_HISTORY_AFTER']}`\n"
              f"- Matrículas restantes na turma a ignorar após apply: `{os.environ['POST_IGNORED_ENROLLMENTS']}`\n"
              f"- Estado da produção: **{os.environ['TOUCHED']}**\n\n"
              'Nenhuma PII ou ID técnico do estudante foi publicada por este gate.'
          )
          repo=os.environ['GITHUB_REPOSITORY']; issue=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-student-baseline-restore',
              'Content-Type':'application/json',
          }
          urllib.request.urlopen(
              urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
                  data=json.dumps({'body':body}).encode(), headers=headers, method='POST'
              ), timeout=30
          ).read()
          reason='completed' if os.environ['OUTCOME'] in {'READY','APPLIED','NOOP'} else 'not_planned'
          urllib.request.urlopen(
              urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}',
                  data=json.dumps({'state':'closed','state_reason':reason}).encode(), headers=headers, method='PATCH'
              ), timeout=30
          ).read()
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: student-baseline-restore-2026-06-12-${{ github.run_id }}
          path: evidence/sanitized.log
          if-no-files-found: error
          retention-days: 90
