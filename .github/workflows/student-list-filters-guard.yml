name: Students - Advanced Filters Guard

on:
  pull_request:
    paths:
      - 'backend/routers/student_list_filters.py'
      - 'backend/routers/students.py'
      - 'backend/routers/__init__.py'
      - 'backend/tests/test_students_list_filters.py'
      - 'backend/tests/test_student_transfer_destination_access.py'
      - 'frontend/src/pages/StudentsComplete.js'
      - 'frontend/src/utils/specialEducation.js'
      - '.github/workflows/student-list-filters-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-list-filters:
    name: Students - filtros semânticos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio mongomock mongomock-motor

      - name: Compile filter contract
        working-directory: backend
        run: |
          python -m py_compile routers/student_list_filters.py tests/test_students_list_filters.py

      - name: Run advanced-filter regression
        working-directory: backend
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017'
          DB_NAME: 'sigesc_students_filters_conftest_unused'
          JWT_SECRET_KEY: 'ci-only-jwt-secret-0123456789abcdef0123456789abcdef'
        run: |
          python -m pytest tests/test_students_list_filters.py -q --asyncio-mode=auto

      - name: Structural read-only guard
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('routers/student_list_filters.py').read_text(encoding='utf-8')
          forbidden = [
              '.insert_one(', '.insert_many(', '.update_one(', '.update_many(',
              '.replace_one(', '.delete_one(', '.delete_many(',
              '.find_one_and_update(', '.bulk_write(',
          ]
          found = [token for token in forbidden if token in src]
          if found:
              raise SystemExit(f'Filtro de Estudantes deixou de ser read-only: {found}')
          print('Students advanced filters read-only guard: PASS')
          PY
