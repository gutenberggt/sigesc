name: "Teacher Visibility F1 Read-only Audit"

on:
  pull_request:
    paths:
      - 'backend/scripts/teacher_visibility_f1_readonly.py'
      - 'backend/tests/test_teacher_visibility_f1_readonly.py'
      - '.github/workflows/teacher-visibility-f1-readonly.yml'
      - 'memory/audit/TEACHER_VISIBILITY_F1_READONLY_2026-09-03.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: teacher-visibility-f1-readonly
  cancel-in-progress: false

jobs:
  guard:
    name: Guard comparative teacher visibility collector
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pymongo
          python -m py_compile backend/scripts/teacher_visibility_f1_readonly.py
          python -m py_compile backend/tests/test_teacher_visibility_f1_readonly.py
          pytest -q --noconftest backend/tests/test_teacher_visibility_f1_readonly.py

      - name: Enforce read-only privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('backend/scripts/teacher_visibility_f1_readonly.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          forbidden={
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  hits.append(node.func.attr)
          if hits:
              raise SystemExit('TEACHER_VISIBILITY_F1_MONGO_MUTATOR:'+','.join(sorted(set(hits))))
          for forbidden_text in (
              'db.students','db.enrollments','db.student_health_profiles','db.grades',
              '"records": 1',"'records': 1",'"content": 1',"'content': 1",
              '"observations": 1',"'observations': 1",'"methodology": 1',"'methodology': 1",
              '"b1": 1',"'b1': 1",'"b2": 1',"'b2': 1",'"b3": 1',"'b3': 1",'"b4": 1',"'b4': 1",
          ):
              if forbidden_text in source:
                  raise SystemExit(f'TEACHER_VISIBILITY_F1_FORBIDDEN_READ:{forbidden_text}')
          for marker in (
              '"database_mutation": False','"production_writes": False','"mongo_reads_only": True',
              '"http_methods": []','"attendance_records_read": False','"student_data_read": False',
              '"student_pii_emitted": False','"grade_values_read": False','"pedagogical_text_read": False',
              '"technical_ids_emitted": False','"automatic_remap_authorized": False',
          ):
              if marker not in source:
                  raise SystemExit(f'TEACHER_VISIBILITY_F1_BOUNDARY_MARKER_MISSING:{marker}')
          workflow=Path('.github/workflows/teacher-visibility-f1-readonly.yml').read_text(encoding='utf-8')
          if '- name: Prepare evidence directory after checkout' not in workflow:
              raise SystemExit('TEACHER_VISIBILITY_F1_EVIDENCE_STEP_MISSING')
          if workflow.count('mkdir -p evidence') < 2:
              raise SystemExit('TEACHER_VISIBILITY_F1_EVIDENCE_DEFENSE_IN_DEPTH_MISSING')
          print('TEACHER_VISIBILITY_F1_STATIC_BOUNDARY=PASS')
          PY

  production-audit:
    name: Audit Ana Lucia and Luiz Gomes in production read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[TEACHER-VISIBILITY-F1] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SIGESC_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SIGESC_PROD_SSH_KNOWN_HOSTS }}
      PROD_HOST: ${{ secrets.SIGESC_PROD_HOST }}
      PROD_USER: ${{ secrets.SIGESC_PROD_USER }}
      MONGO_CONTAINER: ${{ secrets.SIGESC_PROD_MONGO_CONTAINER }}

    steps:
      - name: Resolve owner-scoped exact-SHA authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          issue=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')).get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('TEACHER_VISIBILITY_F1_OWNER_REQUIRED')
          if issue.get('state') != 'open':
              raise SystemExit('TEACHER_VISIBILITY_F1_GATE_MUST_BE_OPEN')
          values={}
          for raw in (issue.get('body') or '').splitlines():
              line=raw.strip()
              if not line or '=' not in line:
                  continue
              key,value=line.split('=',1)
              key=key.strip(); value=value.strip()
              if key in values:
                  raise SystemExit(f'TEACHER_VISIBILITY_F1_DUPLICATE_FIELD:{key}')
              values[key]=value
          if values.get('TEACHER_VISIBILITY_F1') != 'AUTHORIZED':
              raise SystemExit('TEACHER_VISIBILITY_F1_AUTH_INVALID')
          if values.get('CONFIRMATION') != 'AUDIT_TWO_TEACHER_VISIBILITY_READ_ONLY':
              raise SystemExit('TEACHER_VISIBILITY_F1_CONFIRMATION_INVALID')
          if values.get('ACADEMIC_YEAR') != '2026':
              raise SystemExit('TEACHER_VISIBILITY_F1_YEAR_INVALID')
          if values.get('TRACKING_ISSUE') != '357':
              raise SystemExit('TEACHER_VISIBILITY_F1_TRACKING_INVALID')
          target=values.get('TARGET_SHA','')
          if not re.fullmatch(r'[0-9a-f]{40}',target):
              raise SystemExit('TEACHER_VISIBILITY_F1_SHA_INVALID')
          if issue.get('title') != f'[TEACHER-VISIBILITY-F1] {target}':
              raise SystemExit('TEACHER_VISIBILITY_F1_TITLE_MISMATCH')
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'sigesc-teacher-visibility-f1',
          }
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/branches/main",
              headers=headers,
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              main_sha=json.load(response)['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'TEACHER_VISIBILITY_F1_MAIN_MOVED:{main_sha}')
          track=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/357",
              headers=headers,
          )
          with urllib.request.urlopen(track,timeout=30) as response:
              tracking=json.load(response)
          if tracking.get('state') != 'open':
              raise SystemExit('TEACHER_VISIBILITY_F1_TRACKING_ISSUE_NOT_OPEN')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'gate_issue={issue.get("number")}\n')
          print('TEACHER_VISIBILITY_F1_CONTEXT=PASS')
          print('DATABASE_MUTATION=NO')
          print('PRODUCTION_WRITES=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare evidence directory after checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -d evidence

      - name: Re-seal collector at runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/teacher_visibility_f1_readonly.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('backend/scripts/teacher_visibility_f1_readonly.py').read_text(encoding='utf-8'))
          forbidden={
              'insert_one','insert_many','update_one','update_many','replace_one',
              'delete_one','delete_many','bulk_write','find_one_and_update',
              'find_one_and_delete','find_one_and_replace','drop','drop_database',
          }
          hits=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr in forbidden:
                  hits.append(node.func.attr)
          if hits:
              raise SystemExit('TEACHER_VISIBILITY_F1_RUNTIME_MUTATOR:'+','.join(sorted(set(hits))))
          print('TEACHER_VISIBILITY_F1_RUNTIME_SEAL=PASS')
          PY

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_HOST PROD_USER MONGO_CONTAINER; do
            test -n "${!v}" || { echo "TEACHER_VISIBILITY_F1_REQUIRED_SECRET_MISSING:$v"; exit 1; }
          done
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$MONGO_CONTAINER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/teacher_visibility_f1_prod_key
          chmod 600 ~/.ssh/teacher_visibility_f1_prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve running backend container read-only
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          backend="$({
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/teacher_visibility_f1_prod_key" \
              "${PROD_USER}@${PROD_HOST}" bash -s -- "$MONGO_CONTAINER" <<'REMOTE'
          set -euo pipefail
          mongo_container="$1"
          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$mongo_container")"
          test -n "$project"
          docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n 1
          REMOTE
          } | tail -n 1)"
          test -n "$backend"
          [[ "$backend" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          echo "backend_container=$backend" >> "$GITHUB_OUTPUT"

      - name: Execute metadata-only comparative audit
        shell: bash
        env:
          BACKEND_CONTAINER: ${{ steps.topology.outputs.backend_container }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/teacher-visibility-f1-raw.log'
          remote_command="timeout 900 docker exec -i ${BACKEND_CONTAINER} python -c 'import json,sys; ns={\"__name__\":\"audit_module\"}; exec(compile(sys.stdin.read(),\"teacher_visibility_f1_readonly.py\",\"exec\"),ns); print(\"TEACHER_VISIBILITY_F1_JSON=\"+json.dumps(ns[\"run_live_audit\"](),ensure_ascii=False,sort_keys=True))'"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/teacher_visibility_f1_prod_key" \
            "${PROD_USER}@${PROD_HOST}" "$remote_command" \
            < backend/scripts/teacher_visibility_f1_readonly.py > "$raw" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$raw" "$rc" <<'PY'
          import hashlib,re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); rc=int(sys.argv[2]); data=p.read_bytes(); text=data.decode('utf-8','replace')
          controlled=re.findall(r'TEACHER_VISIBILITY_F1_[A-Z0-9_:.ºª -]+',text)
          print('TEACHER_VISIBILITY_F1_REMOTE_EXIT='+str(rc))
          print('TEACHER_VISIBILITY_F1_CONTROLLED_ERROR='+(controlled[-1].strip() if controlled else '<none>'))
          print('TEACHER_VISIBILITY_F1_RAW_SHA256='+hashlib.sha256(data).hexdigest())
          print('TEACHER_VISIBILITY_F1_RAW_BYTES='+str(len(data)))
          PY
            rm -f "$raw"
            exit "$rc"
          fi
          prefix='TEACHER_VISIBILITY_F1_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then
            sha="$(sha256sum "$raw" | awk '{print $1}')"
            bytes="$(wc -c < "$raw")"
            echo "TEACHER_VISIBILITY_F1_JSON_MISSING raw_sha256=$sha raw_bytes=$bytes"
            rm -f "$raw"
            exit 2
          fi
          printf '%s' "${line#${prefix}}" > evidence/runtime.json
          python -m json.tool evidence/runtime.json >/dev/null
          rm -f "$raw"

      - name: Validate boundaries and expected scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'TEACHER_VISIBILITY_F1_READ_ONLY_V1':
              raise SystemExit('TEACHER_VISIBILITY_F1_SCHEMA_INVALID')
          for key in (
              'database_mutation','production_writes','attendance_records_read','student_data_read',
              'student_pii_emitted','grade_values_read','pedagogical_text_read','technical_ids_emitted',
              'audit_old_new_description_read','automatic_remap_authorized',
          ):
              if p.get(key) is not False:
                  raise SystemExit(f'TEACHER_VISIBILITY_F1_BOUNDARY_FAILED:{key}')
          if p.get('mongo_reads_only') is not True or p.get('http_methods') != []:
              raise SystemExit('TEACHER_VISIBILITY_F1_READ_ONLY_FAILED')
          if p.get('target_pair_count') != 23 or len(p.get('cases') or []) != 2:
              raise SystemExit('TEACHER_VISIBILITY_F1_SCOPE_FAILED')
          if sum(len(case.get('pairs') or []) for case in p.get('cases') or []) != 23:
              raise SystemExit('TEACHER_VISIBILITY_F1_PAIR_MATRIX_FAILED')
          print('TEACHER_VISIBILITY_F1_AUDIT=PASS')
          PY

      - name: Upload read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teacher-visibility-f1-readonly-${{ github.run_id }}
          path: evidence/runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Comment comparative diagnosis and close execution gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=json.loads(Path('evidence/runtime.json').read_text(encoding='utf-8'))
          lines=[
              '## F1 — diagnóstico comparativo read-only de visibilidade docente', '',
              f"Target: `{os.environ['TARGET_SHA']}`",
              f"Pares auditados: **{p.get('target_pair_count')}**", '',
          ]
          for case in p.get('cases') or []:
              s=case.get('summary') or {}
              lines += [
                  f"### {case.get('teacher')} — {case.get('school')}",
                  f"- pares: {case.get('pair_count')}",
                  f"- identity split: {s.get('pairs_with_identity_split')}",
                  f"- assignment drift: {s.get('pairs_with_assignment_drift')}",
                  f"- sem dados alvo: {s.get('pairs_without_target_data')}",
                  f"- causas: `{json.dumps(s.get('root_cause_counts'),ensure_ascii=False,sort_keys=True)}`", '',
                  '| Turma / Componente | Identidades mesmo nome | Causas |',
                  '|---|---:|---|',
              ]
              for row in case.get('pairs') or []:
                  identities=(row.get('binding_counts') or {}).get('same_name_catalog_identities','—')
                  causes=', '.join(f"`{c}`" for c in (row.get('root_cause_codes') or [])) or '—'
                  lines.append(f"| {row.get('class')} / {row.get('component')} | {identities} | {causes} |")
              lines.append('')
          lines += [
              '**Boundary:** Mongo read-only; sem HTTP da aplicação; sem `attendance.records`; sem estudantes/matrículas; '
              'sem notas; sem texto pedagógico; sem IDs técnicos brutos; nenhuma mutação/backfill/remapeamento.', '',
              'O artefato completo do run contém somente metadados, fingerprints e contagens. '
              'Nenhuma correção de dados foi executada ou autorizada.',
          ]
          body='\n'.join(lines)
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sigesc-teacher-visibility-f1','Content-Type':'application/json'}
          def req(method,path,payload):
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',data=json.dumps(payload).encode(),method=method,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  response.read()
          req('POST','/issues/357/comments',{'body':body})
          req('PATCH',f"/issues/{os.environ['GATE_ISSUE']}",{'state':'closed','state_reason':'completed'})
          PY
