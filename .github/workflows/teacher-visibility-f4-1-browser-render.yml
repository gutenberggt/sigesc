name: "Teacher Visibility F4.1 Probe Hardening"

on:
  pull_request:
    paths:
      - 'backend/scripts/teacher_visibility_f4_browser_render.py'
      - 'backend/scripts/teacher_visibility_f4_1_browser_render.py'
      - 'backend/tests/test_teacher_visibility_f4_browser_render.py'
      - 'backend/tests/test_teacher_visibility_f4_1_browser_render.py'
      - '.github/workflows/teacher-visibility-f4-1-browser-render.yml'
      - 'memory/audit/TEACHER_VISIBILITY_F4_1_PROBE_HARDENING_2026-09-03.md'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: teacher-visibility-f4-1-browser-render
  cancel-in-progress: false

jobs:
  guard:
    name: Guard F4.1 resilient read-only probe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile \
            backend/scripts/teacher_visibility_f4_browser_render.py \
            backend/scripts/teacher_visibility_f4_1_browser_render.py
          pytest -q --noconftest \
            backend/tests/test_teacher_visibility_f4_browser_render.py \
            backend/tests/test_teacher_visibility_f4_1_browser_render.py

      - name: Enforce F4.1 timeout taxonomy and sealed boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/scripts/teacher_visibility_f4_1_browser_render.py')
          source = path.read_text(encoding='utf-8')

          required = (
              'service_workers="block"',
              'if method != "GET":',
              'route.abort()',
              'if "/api/" in parsed.path:',
              'f4.fixture_for_api(request.url)',
              'route.fulfill(',
              'request.resource_type in {"xhr", "fetch"}',
              'parsed.path in f4.PUBLIC_DYNAMIC_GET_PATHS',
              'context.route_web_socket("**/*", websocket_handler)',
              'web_socket_route.close(',
              '"pair_isolation": True',
              '"checkpoint_streaming": True',
              '"timeout_is_product_gap": False',
              'TEACHER_VISIBILITY_F4_1_CHECKPOINT=',
              'PUBLIC_BROWSER_RENDER_PROBE_ERROR',
              'PUBLIC_BROWSER_RENDER_GAP',
              'PUBLIC_BROWSER_RENDER_CURRENT',
              'live_api_requests": 0',
              'real_authentication_used": False',
              'production_writes": False',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'TEACHER_VISIBILITY_F4_1_REQUIRED_MARKER_MISSING:{marker}')

          forbidden = (
              'MongoClient', 'pymongo', 'create_access_token',
              '/auth/login', 'SIGESC_PROD_SSH', 'docker exec',
              'method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"',
              'connect_to_server',
          )
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'TEACHER_VISIBILITY_F4_1_FORBIDDEN_MARKER:{marker}')

          print('TEACHER_VISIBILITY_F4_1_STATIC_BOUNDARY=PASS')
          print('TIMEOUT_IS_PRODUCT_GAP=NO')
          print('PAIR_ISOLATION=YES')
          print('PRODUCTION_WRITES=NO')
          PY

  public-browser-audit:
    name: Audit F4.1 production public browser render read-only
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[TEACHER-VISIBILITY-F4.1-BROWSER] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve exact-SHA owner authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          issue = event.get('issue') or {}
          if ((issue.get('user') or {}).get('login') or '') != os.environ['REPOSITORY_OWNER']:
              raise SystemExit('TEACHER_VISIBILITY_F4_1_OWNER_REQUIRED')

          values = {}
          for raw in (issue.get('body') or '').splitlines():
              if '=' not in raw:
                  continue
              key, value = raw.split('=', 1)
              key = key.strip()
              value = value.strip()
              if key in values:
                  raise SystemExit(f'TEACHER_VISIBILITY_F4_1_DUPLICATE_FIELD:{key}')
              values[key] = value

          if values.get('TEACHER_VISIBILITY_F4_1') != 'AUTHORIZED':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_AUTH_INVALID')
          if values.get('CONFIRMATION') != 'AUDIT_PUBLIC_BROWSER_RENDER_READ_ONLY':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_CONFIRMATION_INVALID')
          if values.get('TRACKING_ISSUE') != '357':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_TRACKING_INVALID')

          target = values.get('TARGET_SHA', '')
          expected_prod = values.get('EXPECTED_PRODUCTION_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('TEACHER_VISIBILITY_F4_1_TARGET_SHA_INVALID')
          if not re.fullmatch(r'[0-9a-f]{40}', expected_prod):
              raise SystemExit('TEACHER_VISIBILITY_F4_1_PROD_SHA_INVALID')
          if issue.get('title') != f'[TEACHER-VISIBILITY-F4.1-BROWSER] {target}':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_TITLE_MISMATCH')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-teacher-visibility-f4-1',
          }
          repo = os.environ['GITHUB_REPOSITORY']

          def github_json(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          main_sha = github_json('/branches/main')['commit']['sha']
          if main_sha != target:
              raise SystemExit(f'TEACHER_VISIBILITY_F4_1_MAIN_MOVED:{main_sha}')

          prod_sha = github_json('/branches/production')['commit']['sha']
          if prod_sha != expected_prod:
              raise SystemExit(f'TEACHER_VISIBILITY_F4_1_PRODUCTION_MOVED:{prod_sha}')

          tracking = github_json('/issues/357')
          if tracking.get('state') != 'open':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_TRACKING_NOT_OPEN')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'target_sha={target}\n')
              out.write(f'expected_production_sha={expected_prod}\n')
              out.write(f'gate_issue={issue.get("number")}\n')

          print('TEACHER_VISIBILITY_F4_1_CONTEXT=PASS')
          print('PRODUCTION_ACCESS=PUBLIC_GET_ONLY')
          print('REAL_PRODUCTION_API=NO')
          PY

      - name: Checkout exact reviewed main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Execute resilient public browser audit
        env:
          EXPECTED_PRODUCTION_SHA: ${{ steps.context.outputs.expected_production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          raw='evidence/f4-1-browser-raw.log'
          python backend/scripts/teacher_visibility_f4_1_browser_render.py | tee "$raw"
          prefix='TEACHER_VISIBILITY_F4_1_JSON='
          line="$(grep -F "$prefix" "$raw" | tail -n 1 || true)"
          if [ -z "$line" ]; then
            echo '{"schema":"TEACHER_VISIBILITY_F4_1_PUBLIC_BROWSER_RENDER_V2","status":"INCONCLUSIVE","classification":"PUBLIC_BROWSER_RENDER_PROBE_ERROR","probe_errors":["RUNNER:NO_STRUCTURED_JSON"],"product_failures":[],"production_http_methods":["GET"],"service_workers_blocked":true,"all_api_requests_intercepted_locally":true,"dynamic_non_api_gets_allowlisted":true,"websockets_blocked":true,"live_api_requests":0,"real_authentication_used":false,"database_access":false,"student_data_read":false,"attendance_records_read":false,"pedagogical_text_read":false,"production_writes":false}' > evidence/browser.json
          else
            printf '%s' "${line#${prefix}}" > evidence/browser.json
          fi
          python -m json.tool evidence/browser.json >/dev/null

      - name: Validate no-production-data boundary and result taxonomy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('evidence/browser.json').read_text(encoding='utf-8'))
          if p.get('schema') != 'TEACHER_VISIBILITY_F4_1_PUBLIC_BROWSER_RENDER_V2':
              raise SystemExit('TEACHER_VISIBILITY_F4_1_SCHEMA_INVALID')
          if p.get('production_http_methods') != ['GET']:
              raise SystemExit('TEACHER_VISIBILITY_F4_1_HTTP_METHOD_INVALID')

          required_true = (
              'service_workers_blocked',
              'all_api_requests_intercepted_locally',
              'dynamic_non_api_gets_allowlisted',
              'websockets_blocked',
          )
          required_false = (
              'real_authentication_used', 'database_access', 'student_data_read',
              'attendance_records_read', 'pedagogical_text_read', 'production_writes',
          )
          for key in required_true:
              if p.get(key) is not True:
                  raise SystemExit(f'TEACHER_VISIBILITY_F4_1_BOUNDARY_TRUE_FAILED:{key}')
          for key in required_false:
              if p.get(key) is not False:
                  raise SystemExit(f'TEACHER_VISIBILITY_F4_1_BOUNDARY_FALSE_FAILED:{key}')
          if p.get('live_api_requests') != 0:
              raise SystemExit('TEACHER_VISIBILITY_F4_1_LIVE_API_REQUEST_DETECTED')

          allowed = {
              ('PASS', 'PUBLIC_BROWSER_RENDER_CURRENT'),
              ('FAIL', 'PUBLIC_BROWSER_RENDER_GAP'),
              ('INCONCLUSIVE', 'PUBLIC_BROWSER_RENDER_PROBE_ERROR'),
          }
          pair = (p.get('status'), p.get('classification'))
          if pair not in allowed:
              raise SystemExit(f'TEACHER_VISIBILITY_F4_1_TAXONOMY_INVALID:{pair}')

          if p.get('classification') != 'PUBLIC_BROWSER_RENDER_PROBE_ERROR':
              if p.get('target_pair_count') != 6 or len(p.get('pairs') or []) != 6:
                  raise SystemExit('TEACHER_VISIBILITY_F4_1_SCOPE_INVALID')

          print('TEACHER_VISIBILITY_F4_1_BOUNDARY=PASS')
          print('DIAGNOSTIC_STATUS=' + str(p.get('status')))
          print('DIAGNOSTIC_CLASSIFICATION=' + str(p.get('classification')))
          PY

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teacher-visibility-f4-1-browser-${{ github.run_id }}
          path: |
            evidence/browser.json
            evidence/f4-1-browser-raw.log
          if-no-files-found: warn
          retention-days: 90

      - name: Comment diagnosis and close gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ steps.context.outputs.gate_issue }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ steps.context.outputs.expected_production_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          p = json.loads(Path('evidence/browser.json').read_text(encoding='utf-8'))
          lines = [
              '## F4.1 — browser/runtime público → DOM, probe resiliente',
              '',
              f"Audit code: `{os.environ['TARGET_SHA']}`",
              f"Production release: `{os.environ['EXPECTED_PRODUCTION_SHA']}`",
              f"Classificação: **{p.get('classification')}** ({p.get('status')})",
              f"Pares esperados: **6** — {p.get('target_school') or 'escopo Luiz Gomes'}",
              f"API real de produção: **{p.get('live_api_requests', 0)}** requests",
              '',
              '| Turma / Matemática | Conteúdo | Prefill | Datas | Frequência | Prefill | Datas |',
              '|---|---|---:|---:|---|---:|---:|',
          ]
          for row in p.get('pairs') or []:
              content = row.get('content') or {}
              attendance = row.get('attendance') or {}
              lines.append(
                  f"| {row.get('class')} | {content.get('status')} | {content.get('prefill_ok')} | "
                  f"{content.get('visible_probe_dates')} | {attendance.get('status')} | "
                  f"{attendance.get('prefill_ok')} | {attendance.get('visible_probe_dates')} |"
              )

          if p.get('probe_errors'):
              lines += ['', 'Probe errors: `' + json.dumps(p.get('probe_errors'), ensure_ascii=False) + '`']
          if p.get('product_failures'):
              lines += ['', 'Product failures: `' + json.dumps(p.get('product_failures'), ensure_ascii=False) + '`']

          lines += [
              '',
              '**Semântica F4.1:** `PROBE_ERROR` é inconclusivo e nunca é convertido em `PRODUCT_GAP`; somente mismatch observado após probe concluído pode gerar `PUBLIC_BROWSER_RENDER_GAP`.',
              '',
              '**Boundary:** somente assets públicos GET; Service Worker bloqueado; `/api/` integralmente sintética/local; métodos não-GET abortados; fetch/XHR não-API sob allowlist explícita; WebSocket sem conexão ao servidor; sem autenticação real, Mongo, estudantes, `attendance.records`, texto pedagógico ou escrita.',
          ]
          body = '\n'.join(lines)

          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'sigesc-teacher-visibility-f4-1',
              'Content-Type': 'application/json',
          }

          def send(path, payload, method='POST'):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          send('/issues/357/comments', {'body': body})
          send(
              f"/issues/{os.environ['GATE_ISSUE']}/comments",
              {'body': 'F4.1 concluída. Resultado estruturado registrado no tracking #357.'},
          )
          send(f"/issues/{os.environ['GATE_ISSUE']}", {'state': 'closed'}, method='PATCH')
          print('TEACHER_VISIBILITY_F4_1_TRACKING_COMMENTED=YES')
          PY
