name: TEMP - MIG B1 Canonical DTO

on:
  pull_request:
    branches:
      - main

jobs:
  canonical-dto-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: pip install 'pydantic>=2,<3' pytest

      - name: Run B1 canonical DTO tests
        run: pytest -q tests/test_mig_canonical_student.py
