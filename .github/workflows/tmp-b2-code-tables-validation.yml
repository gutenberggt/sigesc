name: TEMP - MIG B2 CMDE Code Tables

on:
  pull_request:
    branches:
      - main

jobs:
  cmde-code-table-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: pip install pytest pymongo python-dotenv

      - name: Run B2 code table tests
        run: PYTHONPATH=. python -m pytest -q tests/test_cmde_code_tables.py
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: sigesc_b2_ci
