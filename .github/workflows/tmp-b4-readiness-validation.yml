name: TEMP - MIG B4 Readiness Validator

on:
  pull_request:
    branches:
      - main

jobs:
  readiness-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: pip install pytest pymongo python-dotenv 'pydantic>=2,<3'

      - name: Run B1-B4 focused tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_cmde_readiness.py
          tests/test_cmde_student_serializer.py
          tests/test_cmde_code_tables.py
          tests/test_mig_canonical_student.py
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: sigesc_b4_ci
