name: Temporary Dependency Multigrade Fix

on:
  push:
    branches:
      - fix/dependency-multigrade-series-20260912

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-multigrade-series-20260912
          fetch-depth: 0

      - name: Apply surgical dependency fix
        run: python scripts/tmp_apply_dependency_multigrade_fix.py

      - name: Backend syntax and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest fastapi
          python -m compileall -q backend/utils/dependency_validator.py backend/routers/student_dependencies.py
          cd backend
          PYTHONPATH=. pytest -q --noconftest \
            tests/test_dependency_target_curriculum.py \
            tests/test_p0f7_7_curriculum_resolver_hardening.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run dependency utility regression
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn test --watchAll=false --runInBand src/features/dependency/dependency.utils.test.js

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn build

      - name: Commit tested correction to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/components/StudentDependencySection.jsx \
            frontend/src/features/dependency/dependency.utils.js \
            frontend/src/features/dependency/dependency.utils.test.js \
            backend/routers/student_dependencies.py \
            backend/utils/dependency_validator.py \
            backend/tests/test_dependency_target_curriculum.py
          git diff --cached --check
          git commit -m 'fix(dependency): normalize multigrade series and validate target'
          git push origin HEAD:fix/dependency-multigrade-series-20260912
