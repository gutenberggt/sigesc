name: Temporary Dependency Test Fixture Patch

on:
  push:
    branches:
      - fix/dependency-multigrade-series-20260912

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-multigrade-series-20260912
          fetch-depth: 0

      - name: Patch dependency test fixture
        run: python scripts/tmp_patch_dependency_test_fixture.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt 'pyOpenSSL>=24.0.0'

      - name: Run dependency regression suite
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: sigesc_dependency_mock_tests
        run: |
          python -m pytest -q tests/test_student_dependencies.py
          python -m pytest -q --noconftest tests/test_dependency_target_curriculum.py tests/test_p0f7_7_curriculum_resolver_hardening.py

      - name: Commit tested fixture update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_student_dependencies.py
          git diff --cached --check
          git commit -m 'test(dependency): update create fixtures for target validation'
          git push origin HEAD:fix/dependency-multigrade-series-20260912
