name: TMP - Separate Student Demographics

on:
  push:
    branches:
      - feat/students-separate-race-community-indicators

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[demographics-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/students-separate-race-community-indicators
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply isolated change
        run: python .github/scripts/tmp_separate_student_demographics.py

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet -- backend/routers/students.py frontend/src/pages/StudentsComplete.js; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/students.py frontend/src/pages/StudentsComplete.js
          git commit -m "feat(students): separar raça/cor de comunidades tradicionais [demographics-auto]"
          git push origin HEAD:feat/students-separate-race-community-indicators
