name: TMP - Students EJA Modalidades Two Columns

on:
  push:
    branches:
      - style/students-eja-modalidades-two-columns

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[eja-modalidades-layout-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: style/students-eja-modalidades-two-columns
          fetch-depth: 0

      - name: Apply isolated layout change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/StudentsComplete.js')
          text = path.read_text(encoding='utf-8')

          start_marker = '                  {/* ETAPAS (EJA) E MODALIDADES */}'
          end_marker = '                  {/* RECONCILIAÇÃO: séries não reconhecidas (problema de cadastro/mapeamento) */}'

          if text.count(start_marker) != 1:
              raise SystemExit(f'Marcador inicial esperado 1 vez; encontrado {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'Marcador final esperado 1 vez; encontrado {text.count(end_marker)}')

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''                  {/* EJA E MODALIDADES/ATENDIMENTOS */}
                  <div data-testid="modalidade-counts" className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div data-testid="eja-counts">
                      <p className="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2">
                        EJA
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { label: '1ª Etapa', value: seriesCounts['1ª ETAPA'] || 0 },
                          { label: '2ª Etapa', value: seriesCounts['2ª ETAPA'] || 0 },
                          { label: '3ª Etapa', value: seriesCounts['3ª ETAPA'] || 0 },
                          { label: '4ª Etapa', value: seriesCounts['4ª ETAPA'] || 0 },
                          { label: 'EJA', value: totalEJA, isSum: true },
                        ].map(({ label, value, isSum }) => (
                          <span
                            key={label}
                            data-testid={isSum ? 'sum-eja' : undefined}
                            className={`inline-flex items-center px-3 py-1.5 rounded-full text-xs ${isSum ? 'bg-purple-100 text-purple-800 border border-purple-300 font-bold' : 'bg-purple-50 text-purple-700 font-medium'}`}
                          >
                            {label}: {value}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div data-testid="modalidades-atendimentos-counts">
                      <p className="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2">
                        Modalidades e Atendimentos
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { label: 'Regular', value: modalidadeCounts.regular || 0 },
                          { label: 'Integral', value: modalidadeCounts.atendimento_integral || 0 },
                          { label: 'AEE', value: modalidadeCounts.aee || 0 },
                          { label: 'Recomp.', value: modalidadeCounts.recomposicao_aprendizagem || 0 },
                        ].map(({ label, value }) => (
                          <span
                            key={label}
                            className="inline-flex items-center px-3 py-1.5 rounded-full text-xs bg-purple-50 text-purple-700 font-medium"
                          >
                            {label}: {value}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Layout EJA e Modalidades/Atendimentos em duas colunas aplicado.')
          PY

      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/StudentsComplete.js; then
            echo "No product change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/StudentsComplete.js
          git commit -m "style(students): separar EJA de modalidades e atendimentos [eja-modalidades-layout-auto]"
          git push origin HEAD:style/students-eja-modalidades-two-columns
