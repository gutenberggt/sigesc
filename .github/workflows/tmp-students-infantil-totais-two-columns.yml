name: TMP - Students Infantil Totais Two Columns

on:
  push:
    branches:
      - style/students-infantil-totais-two-columns

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: style/students-infantil-totais-two-columns
          fetch-depth: 0

      - name: Apply isolated layout change
        run: python .github/scripts/tmp_students_infantil_totais_two_columns.py

      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/StudentsComplete.js; then
            echo "No product change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/StudentsComplete.js
          git commit -m "style(students): separar infantil de totais por etapa"
          git push origin HEAD:style/students-infantil-totais-two-columns
