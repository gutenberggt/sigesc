name: Validate A2 cadastral adjustments

on:
  push:
    branches:
      - fix/a2-cadastral-adjustments
    paths:
      - .github/workflows/validate-a2-cadastral-adjustments.yml

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a2-cadastral-adjustments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run focused backend tests
        working-directory: backend
        run: python -m pytest -q tests/test_backfill_student_ibge_codes.py tests/test_student_location.py

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a2-cadastral-adjustments
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run focused frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn test --watchAll=false --runTestsByPath src/utils/studentIbgeBackfill.test.js src/utils/ibgeAddress.test.js src/utils/studentLocation.test.js
      - name: Build frontend
        working-directory: frontend
        run: yarn build
