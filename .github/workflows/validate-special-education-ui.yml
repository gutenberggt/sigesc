name: Validar refatoracao AEE na tela de alunos

on:
  push:
    branches:
      - feat/student-special-education-classification
    paths:
      - .github/workflows/validate-special-education-ui.yml

permissions:
  contents: read

jobs:
  validate:
    name: Gerar e validar StudentsComplete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-special-education-classification
      - name: Aplicar refatoracao no workspace
        run: python scripts/apply_special_education_ui_refactor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Instalar dependencias
        working-directory: frontend
        run: yarn install --frozen-lockfile --network-timeout 600000 || yarn install --network-timeout 600000
      - name: Testar classificacao
        working-directory: frontend
        env:
          CI: 'true'
        run: yarn test src/utils/specialEducation.test.js --watchAll=false --runInBand
      - name: Validar build
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: --max-old-space-size=2048
        run: yarn build
      - name: Publicar arquivo validado
        uses: actions/upload-artifact@v4
        with:
          name: students-complete-aee-refactor
          path: frontend/src/pages/StudentsComplete.js
          if-no-files-found: error
