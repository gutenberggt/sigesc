name: TEMP - Apply LearningObjects prefill

on:
  push:
    branches:
      - agent/dashboard-direct-actions-prefill

permissions:
  contents: write

jobs:
  apply-prefill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-direct-actions-prefill
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply surgical patch
        run: python scripts/zz_apply_learning_objects_prefill.py

      - name: Remove temporary applicator
        run: |
          rm scripts/zz_apply_learning_objects_prefill.py
          rm .github/workflows/zz-apply-learning-objects-prefill.yml

      - name: Commit final product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/LearningObjects.js scripts/zz_apply_learning_objects_prefill.py .github/workflows/zz-apply-learning-objects-prefill.yml
          git commit -m 'feat: preencher filtros de conteúdos pelo card'
          git push origin HEAD:agent/dashboard-direct-actions-prefill
